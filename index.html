    const ko = userNativeLang==='ko';
    const onSignupTab = !!document.getElementById('su-nm');
    const nameEl = document.getElementById('su-nm');
    const name = nameEl ? (nameEl.value||'').trim() : '';
    // 회원가입 탭에서 소셜 가입 시 이름 필수
    if (onSignupTab && !name) {
      toast(TT('이름을 먼저 입력해주세요','Please enter your name first'));
      if (nameEl) nameEl.focus();
      return;
    }
    const codeEl = document.getElementById('su-code');
    const code = codeEl ? (codeEl.value||'').trim().toUpperCase() : '';
    const suType = window._suType || 'personal';
    if (onSignupTab && suType === 'student' && !code) {
      toast(TT('단체 코드를 입력해주세요','Please enter the org code'));
      if (codeEl) codeEl.focus();
      return;
    }
    // 가입 경로 수집 (모든 유형)
    let source = '';
    if (onSignupTab) {
      const srcSel = window._signupSource || '';
      if (srcSel === 'referral') { const refn=(document.getElementById('su-referral')?.value||'').trim(); source = refn ? ('지인소개: '+refn) : '지인소개'; }
      else if (srcSel === 'other') { const oth=(document.getElementById('su-other')?.value||'').trim(); source = oth ? ('기타: '+oth) : '기타'; }
      else if (srcSel) source = srcSel;
    }
    const pending = { suType, code, name, source };
    try { localStorage.setItem('imvoca.oauthPending', JSON.stringify(pending)); } catch(e){}
    // 네이티브 앱은 origin 이 capacitor://localhost 라 구글이 그리로 돌려보내주지 않는다.
    // 대신 커스텀 스킴으로 앱을 다시 깨운다.
    // ⚠️ Supabase → Authentication → URL Configuration → Redirect URLs 에
    //    app.imvoca://auth 를 반드시 추가해둬야 한다.
    const redirect = encodeURIComponent(_isIosApp() ? IOS_AUTH_REDIRECT : (location.origin + location.pathname));
    let authUrl = SB_URL + '/auth/v1/authorize?provider=' + provider + '&redirect_to=' + redirect;
    // 회원가입에서는 구글 계정 선택 화면을 강제로 띄운다.
    // (브라우저에 이미 로그인된 계정으로 자동 진행돼 원치 않는 아이디로 가입/로그인되는 문제 방지)
    if (onSignupTab) authUrl += '&prompt=select_account';
    track(onSignupTab ? 'sign_up' : 'login', { method: provider });
    // 앱 안 웹뷰에서 구글 로그인 페이지를 열면 구글이 'disallowed_useragent' 로 막는다.
    // 시스템 브라우저로 띄우고, 끝나면 딥링크로 앱이 다시 깨어난다.
    const _b = _capPlugin('Browser');
    if (_b) { _b.open({ url: authUrl, presentationStyle: 'popover' }).catch(() => { location.href = authUrl; }); return; }
    location.href = authUrl;
  }catch(e){ toast('로그인 이동 실패: ' + e.message); }
}

// 소셜 로그인 후 돌아왔을 때 (#access_token=... 처리)
// hashOverride: 네이티브 앱에서 딥링크(app.imvoca://auth#access_token=...)로 돌아왔을 때
// 주소창이 아니라 그 URL 의 프래그먼트를 넘겨받는다.
async function handleOAuthRedirect(hashOverride){
  const h = hashOverride || window.location.hash || '';
  if (h.indexOf('access_token=') === -1) return false;
  const hp = new URLSearchParams(h.replace(/^#/,''));
  const access_token = hp.get('access_token');
  const refresh_token = hp.get('refresh_token');
  if (!access_token) return false;
  if (!hashOverride) history.replaceState({}, '', window.location.pathname);
  try{
    const res = await fetch(SB_URL + '/auth/v1/user', { headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+access_token }});
    if(!res.ok){ renderLogin(); return true; }
    const user = await res.json();
    _authToken = access_token; currentUser = user;
    localStorage.setItem('imvoca.session', JSON.stringify({ access_token, refresh_token, user }));
    await ensureMemberRow(user);
    // 승인 대기(단체 학생/관리자) 체크
    if (user.email !== 'koreayjk@gmail.com') {
      try{
        const r = await fetch(SB_URL + `/rest/v1/members?id=eq.${user.id}&select=org_status,org_role`, { headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }});
        const md = await r.json();
        if (md[0] && md[0].org_status === 'pending') {
          toast(TT('아직 승인 대기 중이에요. 관리자 승인 후 사용 가능해요','Pending approval.'));
          _authToken=null; currentUser=null; localStorage.removeItem('imvoca.session');
          renderLogin(); return true;
        }
      }catch(e){}
    }
    await loadUserPlan();   // org 역할 먼저(공식책 로드 경합 방지)
    await Promise.all([ loadApiKey(), loadUserName(), loadBooksFromDB(), loadNotices(), loadAssignments() ]);
    await maybeSeedSampleBook();
    applyEntryStack(); render();
    setTimeout(updateNoticeBadge, 100); setTimeout(checkReviews, 1000);
  }catch(e){
    console.error('OAuth 처리 실패:', e);
    toast((TT('가입/로그인 오류: ','Signup/login error: ')) + (e.message||e), 6000);
    _authToken=null; currentUser=null;
    try{ localStorage.removeItem('imvoca.session'); }catch(_){}
    renderLogin();
  }
  return true;
}

// 소셜 첫 로그인 시 members 행 없으면 생성
async function ensureMemberRow(user){
  try{
    const r = await fetch(SB_URL + `/rest/v1/members?id=eq.${user.id}&select=id`, { headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }});
    const rows = await r.json();
    if (Array.isArray(rows) && rows.length>0) return; // 이미 있음(기존/연결 계정)
    const meta = user.user_metadata || {};
    // 가입 직전 저장해둔 이름/단체코드/유형
    let pending = null;
    try { pending = JSON.parse(localStorage.getItem('imvoca.oauthPending')||'null'); } catch(e){}
    try { localStorage.removeItem('imvoca.oauthPending'); } catch(e){}
    // 이메일 (카카오는 없을 수 있음)
    const emailVal = user.email || meta.email || null;
    // 사용자가 입력한 이름 우선, 없으면 소셜 계정 이름/닉네임
    const nm = (pending && pending.name) ? pending.name
      : (meta.name || meta.full_name || meta.nickname || meta.user_name || (emailVal ? emailVal.split('@')[0] : '사용자'));
    const body = { id:user.id, name:nm, role:'멤버', plan:'free', scan_count:0 };
    if (emailVal) body.email = emailVal;  // 이메일 있을 때만 저장 (카카오 무이메일 대비)
    if (pending && pending.source) body.signup_source = pending.source;
    if (pending && pending.suType === 'owner') {
      body.org_role = 'owner'; body.org_status = 'approved'; // 단체장 자동 승인(가드가 student로 낮춰도 아래 플래그로 단체 만들기 유도)
      try { localStorage.setItem('imvoca.ownerIntent.' + user.id, '1'); } catch(e){}
    } else if (pending && (pending.suType === 'student' || pending.code) && pending.code) {
      const org = await lookupOrgByCode(pending.code);
      if (org) { body.org_id = org.id; body.org_role = 'student'; body.org_status = 'pending'; }
    }
    const ins = await fetch(SB_URL + '/rest/v1/members', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken, 'Prefer':'return=representation' },
      body: JSON.stringify(body)
    });
    if (!ins.ok) {
      const errTxt = await ins.text().catch(()=> '');
      console.error('member 생성 실패:', ins.status, errTxt);
      // 이메일 중복(409) 등은 이미 계정이 있다는 뜻 → 통과시킴(연결)
      if (ins.status === 409 || /duplicate|unique/i.test(errTxt)) {
        return; // 이미 존재 → 정상 진행
      }
      throw new Error('가입 처리 오류 ('+ins.status+'): '+ (errTxt||'알 수 없는 오류'));
    }
  }catch(e){
    console.error('member 생성 실패:', e);
    throw e; // 상위(handleOAuthRedirect)에서 사용자에게 표시
  }
}

async function sbSignIn(email, pw) {
  // 로딩 상태 표시
  const btn = document.querySelector('.btn-solid');
  const emailEl = document.getElementById('li-em');
  const pwEl = document.getElementById('li-pw');
  if (btn) { btn.disabled = true; btn.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;"></span>${TT('로그인 중...','Logging in...')}</span>`; }
  if (emailEl) emailEl.disabled = true;
  if (pwEl) pwEl.disabled = true;
  try {
    const data = await sbFetch('/auth/v1/token?grant_type=password', 'POST', { email, password: pw }, false);
    if (data.error || !data.access_token) {
      toast('로그인 실패: 이메일 또는 비밀번호를 확인해주세요');
      if (btn) { btn.disabled = false; btn.textContent = t('loginBtn'); }
      if (emailEl) emailEl.disabled = false;
      if (pwEl) { pwEl.disabled = false; pwEl.value = ''; pwEl.focus(); }
      return;
    }
    _authToken = data.access_token; currentUser = data.user;
    // refresh_token 을 반드시 함께 저장해야 만료 후에도 자동 재로그인(카톡처럼 유지)됨
    localStorage.setItem('imvoca.session', JSON.stringify({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user }));
    if (btn) btn.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;"></span>${TT('불러오는 중...','Loading...')}</span>`;
    await loadApiKey(); await loadUserName();
    if (currentUser.email !== 'koreayjk@gmail.com') {
      try {
        const res = await fetch(SB_URL + `/rest/v1/members?id=eq.${currentUser.id}&select=role`, { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken } });
        const roleData = await res.json();
        const role = roleData[0]?.role;
        if (role === '대기중') {
          toast('아직 승인 대기 중이에요. 관리자 승인 후 사용 가능해요');
          _authToken = null; currentUser = null;
          localStorage.removeItem('imvoca.session');
          if (btn) { btn.disabled = false; btn.textContent = t('loginBtn'); }
          if (emailEl) emailEl.disabled = false;
          if (pwEl) pwEl.disabled = false;
          return;
        }
      } catch(e) {}
    }
    await loadUserPlan(); await loadBooksFromDB(); await maybeSeedSampleBook(); applyEntryStack(); render(); setTimeout(checkReviews, 1000);
  } catch(e) {
    toast('로그인 오류: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = t('loginBtn'); }
    if (emailEl) emailEl.disabled = false;
    if (pwEl) pwEl.disabled = false;
  }
}

async function lookupOrgByCode(code) {
  try {
    const data = await sbFetch(`/rest/v1/orgs?code=eq.${encodeURIComponent(code)}&active=eq.true&select=id,name`, 'GET', null, false);
    return (Array.isArray(data) && data[0]) ? data[0] : null;
  } catch(e) { return null; }
}

async function sbSignUp(email, pw, name, acctType='personal', orgCode='', source='') {
  // 입력값 검증
  if (!name?.trim()) { toast(TT('이름을 입력해주세요','Please enter your name')); return; }
  if (!email?.trim()) { toast(TT('이메일을 입력해주세요','Please enter your email')); return; }
  if (!email.includes('@')) { toast(TT('올바른 이메일을 입력해주세요','Please enter a valid email')); return; }
  if (!pw?.trim()) { toast(TT('비밀번호를 입력해주세요','Please enter a password')); return; }
  if (pw.length < 6) { toast(TT('비밀번호는 6자 이상이어야 해요','Password must be at least 6 characters')); return; }
  // 학생용 학원 코드가 있으면 먼저 확인 (학원장 가입은 코드 불필요)
  let org = null;
  const codeTrim = (orgCode||'').trim().toUpperCase();
  if (acctType === 'student') {
    if (!codeTrim) { toast(TT('단체 코드를 입력해주세요','Please enter the org code')); return; }
    org = await lookupOrgByCode(codeTrim);
    if (!org) { toast(TT('단체 코드를 찾을 수 없어요. 코드를 확인해주세요','Org code not found. Please check the code.')); return; }
  } else if (acctType !== 'owner' && codeTrim) {
    org = await lookupOrgByCode(codeTrim);
    if (!org) { toast(TT('단체 코드를 찾을 수 없어요. 코드를 확인해주세요','Org code not found. Please check the code.')); return; }
  }
  try {
    const data = await sbFetch('/auth/v1/signup', 'POST', { email, password: pw, data: { name } }, false);
    if (data.error) { toast('가입 실패: ' + data.error.message); return; }
    if (data.user?.id) {
      const body = { id: data.user.id, name, email, role: '멤버', plan: 'free', scan_count: 0 };
      if (source) body.signup_source = source;
      if (acctType === 'owner') { body.org_role = 'owner'; body.org_status = 'approved'; try { localStorage.setItem('imvoca.ownerIntent.' + data.user.id, '1'); } catch(e){} } // 단체장 자동 승인
      else if (org) { body.org_id = org.id; body.org_role = 'student'; body.org_status = 'pending'; }
      const mRes = await fetch(SB_URL + '/rest/v1/members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Prefer': 'return=minimal' },
        body: JSON.stringify(body)
      });
      if (!mRes.ok) {
        const errTxt = await mRes.text();
        console.error('[members 저장 실패]', mRes.status, errTxt);
        toast('계정은 생성됐지만 회원정보 저장에 실패했어요. 관리자에게 문의해주세요.');
      }
    } else {
      console.error('[회원가입] user.id 없음 - 이메일 인증 대기 상태일 수 있음', data);
    }
    let msg;
    if (acctType === 'owner') msg = TT('단체장 가입 완료! 로그인 후 바로 단체를 만들 수 있어요 😊','Owner signup complete! Log in and create your organization.');
    else if (org) msg = TX(`가입 완료! '{v0}' 승인 후 이용할 수 있어요 😊`,`Signed up! Active after '{v0}' approves you.`,{v0:(org.name)});
    else msg = TT('가입 완료! 바로 로그인해서 사용할 수 있어요 😊','Signed up! Log in to start.');
    toast(msg);
    track('sign_up', { method: 'email', account_type: acctType || 'personal' });
    window._suType = 'personal';
    renderLogin('login');
  } catch(e) { toast('가입 오류: ' + e.message); }
}

async function doDeleteAccount(){
  const word = TT('탈퇴','DELETE');
  const inp = document.getElementById('delacct-word');
  if (!inp || inp.value.trim() !== word) { toast(TX(`{v0} 라고 정확히 입력해주세요`,`Please type {v0} exactly`,{v0:word})); inp?.focus(); return; }
  const btn = document.getElementById('delacct-go');
  if (btn) { btn.disabled = true; btn.textContent = TT('삭제 중…','Deleting…'); }
  try {
    const res = await fetch(SB_URL + '/functions/v1/delete-account', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken },
      body: '{}'
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      try { idbSet(_booksCacheKey(), null); } catch(e){}
      try { localStorage.removeItem('imvoca.session'); localStorage.removeItem(_myOfficialKey()); } catch(e){}
      document.getElementById('delacct-modal')?.remove();
      toast(TT('탈퇴가 완료됐어요. 그동안 함께해주셔서 감사합니다 🙏','Your account has been deleted. Thank you for using IM VOCA 🙏'), 5000);
      _authToken = null; currentUser = null; books = [];
      setTimeout(() => renderLogin(), 800);
      return;
    }
    if (data.error === 'org_has_members') {
      toast(TT('단체에 다른 멤버가 있어 탈퇴할 수 없어요. 단체 관리에서 멤버를 먼저 정리해주세요.','Your organization still has members. Remove them first in Org Admin.'), 5000);
    } else {
      toast(TT('탈퇴 처리에 실패했어요. 잠시 후 다시 시도해주세요.','Failed to delete account — please try again.'));
    }
  } catch(e) {
    toast(TT('네트워크 오류','Network error'));
  }
  if (btn) { btn.disabled = false; btn.textContent = TT('영구 삭제하기','Delete permanently'); }
}

// ── 부팅 가속: 책 데이터 로컬 캐시(IndexedDB) ─────────────────────
// 앱을 켜면 직전 세션의 책 데이터로 즉시 그리고, 뒤에서 서버 최신본으로 교체한다.
// (localStorage 는 5MB 제한이라 단어+분석까지 담기엔 작음 → IndexedDB 사용)
function _idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('imvoca', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(key){ try { const db = await _idbOpen(); return await new Promise((res) => { const t = db.transaction('kv').objectStore('kv').get(key); t.onsuccess = () => res(t.result); t.onerror = () => res(null); }); } catch(e){ return null; } }
async function idbSet(key, val){ try { const db = await _idbOpen(); return await new Promise((res) => { const t = db.transaction('kv','readwrite').objectStore('kv').put(val, key); t.onsuccess = () => res(true); t.onerror = () => res(false); }); } catch(e){ return false; } }
function _booksCacheKey(){ return 'books:' + ((currentUser && currentUser.id) || ''); }

// (0.5초쯤 뒤 서버 값으로 덮어써지므로 캐시가 조금 낡아도 문제되지 않는다)

function _applyProfileSnapshot(p){
  if (!p || typeof p !== 'object') return;
  if (typeof p.userName === 'string') userName = p.userName;
  if (typeof p.userPlan === 'string') userPlan = p.userPlan;
  if (typeof p.userScanCount === 'number') userScanCount = p.userScanCount;
  if (typeof p.userDailyScanCount === 'number') userDailyScanCount = p.userDailyScanCount;
  if (p.userDailyScanDate !== undefined) userDailyScanDate = p.userDailyScanDate;
  if (p.userPremiumUntil !== undefined) userPremiumUntil = p.userPremiumUntil;
  if (p.userOrgId !== undefined) userOrgId = p.userOrgId;
  if (p.userOrgRole !== undefined) userOrgRole = p.userOrgRole;
  if (p.userOrgStatus !== undefined) userOrgStatus = p.userOrgStatus;
  // 단체 정보까지 되살려야 새로고침 직후 바로 콘솔이 그려진다.
  // (0.5초 뒤 loadMyOrg 가 최신 값으로 덮어쓴다)
  if (p.userOrg) userOrg = p.userOrg;
}

async function _bootShelfFromCache(){
  try {
    const cached = await idbGet(_booksCacheKey());
    if (!cached || !Array.isArray(cached.books) || !cached.books.length) return false;
    books = cached.books;
    _applyProfileSnapshot(cached.profile);
    updateTotalWords();
    return true;
  } catch(e){ return false; }
}
// 렌더를 방해하지 않게 잠시 뒤 저장 (여러 번 불려도 마지막 상태가 남으면 됨)
function _saveBooksCache(){
  try { const uid = currentUser && currentUser.id; if (!uid) return;
    clearTimeout(window._bcTimer);
    window._bcTimer = setTimeout(() => {
      try { idbSet('books:' + uid, { books, profile: _profileSnapshot(), savedAt: Date.now() }); } catch(e){}
    }, 600);
  } catch(e){}
}

async function loadBooksFromDB() {
  try {
    const _hiddenP = loadHiddenWords();   // 큰 책 데이터와 병렬로 (직렬 대기 제거)
    // 책 + 페이지 + 단어를 한 번에 (embed)
    // 일시적 오류(네트워크/토큰 타이밍)로 null 이 오면 재시도 — 한 번 삐끗해서
    // 책장이 통째로 '0권'으로 비어 뜨던 문제 방지(공용 fetchRetry).
    const bd = await fetchRetry(() => sbFetch(`/rest/v1/voca_books?user_id=eq.${currentUser.id}&select=*,voca_pages(*,voca_words(*))&order=created_at`));
    // 끝내 실패하면 기존 books 를 비우지 말고(빈 책장 오인 방지) 조용히 종료
    if (!Array.isArray(bd)) { console.error('DB load failed after retries'); return; }
    books = bd.map(b => ({
      id: b.id, title: b.title, author: b.author, color: b.color,
      _added: b.created_at || '',          // 책장 정렬(최신순) 기준
      desc: b.description || '', cover: b.is_official ? _officialCover(b.title, b.cover_url) : (b.cover_url || ''), category: b.category || 'general',
      _officialContent: !!b.is_official, // 공식 콘텐츠 책: 촬영/직접입력 버튼 숨김(소유자 본인이 봐도)
      // 소유자 본인이 봐도 공식 책은 잠금(Day1만 무료) 적용 → _official/_readonly 부여(무료=다 락, 유료만 풀림)
      ...(b.is_official ? { _official: true, _readonly: true } : {}),
      pages: (b.voca_pages || [])
        .sort((a,c) => (a.page_num+'').localeCompare(c.page_num+'', undefined, { numeric: true }))
        .map(p => ({
          num: p.page_num, _pid: p.id,
          words: (p.voca_words || [])
            .sort((a,c) => new Date(a.created_at) - new Date(c.created_at))
            .map(w => ({ id: w.id, en: w.en, ipa: w.ipa||'', base: w.base, ctx: w.ctx, sentence: w.sentence||'', level: w.level||'', fav: w.is_favorite||false, analysis: w.analysis || null }))
        }))
}));
    // 공식책(내 소유 행 포함)은 '추가'한 것만 즉시 남김 — 공식 카탈로그(큰 fetch)를 기다리는
    // appendOfficialBooks 전에 걸러서, 전체 공식책이 잠깐 보였다 나중에 사라지는 깜빡임 방지.
    // (선택 기록이 아직 없는 첫 실행은 건너뛰고 appendOfficialBooks 의 시딩에 맡김)
    if (localStorage.getItem(_myOfficialKey()) !== null) {
      const _picked0 = new Set(getMyOfficialIds());
      books = books.filter(b => !b._officialContent || _picked0.has(b.id));
    }
    updateTotalWords();
    // 숨긴 단어(나에게만 제외): 병렬 로드 완료 후 메모리에서 제거
    await _hiddenP; _stripHiddenWords();
    // 공식 단어장(~6천 단어, 큰 payload)은 비동기로 붙임 → 소유 책 먼저 그려 첫 화면
    // 블로킹을 없애고, 로드 완료 후 현재 화면을 다시 렌더한다.
    window._officialPending = true;
    appendOfficialBooks().then(() => {
      window._officialPending = false;
      updateTotalWords();
      _saveBooksCache();
      if (currentUser && typeof render === 'function') { try { render(); } catch(e){} }
      // 공식 단어장이 이제서야 책장에 붙었다 → 그 책들의 복습을 다시 센다.
      // (이걸 안 하면 공식 단어장 복습이 있는 사람은 탭 뱃지가 안 뜬다)
      try { if (currentUser && typeof checkReviews === 'function') checkReviews().catch(()=>{}); } catch(e){}
    }).catch(e => { window._officialPending = false; console.warn('[official load]', e); });
  } catch(e) { console.error('DB load error:', e); }
}

// 공식 책 표지: 제목에 따라 레포에 호스팅된 표지 이미지를 매핑(DB cover_url이 비어도 적용).
function _officialCover(title, dbCover){
  const t = title || '';
  // 수능 전용 표지 — 제목에 '수능'이 있을 때만. (중등 핵심/스페인어 등이 '핵심' 같은
  // 공통어로 수능 표지를 잘못 가져가던 문제 방지)
  if (t.indexOf('수능') >= 0) {
    if (t.indexOf('기본') >= 0) return 'cover-suneung-basic.jpg?v=5';
    if (t.indexOf('핵심') >= 0) return 'cover-suneung-core.jpg?v=5';
    if (t.indexOf('고난도') >= 0) return 'cover-suneung-hard.jpg?v=5';
    if (t.indexOf('숙어') >= 0) return 'cover-suneung-idiom.jpg?v=5';
  }
  return dbCover || '';
}
// 공식 단어장(is_official)을 읽어 책장에 추가 (읽기전용). 이미 있으면(소유자 본인) 중복 제거.
// 공식책의 학습언어 판별: '스페인어…'=es, 그 외(수능·중등)=en. (앱은 학습언어=userTargetLang 에 맞는 공식책만 노출)
function _officialLang(title){ return String(title||'').startsWith('스페인어') ? 'es' : 'en'; }

// 공식책 카탈로그(페이지·단어 포함)를 한 번만 받아 캐시. 추가 모달 선택 목록·개인 추가에 재사용.
async function ensureOfficialCatalog(){
  if (Array.isArray(window._officialCatalogFull)) return window._officialCatalogFull;
  try {
    // 일시적 오류로 null 이 오면 재시도 — 공식책이 가끔 안 뜨던 문제 방지(공용 fetchRetry)
    const od = await fetchRetry(() => sbFetch(`/rest/v1/voca_books?is_official=eq.true&select=*,voca_pages(*,voca_words(*))&order=created_at`));
    if (Array.isArray(od)) window._officialCatalogFull = od;
  } catch(e){ console.warn('[official catalog]', e); }
  return Array.isArray(window._officialCatalogFull) ? window._officialCatalogFull : [];
}
// DB 공식책 행 → 메모리 book 객체(읽기전용)
function _mapOfficialBook(b){
  return {
    id: b.id, title: b.title, author: b.author, color: b.color,
    _added: (getMyOfficialAt()[b.id] || b.created_at || ''),   // 책장에 담은 시각
    desc: b.description || '', cover: _officialCover(b.title, b.cover_url), category: b.category || 'general',
    _official: true, _readonly: true, _officialContent: true,
    pages: (b.voca_pages || [])
      .sort((a,c) => (a.page_num+'').localeCompare(c.page_num+'', undefined, { numeric: true }))
      .map(p => ({
        num: p.page_num, _pid: p.id,
        words: (p.voca_words || [])
          .sort((a,c) => new Date(a.created_at) - new Date(c.created_at))
          .map(_dbRowToWord)
      }))
  };
}
// 개인(비단체) 사용자가 '추가'한 공식책 id 목록 — 기기별 기억(학습 진도는 DB에 저장돼 기기 무관 유지)
function _myOfficialKey(){ return 'imvoca_offbooks_' + ((currentUser && currentUser.id) || 'anon'); }
// 공식책을 '언제 책장에 담았는지' — 최신순 정렬에서 내가 만든 책과 동일하게 취급하기 위해 기록.
// (공식책 행의 created_at 은 모두가 공유하는 원본 생성일이라 개인 책장 순서로는 못 쓴다)
function _myOfficialAtKey(){ return 'imvoca_offbooks_at_' + ((currentUser && currentUser.id) || 'anon'); }
function getMyOfficialAt(){
  try { const v = JSON.parse(localStorage.getItem(_myOfficialAtKey())||'{}'); return (v && typeof v==='object') ? v : {}; } catch(e){ return {}; }
}
function _setMyOfficialAt(id, iso){
  try { const m = getMyOfficialAt(); m[id] = iso; localStorage.setItem(_myOfficialAtKey(), JSON.stringify(m)); } catch(e){}
  _pushShelfOfficial();
}

// ── 책장 정렬 / 보기 모드 ──────────────────────────────────────────
// 정렬: recent(기본·최신순) | oldest | title | custom(내가 직접 옮긴 순서)
// 보기: grid(기본·표지 크게) | list(작은 표지 + 제목)
const SHELF_SORTS = ['recent','oldest','title','custom'];
function _shelfKey(n){ return 'imvoca_shelf' + n + '_' + ((currentUser && currentUser.id) || 'anon'); }
function getShelfSort(){ try { const v = localStorage.getItem(_shelfKey('Sort')); return SHELF_SORTS.indexOf(v)>=0 ? v : 'recent'; } catch(e){ return 'recent'; } }
function getShelfView(){ try { return localStorage.getItem(_shelfKey('View'))==='list' ? 'list' : 'grid'; } catch(e){ return 'grid'; } }
function getShelfOrder(){ try { const v = JSON.parse(localStorage.getItem(_shelfKey('Order'))||'[]'); return Array.isArray(v)?v:[]; } catch(e){ return []; } }
function _setShelfOrder(ids){ try { localStorage.setItem(_shelfKey('Order'), JSON.stringify(ids)); } catch(e){} }
let _shelfEditing = false;   // 순서 편집 모드(▲▼ 노출 + 드래그 활성 + 탭해도 안 열림)

function setShelfSort(v){
  if (SHELF_SORTS.indexOf(v) < 0) return;
  // '내 순서'로 처음 들어오면 지금 보이는 순서를 그대로 출발점으로 굳힌다 (책이 갑자기 뒤섞이지 않게)
  if (v === 'custom' && !getShelfOrder().length) _setShelfOrder(sortedShelfBooks().map(b=>b.id));
  try { localStorage.setItem(_shelfKey('Sort'), v); } catch(e){}
  if (v !== 'custom') _shelfEditing = false;
  try { renderKeepScroll(); } catch(e){ render(); }
}
function setShelfView(v){
  try { localStorage.setItem(_shelfKey('View'), v==='list'?'list':'grid'); } catch(e){}
  try { renderKeepScroll(); } catch(e){ render(); }
}
function toggleShelfEdit(){
  _shelfEditing = !_shelfEditing;
  // 편집을 시작하면 자동으로 '내 순서'로 전환 — 옮겨놓고 정렬에 덮어써지는 일이 없도록
  if (_shelfEditing && getShelfSort() !== 'custom') { setShelfSort('custom'); return; }
  try { renderKeepScroll(); } catch(e){ render(); }
}

// 이 책을 책장에 담은 시각 (공식책은 개인 기록 우선)
function _bookAddedAt(b){
  if (b && b._officialContent) { const m = getMyOfficialAt(); if (m[b.id]) return m[b.id]; }
  return (b && b._added) || '';
}
// 현재 정렬 기준으로 정돈한 책 목록 (books 원본은 건드리지 않는다)
function sortedShelfBooks(){
  const list = books.slice();
  const mode = getShelfSort();
  const newest = (a,b) => String(_bookAddedAt(b)).localeCompare(String(_bookAddedAt(a)));
  if (mode === 'title')  return list.sort((a,b) => String(a.title||'').localeCompare(String(b.title||''), undefined, { numeric:true, sensitivity:'base' }));
  if (mode === 'oldest') return list.sort((a,b) => String(_bookAddedAt(a)).localeCompare(String(_bookAddedAt(b))));
  if (mode === 'custom') {
    const pos = new Map(getShelfOrder().map((id,i) => [id,i]));
    // 저장된 순서에 없는 책 = 그 뒤에 새로 담은 책 → 맨 위로 (그들끼리는 최신순)
    return list.sort((a,b) => {
      const pa = pos.has(a.id) ? pos.get(a.id) : -1;
      const pb = pos.has(b.id) ? pos.get(b.id) : -1;
      if (pa < 0 && pb < 0) return newest(a,b);
      if (pa < 0) return -1;
      if (pb < 0) return 1;
      return pa - pb;
    });
  }
  return list.sort(newest);   // recent (기본)
}

// ▲▼ 한 칸 이동
function moveShelfBook(id, dir){
  const cur = sortedShelfBooks().map(b=>b.id);
  const i = cur.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= cur.length) return;
  cur.splice(j, 0, cur.splice(i,1)[0]);
  _setShelfOrder(cur);
  try { localStorage.setItem(_shelfKey('Sort'), 'custom'); } catch(e){}
  try { renderKeepScroll(); } catch(e){ render(); }
}
// 드래그해서 다른 책 자리에 놓기
function dropShelfBook(dragId, targetId){
  if (!dragId || !targetId || dragId === targetId) return;
  const cur = sortedShelfBooks().map(b=>b.id);
  const from = cur.indexOf(dragId), to = cur.indexOf(targetId);
  if (from < 0 || to < 0) return;
  cur.splice(to, 0, cur.splice(from,1)[0]);
  _setShelfOrder(cur);
  try { localStorage.setItem(_shelfKey('Sort'), 'custom'); } catch(e){}
  try { renderKeepScroll(); } catch(e){ render(); }
}
function getMyOfficialIds(){
  try { const v = JSON.parse(localStorage.getItem(_myOfficialKey())||'[]'); return Array.isArray(v)?v:[]; } catch(e){ return []; }
}
function _setMyOfficialIds(arr){
  try{ localStorage.setItem(_myOfficialKey(), JSON.stringify([...new Set(arr)])); }catch(e){}
  _pushShelfOfficial();
}

// ── 책장에 담은 공식 단어장 = 서버에도 저장 ───────────────────────
// 예전에는 이 목록이 localStorage 에만 있었다. 그래서 기기를 바꾸거나 앱을 새로
// 깔면 목록이 비어 있고, 아래 '복습 진도가 있는 공식책을 자동으로 담는' 최초
// 시딩이 다시 돌아서 **사용자가 일부러 뺀 책이 되살아났다.**
// (웹으로 쓰던 사람이 스토어 앱을 설치하면 반드시 겪는다)
// 이제 members.shelf_official 에 { ids, at } 로 함께 저장한다.
let _shelfSynced = false;     // 서버 값을 받아오는 데 성공했는가
let _shelfHasServer = false;  // 서버에 저장된 값이 있었는가 (없으면 최초 시딩 대상)
let _shelfPushTimer = null;

function _applyServerShelf(v){
  if (!v || typeof v !== 'object') { _shelfHasServer = false; return; }
  _shelfHasServer = true;
  try {
    if (Array.isArray(v.ids)) localStorage.setItem(_myOfficialKey(), JSON.stringify([...new Set(v.ids)]));
    if (v.at && typeof v.at === 'object') localStorage.setItem(_myOfficialAtKey(), JSON.stringify(v.at));
  } catch(e){}
}

// 컬럼이 아직 없으면(마이그레이션 전) authGet 이 null 을 돌려주고 _shelfSynced 는
// false 로 남는다 → 예전과 똑같이 동작한다. 절대 기존 동작을 깨지 않게.
async function loadShelfOfficial(){
  if (!currentUser) return;
  try {
    const d = await authGet(`/rest/v1/members?id=eq.${currentUser.id}&select=shelf_official`);
    if (!Array.isArray(d)) return;
    _shelfSynced = true;
    _applyServerShelf(d[0] && d[0].shelf_official);
  } catch(e){}
}

// 담기/빼기를 연속으로 해도 요청이 쌓이지 않게 모아서 한 번만 보낸다.
function _pushShelfOfficial(){
  if (!currentUser || !_shelfSynced) return;   // 서버를 못 읽은 상태에서 덮어쓰지 않는다
  clearTimeout(_shelfPushTimer);
  _shelfPushTimer = setTimeout(() => {
    const body = { shelf_official: { ids: getMyOfficialIds(), at: getMyOfficialAt() } };
    sbFetch(`/rest/v1/members?id=eq.${currentUser.id}`, 'PATCH', body, true, { 'Prefer': 'return=minimal' })
      .then(() => { _shelfHasServer = true; })
      .catch(()=>{});
  }, 600);
}

async function appendOfficialBooks() {
  try {
    // 서버에 저장된 '내 책장 공식책' 목록을 먼저 반영 (뺀 책이 되살아나지 않게)
    if (currentUser && !_shelfSynced) await loadShelfOfficial();
    // 이전부터 쓰던 사용자: 서버엔 아직 없고 이 기기(브라우저)에만 목록이 있다.
    // 그대로 두면 다른 기기·새 설치에서 시딩이 돌아 뺀 책이 되살아나므로, 지금 올려둔다.
    if (_shelfSynced && !_shelfHasServer && localStorage.getItem(_myOfficialKey()) !== null) {
      _pushShelfOfficial();
    }
    // 단체 소속이면서 '승인된 관리자(owner)'가 아닌 사람 = 단체 학생/대기자.
    // → 공식 단어장 전체를 자동으로 보여주지 않는다. 배정(_assigned)받은 것만 loadAssignments 로 보임.
    const approvedOwner = (userOrgRole === 'owner' && userOrgStatus === 'approved');
    const od = await ensureOfficialCatalog();
    if (!Array.isArray(od) || !od.length) return;

    // ⚠️ 단체 학생: 카탈로그 전체는 감추되, '가입 전부터 외우던(복습 진도가 있는)'
    // 공식책은 계속 책장에 유지한다. 개인 사용자가 공식 단어장을 담아 공부하다가
    // 단체로 소속되면 그 책이 통째로 사라지던 문제 방지 — 진도(voca_review)는 DB에
    // 남아 있으므로 책 타일만 되살려 준다. (배정받은 공식책은 loadAssignments 가 이미 주입)
    if (userOrgId && !approvedOwner) {
      try {
        const offIds = od.map(b => b.id);
        const rv = offIds.length
          ? await sbFetch(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=in.(${offIds.join(',')})&select=book_id`)
          : [];
        const studied = new Set(Array.isArray(rv) ? rv.map(r => r.book_id) : []);
        od.filter(b => studied.has(b.id)).forEach(b => {
          const ex = findBook(b.id);
          if (ex) { ex._official = true; ex._readonly = true; ex._officialContent = true; if (!ex.cover) ex.cover = _officialCover(b.title, b.cover_url); }
          else books.push(_mapOfficialBook(b));
        });
      } catch(e){ console.warn('[studied official keep]', e); }
      return;
    }
    const have = new Set(books.map(b => b.id));
    // 책장 노출: 관리자·개인 모두 본인이 '추가'한 공식책만 (관리자도 자유롭게 추가/빼기 가능).
    // 배정·시험출제는 책장이 아니라 adminBookPool()(카탈로그 유니온)을 쓰므로 빼도 기능에 지장 없음.
    // 최초 1회: 이미 복습 진도가 있는 공식책은 유지(공부 중이던 책이 사라지지 않도록 시딩).
    // 최초 1회 시딩: 서버에도 없고 이 기기에도 없을 때만. 서버에 빈 목록이
    // 저장돼 있다면 '전부 뺀 것'이 사용자의 선택이므로 되살리지 않는다.
    if (currentUser && !_shelfHasServer && localStorage.getItem(_myOfficialKey()) === null) {
      try {
        const offIds = od.map(b => b.id);
        const rv = offIds.length
          ? await sbFetch(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=in.(${offIds.join(',')})&select=book_id`)
          : [];
        _setMyOfficialIds(Array.isArray(rv) ? rv.map(r => r.book_id) : []);
      } catch(e){ _setMyOfficialIds([]); }
    }
    const picked = new Set(getMyOfficialIds());
    od.filter(b => picked.has(b.id)).forEach(b => {
      const ex = findBook(b.id);
      if (ex) {
        // 이미 책장에 있음(예: 배정 로드가 먼저 실행돼 _assigned 로 주입된 경우) →
        // 공식 속성을 보강해서 책장에 공식책으로 정상 노출되게 한다.
        // (예전엔 have.has 로 건너뛰어 _official 이 안 붙고, 배정한 수능책이 책장에서 사라졌음)
        ex._official = true; ex._readonly = true; ex._officialContent = true;
        if (!ex.cover) ex.cover = _officialCover(b.title, b.cover_url);
      } else {
        books.push(_mapOfficialBook(b));
      }
    });
    // 공식책 '제작 계정'(공식책이 본인 소유 DB 행): loadBooksFromDB 가 매 로그인마다
    // 공식책을 개인 책으로 다시 불러오므로, '추가'하지 않은 공식책은 여기서 책장에서 제외.
    // (배정·시험출제는 adminBookPool 이 카탈로그에서 직접 가져가므로 기능 지장 없음)
    const _offIds = new Set(od.map(b => b.id));
    for (let i = books.length - 1; i >= 0; i--) {
      const b = books[i];
      if ((_offIds.has(b.id) || b._officialContent) && !picked.has(b.id)) books.splice(i, 1);
    }
    _stripHiddenWords();
  } catch(e) { console.warn('[official load]', e); }
}

// 공식 단어장 목록에서 담기/빼기를 하면 목록이 다시 그려지면서 맨 위로 튀었다.
// 실제로 스크롤되는 것은 모달이 아니라 목록 안쪽의 max-height 박스
// (#official-picker-list)인데, renderOfficialPicker 가 innerHTML 로 그 박스를
// 통째로 새로 만들기 때문에 scrollTop 이 무조건 0 으로 돌아간다.
// → 다시 그리기 전에 위치를 적어두고, 새로 생긴 박스에 그대로 돌려준다.
function _keepPickerScroll(fn){
  const prev = document.getElementById('official-picker-list');
  const top = prev ? prev.scrollTop : 0;
  const restore = () => {
    if (!top) return;
    const el = document.getElementById('official-picker-list');
    if (!el) return;
    try { el.scrollTop = top; } catch(e){}
    // 방금 만들어진 직후라 레이아웃이 덜 잡혔을 수 있어 한 프레임 뒤에 한 번 더
    requestAnimationFrame(() => { try { el.scrollTop = top; } catch(e){} });
  };
  let r; try { r = fn(); } catch(e){ restore(); throw e; }
  if (r && typeof r.then === 'function') r.then(restore, restore); else restore();
}

// 개인 사용자: 공식책을 책장에 추가/제거
function addOfficialToShelf(id){
  const od = Array.isArray(window._officialCatalogFull) ? window._officialCatalogFull : [];
  const row = od.find(b => b.id === id);
  if (!row) return;
  _setMyOfficialAt(id, new Date().toISOString());   // 최신순 정렬에서 방금 담은 책이 맨 위로
  if (!books.some(b => b.id === id)) books.push(_mapOfficialBook(row));
  _setMyOfficialIds([...getMyOfficialIds(), id]);
  try { loadReviewStatus(id); } catch(e){}
  _keepPickerScroll(() => renderOfficialPicker());
  try { renderKeepScroll(); } catch(e){}
  toast(TT('📚 단어장을 책장에 추가했어요','Added to your shelf'));
}
function removeOfficialFromShelf(id){
  const i = books.findIndex(b => b.id === id && b._official);
  if (i >= 0) books.splice(i, 1);
  _setMyOfficialIds(getMyOfficialIds().filter(x => x !== id));
  _keepPickerScroll(() => renderOfficialPicker());
  try { renderKeepScroll(); } catch(e){}
  toast(TT('책장에서 뺐어요','Removed from shelf'));
}

// ── 공식·과제 책의 단어 '나에게만 숨기기' ─────────────────────────
// 공식 단어장은 모두가 공유하므로 진짜 삭제 대신, 사용자별로 숨김(voca_hidden_words).
// 숨긴 단어는 내 목록·암기·퀴즈·복습·단어 수에서만 빠지고 다른 사용자에겐 그대로.
let _hiddenWords = new Set();   // 내가 숨긴 word_id 집합
let _hiddenStash = {};          // bookId → [{pageNum, w}] 숨겨서 메모리에서 뺀 단어(복원 목록용)
let _hiddenLoaded = false;
async function loadHiddenWords(){
  if (!currentUser || !_authToken || _hiddenLoaded) return;
  try {
    const rows = await authGet(`/rest/v1/voca_hidden_words?user_id=eq.${currentUser.id}&select=word_id&limit=5000`);
    if (Array.isArray(rows)) { _hiddenWords = new Set(rows.map(r => r.word_id)); _hiddenLoaded = true; }
  } catch(e){}
}
// 메모리 books 에서 숨긴 단어 제거 (읽기전용 책만) — 여러 번 불려도 안전
function _stripHiddenWords(){
  if (!_hiddenLoaded || !_hiddenWords.size) return;
  let changed = false;
  (books||[]).forEach(b => {
    if (!(b._readonly || b._official || b._assigned || b._officialContent)) return;
    (b.pages||[]).forEach(p => {
      for (let i = (p.words||[]).length - 1; i >= 0; i--) {
        const w = p.words[i];
        if (w && w.id && _hiddenWords.has(w.id)) {
          p.words.splice(i, 1);
          (_hiddenStash[b.id] = _hiddenStash[b.id] || []).push({ pageNum: p.num, w });
          changed = true;
        }
      }
    });
  });
  if (changed) updateTotalWords();
}
async function hideWordForMe(bookId, pageNum, wordId){
  const b = findBook(bookId); if (!b) return;
  const p = findPage(b, pageNum); if (!p) return;
  const i = (p.words||[]).findIndex(w => w && w.id === wordId);
  if (i < 0) return;
  const w = p.words[i];
  p.words.splice(i, 1);
  (_hiddenStash[bookId] = _hiddenStash[bookId] || []).push({ pageNum: p.num, w });
  _hiddenWords.add(wordId); _hiddenLoaded = true;
  updateTotalWords(); renderKeepScroll();
  toast(TT('나에게만 숨겼어요 — 🙈 숨긴 단어에서 복원할 수 있어요','Hidden for you only — restore from 🙈'));
  try { await authPost('/rest/v1/voca_hidden_words', { user_id: currentUser.id, word_id: wordId }, 'return=minimal'); } catch(e){}
}
async function unhideWord(bookId, wordId){
  const list = _hiddenStash[bookId] || [];
  const i = list.findIndex(x => x.w && x.w.id === wordId);
  if (i < 0) return;
  const { pageNum, w } = list[i];
  list.splice(i, 1);
  _hiddenWords.delete(wordId);
  const b = findBook(bookId); const p = b && findPage(b, pageNum);
  if (p) p.words.push(w);
  updateTotalWords();
  const ov = document.getElementById('hidden-words-modal'); if (ov) ov.remove();
  if (list.length) showHiddenWords(bookId);
  try { renderKeepScroll(); } catch(e){}
  try { await _authDelete(`/rest/v1/voca_hidden_words?user_id=eq.${currentUser.id}&word_id=eq.${wordId}`); } catch(e){}
}
function showHiddenWords(bookId){
  const list = _hiddenStash[bookId] || [];
  const overlay = document.createElement('div');

  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:flex-end;justify-content:center;';

    </div>`).join('') : `<div class="muted" style="font-size:13px;text-align:center;padding:22px 0;">${TT('숨긴 단어가 없어요','No hidden words')}</div>`;
  overlay.innerHTML = `
    <div style="background:var(--bg-card);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:80vh;overflow:auto;">
      <div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--ink-100);margin-bottom:2px;">🙈 ${TT('숨긴 단어','Hidden words')} · ${list.length}</div>
      <div class="muted" style="font-size:12px;margin-bottom:10px;">${TT('나에게만 숨겨진 단어예요 — 복원하면 다시 암기·복습에 포함돼요','Hidden only for you — restore to include them again')}</div>
      ${rows}
      <button onclick="document.getElementById('hidden-words-modal').remove()" style="width:100%;margin-top:12px;background:none;border:none;color:var(--ink-45);font-size:13px;cursor:pointer;padding:10px;font-family:var(--font-body);">${TT('닫기','Close')}</button>
    </div>`;
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

// 추가 모달의 '우리가 만든 단어장' 선택 목록 렌더 (개인 사용자 + 단체 관리자)
async function renderOfficialPicker(){
  const box = document.getElementById('official-picker');
  if (!box) return;
  const ko = userNativeLang==='ko';
  // 한국어 사용자가 아니면 공식 단어장 목록 자체를 숨긴다 (뜻이 전부 한국어라 쓸 수 없다)
  if (!_officialBooksForMe()) { box.innerHTML = ''; return; }
  // 단체 '학생'에게는 선택 목록을 보이지 않음(배정받은 책만) — 관리자는 개인처럼 추가/빼기 가능.
  if (userOrgId && !_seesAllOfficialLangs()) { box.innerHTML = ''; return; }
  // 목록을 이미 받아둔 상태에서 '담기/빼기' 후 다시 그리는 경우에는 비우지 않는다.
  // 한 줄짜리 '불러오는 중…' 으로 갈아끼우면 높이가 무너져서 모달 스크롤이 맨 위로 튄다.
  if (!Array.isArray(window._officialCatalogFull)) {
    box.innerHTML = `<div style="font-size:12px;color:var(--ink-40);padding:8px 2px;">${TT('불러오는 중…','Loading…')}</div>`;
  }
  const od = await ensureOfficialCatalog();
  // 전 언어 공식책 모두 노출 — 스페인어 단어장도 토익·토플처럼 누구나 추가해서 공부할 수 있게 (학습언어 필터 제거)
  const list = od;
  if (!list.length){ box.innerHTML=''; return; }
  const onShelf = new Set(books.map(b=>b.id));
  const rows = list.map(b=>{
    const wc = (b.voca_pages||[]).reduce((n,p)=>n+((p.voca_words||[]).length),0);
    const added = onShelf.has(b.id);
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--ink-05);">
      <div style="flex:1;min-width:0;">

        : `<button onclick="addOfficialToShelf('${jsq(b.id)}')" style="flex-shrink:0;background:var(--gold-bg);border:1px solid rgba(28,53,83,0.25);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;font-family:var(--font-body);">＋ ${TT('추가','Add')}</button>`}

    <div id="official-picker-list" style="border:1px solid var(--ink-07);border-radius:12px;padding:2px 12px;max-height:230px;overflow-y:auto;">${rows}</div>`;

async function saveBookToDB(title, author, color, desc, cover='', category='general') {
  try {
    const body = { user_id:currentUser.id, title, author, color, description:desc, cover_url:cover };
    if (category && category !== 'general') body.category = category;
    const data = await sbFetch('/rest/v1/voca_books', 'POST',
      body,
      true, { 'Prefer': 'return=representation' });
    if (data.code || data.error) { toast('DB 오류: ' + (data.message || data.error)); return null; }
    return Array.isArray(data) ? data[0] : data;
  } catch(e) { toast('저장 오류: ' + e.message); return null; }
}

function calcWordScore(words) {
  // CEFR 난이도별 가중치
  const WEIGHTS = { 'A2': 1, 'B1': 2, 'B2': 3, 'C1': 4, 'C2': 5 };
  return words.reduce((sum, w) => sum + (WEIGHTS[w.level] || 1), 0);
}

async function updateTotalWords(allowZero=false) {
  if (!currentUser) return;
  try {
    // 전체 단어 가중치 점수(CEFR) 계산 → members.total_words에 저장
    // 공식책·배정책(_assigned)은 '내 단어'가 아니므로 제외.
    const totalScore = books.filter(b => !b._official && !b._assigned).reduce((sum, b) =>
      sum + b.pages.reduce((s, p) =>
        s + calcWordScore(p.words), 0), 0);
    // ⚠️ 스푸리어스 제로화 방지: 책 로드가 아직 안 됐거나, 토큰 만료 등으로 목록이 일시적으로
    // 비어 total=0 이 나올 때 total_words 를 0 으로 덮어쓰면 관리자·랭킹에 '단어 0'으로 표시됨.
    // 실제 0 은 '삭제'로 마지막 단어까지 지운 경우뿐 → 그때만 allowZero=true 로 0 기록 허용.
    if (totalScore === 0 && !allowZero) return;
    await sbFetch(`/rest/v1/members?id=eq.${currentUser.id}`, 'PATCH', { total_words: totalScore });
  } catch(e) {}
}

async function savePageWordsToDB(bookId, pageNum, words) {
  try {
    // 단어 0개면 페이지 자체를 만들지 않음 (빈 유령 페이지 방지)
    if (!words || !words.length) return { pageId: null, savedRows: [] };
    const book = findBook(bookId);
    let pageId;
    const ex = book?.pages.find(p => String(p.num) === String(pageNum));
    if (ex?._pid) { pageId = ex._pid; }
    if (!pageId) {
      // DB에 같은 책+페이지번호가 이미 있는지 확인 (중복 페이지 방지)
      try {
        const found = await sbFetch(`/rest/v1/voca_pages?book_id=eq.${bookId}&page_num=eq.${encodeURIComponent(String(pageNum))}&select=id&limit=1`);
        if (Array.isArray(found) && found[0]?.id) pageId = found[0].id;
      } catch(e) {}
    }
    let pageCreatedHere = false;
    if (!pageId) {
      const data = await sbFetch('/rest/v1/voca_pages', 'POST',
        { book_id:bookId, page_num:String(pageNum) },
        true, { 'Prefer': 'return=representation' });
      pageId = (Array.isArray(data) ? data[0] : data)?.id;
      pageCreatedHere = !!pageId;
    }
    if (!pageId) return null;

    // 행 배열로 한 번에 INSERT (원자적 · 빠름 · 누락 방지)
    // created_at 을 1초씩 증가시켜 부여 → 재로딩(=created_at 정렬) 시에도
    // 추출 순서(책 본문 등장 순서)가 그대로 유지됨. (bulk insert 는 now() 동률이라 순서 보장 안 됨)
    const _seqBase = Date.now();
    const rows = words.map((w, i) => {
      const r = { page_id:pageId, en:w.en, ipa:w.ipa||'', base:w.base, ctx:w.ctx, sentence:w.sentence||'', level:w.level||'', created_at: new Date(_seqBase + i*1000).toISOString() };
      if (w.analysis && typeof w.analysis === 'object') r.analysis = w.analysis;
      return r;
    });
    const resp = await sbFetch('/rest/v1/voca_words', 'POST', rows, true, { 'Prefer': 'return=representation' });
    // (정상) 저장 검증: 반환된 행 수가 보낸 수와 같은지 확인
    let savedRows = Array.isArray(resp) ? resp.slice() : [];
    if (savedRows.length === rows.length) return { pageId, savedRows };

    // 일부/전체 실패 → 개별 재시도 (실패한 것만 다시)
    const failed = [];
    for (let i = savedRows.length; i < rows.length; i++) {
      try {
        const one = await sbFetch('/rest/v1/voca_words', 'POST', rows[i], true, { 'Prefer': 'return=representation' });
        const row = Array.isArray(one) ? one[0] : one;
        if (row?.id) savedRows.push(row);
        else failed.push(rows[i]);
      } catch(e) { failed.push(rows[i]); }
    }
    if (failed.length > 0) {
      toast(TX(`⚠️ 단어 {v0}개 저장 실패 — 다시 시도해주세요`,`⚠️ {v0} word(s) failed to save — please retry`,{v0:(failed.length)}));
      window._failedWords = { bookId, pageNum, words: failed };
    }
    // 단어가 하나도 저장되지 않았고 이 호출에서 페이지를 새로 만들었다면 → 빈 페이지 롤백
    // (네트워크 중단 시 '단어 0개 페이지'가 DB에 남던 정합성 이상의 원인)
    if (savedRows.length === 0 && pageCreatedHere) {
      try { await sbFetch(`/rest/v1/voca_pages?id=eq.${pageId}`, 'DELETE', null, true, { 'Prefer':'return=minimal' }); } catch(e){}
      return null;
    }
    return { pageId, savedRows };
  } catch(e) {
    toast(TT('⚠️ 단어 저장 중 오류가 발생했어요','⚠️ Error saving words'));
    return null;
  }
}

// 저장된 DB 행을 메모리 단어 객체로 변환
function _dbRowToWord(w) {
  return { id: w.id, en: w.en, ipa: w.ipa||'', base: w.base, ctx: w.ctx, sentence: w.sentence||'', level: w.level||'', fav: w.is_favorite||false, analysis: w.analysis || null };
}


function showResetPassword() {
  const overlay = document.createElement('div');
  overlay.id = 'reset-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;';
  overlay.innerHTML = `
    <div style="background:var(--bg-page);border-radius:20px;padding:28px 24px;width:100%;max-width:360px;">
      <div style="font-size:18px;font-weight:700;margin-bottom:8px;color:var(--ink-100);">
        ${TT('🔑 비밀번호 재설정','🔑 Reset Password')}
      </div>
      <div style="font-size:13px;color:var(--ink-60);margin-bottom:20px;line-height:1.6;">
        ${TT('가입한 이메일을 입력하면 비밀번호 재설정 링크를 보내드려요.','Enter your email and we will send you a reset link.')}
      </div>
      <input id="reset-email" type="email" 
        placeholder="${TT('이메일 입력','Enter your email')}"
        style="width:100%;background:var(--bg-input);border:1px solid var(--ink-12);border-radius:10px;padding:12px 14px;font-family:var(--font-body);font-size:14px;color:var(--ink-100);outline:none;margin-bottom:14px;">
      <button id="reset-btn" onclick="sendResetEmail()" 
        style="width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:var(--font-body);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;">
        ${TT('재설정 이메일 보내기','Send Reset Email')}
      </button>
      <button onclick="this.closest('[style*=fixed]').remove()"
        style="width:100%;padding:12px;background:none;border:none;font-family:var(--font-body);font-size:13px;cursor:pointer;color:var(--ink-60);">
        ${TT('취소','Cancel')}
      </button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
  setTimeout(() => document.getElementById('reset-email')?.focus(), 100);
}

async function sendResetEmail() {
  const email = document.getElementById('reset-email')?.value?.trim();
  if (!email) { toast(TT('이메일을 입력해주세요','Please enter your email')); return; }
  
  const btn = document.getElementById('reset-btn');
  if (btn) { btn.disabled = true; btn.textContent = TT('보내는 중...','Sending...'); }
  
  try {
    const res = await fetch(SB_URL + '/auth/v1/recover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ 
        email,
        options: { redirectTo: 'https://imvoca.app/?type=recovery' }
      })
    });
    
    if (res.ok || res.status === 200) {
      // 팝업 닫기
      document.getElementById('reset-overlay')?.remove();
      toast(TT('📧 이메일을 보냈어요! 받은 편지함을 확인해주세요','📧 Email sent! Check your inbox'));
    } else {
      const data = await res.json();
      toast(data.msg || (TT('이메일 전송 실패','Failed to send email')));
      if (btn) { btn.disabled = false; btn.textContent = TT('재설정 이메일 보내기','Send Reset Email'); }
    }
  } catch(e) {
    toast(TT('오류가 발생했어요','An error occurred'));
    if (btn) { btn.disabled = false; btn.textContent = TT('재설정 이메일 보내기','Send Reset Email'); }
  }
}

<script>
// ── Gemini API 모델 폴백 + 재시도 ──
const GEMINI_MODELS = ['gemini-2.5-flash', 'gemini-2.5-flash-lite'];
// 서버(gemini-proxy)가 일일 스캔 한도의 '오늘' 을 사용자 현지 날짜로 계산하도록
// 시간대 이름을 같이 보낸다. (날짜를 보내면 아무 날짜나 보내 한도를 리셋할 수 있다)
function _myTz(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){ return ''; } }
let _geminiModelIdx = 0;

// Gemini 응답에서 단어 목록을 최대한 견고하게 추출 (JSON이 잘려도 완성된 단어는 모두 살림)
// Gemini 응답에서 AI가 읽은 페이지 번호만 추출 (없으면 '')
function parsePageNum(rawText) {
  const clean = (rawText || '').replace(/```json|```/g, '').trim();
  // 정상 JSON에서 page 필드
  try {
    const p = JSON.parse(clean);
    if (p && typeof p.page !== 'undefined' && p.page !== null) return String(p.page).trim();
  } catch(e) {}
  // JSON이 깨졌어도 page 필드만 정규식으로
  const m = clean.match(/"page"\s*:\s*"([^"]*)"/);
  if (m) return m[1].trim();
  const m2 = clean.match(/"page"\s*:\s*(\d+)/);
  if (m2) return m2[1].trim();
  return '';
}

function parseWordsRobust(rawText) {
  const clean = (rawText || '').replace(/```json|```/g, '').trim();
  // 1차: 정상 JSON 시도
  try {
    const p = JSON.parse(clean);
    if (p.words && p.words.length) return p.words;
  } catch(e) {}
  // 2차: 마지막 불완전 객체만 잘라내고 닫기
  try {
    let fixed = clean.replace(/,?\s*\{[^}]*$/, '').replace(/,\s*$/, '');
    if (!fixed.endsWith(']}')) {
      if (!fixed.includes(']')) fixed += ']';
      if (!fixed.endsWith('}')) fixed += '}';
    }
    const p = JSON.parse(fixed);
    if (p.words && p.words.length) return p.words;
  } catch(e) {}
  // 3차: 완성된 단어 객체를 통째로 정규식으로 추출 (가장 견고)
  const words = [];
  const objRe = /\{[^{}]*?"en"\s*:\s*"([^"]+)"[^{}]*?\}/g;
  let m;
  while ((m = objRe.exec(clean)) !== null) {
    const block = m[0];
    const en = (block.match(/"en"\s*:\s*"([^"]+)"/) || [])[1] || '';
    const base = (block.match(/"base"\s*:\s*"([^"]+)"/) || [])[1] || '';
    const ctx = (block.match(/"ctx"\s*:\s*"([^"]+)"/) || [])[1] || '';
    const level = (block.match(/"level"\s*:\s*"([^"]+)"/) || [])[1] || '';
    const sentence = (block.match(/"sentence"\s*:\s*"([^"]+)"/) || [])[1] || '';
    if (en) words.push({ en, base, ctx, sentence, level });
  }
  if (words.length) return words;
  // 4차: 객체 매칭도 실패하면 en 필드만이라도 순서대로 긁기
  const ens = clean.match(/"en"\s*:\s*"([^"]+)"/g) || [];
  const bases = clean.match(/"base"\s*:\s*"([^"]+)"/g) || [];
  const ctxs = clean.match(/"ctx"\s*:\s*"([^"]+)"/g) || [];
  const levels = clean.match(/"level"\s*:\s*"([^"]+)"/g) || [];
  const sents = clean.match(/"sentence"\s*:\s*"([^"]+)"/g) || [];
  return ens.map((e, i) => ({
    en: e.match(/"en"\s*:\s*"([^"]+)"/)[1],
    base: bases[i] ? bases[i].match(/"base"\s*:\s*"([^"]+)"/)[1] : '',
    ctx: ctxs[i] ? ctxs[i].match(/"ctx"\s*:\s*"([^"]+)"/)[1] : '',
    sentence: sents[i] ? sents[i].match(/"sentence"\s*:\s*"([^"]+)"/)[1] : '',
    level: levels[i] ? levels[i].match(/"level"\s*:\s*"([^"]+)"/)[1] : ''
  }));
}

async function geminiWithRetry(body, maxRetry=7) {
  const totalModels = GEMINI_MODELS.length;
  let lastError = null;
  for (let attempt = 0; attempt < maxRetry; attempt++) {
    const modelIdx = (_geminiModelIdx + attempt) % totalModels;
    const model = GEMINI_MODELS[modelIdx];
    try {
      // Gemini 키는 서버(Edge Function 'gemini-proxy')에서만 사용 — 클라이언트에 노출 안 됨
      const res = await fetch(SB_URL + '/functions/v1/gemini-proxy', { method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+(_authToken||SB_KEY)}, body:JSON.stringify({ model, body, tz:_myTz() }) });
      const data = await res.json();
      if (data.error) {
        const code = data.error.code, msg = data.error.message||'';
        const isRetryable = code===429||code===503||msg.includes('demand')||msg.includes('quota')||msg.includes('overloaded')||msg.includes('unavailable')||msg.includes('busy');
        if (isRetryable && attempt < maxRetry-1) {
          const nextModel = GEMINI_MODELS[(modelIdx+1)%totalModels];
          toast(`⚡ ${model} 혼잡 → ${nextModel} 전환 중...`);
          await new Promise(r=>setTimeout(r,2000)); continue;
        }
        return data;
      }
      _geminiModelIdx = modelIdx; return data;
    } catch(e) {
      lastError = e;
      if (attempt < maxRetry-1) { toast('네트워크 오류. 재시도 중...'); await new Promise(r=>setTimeout(r,3000)); }
    }
  }
  throw lastError || new Error('모든 모델 시도 실패');
}

function applyStaticI18n() {
  if (typeof userNativeLang === 'undefined') return;

  const xl = (en) => (xd && xd[en] !== undefined) ? xd[en] : en;
  // data-i18n 속성값이 곧 한국어 원문이라, ko로 되돌릴 때는 그 값으로 원복한다 (언어 왕복 시 잔상 방지)
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');

    if (_staticI18n[k]) el.textContent = xl(_staticI18n[k]);
  });

function toast(m, dur) {
  if (typeof userNativeLang !== 'undefined' && userNativeLang !== 'ko') {
    if (_toastDict[m]) m = _toastDict[m];
    else if (/[가-힣]/.test(m)) {
      // '저장 실패: <상세>' 처럼 동적 메시지가 붙는 경우: 접두어(': ' 로 끝나는 키)로 매칭
      for (const k in _toastDict) { if (k.endsWith(': ') && m.startsWith(k)) { m = _toastDict[k] + m.slice(k.length); break; } }
    }
    // ko→en 변환 후, 사용자의 언어 사전(UI_XL)이 있으면 영어 → 해당 언어로 한 번 더 변환
    const xd = (typeof UI_XL !== 'undefined') && UI_XL[userNativeLang];
    if (xd) {
      if (xd[m] !== undefined) m = xd[m];
      else { for (const k in xd) { if (k.endsWith(': ') && m.startsWith(k)) { m = xd[k] + m.slice(k.length); break; } } }
    }
  }
  const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), dur||2600);
}

// 미리보기를 '실제로 들어오는 화면' 비율에 맞춘다.
// 카메라가 무엇을 주든 그대로 보여주므로, 미리보기에 보이는 것 = 찍히는 것이 된다.
// 가능하면 확대(zoom)도 최소로 내린다 — 일부 기기는 기본이 1배가 아니다.
function _fitCameraPreview(video, stream){
  const apply = () => {
    const w = video.videoWidth, h = video.videoHeight;
    if (w && h) video.style.aspectRatio = w + '/' + h;
  };
  video.onloadedmetadata = apply;
  setTimeout(apply, 400);
  try {
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : null;
    if (caps && caps.zoom && typeof caps.zoom.min === 'number') {
      track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(()=>{});
    }
  } catch(e){}
}

async function openCamera() {
  if (!window._cameraShots) window._cameraShots = [];
  const area = document.getElementById('camera-area');
  const video = document.getElementById('camera-video');
  const isMobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
  // ⚠️ 세로 비율(3/4)을 요구하면 안 된다. 아이폰 카메라는 원래 가로 4:3 으로 찍는데
  //    세로를 요구하면 사파리가 양옆을 '잘라내서' 맞춘다 → 기본 카메라보다 확대되어
  //    보이고, 책 한 쪽을 담으려면 더 뒤로 물러나야 했다.
  //    센서 그대로 받고, 미리보기는 잘린 데 없이(contain) 전체를 보여준다.
  video.style.width = '100%'; video.style.maxHeight = '';
  video.style.objectFit = 'contain';      // 찍히는 그대로 보여준다 (미리보기 ≠ 결과 방지)
  video.style.background = '#000';
  video.style.aspectRatio = isMobile ? '3/4' : '16/9';   // 스트림을 받으면 실제 비율로 다시 잡는다
  try {
    // 해상도만 넉넉히 요청하고 비율은 건드리지 않는다 (OCR 정확도를 위해 화소는 필요하다)
    const constraints = isMobile
      ? { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } } }
      : { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream; area.style.display = 'block'; window._cameraStream = stream;
    _fitCameraPreview(video, stream);
  } catch(e) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream; area.style.display = 'block'; window._cameraStream = stream;
      _fitCameraPreview(video, stream);
    } catch(e2) {
      // 라이브 카메라 실패(안드로이드 인앱브라우저 등) → OS 기본 카메라(1장)로 폴백
      area.style.display = 'none';
      const camInput = document.getElementById('camera-input');
      if (camInput) { camInput.value = ''; camInput.click(); }
      else { toast('카메라 접근 권한이 필요해요'); }
      return;
    }
  }
  updateCameraCounter();
}

function updateCameraCounter() {
  const shots = window._cameraShots || [];
  const counter = document.getElementById('camera-counter');
  const captureBtn = document.getElementById('camera-capture-btn');
  const useBtn = document.getElementById('camera-use-btn');
  if (counter) {
    counter.textContent = shots.length > 0 ? `${shots.length}/10 ${TT('장 촬영됨','shots taken')}` : '';
    counter.style.display = shots.length > 0 ? 'block' : 'none';
  }
  if (captureBtn) {
    captureBtn.textContent = shots.length >= 10 ? TT('📸 최대 10장','📸 Max 10') : TT('📸 촬영하기','📸 Capture');
    captureBtn.disabled = shots.length >= 10;
    captureBtn.style.opacity = shots.length >= 10 ? '0.5' : '1';
  }
  if (useBtn) {
    useBtn.style.display = shots.length > 0 ? 'block' : 'none';
    useBtn.textContent = shots.length === 1 ? TT('✅ 이 사진 사용하기','✅ Use This Photo') : TX(`✅ {v0}장 사용하기`,`✅ Use {v0} Photos`,{v0:(shots.length)});
  }
  // 썸네일 업데이트
  const thumbWrap = document.getElementById('camera-thumbs');
  if (thumbWrap) {
    thumbWrap.innerHTML = shots.map((d,i) => `
      <div style="position:relative;flex-shrink:0;">
        <img src="${d}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid var(--accent);">
        <button onclick="removeCameraShot(${i})" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#c0392b;border:none;color:#fff;font-size:10px;cursor:pointer;line-height:18px;text-align:center;padding:0;">✕</button>
      </div>`).join('');
    thumbWrap.style.display = shots.length > 0 ? 'flex' : 'none';
  }
}

function removeCameraShot(i) {
  window._cameraShots.splice(i, 1);
  updateCameraCounter();
}

function closeCamera() {
  const video = document.getElementById('camera-video');
  const area = document.getElementById('camera-area');
  if (window._cameraStream) { window._cameraStream.getTracks().forEach(t => t.stop()); window._cameraStream = null; }
  video.srcObject = null; area.style.display = 'none';
}

function cancelCamera() {
  window._cameraShots = [];
  closeCamera();
}

function capturePhoto() {
  if ((window._cameraShots||[]).length >= 10) { toast('최대 10장까지 촬영할 수 있어요'); return; }
  const video = document.getElementById('camera-video');
  const canvas = document.getElementById('camera-canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const shot = canvas.toDataURL('image/jpeg', 0.82);
  if (!window._cameraShots) window._cameraShots = [];
  window._cameraShots.push(shot);
  // 플래시 효과
  const flash = document.getElementById('camera-flash');
  if (flash) { flash.style.opacity='1'; setTimeout(()=>flash.style.opacity='0', 150); }
  toast(`${window._cameraShots.length}${TT('장 촬영됨',' photos taken')}`);
  updateCameraCounter();
}

function useCameraShots() {
  const shots = window._cameraShots || [];
  if (!shots.length) return;
  closeCamera();
  if (shots.length === 1) {
    imgData = shots[0];
    window._cameraShots = [];
    window._multiImgData = null;
    renderUploadPreview();
  } else {
    window._multiImgData = [...shots];
    window._cameraShots = [];
    imgData = null;
    renderMultiPreview(window._multiImgData);
  }
}

// ── PDF 지원: pdf.js 를 필요할 때만 CDN 로드 후 페이지를 이미지로 변환 ──
const _PDF_MAX_PAGES = 10; // PDF 한 번에 처리할 최대 페이지(사진 10장 제한과 동일)
let _pdfjsPromise = null;
function _loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e){}
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { _pdfjsPromise = null; reject(new Error('pdf.js load failed')); };
    document.head.appendChild(s);
  });
  return _pdfjsPromise;
}
// PDF 파일 → 페이지별 JPEG dataURL 배열 (limit 만큼만)
async function _pdfToImages(file, limit) {
  const lib = await _loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  const n = Math.min(pdf.numPages, limit);
  const out = [];
  for (let i = 1; i <= n; i++) {
    const page = await pdf.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const targetMax = 1600; // 텍스트 인식 위해 사진(1200)보다 약간 높게
    const scale = Math.max(1, targetMax / Math.max(base.width, base.height));
    const vp = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    out.push(canvas.toDataURL('image/jpeg', 0.82));
  }
  return { images: out, total: pdf.numPages };
}
// 선택된 PDF(들) 처리 → 기존 단일/멀티 스캔 흐름으로 합류
async function handlePdfFiles(pdfs) {
  const ko = userNativeLang === 'ko';
  try {
    toast(TT('PDF 변환 중...','Converting PDF...'));
    let all = [], totalPages = 0;
    for (const f of pdfs) {
      if (all.length >= _PDF_MAX_PAGES) break;
      const { images, total } = await _pdfToImages(f, _PDF_MAX_PAGES - all.length);
      all = all.concat(images); totalPages += total;
    }
    if (!all.length) { toast(TT('PDF에서 페이지를 읽지 못했어요','Could not read PDF')); return; }
    if (totalPages > all.length) toast(TX(`PDF가 길어 처음 {v0}페이지만 처리해요`,`Long PDF — using first {v0} pages`,{v0:(all.length)}));
    if (all.length === 1) { imgData = all[0]; window._multiImgData = null; renderUploadPreview(); }
    else { window._multiImgData = all; imgData = null; renderMultiPreview(all); }
  } catch (err) {
    console.warn('[pdf]', err);
    toast(TT('PDF 처리 실패 — 사진으로 시도해주세요','PDF failed — try images'));
  }
}

function handleFileChange(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  // PDF 가 포함되면 PDF 경로로 처리 (이미지와 섞이면 PDF 우선)
  const pdfs = files.filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (pdfs.length) { handlePdfFiles(pdfs); if (e.target) e.target.value = ''; return; }
  if (files.length > 10) { toast('최대 10장까지만 선택할 수 있어요'); return; }
  const readers = files.map(f => new Promise(resolve => {
    const img = new Image(), r = new FileReader();
    r.onload = ev => {
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1200; let w = img.width, h = img.height;
        if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h*MAX/w); w=MAX; } else { w=Math.round(w*MAX/h); h=MAX; } }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  }));
  Promise.all(readers).then(dataUrls => {
    if (dataUrls.length === 1) {
      imgData = dataUrls[0];
      window._multiImgData = null;
      renderUploadPreview();
    } else {
      window._multiImgData = dataUrls;
      imgData = null;
      renderMultiPreview(dataUrls);
    }
    // 같은 파일을 다시 선택해도 onchange가 동작하도록 초기화
    if (e.target) e.target.value = '';
  });
}

// ── 여러 장 순서대로 스캔 ──
async function doMultiScan() {
  const bId = document.getElementById('up-book-sel')?.value;
  if (!bId) { toast('책을 먼저 선택해주세요'); return; }
  const dataUrls = window._multiImgData;
  if (!dataUrls?.length) return;
  window._multiQueue = [...dataUrls];
  window._multiTotal = dataUrls.length;
  window._multiImgData = null; // 원본 배열 참조 해제
  window._multiBookId = bId;
  window._multiScannedWords = [];
  window._multiPageNums = [];
  await extractAllMultiScan();
}

// 여러 장을 한 번에 추출 — 모아서 마지막에 한 화면으로 보여줌.
// ⚠️ 예전엔 사진을 한 장씩 순서대로 기다렸다. 한 장에 10~25초가 걸리니 10장이면
//    2~4분이다. 사진끼리는 서로 의존하지 않으므로 동시에 여러 장을 보낸다.
//    결과는 사진 순서대로 다시 맞춰서 합친다 (본문 읽는 순서가 유지돼야 한다).
const SCAN_CONCURRENCY = 3;   // 너무 올리면 Gemini 가 429(혼잡)를 돌려준다

async function extractAllMultiScan() {
  const total = window._multiTotal || 0;
  const existing = _bookWordSet(window._multiBookId);   // 이 책에 이미 있는 단어 → 하드 필터
  const results = new Array(total).fill(null);          // [{words, pageNum}] — 사진 순서 보존
  let failCount = 0, limitHit = false, fatal = false;
  let next = 0, finished = 0;

  renderScanLoading(0, total);

  const runOne = async (idx) => {
    const currentImg = window._multiQueue[idx];
    window._multiQueue[idx] = null;   // 처리한 이미지 메모리 회수
    try {
      const b64 = currentImg.split(',')[1], mt = currentImg.split(';')[0].split(':')[1];
      const data = await geminiWithRetry({ contents:[{parts:[{inline_data:{mime_type:mt,data:b64}},{text:buildScanPrompt(false)}]}], generationConfig:{temperature:0.1,maxOutputTokens:16384} });
      if (data.error) {
        if (data.error.code === 'scan_limit') { limitHit = true; return; }
        if (data.error.code === 403) { fatal = true; return; }
        failCount++; return;
      }
      if (!data.candidates?.[0]) { failCount++; return; }
      const txt = data.candidates[0].content.parts[0].text;
      const words = _absorbUsage(parseWordsRobust(txt));
      if (!words?.length) { failCount++; return; }
      results[idx] = { words, pageNum: parsePageNum(txt) || '' };
    } catch(e) { failCount++; }
    finally { finished++; renderScanLoading(finished, total); }
  };

  // 일꾼 여러 명이 큐에서 하나씩 집어간다
  const worker = async () => {
    while (!limitHit && !fatal) {
      // 무료 스캔 한도: 보내기 직전에 확인하고 그 자리에서 카운트를 올린다.
      // (성공 후에 올리면 동시에 뜬 요청들이 같은 잔여분을 보고 다 통과해버린다.
      //  서버도 Gemini 호출 전에 올리므로 이쪽이 서버 계산과도 맞는다)
      if (!canScan()) { limitHit = true; return; }
      const idx = next++;
      if (idx >= total) return;
      incrementScanCount();
      await runOne(idx);
    }
  };
  await Promise.all(Array.from({ length: Math.min(SCAN_CONCURRENCY, total) }, worker));

  if (fatal) { toast('API 키를 확인해주세요'); render(); return; }

  // ── 사진 순서대로 합치기 ──────────────────────────────────────
  const seen = new Set();       // en(소문자) 기준 중복 제거 (여러 장에 겹치는 단어 방지)
  const allWords = [], pageNums = [];
  let doneCount = 0, dupSkipped = 0;
  results.forEach(r => {
    if (!r) return;
    doneCount++;
    if (r.pageNum) pageNums.push(r.pageNum);
    for (const w of r.words) {
      const key = (w.en||'').toLowerCase().trim();
      if (!key || seen.has(key)) continue;
      if (existing.has(key)) { dupSkipped++; continue; }
      seen.add(key);
      w._page = r.pageNum || '';
      allWords.push(w);
    }
  });

  if (limitHit) toast(TX(`스캔 한도에 도달해 {v0}장까지만 추출했어요`,`Scan limit reached — extracted {v0} photo(s)`,{v0:(doneCount)}));

  if (!allWords.length) {
    toast(dupSkipped>0
      ? (TT('전부 이미 단어장에 있는 단어예요','All words are already in this book'))
      : (TT('단어를 찾지 못했어요','No words found')));
    window._multiQueue = null; window._multiScannedWords = null;
    stack = [{ name:'library' }, { name:'book', bookId:window._multiBookId }];
    render(); return;
  }
  if (failCount) toast(TX(`{v0}장은 인식하지 못해 건너뛰었어요`,`{v0} photo(s) skipped`,{v0:(failCount)}));
  else if (dupSkipped) toast(TX(`이미 단어장에 있는 단어 {v0}개는 제외했어요`,`{v0} already-saved word(s) excluded`,{v0:(dupSkipped)}));
  window._multiScannedWords = allWords;
  window._multiPageNums = pageNums;
  renderCombinedWordSelection();
}

// 멀티 스캔 마무리: 모은 단어를 하나의 페이지(범위 제목)로 저장
async function finalizeMultiScan() {
  const bId = window._multiBookId;
  const all = window._multiAccumWords || [];
  const book = findBook(bId);
  if (!all.length || !book) {
    toast(TT('저장된 단어가 없어요','No words saved'));
    window._multiImgData=null; window._multiAccumWords=[]; window._multiPageNums=[]; window._aiPageNum='';
    stack = [{ name:'library' }, { name:'book', bookId:bId }];
    render(); return;
  }
  // 입력된 페이지 번호로 범위 제목 만들기 (처음-끝)
  const nums = (window._multiPageNums||[]).filter(x=>x);
  let title;
  if (nums.length >= 2 && nums[0] !== nums[nums.length-1]) title = `${nums[0]}-${nums[nums.length-1]}`;
  else if (nums.length >= 1) title = `${nums[0]}`;
  else title = TT('묶음','group');
  // 같은 제목이 이미 있으면 뒤에 번호
  let finalTitle = title, n = 2;
  while (book.pages.some(p => String(p.num) === finalTitle)) finalTitle = `${title}-${n++}`;
  renderScanLoading();
  const saveRes = await savePageWordsToDB(bId, finalTitle, all);
  const pid = saveRes?.pageId || null;
  // DB에 실제 저장된 행만 메모리에 반영 (진짜 id 사용)
  const words = (saveRes?.savedRows||[]).map(_dbRowToWord);
  book.pages.push({ num: finalTitle, _pid: pid, words });
  book.pages.sort((a,b)=>pageSort(a,b));
  updateTotalWords();
  window._multiImgData=null; window._multiAccumWords=[]; window._multiPageNums=[]; window._aiPageNum='';
  toast(TX(`✅ Page {v0} 저장 완료 ({v1}개)`,`✅ Page {v0} saved ({v1})`,{v0:(finalTitle),v1:(words.length)}));
  track('scan_saved', { words: words.length });
  stack = [{ name:'library' }, { name:'book', bookId:bId }, { name:'page-words', bookId:bId, pageNum:finalTitle }];
  render();
}

function buildScanPrompt(useExclude=true) {
  const target = getTargetLang(), native = getNativeLang();
  const nativeName = promptLangName(native.code);   // 모델 인식용 언어명 (영문+원어 병기)
  const exclude = useExclude ? buildExcludePrompt() : '';
  const wordCount = getScanWordCount();
  const isEnglish = (target.code === 'en' || target.name === 'English' || target.name === '영어');
  const levelGuide = isEnglish
    ? `CEFR 난이도 기준으로 각 단어를 반드시 분류하세요:\n- C2: 원어민 수준\n- C1: 대학/원서 수준 고급 어휘\n- B2: 고급 중급\n- B1: 중급\n- A2: 초급\n단어 선정: 어려운 단어(C1~C2)를 먼저 고르고, 목표 개수를 채우기 위해 필요하면 B2 → B1 → A2 순으로 쉬운 단어까지 포함하세요.`
    : `각 단어의 난이도를 5단계로 분류하세요. 사용 빈도가 낮고 어려울수록 높은 등급입니다:\n- C2: 매우 어려움 (전문·희귀 어휘)\n- C1: 어려움 (고급 어휘)\n- B2: 중상급\n- B1: 중급\n- A2: 초급 (기초 어휘)\n단어 선정: 어려운 단어(C1~C2)를 먼저 고르고, 목표 개수를 채우기 위해 필요하면 B2 → B1 → A2 순으로 쉬운 단어까지 포함하세요.`;
  // 원어민이 일상에서 쓰는 '쉬운 단어의 다른 뜻'은 사전만 봐서는 절대 모른다.
  // (예: The Catcher in the Rye 의 "I went down to the can" — can 은 깡통이 아니라 화장실)
  // 난이도로만 고르면 이런 단어는 A1 이라 전부 걸러진다. 그래서 예외 규칙을 따로 둔다.
  const slangRule = isEnglish ? `\n\n⭐ 반드시 지킬 예외 규칙 — '쉬운 단어인데 뜻이 전혀 다른 경우':\n본문에서 어떤 단어가 사전의 기본 뜻이 아니라 원어민의 구어·속어·관용적·비유적 의미로 쓰였다면, 그 단어가 아무리 쉬워도(A1·A2) 반드시 포함하세요. 위의 '지나치게 기초적인 단어 제외' 규칙보다 이 규칙이 우선입니다.\n예: "I went down to the can" 의 can → 깡통이 아니라 '화장실'(미국 구어). "He's a real pain" 의 pain → 고통이 아니라 '성가신 사람'. "That's sick!" 의 sick → 아픈이 아니라 '멋진'.\n이런 단어에는 "usage" 필드를 아래 정의에 맞춰 정확히 골라 채우세요.\n- "slang" (속어·구어): 한 단어가 비격식 상황에서 사전 기본 뜻과 다른 뜻으로 쓰임. 예: can(화장실), sick(멋진), buck(달러)\n- "idiom" (관용 표현): 둘 이상의 단어가 굳어져 전체 뜻을 부분에서 유추할 수 없음. 예: kick the bucket, shoot the breeze, a pain in the neck\n- "figurative" (비유적): 기본 뜻의 은유적 확장. 예: He's a pain(성가신 사람), the heart of the city\n- "phrasal" (구동사): 동사 + 부사/전치사가 합쳐져 다른 뜻. 예: give up, put off, run into\n\n그리고 "literal" 필드에 그 단어의 원래(사전) 뜻을 ${nativeName}로 적고, "ctx" 에는 이 문장에서의 실제 뜻을 적으세요.\n평범하게 쓰인 단어는 "usage"와 "literal"을 빈 문자열("")로 두세요. 억지로 만들어내지 마세요 — 정말로 기본 뜻과 다르게 쓰인 경우만입니다.` : '';
  return `이 ${target.name} 책 페이지에서 어려운 ${target.name} 단어를 추출해주세요.\n목표 분량은 ${wordCount}개입니다. 되도록 ${wordCount}개를 꽉 채워주세요. 어려운 단어(C1~C2)를 먼저 고르고, 그것만으로 ${wordCount}개가 안 되면 B2 → B1 → A2 순으로 쉬운 단어까지 포함해서 ${wordCount}개를 채워주세요. 단, 관사·전치사·대명사·접속사·be동사·조동사 같은 기능어(예: a, the, in, of, to, is, was, and)나 학습 가치가 없는 지나치게 기초적인 단어는 넣지 마세요. 페이지에 쓸 만한 단어 자체가 ${wordCount}개보다 적을 때만 있는 만큼 적게 뽑아도 됩니다.\n\n⚠️ 절대 규칙: 반드시 이 사진의 본문에 실제로 인쇄되어 보이는 단어만 추출하세요. 사진에 없는 단어를 추측하거나 상상해서 추가하는 것은 절대 금지입니다. 목표 개수를 채우려고 본문에 없는 단어를 만들어 넣지 마세요. 글자가 흐릿해서 확실히 읽히지 않는 단어도 넣지 마세요. 개수보다 정확성이 훨씬 중요합니다.\n${levelGuide}${exclude}\n\n⚠️ 단어 배열 순서: 고른 단어들을 난이도순이 아니라, 책 본문에 등장하는 순서대로(페이지 위 → 아래, 왼쪽 → 오른쪽) "words" 배열에 넣어주세요. 사진에 책 두 쪽(왼쪽·오른쪽 페이지)이 함께 보이면, 왼쪽 페이지의 단어를 위에서 아래로 모두 나열한 뒤에 오른쪽 페이지 단어를 나열하세요. 독자가 본문을 읽으며 단어를 쉽게 찾을 수 있게 하는 것이 목적입니다.\n\n또한 이 사진에서 페이지 번호가 보이면 읽어서 page 필드에 넣어주세요. 페이지 번호가 안 보이면 page는 빈 문자열("")로 두세요. 페이지 번호는 보통 페이지 위쪽이나 아래쪽 모서리에 있는 숫자나 로마숫자입니다. 연도, 각주 번호, 본문 속 숫자는 페이지 번호가 아닙니다.\n\n중요: "en" 필드에는 ${target.name} 단어를 넣고, "base"와 "ctx" 필드에는 ${nativeName}로 된 뜻을 넣어주세요. "en"이라는 이름이지만 실제로는 ${target.name} 단어가 들어갑니다. 또한 각 단어를 사용한 짧고 자연스러운 ${target.name} 예문 한 문장을 "sentence" 필드에 넣어주세요.\n\n전문 용어(의학·법률·화학·공학 등 전문 분야 어휘)인 경우, "ctx" 필드에 단순 번역에 그치지 말고 그 개념을 이해하는 데 도움이 되는 간단한 부연 설명(정의·역할·상위 개념)을 ${nativeName}로 한 문장 더해주세요.${native.code==='ko'?' 예: "ketone" → "카르보닐기(C=O)를 가진 유기 화합물의 한 종류로, 알데하이드와 함께 카르보닐 화합물에 속한다".':''}\n\n⚠️ 언어 규칙: "base"와 "ctx" 값은 반드시 ${nativeName}로만 작성하세요. ${nativeName} 이외의 언어(특히 한국어)로 쓰는 것은 금지입니다. "sentence"만 ${target.name}입니다.${slangRule}\n\n반드시 JSON만 반환 (level 필드는 C2/C1/B2/B1/A2 중 하나):\n{"page":"34","words":[{"en":"${target.name} 단어","base":"${nativeName} 뜻","ctx":"${nativeName} 문맥 뜻 + (전문 용어면) 개념 설명","sentence":"그 단어를 사용한 짧은 ${target.name} 예문","level":"C1","usage":"","literal":""}]}`;
}

// 이 책에 이미 저장된 단어(en 소문자) 세트 — 스캔 결과 하드 필터용.
// 프롬프트의 "피해주세요" 힌트는 보장이 아니라서(멀티 스캔은 힌트도 꺼져 있음),
// AI 응답을 받은 뒤 클라이언트에서 확실하게 걸러낸다. (메모리 데이터라 비용 0)
function _bookWordSet(bookId){
  const s = new Set(); const b = findBook(bookId);
  if (b) (b.pages||[]).forEach(p=>(p.words||[]).forEach(w=>{ const k=(w.en||'').toLowerCase().trim(); if(k) s.add(k); }));
  return s;
}

// ── 이미 등록된 단어 목록 추출 ──
function getExistingWordList() {
  const words = [];
  books.forEach(book => {
    book.pages.forEach(page => {
      page.words.forEach(w => {
        if (w.en) words.push(w.en.toLowerCase().trim());
      });
    });
  });
  // 중복 제거
  return [...new Set(words)];
}

function buildExcludePrompt() {
  const existing = getExistingWordList();
  if (!existing.length) return '';
  // 최근 100개만 (너무 많으면 Gemini 응답 품질 저하)
  const limited = existing.slice(-100);
  return `\n\n가능하면 이미 등록된 단어는 피해주세요 (필수는 아님):\n${limited.join(', ')}`;
}

async function doScan() {
  // 스캔 제한 체크
  if (!canScan()) { handleScanBlocked(); return; }
  const bId = document.getElementById('up-book-sel')?.value;
  if (!bId) { toast('책을 먼저 선택해주세요'); return; }
  let pg;
  if (window._captureMode === 'add') {
    if (!window._addTargetPage) { toast('추가할 페이지를 선택해주세요'); return; }
    pg = window._addTargetPage;
    const newName = document.getElementById('rename-pg-inp')?.value.trim();
    if (newName) window._renamedPageNum = newName; else window._renamedPageNum = null;
  } else {
    pg = document.getElementById('up-pg-inp')?.value.trim();
    if (!pg) { toast('페이지 번호를 입력해주세요'); return; }
  updateTotalWords();
  window._renamedPageNum = null;
}
  if (!imgData) { toast('사진을 먼저 선택해주세요'); return; }
  renderScanLoading();
  let words, dupSkipped = 0;
  try {
    const b64 = imgData.split(',')[1], mt = imgData.split(';')[0].split(':')[1];
    const data = await geminiWithRetry({ contents:[{parts:[{inline_data:{mime_type:mt,data:b64}},{text:buildScanPrompt(true)}]}], generationConfig:{temperature:0.1,maxOutputTokens:16384} });
    if (data.error) {
      if (data.error.code==='scan_limit') { handleScanBlocked(); return; } // 서버 한도 초과
      if (data.error.code===403) toast('API 키를 확인해주세요');
      else toast('오류가 발생했어요\n잠시 후 다시 시도해주세요');
      render(); return;
    }
    if (!data.candidates?.[0]) { toast('응답 오류, 다시 시도해주세요'); render(); return; }
    const txt = data.candidates[0].content.parts[0].text;
    words = parseWordsRobust(txt);
    // 이 책에 이미 있는 단어는 하드 필터로 제외 (한 책을 여러 번 나눠 스캔할 때 중복 방지)
    { const dup = _bookWordSet(bId), n0 = (words||[]).length;
      words = (words||[]).filter(w=>!dup.has((w.en||'').toLowerCase().trim()));
      dupSkipped = n0 - words.length; }
    words = _absorbUsage(words);
    if (!words?.length) {
      toast(dupSkipped>0
        ? (TT('전부 이미 단어장에 있는 단어예요','All words are already in this book'))
        : '단어를 찾지 못했어요');
      render(); return;
    }
  } catch(e) { toast('네트워크 오류\n잠시 후 다시 시도해주세요'); render(); return; }
  await incrementScanCount();
  if (dupSkipped>0) toast(TX(`이미 단어장에 있는 단어 {v0}개는 제외했어요`,`{v0} already-saved word(s) excluded`,{v0:(dupSkipped)}));
  pendingW = words; pendingB = bId; pendingP = pg;
  renderWordSelection(words);
}

async function acceptWords() {
  const book = findBook(pendingB); if (!book) return;
  const saveRes = await savePageWordsToDB(pendingB, pendingP, pendingW);
  const pid = saveRes?.pageId || null;
  let words = (saveRes?.savedRows||[]).map(_dbRowToWord);
  // 안전장치 1: 저장 후 DB에서 이 페이지의 모든 단어를 다시 가져와 메모리와 동기화 (다른 기기에서 추가한 단어 보존)
  if (pid) {
    try {
      const fresh = await sbFetch(`/rest/v1/voca_words?page_id=eq.${pid}&order=created_at`);
      if (Array.isArray(fresh) && fresh.length >= words.length) {
        // DB에서 가져온 게 우선 (다른 기기에서 추가한 것 포함)
        words = fresh.map(_dbRowToWord);
        console.log('[acceptWords] DB 동기화: ' + words.length + '개 단어 확인');
      }
    } catch(e) { console.warn('[acceptWords] DB 동기화 실패, 로컬 사용', e); }
  }
  const ex = findPage(book, pendingP);
  const newName = window._renamedPageNum;
  if (ex) {
    ex.words = [...ex.words, ...words];
    if (newName && newName !== pendingP) {
      try {
        await fetch(SB_URL + `/rest/v1/voca_pages?id=eq.${ex._pid}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }, body: JSON.stringify({ page_num: newName }) });
        ex.num = newName; toast(TX(`Page {v0} 단어 추가 완료`,`Page {v0} words added`,{v0:(newName)}));
        replace({ name:'page-words', bookId:pendingB, pageNum:newName });
      } catch(e) { toast(TX(`Page {v0} 단어 추가 완료`,`Page {v0} words added`,{v0:(pendingP)})); replace({ name:'page-words', bookId:pendingB, pageNum:pendingP }); }
    } else { toast(TX(`Page {v0} 단어 추가 완료`,`Page {v0} words added`,{v0:(pendingP)})); replace({ name:'page-words', bookId:pendingB, pageNum:pendingP }); }
  } else {
    book.pages.push({num:pendingP, _pid:pid, words});
    book.pages.sort((a,b)=>pageSort(a,b));
    toast(TX(`Page {v0} 저장 완료`,`Page {v0} saved`,{v0:(pendingP)}));
    replace({ name:'page-words', bookId:pendingB, pageNum:pendingP });
  }
  window._renamedPageNum = null;

  // 모든 책에 대해 백그라운드로 심화 분석 자동 채우기(학생이 스캔/추가한 단어도 심화 분석 제공).
  if (pid) {
    enrichExamWords(book.id, pid).catch(e => console.warn('[enrichExamWords] 실패', e));
  }
}

// 스캔 결과의 usage/literal 을 analysis 안으로 옮긴다.
// voca_words 에 컬럼을 새로 만들지 않아도 되고, 저장 경로(savePageWordsToDB)를
// 그대로 탄다. analysis 는 이미 jsonb 라 필드를 더해도 안전하다.
function _absorbUsage(words){
  return (words||[]).map(w => {
    const u = String(w.usage||'').trim().toLowerCase();
    if (u && u !== 'none' && u !== 'normal') {
      w.analysis = Object.assign({}, w.analysis, { usage: u, literal: String(w.literal||'').trim() });
    }
    delete w.usage; delete w.literal;
    return w;
  });
}

// 쉬운 단어인데 원래 뜻과 다르게 쓰인 경우의 표시.
// 원어민에겐 당연하지만 외국어로 배운 사람은 사전을 봐도 알 수 없는 뜻들이다.
function _usageBadge(w){
  const a = (w && w.analysis) || {};
  const u = String(a.usage || '').toLowerCase();
  if (!u) return '';
  const L = {
    slang:      TT('구어·속어','slang'),
    idiom:      TT('관용 표현','idiom'),
    figurative: TT('비유적','figurative'),
    phrasal:    TT('구동사','phrasal verb'),
  };
  const label = L[u] || TT('특수 용법','special use');
  const tip = a.literal ? esc(TT('사전 뜻','Literally') + ': ' + a.literal) : '';
  return `<span title="${tip}" style="font-size:10px;font-weight:700;color:#fff;background:#b03a2e;border-radius:99px;padding:2px 7px;white-space:nowrap;">💬 ${label}</span>`;
}
// 목록·카드에 '원래 뜻은 이거였는데 여기선 다르게 쓰였다' 한 줄
function _literalLine(w){
  const a = (w && w.analysis) || {};
  if (!a.usage || !a.literal) return '';
  return `<div style="font-size:11px;color:var(--ink-45);margin-top:3px;">${TT('사전 뜻','Literally')}: ${esc(a.literal)} <span style="color:var(--ink-40);">→ ${TT('여기서는 위 뜻으로 쓰였어요','used differently here')}</span></div>`;
}

// 단어 심화 분석 (analysis JSONB) 렌더 — 접기/펴기

  }

  // 유의어
  if (a.synonyms && a.synonyms.length) {

    for (const c of a.confusing) {
      html += `<div style="margin-bottom:4px;font-size:12px;"><span style="font-weight:700;color:var(--ink-100);">${esc(c.word||'')}:</span> <span style="color:var(--ink-60);">${esc(c.diff||'')}</span></div>`;
