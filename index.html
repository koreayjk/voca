// ════════════════════════════════════════════════════════════════
// 진도 유실 방지: 로컬 백업 + 재전송 큐
// 학습/테스트 기록을 (1) 기기에 즉시 저장해 화면에서 안 사라지게 하고,
// (2) 서버 저장이 실패하면 큐에 넣어 재접속·복귀·온라인 시 자동 재전송.
// (에러가 잦아 "했는데 안 했다고 뜨는" 진도 유실 문제 대응)
// ════════════════════════════════════════════════════════════════
const _LS_STUDIED='imvoca.localStudied', _LS_SCORE='imvoca.localScore', _LS_PENDING='imvoca.pendingWrites';
function _lsGetObj(k){ try{ const o=JSON.parse(localStorage.getItem(k)||'{}'); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function _lsSetObj(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function _lsGetArr(k){ try{ const a=JSON.parse(localStorage.getItem(k)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function _lsSetArr(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// 인증 POST + 401/403이면 세션 갱신 후 1회 재시도. 네트워크 실패 시 null.
async function authPost(path, body, prefer){
  const doIt=()=>fetch(SB_URL+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+_authToken,...(prefer?{'Prefer':prefer}:{})},body:JSON.stringify(body)});
  let res; try{ res=await doIt(); }catch(e){ return null; }
  if(res.status===401||res.status===403){ if(await refreshSession()){ try{ res=await doIt(); }catch(e){ return null; } } }
  return res;
}

// 로컬 낙관적 표시(빨간 점 / % 배지) — 새로고침해도 유지됨
function _markLocalStudied(bookId,pageNum,words){
  if(pageNum==null) return;
  const m=_lsGetObj(_LS_STUDIED); m[bookId+'|'+pageNum]={w:words||0}; _lsSetObj(_LS_STUDIED,m);
  const key=bookId+'|'+pageNum; if(_reviewStatus[key]!=='done') _reviewStatus[key]='doing';
}
function _markLocalScore(bookId,pageNum,rate){
  if(pageNum==null) return;
  const key=bookId+'|'+pageNum, m=_lsGetObj(_LS_SCORE);
  if(!(key in m)||rate>m[key]){ m[key]=rate; _lsSetObj(_LS_SCORE,m); }
  if(typeof _testScore==='object'){ if(!(key in _testScore)||rate>_testScore[key]) _testScore[key]=rate; }
}
// 서버 재전송 큐에 넣기 (review 는 대상별 1건으로 dedupe, 나머지는 누적·상한 300)
function _enqueueWrite(op){
  const q=_lsGetArr(_LS_PENDING);
  if(op.type==='review'){
    const id='review|'+op.book_id+'|'+op.page_num;
    const rest=q.filter(x=>!(x.type==='review'&&('review|'+x.book_id+'|'+x.page_num)===id));
    rest.push(op); _lsSetArr(_LS_PENDING, rest);
  } else {
    q.push(op); _lsSetArr(_LS_PENDING, q.slice(-300));
  }
}
// 큐 1건 실제 전송. 성공(또는 이미 존재/중복)이면 true.
async function _sendWrite(op){
  if(!currentUser||!_authToken) return false;
  if(op.type==='review'){
    const ex=await authGet(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=eq.${op.book_id}&page_num=eq.${op.page_num}&select=id`);
    if(ex==null) return false;          // 확인 실패 → 나중에 다시
    if(ex.length>0) return true;        // 이미 있음 → 완료로 간주
    const res=await authPost('/rest/v1/voca_review', op.body, 'return=minimal');
    return !!res && (res.ok || res.status===409);
  }
  if(op.type==='stats'){ const res=await authPost('/rest/v1/voca_stats', op.body); return !!res && res.ok; }
  if(op.type==='activity'){ const res=await authPost('/rest/v1/voca_activity', op.body, 'return=minimal'); return !!res && res.ok; }
  return true;
}
let _flushing=false;
async function flushPending(){
  if(_flushing||!currentUser||!_authToken) return;
  let q=_lsGetArr(_LS_PENDING); if(!q.length) return;
  _flushing=true;
  try{
    const remain=[];
    for(const op of q){
      let ok=false; try{ ok=await _sendWrite(op); }catch(e){ ok=false; }
      if(!ok) remain.push(op);
    }
    _lsSetArr(_LS_PENDING, remain);
  } finally { _flushing=false; }
}
// 로컬에 저장해둔 테스트 점수를 _testScore 에 병합(배지 표시 유지)
function _seedTestScoresFromLocal(){
  try{ const m=_lsGetObj(_LS_SCORE); for(const k in m){ if(!(k in _testScore)||m[k]>_testScore[k]) _testScore[k]=m[k]; } }catch(e){}
}
// 로컬에 studied 표시된 페이지를 _reviewStatus 에 덮어씀(서버 상태 우선)
function _overlayLocalStudied(){
  try{ const m=_lsGetObj(_LS_STUDIED); for(const k in m){ if(!_reviewStatus[k]) _reviewStatus[k]='doing'; } }catch(e){}
}

async function saveStats(bookId, total, correct, pageNum) {
  // 1) 로컬 즉시 반영(화면에서 안 사라지게)
  let rate=null;
  if (pageNum != null && total > 0) { rate = Math.round(correct / total * 100); _markLocalScore(bookId, pageNum, rate); }
  // 2) 서버 저장 시도, 실패하면 큐에 넣어 나중에 재전송
  const body = { user_id: currentUser.id, book_id: bookId, total, correct };
  if (pageNum != null) body.page_num = String(pageNum);
  const res = await authPost('/rest/v1/voca_stats', body);
  if (!res || !res.ok) { logError('write_fail','saveStats',(res&&res.status)||'network',{ bookId, pageNum, rate }); _enqueueWrite({ type:'stats', book_id:bookId, page_num:pageNum!=null?String(pageNum):null, body }); }
}

// 일별 활동 로그: 첫 암기('study') / 복습 완료('review') 한 줄 기록. (관리자가 학생별 일별 활동 확인용)
// 복습 단계 컬럼 → 몇 회차 복습인지 (1~6). review_2d=1회차, review_3d=2회차, ...
const _REVIEW_STEP_NUM = { review_2d:1, review_3d:2, review_6d:3, review_15d:4, review_30d:5, review_60d:6 };
async function logActivity(bookId, pageNum, kind, words, step){
  // day 를 명시해서 보내면 DB 의 default(Asia/Seoul) 가 적용되지 않는다 → 사용자 현지 날짜로 기록
  const body = { user_id: currentUser.id, org_id: userOrgId||null, book_id: bookId, page_num: pageNum!=null?String(pageNum):null, kind, words: words||0, day: _todayStr() };
  if (step!=null) body.step = step;   // 복습이면 회차(1~6)
  const res = await authPost('/rest/v1/voca_activity', body, 'return=minimal');
  if (!res || !res.ok) { logError('write_fail','logActivity',(res&&res.status)||'network',{ bookId, pageNum, kind }); _enqueueWrite({ type:'activity', book_id:bookId, page_num:body.page_num, body }); }
}

// Day별 테스트 베스트 점수(%) 캐시: key = bookId|pageNum
let _testScore = {}, _testScoreLoaded = {};
async function loadTestScores(bookId) {
  if (_testScoreLoaded[bookId]) return;
  _seedTestScoresFromLocal(); // 로컬 백업 점수 먼저 반영(배지 안 사라지게)
  const data = await authGet(`/rest/v1/voca_stats?user_id=eq.${currentUser.id}&book_id=eq.${bookId}&page_num=not.is.null&select=page_num,total,correct`);
  if (!Array.isArray(data)) return; // 실패 → loaded 플래그 안 세우고 다음에 재시도
  _testScoreLoaded[bookId] = true;
  let changed = false;
  data.forEach(r => {
    if (!r.total) return;
    const key = bookId + '|' + r.page_num, rate = Math.round(r.correct / r.total * 100);
    if (!(key in _testScore) || rate > _testScore[key]) { _testScore[key] = rate; changed = true; }
  });
  if (changed && stack[stack.length-1]?.name === 'book' && stack[stack.length-1]?.bookId === bookId) render();
}

const _savingReview = new Set(); // 동시 등록(암기카드+퀴즈 완료 등) 중복 방지
async function saveReviewSchedule(bookId, pageNum) {
  const _key = currentUser.id + '|' + bookId + '|' + pageNum;
  if (_savingReview.has(_key)) return false; // 같은 페이지 등록이 이미 진행 중 → 중복 차단
  _savingReview.add(_key);
  // 학습한 단어 수(로컬 표시용)
  const _book0 = findBook(bookId);
  const _page0 = _book0 ? findPage(_book0, pageNum) : null;
  const _words0 = _page0 ? (_page0.words?.length||0) : 0;
  try {
    const existing = await authGet(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=eq.${bookId}&page_num=eq.${pageNum}&select=id,completed`);
    if (existing == null) {
      // 확인 실패(토큰 만료/네트워크) → 진도 유실 막기 위해 로컬 표시 + 큐 등록(전송 시 존재확인 후 insert).
      // 이 기기 로컬에도 학습 기록이 없으면 '처음 학습'일 가능성이 높으므로 점수 지급 대상(true).
      logError('load_fail','saveReviewSchedule.check','existing check failed',{ bookId, pageNum });
      const _localNew = !(_lsGetObj(_LS_STUDIED)[bookId + '|' + pageNum]);
      _markLocalStudied(bookId, pageNum, _words0);
      const nowF=new Date(), midF=(n)=>{const d=new Date(nowF);d.setDate(d.getDate()+n);d.setHours(0,0,0,0);return d.toISOString();};
      _enqueueWrite({ type:'review', book_id:bookId, page_num:String(pageNum), body:{ user_id:currentUser.id, book_id:bookId, page_num:String(pageNum), first_studied_at:nowF.toISOString(), review_2d:midF(1), review_3d:midF(2), review_6d:midF(3), review_15d:midF(6), review_30d:midF(15), review_60d:midF(30) } });
      _enqueueWrite({ type:'activity', book_id:bookId, page_num:String(pageNum), body:{ user_id:currentUser.id, org_id:userOrgId||null, book_id:bookId, page_num:String(pageNum), kind:'study', words:_words0, day:_todayStr() } });
      return _localNew;
    }
    if (existing.length > 0) {
      // 복습 일정이 있는데 책장에서 암기한 경우 안내
      const hasdue = existing.some(r => !r.completed);
      if (hasdue) {
        setTimeout(() => {
          toast(TT('📆 복습 일정이 있어요! 복습 탭에서 완료해주세요','📆 You have a review scheduled! Complete it in the Review tab'));
        }, 1500);
      }
      return false;
    }
    const now = new Date();
    // 날짜만 비교하기 위해 자정(00:00:00) 기준으로 저장
    const toMidnight = (d, n) => {
      const date = new Date(d);
      date.setDate(date.getDate() + n);
      date.setHours(0, 0, 0, 0);
      return date.toISOString();
    };
    const addDays = (d, n) => toMidnight(d, n);
    // ⚠️ 컬럼명(review_2d~60d)은 레거시라 실제 복습 간격과 안 맞음. 실제 간격은 첫 학습 기준 +1/+2/+3/+6/+15/+30일 (에빙하우스). 값이 정답이며 컬럼명은 단순 라벨이니 DB 마이그레이션 없이 그대로 둠.
    const reviewBody = { user_id: currentUser.id, book_id: bookId, page_num: String(pageNum), first_studied_at: now.toISOString(), review_2d: addDays(now, 1), review_3d: addDays(now, 2), review_6d: addDays(now, 3), review_15d: addDays(now, 6), review_30d: addDays(now, 15), review_60d: addDays(now, 30) };
    // 서버 저장 전에 로컬 낙관적 표시(빨간 점 즉시, 새로고침해도 유지)
    _markLocalStudied(bookId, pageNum, _words0);
    const res = await authPost('/rest/v1/voca_review', reviewBody, 'return=minimal');
    if (res && res.status === 409) return false; // 유니크 충돌(동시 등록) → DB가 중복을 막음. 정상.
    if (!res || !res.ok) {
      // 저장이 일시적으로 실패(토큰·네트워크) → 재전송 큐에 넣어 나중에 자동 동기화.
      // 단, 위에서 existing 이 비어있음을 확인했으니 '새 학습'인 건 확실 → 첫 암기 점수는
      // 지급 대상(true)으로 본다. (일시 오류로 새 단어 점수를 놓치지 않게)
      logError('write_fail','saveReviewSchedule.insert',(res&&res.status)||'network',{ bookId, pageNum });
      _enqueueWrite({ type:'review', book_id:bookId, page_num:String(pageNum), body:reviewBody });
      _enqueueWrite({ type:'activity', book_id:bookId, page_num:String(pageNum), body:{ user_id:currentUser.id, org_id:userOrgId||null, book_id:bookId, page_num:String(pageNum), kind:'study', words:_words0, day:_todayStr() } });
      return true;
    }
    return true; // 새 복습 일정을 실제로 등록함 → 첫 암기 점수 지급 대상(호출측에서 처리)
  } catch(e) { console.error('[복습 저장 오류]', e); return false; }
  finally { _savingReview.delete(_key); }
}

// 첫 암기(퀴즈 통과 후): 복습 일정 등록 + 점수 지급. 일정이 새로 만들어졌을 때만 점수를 준다(중복 방지).
// 첫 암기 '등록': 복습 일정 + '학습' 기록 (암기 카드 완료 시점). 새로 만들어졌으면 true 반환.
// (점수와 분리 — 카드만 하고 퀴즈를 안 끝내도 '학습'은 기록되도록. 예전엔 퀴즈 통과해야만 등록돼서 학습이 유실됐음)
async function _registerFirstStudy(bookId, pageNum){
  const created = await saveReviewSchedule(bookId, pageNum);
  if (created){
    const book = findBook(bookId);
    const page = book ? book.pages.find(p=>String(p.num)===String(pageNum)) : null;
    logActivity(bookId, pageNum, 'study', page ? page.words.length : 0);
  }
  return created;
}
// 첫 암기 '점수': 퀴즈 통과 시. 이번에 새로 등록된 페이지(isNew)만 지급(재학습 중복 방지).
// ── 첫 암기 점수 '이미 받은 페이지' 집합 ─────────────────────────
// 로그인 직후, 학습을 시작하기 '전에' 서버의 복습 행(=이미 학습한 페이지)으로 시드한다.
// 이렇게 하면: 처음 배우는 Day는 여러 번 틀린 뒤 다 맞혀도 점수 지급(첫 통과 1회),
// 이미 배운 Day는 다시 테스트해 만점 받아도 재지급 안 함(점수 파밍 방지).
let _scoredPages = new Set();
let _scoredSeeded = false;
async function _seedScoredPages(){
  if (_scoredSeeded || !currentUser) return;
  const rows = await authGet(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&select=book_id,page_num`);
  if (Array.isArray(rows)) { rows.forEach(r=> _scoredPages.add(r.book_id + '|' + r.page_num)); _scoredSeeded = true; }
}
async function _awardFirstStudyPoints(bookId, pageNum, isNew){
  const book = findBook(bookId);
  const page = book ? book.pages.find(p=>String(p.num)===String(pageNum)) : null;
  const base = page ? calcWordScore(page.words) : 0;
  const key = bookId + '|' + pageNum;
  // 시드가 됐으면 '집합' 기준으로 정확 판정, 아직 안 됐으면 isNew 로 폴백.
  const already = _scoredSeeded ? _scoredPages.has(key) : !isNew;
  if (!already && base>0){ addReviewScore(base); _scoredPages.add(key); window._lastEarnedScore = base; }
  else { window._lastEarnedScore = 0; }
  window._lastReviewFinished = false; window._lastReviewLate = false; window._lastBaseScore = base;
}

// ── 진행 중 퀴즈(암기 후 퀴즈) 저장/복원 — 재접속·새로고침해도 이어서 풀기 ──
// 채점 게이트(_pendingReview/_pendingFirstStudy)까지 함께 보관해야 통과 시 점수가 정확히 반영됨.
function _quizKey(){ return 'imvoca.quiz.' + (currentUser?.id || 'anon'); }
function saveQuizState(){
  try {
    const q = window._quiz;
    if (!q || !Array.isArray(q.words) || !q.words.length) return;
    if (typeof q.idx === 'number' && q.idx >= q.words.length) return; // 결과 화면은 저장 안 함(진행 중만)
    localStorage.setItem(_quizKey(), JSON.stringify({ quiz:q, pendingReview:window._pendingReview||null, pendingFirstStudy:window._pendingFirstStudy||null, savedAt:Date.now() }));
  } catch(e){}
}
function clearQuizState(){ try { localStorage.removeItem(_quizKey()); } catch(e){} }
function hasSavedQuiz(){
  try {
    const s = localStorage.getItem(_quizKey()); if (!s) return false;
    const d = JSON.parse(s); const q = d && d.quiz;
    if (!q || !Array.isArray(q.words) || !q.words.length || typeof q.idx !== 'number' || q.idx >= q.words.length) { clearQuizState(); return false; }
    if (d.savedAt && Date.now() - d.savedAt > 12*3600*1000) { clearQuizState(); return false; } // 12시간 후 폐기
    if (q.bookId && q.bookId !== '__fav__' && !findBook(q.bookId)) { clearQuizState(); return false; } // 책이 없으면 폐기
    return true;
  } catch(e){ return false; }
}
function resumeQuiz(){
  try {
    const s = localStorage.getItem(_quizKey()); if (!s) return;
    const d = JSON.parse(s); const q = d && d.quiz; if (!q) return;
    window._quiz = q;
    window._pendingReview = d.pendingReview || null;
    window._pendingFirstStudy = d.pendingFirstStudy || null;
    // 첫 암기 재개: _registerFirstStudy 가 이미 만든 복습행 때문에 재시드된 _scoredPages 에
    // 이 페이지가 들어가 점수가 막힐 수 있어, 이 페이지만 예외로 풀어 통과 시 점수 지급되게 함.
    if (d.pendingFirstStudy && typeof _scoredPages !== 'undefined') {
      _scoredPages.delete(d.pendingFirstStudy.book_id + '|' + d.pendingFirstStudy.page_num);
    }
    push({ name:'quiz', bookId:q.bookId, scope:q.scope, pageNum:q.pageNum });
    toast(TT('이어서 퀴즈를 풀 수 있어요 ✍️','Resumed your quiz ✍️'));
  } catch(e){}
}

function startWrongQuiz() {
  const q = window._quiz;
  if (!window._wrongWords?.length) return;
  // 복습-게이트 여부(_review)를 유지해야, 틀린 것만 다 맞혔을 때 복습 점수가 지급됨.
  window._quiz = {bookId:q.bookId,scope:q.scope,pageNum:q.pageNum,words:shuffle([...window._wrongWords]),idx:0,correct:0,_review:q._review};
  saveQuizState();
  push({name:'quiz',bookId:q.bookId,scope:q.scope,pageNum:q.pageNum});
}

// 복습 카드 완료 후 실행하는 '복습 게이트 퀴즈' — 모두 맞혀야 점수 지급.
function startReviewQuiz(bookId, pageNum){
  const book = findBook(bookId);
  const ws = book ? shuffle([...(findPage(book, pageNum)?.words || [])]) : [];
  if (!ws.length){
    // 단어가 없으면 퀴즈 없이 바로 처리(폴백): 대기 중 복습/첫암기를 그대로 반영.
    const pr = window._pendingReview; const pf = window._pendingFirstStudy;
    if (pr){ window._pendingReview = null; updateReviewStep(pr).then(()=>{ checkReviews().catch(()=>{}); }); }
    else if (pf){ window._pendingFirstStudy = null; _awardFirstStudyPoints(pf.book_id, pf.page_num, pf.isNew).then(()=>{ checkReviews().catch(()=>{}); }); }
    replace({name:'study-done', bookId, scope:'page', pageNum, total:0, rounds:1, isReview:!!pr});
    return;
  }
  window._quiz = { bookId, scope:'page', pageNum, words: ws, idx:0, correct:0, _review:true };
  saveQuizState();
  replace({ name:'quiz', bookId, scope:'page', pageNum });
}

function startQuiz(bookId, scope, pageNum) {
  if (scope !== 'favorite' && !_officialAccessOK(bookId, scope, pageNum)) { showOfficialPaywall(); return; }
  if (bookId && bookId !== '__fav__') { try { localStorage.setItem('imvoca.lastBookId', bookId); } catch(e){} }
  let ws;
  if (scope === 'favorite') { ws = allFavoriteWords(); }
  else { const book = findBook(bookId); if (!book) return; ws = scope === 'page' ? (findPage(book,pageNum)?.words||[]) : allWords(book); }
  ws = shuffle([...ws]);
  window._quiz = { bookId, scope, pageNum, words: ws, idx: 0, correct: 0 };
  saveQuizState();
  push({ name: 'quiz', bookId, scope, pageNum });
}

function renderQuiz() {
  const root = document.getElementById('root');
  const q = window._quiz;
  if (!q) { goTab('books'); return; }
  if (q.idx >= q.words.length) {
    _autoStop();      // 결과 화면에서는 읽지 않는다
    clearQuizState(); // 결과 화면 도달 → 진행 저장 삭제(중복 채점·재개 방지)
    const rate = Math.round(q.correct / q.words.length * 100);
    saveStats(q.bookId, q.words.length, q.correct, q.scope === 'page' ? q.pageNum : null);
    const rateColor = rate>=80?'#1c7c3c':rate>=50?'#b35900':'#c0392b';
    const rateMsg = rate>=80?t('rateMsg80'):rate>=50?t('rateMsg50'):t('rateMsgBad');
    const wrongWords = q.words.filter((_,i)=>!q._correct?.includes(i));
    window._wrongWords = wrongWords;

    // ── 게이트 퀴즈: 이 페이지에 대기 중인 복습/첫암기가 있고 이 퀴즈가 게이트용이면 다 맞혀야 점수 지급 ──
    const _pr = window._pendingReview, _pf = window._pendingFirstStudy;
    const _match = (p)=> p && p.book_id===q.bookId && String(p.page_num)===String(q.pageNum);
    const gateReview = !!(q._review && _match(_pr));
    const gateFirst  = !!(q._review && _match(_pf));
    const gated = gateReview || gateFirst;
    if (gated && wrongWords.length === 0) {
      const ko = userNativeLang==='ko';
      root.innerHTML = `<div class="scr"><div class="done" style="padding-top:70px;text-align:center;"><div style="font-size:34px;margin-bottom:10px;">✅</div><div style="font-size:14px;color:var(--ink-60);">${TT('퀴즈 통과! 점수를 반영하는 중...','Passed! Scoring...')}</div></div></div>`;
      if (gateReview){
        const pend = window._pendingReview; window._pendingReview = null;
        updateReviewStep(pend).then(async ()=>{ try{ await checkReviews(); }catch(e){}
          replace({name:'study-done', bookId:q.bookId, scope:'page', pageNum:q.pageNum, total:q.words.length, rounds:1, isReview:true}); });
      } else {
        const pend = window._pendingFirstStudy; window._pendingFirstStudy = null;
        _awardFirstStudyPoints(pend.book_id, pend.page_num, pend.isNew).then(async ()=>{ try{ await checkReviews(); }catch(e){}
          replace({name:'study-done', bookId:q.bookId, scope:'page', pageNum:q.pageNum, total:q.words.length, rounds:1, isReview:false}); });
      }
      return;
    }

    // ── 테스트만(암기카드 없이) 페이지를 '만점'으로 통과한 경우: 첫 암기와 동일하게 점수 지급 + 복습 등록 ──
    // (암기카드를 거치지 않아도, 처음 학습하는 Day를 다 맞히면 첫 암기 점수를 준다)
    if (!gated && q.scope==='page' && q.pageNum!=null && q.bookId && q.bookId!=='__fav__' && wrongWords.length===0) {
      const ko = userNativeLang==='ko';
      root.innerHTML = `<div class="scr"><div class="done" style="padding-top:70px;text-align:center;"><div style="font-size:34px;margin-bottom:10px;">✅</div><div style="font-size:14px;color:var(--ink-60);">${TT('통과! 점수를 반영하는 중...','Passed! Scoring...')}</div></div></div>`;
      (async ()=>{
        try{ await _registerFirstStudy(q.bookId, q.pageNum); }catch(e){}     // 복습 일정 등록(없으면 생성)
        try{ await _awardFirstStudyPoints(q.bookId, q.pageNum, true); }catch(e){} // 첫 통과면 지급('이미 받은 페이지' 집합으로 판정)
        try{ await checkReviews(); }catch(e){}
        replace({name:'study-done', bookId:q.bookId, scope:'page', pageNum:q.pageNum, total:q.words.length, rounds:1, isReview:false});
      })();
      return;
    }
    // 테스트만 했는데 만점이 아니면: 복습 일정은 등록(없으면 생성)하되 점수는 없음. 결과 화면은 아래 그대로.
    if (!gated && q.scope==='page' && q.pageNum!=null && q.bookId && q.bookId!=='__fav__') {
      try { _registerFirstStudy(q.bookId, q.pageNum); } catch(e){}
    }
    const gateNote = (gated && wrongWords.length>0)
      ? `<div style="width:100%;background:#fff3e0;border:1px solid #f0c98a;border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:12.5px;color:#8a5a00;line-height:1.6;text-align:left;">⚠️ ${TX(`아직 <b>점수를 받지 못했어요.</b> 아래 <b>틀린 {v0}개 다시 풀기</b>로 <b>모두 맞히면</b> 점수를 받아요.`,`No points yet. Retry the {v0} wrong word(s) and get them all right to earn points.`,{v0:(wrongWords.length)})}</div>`
      : '';
    // 넛지: 암기카드 없이 '테스트만' 했는데, 아직 안 배운(점수 없는) Day를 만점 못 했을 때
    // → 강제하지 않고 '암기카드로 먼저 외우기'를 권함.
    const _firstStudyUnscored = (!gated && q.scope==='page' && q.pageNum!=null && q.bookId && q.bookId!=='__fav__' && wrongWords.length>0 && !_scoredPages.has(q.bookId+'|'+q.pageNum));
    const nudgeNote = _firstStudyUnscored
      ? `<div style="width:100%;background:var(--gold-bg);border:1px solid #f0c98a;border-radius:12px;padding:13px 15px;margin:14px 0 0;font-size:13px;color:#8a5a00;line-height:1.6;text-align:left;">🃏 ${TX(`아직 다 못 외웠어요. <b>암기카드로 먼저 외우고</b> 다시 테스트하면 통과해서 <b>점수</b>도 받기 쉬워요!`,`Not fully memorized yet. Study with flashcards first, then test again to pass and earn points.`)}</div>`
      : '';
    // 게이트 상태에서 '전체 다시'도 게이트를 유지해야 함(통과 시 점수 지급).
    const retryAllOnclick = gated ? `startReviewQuiz('${jsq(q.bookId)}','${jsq(String(q.pageNum))}')` : `startQuiz('${q.bookId}','${q.scope}','${q.pageNum}')`;
    root.innerHTML = `<div class="scr" style="padding-bottom:24px;">
      <div class="topnav"><span></span><span class="topnav__title">${t('quizResult')}</span><span class="topnav__right" onclick="goTab('books')">✕</span></div>
      <div class="done" style="padding-top:0;">
        <div style="font-size:13px;color:var(--ink-40);">${t('quizDone')}</div>
        <div class="done__n" style="color:${rateColor};">${rate}%</div>
        <div style="font-size:13px;color:var(--ink-60);">${q.correct}/${q.words.length} ${t('correctLabel')}</div>
        <div style="font-size:14px;color:${rateColor};margin-top:4px;font-weight:600;">${rateMsg}</div>
        ${gateNote}${nudgeNote}
        <div class="done__grid" style="margin-top:16px;">
          <div class="done__tile" style="text-align:center;"><div class="done__tile-label">${t('correct')}</div><div class="done__tile-value" style="color:#1c7c3c;">${q.correct}</div></div>
          <div class="done__tile" style="text-align:center;"><div class="done__tile-label">${t('wrong')}</div><div class="done__tile-value" style="color:#c0392b;">${wrongWords.length}</div></div>
        </div>
        ${wrongWords.length>0?`<div style="width:100%;margin-top:16px;text-align:left;"><div style="font-size:12px;font-weight:700;color:var(--ink-60);margin-bottom:8px;">${t('wrongWordList')} (${wrongWords.length}${TT('개','')})</div><div style="background:var(--bg-card);border-radius:12px;padding:12px;max-height:160px;overflow-y:auto;">${wrongWords.map(w=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ink-07);"><span style="font-size:13px;font-weight:600;">${esc(w.en)}</span><span style="font-size:12px;color:var(--ink-60);">${esc(w.base)}</span></div>`).join('')}</div></div>`:''}
        <div style="width:100%;margin-top:16px;display:flex;flex-direction:column;gap:10px;">
          ${_firstStudyUnscored?`<button class="btn btn-solid" onclick="initStudy('${q.bookId}','page','${jsq(String(q.pageNum))}');push({name:'study-cards',bookId:'${q.bookId}',scope:'page',pageNum:'${jsq(String(q.pageNum))}'})">🃏 ${TT('암기카드로 외우기','Study with flashcards')}</button>`:''}
          ${wrongWords.length>0?`<button class="btn ${_firstStudyUnscored?'btn-outline':'btn-solid'}" onclick="startWrongQuiz()">${t('wrongOnly')} (${wrongWords.length}개)</button>`:''}
          <button class="btn btn-outline" onclick="${retryAllOnclick}">${t('retryAll')}</button>
          ${gated?'':`<button class="btn btn-outline" onclick="goTab('books')">${t('toBookshelf')}</button>`}
          ${gated?`<button class="btn btn-outline" onclick="goTab('books')">${TT('나중에 하기 (점수 없음)','Later (no points)')}</button>`:''}
        </div>
      </div>
    </div>`;
    return;
  }
  const w = q.words[q.idx];
  const prog = Math.round(q.idx / q.words.length * 100);
  const allW = q.scope==='favorite' ? allWordsGlobal() : (allWords(findBook(q.bookId))||[]);
  // 보기(뜻) 중복 방지: 정답 뜻과 다르고 서로 겹치지 않는 뜻만 후보로
  const seenBases = new Set([(w.base||'').trim()]);
  const pool = shuffle(allW.filter(x => x.en !== w.en));
  const others = [];
  for (const cand of pool) {
    const b = (cand.base||'').trim();
    if (!b || seenBases.has(b)) continue;
    seenBases.add(b); others.push(cand);
    if (others.length >= 3) break;
  }
  const choices = shuffle([w, ...others]);
  root.innerHTML = `<div class="scr" style="padding-bottom:20px;">
    <div class="study__top" style="margin-top:8px;"><span class="study__info">${q.idx+1} / ${q.words.length}</span><span class="auto-chip" onclick="toggleAutoRead()" style="font-size:12px;cursor:pointer;padding:4px 10px;border-radius:99px;border:1px solid var(--ink-12);font-family:var(--font-body);white-space:nowrap;color:${_autoRead?'var(--accent)':'var(--ink-60)'};background:${_autoRead?'var(--gold-bg)':'transparent'};">${_autoRead?TT('🔊 자동 ON','🔊 Auto ON'):TT('🔇 자동','🔇 Auto')}</span><span class="study__close" onclick="clearQuizState();_autoStop();goTab('books')">✕</span></div>
    <div class="study__bar"><div class="study__fill" style="width:${prog}%"></div></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0;">
      <div style="text-align:center;margin-bottom:30px;">
        <div style="font-size:11px;color:var(--ink-40);margin-bottom:8px;">${t('quizQuestion')}</div>
        <div style="font-family:var(--font-display);font-size:36px;letter-spacing:-0.04em;color:var(--ink-100);">${esc(w.en)}</div>
        <button onclick="speak('${jsq(w.en)}')" style="background:none;border:none;cursor:pointer;font-size:18px;margin-top:8px;">🔊</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${choices.map((c,i) => `<button onclick="answerQuiz('${jsq(c.en)}','${jsq(w.en)}')" class="quiz-choice" style="padding:14px;border-radius:12px;border:1.5px solid var(--ink-12);background:var(--bg-card);color:var(--ink-100);font-family:var(--font-body);font-size:14px;cursor:pointer;text-align:left;">${String.fromCharCode(65+i)}. ${esc(c.base)}</button>`).join('')}
      </div>
    </div>
  </div>`;
  _autoQuizAfterRender(w);
}

function answerQuiz(chosen, correct) {
  const q = window._quiz;
  const isCorrect = chosen === correct;
  if (isCorrect) { q.correct++; if(!q._correct)q._correct=[]; q._correct.push(q.idx); }
  const btns = document.querySelectorAll('.scr button[onclick^="answerQuiz"]');
  btns.forEach(btn => {
    btn.disabled = true;
    const txt = btn.textContent.trim().substring(3);
    const word = q.words.find(w => w.base === txt);
    if (word?.en === correct) btn.style.background = '#eafaf1';
    else if (word?.en === chosen && !isCorrect) btn.style.background = '#fdeaea';
  });
  setTimeout(() => { q.idx++; saveQuizState(); renderQuiz(); }, 800);
}

async function checkReviews() {
  try {
    // 오늘 날짜 끝(23:59:59)까지를 today로 설정 → 오늘 복습 대상 모두 포함
    const todayEnd = new Date();
    todayEnd.setHours(23, 59, 59, 999);
    const today = todayEnd.toISOString();
    const reviews = await authGet(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&completed=eq.false&select=*`);
    if (!Array.isArray(reviews)) return;
    const due = [];
    reviews.forEach(r => {
      // 책이 삭제됐으면 복습 알림에서 제외
      const _rb = findBook(r.book_id);
      if (!_rb) return;
      // 무료/단체미결제 → 공식·배정 단어장 복습 중지(Day1 체험은 유지, 데이터 보존 → 재구독 시 재개)
      if ((_rb._official || _rb._assigned) && !hasOfficialAccess() && String(r.page_num) !== OFFICIAL_FREE_PAGE) return;
      const steps = [
        { key: 'review_2d',  label: t('step1'),  date: r.review_2d  },
        { key: 'review_3d',  label: t('step2'),  date: r.review_3d  },
        { key: 'review_6d',  label: t('step3'),  date: r.review_6d  },
        { key: 'review_15d', label: t('step6'),  date: r.review_15d },
        { key: 'review_30d', label: t('step15'), date: r.review_30d },
        { key: 'review_60d', label: t('step30'), date: r.review_60d },
      ];
      // 순서 보장: 가장 이른 미완료 단계가 현재 단계. 그게 오늘까지 예정이면 '오늘 복습'.
      // (뒷 단계로 건너뛰어 순서가 꼬이던 문제 방지)
      const firstPending = steps.find(s => s.date);
      if (firstPending && firstPending.date <= today) due.push({ ...r, _stepKey: firstPending.key, _stepLabel: firstPending.label });
    });
    window._dueReviews = due;

    // ── 뱃지 갱신 ────────────────────────────────────────────────
    // ⚠️ due 가 0 이어도 반드시 지나가야 한다. 예전엔 바로 아래에서 return 해버려서
    //    복습을 다 끝내도 탭 뱃지와 앱 아이콘 숫자가 그대로 남았다.
    // 공식 단어장이 아직 붙는 중이면 그 책들의 복습이 통째로 빠진 채 세어진다.
    // 그 값으로 뱃지를 '낮추면' 켜자마자 뱃지가 사라졌다가 몇 초 뒤 다시 뜬다.
    // 올리는 것은 언제나 허용하고, 낮추는 것만 로드가 끝난 뒤로 미룬다.
    if (!(window._officialPending && due.length < (window._reviewBadgeCount || 0))) {
      window._reviewBadgeCount = due.length;
      try { syncAppBadge(); } catch(e){}
      const dockEl = document.querySelector('.dock');
      if (dockEl) dockEl.outerHTML = buildDock();
    }

    if (!due.length) return;
    let totalWords = 0;
    due.forEach(r => { const book = findBook(r.book_id); const page = book ? findPage(book, r.page_num) : null; if (page) totalWords += page.words.length; });
    const stepCounts = {};
    due.forEach(r => { stepCounts[r._stepLabel] = (stepCounts[r._stepLabel]||0) + 1; });
    const stepText = Object.entries(stepCounts).map(([k,v]) => `${k} ${v}${TT('개','')}`).join(' · ');

  } catch(e) {}
}

async function addReviewScore(score) {
  if (!score || score <= 0) return;
  try {
    const res = await fetch(SB_URL + `/rest/v1/members?id=eq.${currentUser.id}&select=perfect_reviews`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }
    });
    const data = await res.json();
    const current = data[0]?.perfect_reviews || 0;
    await fetch(SB_URL + `/rest/v1/members?id=eq.${currentUser.id}`, {
      method: 'PATCH',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ perfect_reviews: current + score, last_scored_at: new Date().toISOString() })
    });
    // 점수 일지(2026-09-10~): 월별 랭킹을 1점 단위로 정확 집계. 실패해도 총점 적립엔 영향 없음.
    try { authPost('/rest/v1/voca_score_log', { user_id: currentUser.id, score }); } catch(e){}
  } catch(e) { console.error('[복습 점수 저장 실패]', e); logError('write_fail','addReviewScore', e && e.message, { score }); }
}

async function updateReviewStep(review) {
  try {
    const patch = {};
    const key = review._stepKey;
    const now = new Date();
    patch.last_reviewed_at = now.toISOString();   // 일일 리포트: '오늘 복습함' 판별용

    // 복습 단계 순서 및 다음 단계까지의 간격 (일)
    const STEPS = [
      { key: 'review_2d',  next: 'review_3d',  days: 1 },
      { key: 'review_3d',  next: 'review_6d',  days: 2 },
      { key: 'review_6d',  next: 'review_15d', days: 5 },
      { key: 'review_15d', next: 'review_30d', days: 9 },
      { key: 'review_30d', next: 'review_60d', days: 15 },
      { key: 'review_60d', next: null,          days: 0 },
    ];

    const step = STEPS.find(s => s.key === key);

    // 현재 단계 null로 지우기 (복습 완료 표시)
    patch[key] = null;

    // 원래 예정일과 오늘 비교 - 하루 이상 미뤄졌으면 is_perfect=false 로 기록(리포트용). 점수는 그대로 지급.
    let isLate = false, lateDays = 0, dueStr = '';
    const scheduled = review._scheduledDate ? new Date(review._scheduledDate) : null;
    if (scheduled) {
      const diffDays = Math.floor((now - scheduled) / (1000 * 60 * 60 * 24));
      if (diffDays > 0) {
        patch.is_perfect = false; isLate = true; lateDays = diffDays;
        dueStr = TX(`{v0}월 {v1}일`,`{v0}/{v1}`,{v0:(scheduled.getMonth()+1),v1:(scheduled.getDate())});
      }
    }

    if (!step || !step.next) {
      // 마지막 단계 → 완료
      patch.completed = true;
    } else {
      // 다음 단계 날짜를 오늘 기준으로 재계산
      const nextDate = new Date(now);
      nextDate.setDate(nextDate.getDate() + step.days);
      nextDate.setHours(0, 0, 0, 0);
      patch[step.next] = nextDate.toISOString();
    }

    // 복습 단계 하나 완료할 때마다, 그 페이지 단어들의 난이도 점수를 합산해 반영
    const rbook = findBook(review.book_id);
    const rpage = rbook?.pages.find(p => String(p.num) === String(review.page_num));
    const baseScore = rpage ? calcWordScore(rpage.words) : 0;
    logActivity(review.book_id, review.page_num, 'review', rpage ? rpage.words.length : 0, _REVIEW_STEP_NUM[key]||null); // 복습 완료 기록(+회차)
    const isFinalStep = (!step || !step.next); // 마지막 단계(60일차) 완주
    // 예정일을 넘겨도(늦어도) 퀴즈를 통과해 복습을 완료하면 점수를 지급한다.
    // (늦음은 is_perfect=false 로만 기록 — 리포트의 '정시복습' 판별용. 점수에는 영향 없음)
    const pageScore = isFinalStep ? baseScore * 2 : baseScore; // 완주 시 2배 보너스
    window._lastReviewFinished = isFinalStep; // 축하 화면 분기용
    window._lastReviewLate = false;           // 늦어도 점수를 주므로 '점수 없음' 안내는 표시하지 않음
    window._lastReviewLateDays = lateDays;    // 며칠 늦었는지
    window._lastReviewDue = dueStr;           // 원래 예정일(표시용)
    window._lastBaseScore = baseScore; // 기본 점수 (보너스 표시용)
    if (pageScore > 0) { addReviewScore(pageScore); window._lastEarnedScore = pageScore; }
    else { window._lastEarnedScore = 0; }
    // 이 책의 복습 상태가 바뀌었으니 캐시 리셋 (다음에 책 열면 새로 불러옴)
    if (review.book_id) { _reviewStatusLoaded[review.book_id] = false; }

    const res = await fetch(SB_URL + `/rest/v1/voca_review?id=eq.${review.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken, 'Prefer': 'return=representation' },
      body: JSON.stringify(patch)
    });
    const result = await res.json();
  } catch(e) {
    console.error('[updateReviewStep 오류]', e);
  }
}

  </div>` + dock;

  try {
    const _rvPath = `/rest/v1/voca_review?user_id=eq.${currentUser.id}&completed=eq.false&order=first_studied_at.desc`;
    // 실패(null) 시 자동 재시도 — 일시적 오류로 "다시 시도" 화면이 안 뜨게(공용 fetchRetry)
    let reviews = await fetchRetry(() => authGet(_rvPath), 3);
    // 로그인 직후/토큰 타이밍 문제로 빈 결과가 올 수 있어 한 번 더 재시도
    if (Array.isArray(reviews) && reviews.length === 0) {
      await new Promise(r => setTimeout(r, 600));
      const _r2 = await authGet(_rvPath);
      if (Array.isArray(_r2)) reviews = _r2;
    }
    const el = document.getElementById('review-list');
    // 비동기 로드 중 사용자가 다른 화면으로 이동하면 review-list 가 사라짐(el=null) → 조용히 종료

    if (reviews == null || !Array.isArray(reviews)) {

      return;
    }
    if (!reviews?.length) { el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--ink-40);font-size:13px;">${TT('아직 ','')}${t('noReviewSchedule')}<br>${TT('암기 카드를 완료하면 자동으로 등록돼요','Complete flashcards to register automatically')}</div>`; return; }

    const todayEnd = new Date();
    todayEnd.setHours(23, 59, 59, 999);
    const today = todayEnd.toISOString();
    const STEPS = [
      { key: 'review_2d',  label: t('step1')  }, { key: 'review_3d',  label: t('step2')  },
      { key: 'review_6d',  label: t('step3')  }, { key: 'review_15d', label: t('step6')  },
      { key: 'review_30d', label: t('step15') }, { key: 'review_60d', label: t('step30') },
    ];
    const todayDue = [], upcoming = [], done = [];
    reviews.forEach(r => {
      // 책이 삭제됐으면 복습 목록에서 제외
      const _rb2 = findBook(r.book_id);
      if (!_rb2) return;
      // 페이지가 삭제/이름변경돼 없거나 단어가 0개인 '유령 복습'도 제외
      // (탭해도 "단어를 불러올 수 없어요"만 뜨던 문제 — 시작 시 자기치유 로직이 DB도 정리)
      const _rp2 = findPage(_rb2, r.page_num);
      if (!_rp2 || !(_rp2.words || []).length) return;
      // 무료/단체미결제 → 공식·배정 단어장 복습 중지(Day1 체험은 유지)
      if ((_rb2._official || _rb2._assigned) && !hasOfficialAccess() && String(r.page_num) !== OFFICIAL_FREE_PAGE) return;
      if (r.completed) { done.push(r); return; }
      // 순서 보장: 항상 '가장 이른 미완료 단계'가 현재 단계 (뒤 단계를 앞질러 하지 않음).
      // 예전엔 '미완료 & 기한지남' 첫 단계를 골라서, 앞 단계 예정일이 미래면 뒷 단계로 건너뛰어
      // "3일차는 됐는데 2일차가 남는" 순서 꼬임이 생겼음 → 방지.
      const firstPending = STEPS.find(s => r[s.key]);
      if (!firstPending) { done.push(r); return; } // 전부 null인데 completed 플래그만 없는 예외
      if (r[firstPending.key] <= today) { todayDue.push({ ...r, _stepKey: firstPending.key, _stepLabel: firstPending.label }); }
      else { upcoming.push({ ...r, _stepKey: firstPending.key, _nextLabel: firstPending.label, _nextDate: r[firstPending.key] }); }
    });

    function reviewCard(r, type) {
      const book = findBook(r.book_id);
      // 책이 삭제됐으면 카드 표시 안 함
      if (!book) return '';
      const page = book ? findPage(book, r.page_num) : null;
      const wordCount = page?.words.length || 0;
      const studiedDate = new Date(r.first_studied_at).toLocaleDateString(uiLocale());
      const totalSteps = STEPS.length;
      // 단조 표시: 현재(첫 미완료) 단계 앞까지만 '완료(✓)'로 본다. 순서 꼬임이 있어도
      // "1일차✓ 2일차(현재) 3일차✓" 처럼 중간이 빈 채로 보이지 않게.
      const curIdx = STEPS.findIndex(s => s.key === r._stepKey); // done이면 -1
      const completedSteps = curIdx < 0 ? totalSteps : curIdx;
      const progress = Math.round(completedSteps / totalSteps * 100);
      const stepDone = (i) => curIdx < 0 ? true : i < curIdx;
      const stepCur  = (i) => i === curIdx;

      if (type === 'due') {
        // 오늘 복습 카드 — 카드 전체 클릭 가능, 강렬한 스타일
        return `<div onclick="startSingleReview('${r.book_id}','${r.page_num}','${r.id}','${r._stepKey}','${r[r._stepKey]}')"
          style="background:var(--accent);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;active:opacity:0.85;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                <span style="font-size:11px;background:rgba(255,255,255,0.25);color:#fff;border-radius:99px;padding:2px 9px;font-weight:700;">🔥 ${r._stepLabel} ${TT('복습','Review')}!</span>
              </div>
              <div style="font-size:15px;font-weight:700;color:#fff;">${book?.title||t('deletedBook')}</div>
              <div style="font-size:12px;color:rgba(255,255,255,0.75);margin-top:3px;">Page ${r.page_num} · ${wordCount}${t('wordsUnit')}</div>
            </div>
            <div style="font-size:28px;opacity:0.4;">→</div>
          </div>
          <div style="height:4px;background:rgba(255,255,255,0.2);border-radius:99px;overflow:hidden;margin-bottom:8px;">
            <div style="height:100%;width:${progress}%;background:#fff;border-radius:99px;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;gap:6px;">
              ${STEPS.map((s,i) => `<span style="font-size:9px;color:${stepDone(i)?'rgba(255,255,255,0.5)':'rgba(255,255,255,0.9)'};font-weight:${stepCur(i)?'700':'400'};${stepCur(i)?'background:rgba(255,255,255,0.2);border-radius:99px;padding:1px 6px;':''}">${s.label}${stepDone(i)?'✓':''}</span>`).join('')}
            </div>
            <span style="font-size:11px;color:rgba(255,255,255,0.7);">${t('studiedDate')} ${studiedDate}</span>
          </div>
        </div>`;
      }

      if (type === 'upcoming') {
        return `<div style="background:var(--bg-card);border:1.5px solid var(--ink-12);border-radius:14px;padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:700;color:var(--ink-100);">${book?.title||t('deletedBook')}</div>
              <div style="font-size:11px;color:var(--ink-60);margin-top:2px;">Page ${r.page_num} · ${wordCount}${t('wordsUnit')} · ${t('studiedDate')} ${studiedDate}</div>
            </div>
            <span style="font-size:11px;color:var(--ink-40);flex-shrink:0;margin-left:8px;">${r._nextLabel} ${t('nextLabel')}</span>
          </div>
          <div style="margin-top:10px;">
            <div style="height:4px;background:var(--ink-07);border-radius:99px;overflow:hidden;">
              <div style="height:100%;width:${progress}%;background:var(--accent);border-radius:99px;"></div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:6px;">
              ${STEPS.map((s,i) => `<span style="font-size:9px;color:${stepDone(i)?'#1c7c3c':'var(--ink-40)'};font-weight:${stepDone(i)?'700':'400'}">${s.label}${stepDone(i)?'✓':''}</span>`).join('')}
            </div>
          </div>
          <div style="margin-top:8px;font-size:11px;color:var(--ink-40);">📅 ${t('nextReview')}: ${new Date(r._nextDate).toLocaleDateString(uiLocale())}</div>
        </div>`;
      }

      // done
      return `<div style="background:rgba(28,124,60,0.07);border:1.5px solid #1c7c3c;border-radius:14px;padding:14px 16px;margin-bottom:10px;opacity:0.75;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:700;color:var(--ink-100);">${book?.title||t('deletedBook')}</div>
            <div style="font-size:11px;color:var(--ink-60);margin-top:2px;">Page ${r.page_num} · ${wordCount}${t('wordsUnit')} · ${t('studiedDate')} ${studiedDate}</div>
          </div>
          <span style="font-size:11px;background:#1c7c3c;color:#fff;border-radius:99px;padding:3px 10px;font-weight:700;flex-shrink:0;margin-left:8px;">${t('completedLabel')} ✓</span>
        </div>
        <div style="margin-top:8px;">
          <div style="height:4px;background:var(--ink-07);border-radius:99px;overflow:hidden;">
            <div style="height:100%;width:100%;background:#1c7c3c;border-radius:99px;"></div>
          </div>
        </div>
      </div>`;
    }

    // 이번 주(오늘~+7일) 예정 복습 수 — 다가올 복습량 안내용
    const _weekEnd = new Date(); _weekEnd.setDate(_weekEnd.getDate() + 7); _weekEnd.setHours(23,59,59,999);
    const _weekCount = upcoming.filter(r => new Date(r._nextDate) <= _weekEnd).length;

    let html = '';
    // 복습 원리 한 줄 안내 — "왜 오늘 몇 개만 뜨지?" 오해 방지 (하루 몰아서가 아니라 30일에 6번 분산)
    html += `<div style="font-size:12px;color:var(--ink-60);line-height:1.55;margin-bottom:16px;">${TT('💡 복습은 한 단어장을 <b style="color:var(--ink-100);">30일 동안 6번</b>에 나눠서 진행돼요 — 오늘 것만 끝내면 나머지는 예정일에 자동으로 떠요.','💡 Each wordbook is reviewed <b style="color:var(--ink-100);">6 times over 30 days</b> — finish today\'s and the rest appear automatically on their dates.')}</div>`;
    if (todayDue.length) {
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <div style="font-size:13px;font-weight:700;color:var(--accent);">${t('todayReviewTitle')}</div>
        <div style="background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;">${todayDue.length}${TT('개','')}</div>
        <div style="font-size:11px;color:var(--ink-60);">${t('tapToStart')}</div>
      </div>`;
      html += todayDue.map(r => reviewCard(r, 'due')).join('');
    }
    if (upcoming.length) { html += `<div style="font-size:12px;font-weight:700;color:var(--ink-60);margin-top:16px;margin-bottom:8px;">${t('scheduledTitle')} (${upcoming.length}${TT('개','')}${_weekCount?` · ${TT('이번 주','this week')} ${_weekCount}${TT('개','')}`:''})</div>`; html += upcoming.map(r => reviewCard(r, 'upcoming')).join(''); }
    if (done.length) { html += `<div style="font-size:12px;font-weight:700;color:#1c7c3c;margin-top:16px;margin-bottom:8px;">${t('completedTitle')} (${done.length}${TT('개','')})</div>`; html += done.map(r => reviewCard(r, 'done')).join(''); }
    el.innerHTML = html || `<div style="text-align:center;padding:40px;color:var(--ink-40);font-size:13px;">${t('noReviewSchedule')}</div>`;
  } catch(e) { const _el = document.getElementById('review-list'); if (_el) _el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--ink-40);">${TT('오류','Error')}: ${e.message}</div>`; }
}

async function startSingleReview(bookId, pageNum, reviewId, stepKey, scheduledDate) {
  // 1차: 로컬 books에서 시도(빠른 표시)
  initStudy(bookId, 'page', pageNum);
  // ⭐ 항상 DB에서 이 Day의 '전체 단어'를 확인해 보강한다.
  //   (로컬 책이 부분 로드(20/40)·중복 페이지·누락일 때 복습 단어가 들쭉날쭉/안 보이던 문제 방지)
  try {
    // 이 book+page 에 해당하는 모든 page_id 수집 (중복 페이지가 있어도 전부 합침)
    const pgs = await sbFetch(`/rest/v1/voca_pages?book_id=eq.${bookId}&page_num=eq.${encodeURIComponent(String(pageNum))}&select=id`);
    const pids = (Array.isArray(pgs)?pgs:[]).map(p=>p.id).filter(Boolean);
    if (pids.length) {
      const fresh = await sbFetch(`/rest/v1/voca_words?page_id=in.(${pids.join(',')})&order=created_at`);
      if (Array.isArray(fresh) && fresh.length) {
        // en 기준 중복 제거(중복 페이지의 겹치는 단어 정리)
        const seen = new Set(), ws = [];
        for (const r of fresh) { const k=String(r.en||'').trim().toLowerCase(); if(!k||seen.has(k)) continue; seen.add(k); ws.push({ ..._dbRowToWord(r), pageNum }); }
        // DB가 로컬보다 많으면(부분 로드였음) DB 전체로 교체 + 로컬 books 도 갱신
        if (ws.length > (studyState?.queue?.length || 0)) {
          studyState = { bookId, scope:'page', pageNum, round:1, queue:shuffle([...ws]), idx:0, flipped:false, xList:[], stats:{total:ws.length,seen:0,oCount:0} };
          const _bk = findBook(bookId), _pg = _bk ? findPage(_bk, pageNum) : null; if (_pg) _pg.words = ws;
        }
      }
    }
  } catch(e) { console.warn('복습 단어 fresh 로드 실패:', e); }
  // 그래도 비었으면(로컬에 책 자체가 없던 경우) 전체 책 재로드 폴백
  if (!studyState || !studyState.queue || studyState.queue.length === 0) {
    try {
      toast(TT('단어 불러오는 중...','Loading words...'));
      await loadBooksFromDB();
      initStudy(bookId, 'page', pageNum);
    } catch(e) { console.warn('복습 단어 재로드 실패:', e); }
  }
  if (!studyState || !studyState.queue || studyState.queue.length === 0) {
    // 자기치유: 페이지가 실제로 삭제됐거나 단어가 0개인 '유령 복습'이면 그 자리에서 복습 행을 정리.
    // (책/페이지 삭제·이름변경 시 voca_review 가 남아 "추가하지 않은 페이지 · 0개 단어"로 뜨던 문제)
    try {
      const _pgs2 = await sbFetch(`/rest/v1/voca_pages?book_id=eq.${bookId}&page_num=eq.${encodeURIComponent(String(pageNum))}&select=id`);
      const _pids2 = (Array.isArray(_pgs2) ? _pgs2 : []).map(p => p.id).filter(Boolean);
      let _ghost = _pids2.length === 0;
      if (!_ghost) {
        const _ws2 = await sbFetch(`/rest/v1/voca_words?page_id=in.(${_pids2.join(',')})&select=id&limit=1`);
        _ghost = !(Array.isArray(_ws2) && _ws2.length);
      }
      if (_ghost && reviewId) {
        await fetch(SB_URL + `/rest/v1/voca_review?id=eq.${reviewId}`, { method:'DELETE', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken } });
        toast(TT('삭제된 페이지의 복습이라 목록에서 정리했어요','This review pointed to a deleted page — cleaned up'), 4000);
        render();
        return;
      }
    } catch(e) { console.warn('유령 복습 정리 실패:', e); }
    logError('load_fail','startSingleReview','review words empty',{ bookId, pageNum, reviewId });
    toast(TT('⚠️ 단어를 불러올 수 없어요. 책장에서 책을 열어 확인 후 다시 시도해주세요','⚠️ Could not load words. Please open the book in the bookshelf to verify, then retry'), 5000);
    return;
  }
  studyState._reviewId = reviewId;
  studyState._reviewStepKey = stepKey;
  studyState._scheduledDate = scheduledDate;
  push({ name: 'study-cards', bookId, scope: 'page', pageNum });
}

          ${TT('· <b>열 순서는 몰라도 됩니다.</b> 번호·품사 같은 열이 섞여 있어도 알아서 찾아요.<br>· 뜻을 적어두면 그대로 쓰고, 비워두면 채워드려요.<br>· 첫 줄 제목(단어/뜻/예문)은 있어도 되고 없어도 됩니다.<br>· <b>탭이 여러 개면</b> 탭마다 페이지로 나눠 저장할 수 있어요 (Day 1 · Day 2 …).<br>· 한 탭에 200개까지 · .xlsx · .xls · .csv','· <b>Column order does not matter.</b> Extra columns like No. or part of speech are fine.<br>· If you write a meaning we keep it; leave it blank and we fill it in.<br>· A header row is optional.<br>· <b>Multiple sheets?</b> Each sheet can become its own page (Day 1 · Day 2 …).<br>· Up to 200 words per sheet · .xlsx · .xls · .csv')}
        </div>

        <input type="file" id="manual-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleWordFile(event)">
        <button onclick="document.getElementById('manual-file').click()" class="btn btn-solid" style="width:100%;padding:12px;font-size:13.5px;">
          ${TT('파일 선택','Choose file')}
        </button>
        <button onclick="downloadWordTemplate()" style="width:100%;padding:9px;margin-top:6px;background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-body);text-decoration:underline;">
          ${TT('예시 파일 내려받기','Download a sample file')}
        </button>
      </div>
      </div>
      <div class="btn-fixed">
        <button id="manual-save-btn" class="btn btn-solid" onclick="saveManualWords('${route.bookId}')" style="opacity:${window._manualWords.length>0?1:0.4};">
          ${window._manualWords.length>0?`${t('saveWithMeaning')} (${window._manualWords.length}${TT('개','')})`:t('addWordsFirst')}
        </button>

    </div>`;
  setTimeout(() => document.getElementById('manual-en')?.focus(), 100);

// ── 직접 입력한 단어를 '이미 가진 사전'에서 즉시 찾기 ─────────────
// 공식 단어장에 1만 5천여 단어가 뜻·발음기호·품사·예문·CEFR 까지 갖춘 채로 들어
// 있다. 사용자가 타이핑한 단어가 거기 있으면 Gemini 를 부를 이유가 없다 —
// 즉시 채워지고, API 비용도 0이고, 공식 단어장과 뜻·예문이 일치한다.
//
// RLS 가 공식책만 노출하므로 이 조회로 남의 개인 단어가 나올 일은 없다.
//
// ⚠️ base(뜻)는 한국어다. 그래서 한국어 사용자에게만 뜻을 준다.
//    하지만 발음기호·예문·품사·CEFR 등급은 어느 나라 사람이 봐도 같은 값이다.
//    → 다른 언어 사용자에게도 그 항목들은 즉시 채워주고, 뜻만 저장할 때 AI 가 만든다.
//    (예전에는 통째로 막혀 있어서 한국어 사용자만 빠르게 쓸 수 있었다)
const _corpusCache = new Map();   // 같은 단어를 두 번 조회하지 않게
async function lookupWordInCorpus(en){
  const q = String(en || '').trim().toLowerCase();
  if (!q) return null;
  if (_corpusCache.has(q)) return _corpusCache.get(q);
  const ko = (userNativeLang === 'ko');
  let best = null;
  try {
    // ilike + 와일드카드 없음 = 대소문자 무시 정확 일치 (Neat 로 쳐도 neat 을 찾는다)
    const rows = await sbFetch(`/rest/v1/voca_words?en=ilike.${encodeURIComponent(q)}&select=en,base,ipa,sentence,level,analysis&limit=5`);
    if (Array.isArray(rows) && rows.length) {
      // 같은 단어가 여러 공식책에 있을 수 있다 → 예문·심화분석이 있는 쪽을 고른다
      const score = (r) => (r.base?2:0) + (r.sentence?2:0) + (r.analysis?1:0) + (r.ipa?1:0);
      best = rows.slice().sort((a,b)=>score(b)-score(a))[0];
      if (!best.base) best = null;
      // 한국어 사용자가 아니면 한국어 뜻·해설은 빼고 언어 무관 항목만 넘긴다
      if (best && !ko) {
        const a0 = best.analysis || {};
        best = { en: best.en, base: '', ipa: best.ipa || '', sentence: best.sentence || '',
                 level: best.level || '', analysis: a0.pos ? { pos: a0.pos } : null };
      }
    }
  } catch(e){
    // ⚠️ 네트워크 실패를 '사전에 없음' 으로 캐시하면, 그 단어는 이 세션 내내
    //    다시 찾지 않는다. 잠깐 끊겼다가 돌아온 사람에게 기능이 죽은 것처럼 보였다.
    return null;
  }
  _corpusCache.set(q, best);
  return best;
}
// ── 타이핑 중 단어 추천 ─────────────────────────────────────────
// 공식 단어장 1만 5천여 단어가 이미 서버에 있다. 두 글자만 쳐도
//   ① 이어질 단어를 입력칸 안에 옅은 색으로 미리 보여주고 (→ 또는 Tab 으로 완성)
//   ② 아래에 뜻까지 붙은 후보를 띄운다 (누르면 바로 추가 — 폰에서는 이게 더 빠르다)
// 철자가 헷갈려도 고를 수 있고, 고른 단어는 이미 사전에 있으니 저장도 즉시 끝난다.
const _prefixCache = new Map();   // 접두사 → 후보 배열 (같은 접두사를 두 번 묻지 않게)
let _manualSuggTimer = null;
let _manualSuggSeq = 0;           // 늦게 도착한 응답이 최신 결과를 덮어쓰지 않게
let _manualGhost = '';            // 지금 떠 있는 완성 후보 (단어 전체)
const _SUGG_MIN = 2;              // 두 글자부터
const _SUGG_SHOW = 6;             // 후보는 최대 6개
// 추천에는 단어와 뜻만 받는다. 발음기호·예문·심화분석까지 받으면 한 번에 50KB가
// 넘는데, 그건 실제로 '추가' 를 누른 단어 하나만 뒤에서 가져오면 되는 정보다.
// 가볍게 받는 대신 한 번에 많이 받아둔다 → 뒷글자를 더 쳐도 대개 서버에 다시 묻지 않는다.
const _SUGG_FETCH = 300;

function _suggScore(r){ return (r.base?1:0); }

async function fetchPrefixWords(q){
  if (_prefixCache.has(q)) return _prefixCache.get(q);
  // 더 짧은 접두사의 결과가 '잘리지 않은 전부' 였다면 거기서 걸러 쓰면 된다 → 네트워크 0회
  for (let n = q.length - 1; n >= _SUGG_MIN; n--) {
    const shorter = _prefixCache.get(q.slice(0, n));
    if (shorter && shorter._complete) {
      const sub = shorter.filter(r => String(r.en||'').toLowerCase().startsWith(q));
      sub._complete = true;
      _prefixCache.set(q, sub);
      return sub;
    }
  }
  let out = [];
  try {
    const rows = await sbFetch(`/rest/v1/voca_words?en=ilike.${encodeURIComponent(q)}*&select=en,base&limit=${_SUGG_FETCH}`);
    // 같은 단어가 여러 공식책에 있다 → 뜻·예문이 가장 잘 갖춰진 행 하나만 남긴다
    const byWord = new Map();
    for (const r of (Array.isArray(rows) ? rows : [])) {
      const k = String(r.en||'').trim().toLowerCase();
      if (!k) continue;
      const prev = byWord.get(k);
      if (!prev || _suggScore(r) > _suggScore(prev)) byWord.set(k, r);
    }
    out = [...byWord.values()].sort((a,b) => a.en.length - b.en.length || a.en.localeCompare(b.en));
    out._complete = (Array.isArray(rows) ? rows.length : 0) < _SUGG_FETCH;
  } catch(e) { out = []; out._complete = false; }
  _prefixCache.set(q, out);
  return out;
}

// 입력칸 안쪽에 겹쳐 그리는 '옅은 글씨' — 친 글자는 투명하게 두고 뒷부분만 보여준다
function _setManualGhost(word){
  _manualGhost = word || '';
  const el = document.getElementById('manual-ghost');
  const inp = document.getElementById('manual-en');
  if (!el) return;
  const typed = inp ? inp.value : '';
  const ok = _manualGhost && typed && typed === typed.trim()
             && _manualGhost.toLowerCase().startsWith(typed.toLowerCase())
             && _manualGhost.length > typed.length;
  if (!ok) { el.innerHTML = ''; _manualGhost = ''; return; }
  el.innerHTML = `<span style="visibility:hidden;">${esc(typed)}</span><span style="color:var(--ink-40);">${esc(_manualGhost.slice(typed.length))}</span>`;
}

function _renderManualSugg(rows){
  const box = document.getElementById('manual-sugg');
  if (!box) return;
  if (!rows || !rows.length) { box.innerHTML = ''; box.style.display = 'none'; return; }
  const ko = (typeof userNativeLang !== 'undefined' && userNativeLang === 'ko');
  box.style.display = 'block';
  box.innerHTML =
    `<div style="font-size:10px;color:var(--ink-40);margin:8px 0 6px;">${TT('사전에 있는 단어 · 누르면 바로 추가','In the dictionary · tap to add')}</div>` +
    rows.map(r => {
      const mean = (ko && r.base) ? String(r.base).split(/[,;·]/)[0].trim().slice(0, 12) : '';
      return `<button onclick="pickManualSugg('${jsq(r.en)}')" style="display:inline-flex;align-items:baseline;gap:5px;max-width:100%;background:var(--bg-input);border:1px solid var(--ink-07);border-radius:99px;padding:6px 11px;margin:0 6px 6px 0;font-family:var(--font-body);font-size:12.5px;color:var(--ink-100);cursor:pointer;">`
        + `<span style="font-weight:700;">${esc(r.en)}</span>`
        + (mean ? `<span style="font-size:11px;color:var(--ink-45);">${esc(mean)}</span>` : '')
        + `</button>`;
    }).join('');
}

function manualSuggestInput(){
  const inp = document.getElementById('manual-en');
  if (!inp) return;
  _setManualGhost('');
  if (_manualSuggTimer) clearTimeout(_manualSuggTimer);
  const q = inp.value.trim().toLowerCase();
  if (q.length < _SUGG_MIN || !/^[a-z][a-z'-]*$/.test(q)) { _manualSuggSeq++; _renderManualSugg([]); return; }
  const seq = ++_manualSuggSeq;
  _manualSuggTimer = setTimeout(async () => {
    let rows = [];
    try { rows = await fetchPrefixWords(q); } catch(e) { rows = []; }
    if (seq !== _manualSuggSeq) return;                       // 그 사이 더 쳤다
    const cur = document.getElementById('manual-en');
    if (!cur || cur.value.trim().toLowerCase() !== q) return; // 화면이 바뀌었거나 글자가 달라졌다
    // 이미 목록에 넣은 단어는 다시 권하지 않는다
    const fresh = rows.filter(r => !(window._manualWords||[]).some(w => String(w.en).toLowerCase() === String(r.en).toLowerCase()));
    _renderManualSugg(fresh.slice(0, _SUGG_SHOW));
    // 친 글자 그대로가 사전에 있으면 완성 힌트를 띄우지 않는다 (goo → good 으로 끌려가지 않게)
    const exact = fresh.some(r => String(r.en).trim().toLowerCase() === q);
    const ghost = exact ? null : fresh.find(r => String(r.en).toLowerCase().startsWith(q) && r.en.length > q.length);
    _setManualGhost(ghost ? ghost.en : '');
  }, 180);
}

// 옅게 떠 있는 단어를 입력칸에 확정 (→ / Tab)
function acceptManualGhost(){
  const inp = document.getElementById('manual-en');
  if (!inp || !_manualGhost) return false;
  inp.value = _manualGhost;
  _setManualGhost('');
  _renderManualSugg([]);
  _manualSuggSeq++;
  inp.focus();
  return true;
}

function manualKeydown(ev){
  const k = ev.key;
  if (k === 'Enter') { ev.preventDefault(); _setManualGhost(''); _renderManualSugg([]); addManualWord(); return; }
  if (k === 'Tab' && _manualGhost) { ev.preventDefault(); acceptManualGhost(); return; }
  if (k === 'ArrowRight' && _manualGhost) {
    const end = ev.target.selectionStart === ev.target.value.length && ev.target.selectionStart === ev.target.selectionEnd;
    if (end) { ev.preventDefault(); acceptManualGhost(); }
    return;
  }
  if (k === 'Escape') { _setManualGhost(''); _renderManualSugg([]); _manualSuggSeq++; }
}

// 후보를 누르면 고민 없이 바로 목록에 넣는다 (뜻까지 보고 누르는 것이라 확인 단계가 필요 없다)
function pickManualSugg(en){
  const inp = document.getElementById('manual-en');
  if (!inp) return;
  inp.value = en;
  _setManualGhost('');
  _renderManualSugg([]);
  _manualSuggSeq++;
  addManualWord();
}

// 예시 파일 내려받기 — '어떻게 만들면 되는지' 를 말로 설명하는 것보다 빠르다.
// 받아서 단어만 바꿔 다시 올리면 된다.
function downloadWordTemplate(){
  const rows = [
    [TT('단어','Word'), TT('뜻 (선택)','Meaning (optional)'), TT('예문 (선택)','Example (optional)')],
    ['neat', '', ''],
    ['beneath', '', ''],
    ['fragile', '', ''],
  ];
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  // ⚠️ BOM 이 없으면 한국 엑셀이 CP949 로 읽어 한글이 깨진다. 가장 흔한 사고라 꼭 붙인다.
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'imvoca-words-sample.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  toast(TT('예시 파일을 받았어요. 단어만 바꿔서 올려보세요','Sample downloaded — swap in your own words'));
}

// ── 엑셀·CSV 로 단어 한 번에 올리기 ──────────────────────────────
// 학원에서는 단어 목록을 이미 엑셀로 갖고 있다. 50개를 한 줄씩 치게 하는 대신
// 파일을 받아 '직접 입력' 목록을 채운다 — 그 뒤 흐름(사전 조회·카드·저장)은
// 손으로 넣었을 때와 똑같다.
const MANUAL_MAX = 200;   // 한 Day 에 이보다 많으면 저장도 학습도 버겁다

// xlsx 파서는 400KB 가 넘는다. 파일을 고른 사람에게만 내려받는다.
//
// ⚠️ 공식 CDN(cdn.sheetjs.com)에서 받는다. cdnjs 에 올라와 있는 0.18.5 는
//    프로토타입 오염 취약점(CVE-2023-30533)이 남아 있는 버전이라 쓰면 안 된다 —
//    남이 보낸 엑셀을 열었을 때 우리 앱에서 스크립트가 실행될 수 있다.
//    SheetJS 가 npm/cdnjs 배포를 중단해서 그쪽 최신이 0.18.5 에 멈춰 있다.
let _xlsxLoading = null;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    el.onload = () => resolve(window.XLSX);
    el.onerror = () => { _xlsxLoading = null; reject(new Error('xlsx load failed')); };
    document.head.appendChild(el);
  });
  return _xlsxLoading;
}

// ── 열 자동 인식 ────────────────────────────────────────────────
// 사람마다 엑셀 양식이 다르다. '번호|단어|뜻', '뜻|단어', '단어|품사|뜻|예문' …
// 위치를 고정하면 대부분 깨지므로 두 단계로 알아낸다:
//   1) 머리글 이름으로 (순서 무관)
//   2) 머리글이 없으면 내용을 보고 (영어 단어 열 / 한글 뜻 열 / 영어 문장 열)
const _HDR = {
  en:  /^(영어|영어단어|단어|영단어|word|words|en|english|vocab\w*|어휘|스펠링|spelling)$/i,
  ko:  /^(뜻|의미|해석|뜻풀이|한글|meaning|korean|ko|translation|definition|정의)$/i,
  ex:  /^(예문|예시|문장|용례|example|examples|sentence|usage)$/i,
};
function _headerMap(row){
  const map = {};
  row.forEach((c, i) => {
    const t = String(c||'').trim();
    if (!t) return;
    for (const k of ['en','ko','ex']) if (map[k] === undefined && _HDR[k].test(t)) map[k] = i;
  });
  // '단어' 열을 못 찾으면 머리글로 보지 않는다 (그냥 첫 데이터 줄일 수 있다)
  return map.en !== undefined ? map : null;
}

const _HAN = /[가-힣]/;
// 어휘 항목처럼 생겼는가 — 영어이고 짧다(한 낱말~숙어)
function _looksLikeWord(v){
  const t = String(v||'').trim();
  if (!t || t.length > 40) return false;
  if (!/^[A-Za-z][A-Za-z\-' .]*$/.test(t)) return false;
  return t.split(/\s+/).length <= 3;
}
// 예문처럼 생겼는가 — 영어인데 길다
function _looksLikeSentence(v){
  const t = String(v||'').trim();
  if (t.length < 12 || !/[A-Za-z]/.test(t)) return false;
  return t.split(/\s+/).length >= 4;
}
function _looksLikeKo(v){ return _HAN.test(String(v||'')); }

// 표본 줄들을 보고 어느 열이 무엇인지 고른다
function detectColumns(rows){
  if (!rows.length) return { map:{en:0}, headerRow:false };
  const hm = _headerMap(rows[0]);
  if (hm) return { map: hm, headerRow: true };

  const sample = rows.slice(0, 30);
  const width = Math.max(...sample.map(r => (r||[]).length), 1);
  // 품사 열('adj','v','명사'…)도 짧은 낱말이라 단어 열로 오해하기 쉽다.
  // 값의 가짓수로 가른다 — 단어 열은 거의 전부 다르고, 품사 열은 몇 개가 반복된다.
  const POSish = /^(n|v|adj|adv|prep|conj|pron|int|phr|명사|동사|형용사|부사|전치사|접속사|대명사|감탄사|숙어)\.?$/i;
  const stat = [];
  for (let c = 0; c < width; c++) {
    let word = 0, sent = 0, ko = 0, filled = 0, pos = 0;
    const seen = new Set();
    for (const r of sample) {
      const v = String((r||[])[c] ?? '').trim();
      if (!v) continue;
      filled++; seen.add(v.toLowerCase());
      if (POSish.test(v)) pos++;
      if (_looksLikeSentence(v)) sent++;
      else if (_looksLikeWord(v)) word++;
      if (_looksLikeKo(v)) ko++;
    }
    // 가짓수 비율: 1에 가까울수록 '항목 열', 낮을수록 '분류 열'
    const uniq = filled ? seen.size / filled : 0;
    stat.push({ c, word, sent, ko, filled, pos, uniq });
  }
  const pick = (key, used) => {
    const cand = stat.filter(s => !used.includes(s.c) && s[key] > 0);
    if (!cand.length) return undefined;
    if (key === 'word') {
      // 절반 이상이 품사 값인 열은 단어 열이 아니다
      const ok = cand.filter(s => s.pos < s.filled / 2);
      const use = ok.length ? ok : cand;
      // 같은 개수면 가짓수가 많은 쪽(=진짜 단어 목록)을 고른다
      return use.sort((a,b) => (b.word*b.uniq) - (a.word*a.uniq) || b.word - a.word || a.c - b.c)[0].c;
    }
    return cand.sort((a,b) => b[key] - a[key] || a.c - b.c)[0].c;
  };
  const used = [];
  const map = {};
  map.en = pick('word', used); if (map.en !== undefined) used.push(map.en);
  map.ko = pick('ko',   used); if (map.ko !== undefined) used.push(map.ko);
  map.ex = pick('sent', used);
  if (map.en === undefined) map.en = 0;   // 못 고르면 첫 열로 폴백
  return { map, headerRow: false };
}

// 시트(탭) 하나에서 단어를 뽑는다.
// 열 인식은 탭마다 따로 한다 — 'Day 1' 은 번호|단어|뜻, 'Day 2' 는 단어|뜻 처럼
// 탭마다 양식이 다른 파일이 실제로 흔하다.
function _extractSheetItems(rows, limit, skipSet){
  let data = Array.isArray(rows) ? rows.slice() : [];
  if (!data.length) return { items: [], skipped: 0, picked: '' };
  const det = detectColumns(data);
  if (det.headerRow) data = data.slice(1);
  const M = det.map;
  const cell = (r, i) => (i === undefined ? '' : String((r && r[i]) ?? '').trim());
  const have = new Set(skipSet || []);
  const items = [];
  let skipped = 0;
  for (const r of data) {
    const en = cell(r, M.en);
    if (!_looksLikeWord(en)) { if (en) skipped++; continue; }
    const k = en.toLowerCase();
    if (have.has(k)) continue;            // 같은 탭 안의 중복만 정리
    have.add(k);
    items.push({ en, base: cell(r, M.ko), sentence: cell(r, M.ex), ctx: '', level: 'B1', ipa: '' });
    if (items.length >= limit) break;
  }
  // 자동으로 고른 열을 알려준다 — 잘못 골랐을 때 사용자가 바로 알아챌 수 있게
  const col = (i) => i === undefined ? '' : String.fromCharCode(65 + i);
  const picked = [
    `${TT('단어','Word')} ${col(M.en)}`,
    M.ko !== undefined ? `${TT('뜻','Meaning')} ${col(M.ko)}` : '',
    M.ex !== undefined ? `${TT('예문','Example')} ${col(M.ex)}` : '',
  ].filter(Boolean).join(' · ');
  return { items, skipped, picked };
}

// 뽑은 단어를 '직접 입력' 목록에 붙이고 뜻을 사전에서 채운다
async function _appendToManualList(items, picked, skipped){
  const have = new Set((window._manualWords||[]).map(w => String(w.en).toLowerCase()));
  const room = MANUAL_MAX - (window._manualWords||[]).length;
  const add = items.filter(w => !have.has(String(w.en).toLowerCase())).slice(0, Math.max(0, room));
  if (!add.length) { toast(TT('새로 가져올 단어가 없어요','Nothing new to import')); return; }

  // 뜻이 비어 있는 것만 사전에서 찾는다 (파일에 뜻이 있으면 그 사람 뜻을 존중)
  const marked = add.filter(w => !w.base);
  marked.forEach(w => { w._looking = true; });
  window._manualWords.push(...add);
  _refreshManualList();

  const found = await lookupWordsInCorpus(marked.map(w => w.en));
  let hit = 0;
  for (const w of marked) {
    w._looking = false;
    const r = found.get(w.en.toLowerCase());
    if (r) {
      hit++;
      w.base = r.base || '';
      w.ipa = r.ipa || '';
      if (!w.sentence) w.sentence = r.sentence || '';
      if (r.level) w.level = r.level;
      if (r.analysis) w.analysis = r.analysis;
    }
  }
  _refreshManualList();
  toast(TX(`${add.length}개를 가져왔어요 (${picked}열) · 사전에서 ${hit}개 바로 채움` + (skipped?` · ${skipped}개 건너뜀`:''),
           '{v0} imported ({v3}) · {v1} filled from dictionary' + (skipped?' · {v2} skipped':''),
           {v0:(add.length), v1:(hit), v2:(skipped), v3:(picked)}), 5000);
}

// ── 탭(시트) = 페이지 ───────────────────────────────────────────
// 학원 단어장은 'Day 1', 'Day 2' 처럼 탭을 나눠 쓰는 경우가 많다. 탭이 두 개
// 이상이면 탭마다 페이지로 나눠 저장할지 물어본다(합치는 쪽도 남겨둔다).
const SHEET_PAGE_MAX = 30;      // 한 파일에서 만들 페이지 수 상한
const SHEET_TOTAL_MAX = 1000;   // 한 파일에서 가져올 총 단어 수 상한

// 탭 이름에서 페이지 번호를 뽑는다: 'Day 1'·'1과'·'Unit 07' → 1, 1, 7
// 숫자가 없거나 이미 쓴 번호면 비어 있는 다음 번호를 준다.
function _sheetPageNum(name, used){
  const m = String(name||'').match(/\d+/);
  if (m) {
    const n = String(parseInt(m[0], 10));
    if (n !== 'NaN' && !used.has(n)) { used.add(n); return n; }
  }
  let k = 1;
  while (used.has(String(k))) k++;
  used.add(String(k));
  return String(k);
}

async function handleWordFile(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';                   // 같은 파일을 다시 골라도 동작하게
  if (!file) return;

  let sheets;
  try {
    toast(TT('파일을 읽는 중이에요…','Reading file…'));
    const XLSX = await loadXlsx();
    const buf = await file.arrayBuffer();
    // CSV 도 xlsx 파서가 읽는다 — 한국 엑셀이 만드는 CP949 인코딩까지 알아서 처리해
    // 따로 CSV 경로를 두지 않는다(그쪽이 한글 깨짐의 단골 원인이다).
    const wb = XLSX.read(buf, { type: 'array' });
    sheets = wb.SheetNames.map(nm => ({
      name: String(nm || '').trim(),
      rows: XLSX.utils.sheet_to_json(wb.Sheets[nm], { header: 1, blankrows: false, defval: '' })
    })).filter(sh => Array.isArray(sh.rows) && sh.rows.length);
  } catch(e){
    toast(TT('파일을 읽지 못했어요. 엑셀(.xlsx)이나 CSV 인지 확인해주세요','Could not read the file — please use .xlsx or .csv'));
    return;
  }
  if (!sheets.length) { toast(TT('파일이 비어 있어요','The file is empty')); return; }

  // 탭마다 단어를 뽑는다
  const parsed = [];
  let total = 0;
  for (const sh of sheets) {
    if (parsed.length >= SHEET_PAGE_MAX || total >= SHEET_TOTAL_MAX) break;
    const room = Math.min(MANUAL_MAX, SHEET_TOTAL_MAX - total);
    if (room <= 0) break;
    const got = _extractSheetItems(sh.rows, room, null);
    if (!got.items.length) continue;      // 설명·표지 같은 빈 탭은 건너뛴다
    total += got.items.length;
    parsed.push({ name: sh.name || `${TT('탭','Sheet')} ${parsed.length + 1}`, ...got });
  }
  if (!parsed.length) {
    toast(TT('가져올 영어 단어를 찾지 못했어요. 첫 번째 열에 단어를 넣어주세요','No English words found — put them in the first column'));
    return;
  }

  // 쓸 만한 탭이 하나뿐이면 지금까지와 똑같이 목록에 붙인다
  if (parsed.length === 1) {
    await _appendToManualList(parsed[0].items, parsed[0].picked, parsed[0].skipped);
    return;
  }
  openSheetSplitModal(parsed);
}

// 탭이 여러 개일 때 물어보는 창 — 어느 탭이 몇 페이지가 되는지 보여주고 고치게 한다
function openSheetSplitModal(parsed){

  const bookId = window._manualBookId;
  const book = findBook(bookId);
  const used = new Set();
  const groups = [];

  // 이미 손으로 넣어둔 단어가 있으면 같이 저장할 수 있게 맨 위에 한 줄 둔다
  const typed = (window._manualWords || []).slice();
  if (typed.length) {
    const pg = (document.getElementById('manual-pg')?.value || '').trim();
    if (pg) used.add(pg);
    groups.push({ name: TT('직접 입력한 단어','Typed by hand'), items: typed, num: pg });
  }
  for (const sh of parsed) groups.push({ name: sh.name, items: sh.items, num: _sheetPageNum(sh.name, used) });
  window._sheetGroups = groups;

  const totalWords = groups.reduce((n,g) => n + g.items.length, 0);
  const rows = groups.map((g, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ink-07);">
      <div style="flex:1;min-width:0;text-align:left;">
        <div style="font-size:13px;font-weight:700;color:var(--ink-100);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(g.name)}</div>
        <div id="ssp-note-${i}" style="font-size:11px;color:var(--ink-45);margin-top:2px;">${g.items.length}${TT('단어',' words')}</div>
      </div>
      <span style="font-size:11px;color:var(--ink-45);white-space:nowrap;">${TT('페이지','Page')}</span>
      <input class="ssp-num" data-i="${i}" value="${esc(g.num)}" oninput="_sspNotes()" inputmode="numeric"
        style="width:60px;text-align:center;background:var(--bg-input);border:1px solid var(--ink-12);border-radius:8px;padding:8px 6px;font-family:var(--font-body);font-size:13px;color:var(--ink-100);outline:none;">
    </div>`).join('');

  const ov = document.createElement('div');
  ov.id = 'sheet-split-modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML = `
    <div style="background:var(--bg-card,#fff);border-radius:18px;padding:20px;max-width:360px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.2);text-align:center;">
      <div style="font-size:30px;line-height:1;margin-bottom:8px;">🗂️</div>
      <div style="font-family:var(--font-serif-ko);font-size:17px;font-weight:700;color:var(--ink-100);margin-bottom:6px;">${TX('탭이 {v0}개 있어요','Found {v0} sheets',{v0:(parsed.length)})}</div>
      <div style="font-size:12.5px;color:var(--ink-60);line-height:1.6;margin-bottom:6px;">${TT('탭마다 다른 페이지로 나눠 저장할 수 있어요.<br>페이지 번호는 고쳐도 됩니다.','Each sheet can become its own page.<br>You can change the page numbers.')}</div>
      <div style="margin-bottom:10px;">${rows}</div>
      <div style="font-size:11px;color:var(--ink-45);border-top:1px solid var(--ink-07);padding-top:10px;margin-bottom:12px;">${TX('모두 {v0}단어','{v0} words in total',{v0:(totalWords)})}</div>
      <button id="ssp-go" class="btn btn-solid" style="width:100%;padding:13px;font-size:14px;">${TT('탭별로 나눠 저장','Save as separate pages')}</button>
      <button id="ssp-merge" class="btn btn-outline" style="width:100%;padding:12px;margin-top:8px;font-size:13.5px;">${TT('한 페이지로 합치기','Merge into one page')}</button>
      <button id="ssp-cancel" style="width:100%;padding:12px;margin-top:6px;background:none;color:var(--ink-45);border:none;font-size:13px;cursor:pointer;font-family:var(--font-body);">${TT('취소','Cancel')}</button>
    </div>`;
  ov.onclick = (e) => { if (e.target === ov) closeSheetSplit(); };
  document.body.appendChild(ov);
  document.getElementById('ssp-go').onclick = () => importSheetsAsPages();
  document.getElementById('ssp-merge').onclick = async () => {
    closeSheetSplit();
    const merged = [];
    const seen = new Set((window._manualWords||[]).map(w => String(w.en).toLowerCase()));
    for (const sh of parsed) for (const w of sh.items) {
      const k = w.en.toLowerCase();
      if (seen.has(k)) continue;          // 합칠 때는 탭을 넘나드는 중복도 정리한다
      seen.add(k); merged.push(w);
    }
    await _appendToManualList(merged, parsed[0].picked, 0);
  };
  document.getElementById('ssp-cancel').onclick = () => closeSheetSplit();
  _sspNotes();
}

function closeSheetSplit(){
  window._sheetGroups = null;
  document.getElementById('sheet-split-modal')?.remove();
}

// 입력한 번호가 이미 있는 페이지면 '기존 페이지에 추가' 라고 알려준다
function _sspNotes(){
  const groups = window._sheetGroups || [];
  const book = findBook(window._manualBookId);
  document.querySelectorAll('#sheet-split-modal .ssp-num').forEach(el => {
    const i = +el.dataset.i;
    const g = groups[i]; if (!g) return;
    const note = document.getElementById('ssp-note-' + i);
    if (!note) return;
    const v = String(el.value || '').trim();
    const dup = v && book && findPage(book, v);
    note.innerHTML = `${g.items.length}${TT('단어',' words')}`
      + (dup ? ` · <span style="color:#b06b00;font-weight:600;">${TT('기존 페이지에 추가','adds to existing page')}</span>` : '');
  });
}

// 탭별로 페이지를 만들어 저장한다
async function importSheetsAsPages(){
  const groups = window._sheetGroups || [];
  const bookId = window._manualBookId;
  if (!groups.length || !bookId) { closeSheetSplit(); return; }

  const nums = [];
  for (const el of document.querySelectorAll('#sheet-split-modal .ssp-num')) {
    const v = String(el.value || '').trim();
    if (!v) { toast(TT('페이지 번호를 모두 채워주세요','Fill in every page number')); el.focus(); return; }
    nums[+el.dataset.i] = v;
  }
  const btn = document.getElementById('ssp-go');
  const stop = document.getElementById('ssp-merge');
  const cancel = document.getElementById('ssp-cancel');
  [btn, stop, cancel].forEach(b => { if (b) { b.disabled = true; b.style.opacity = '0.6'; b.style.pointerEvents = 'none'; } });

  // 1) 뜻은 먼저 우리 사전에서 한 번에 찾는다 (탭 전체를 통틀어 한 번)
  if (btn) btn.textContent = TT('사전에서 찾는 중…','Looking up…');
  const blanks = groups.flatMap(g => g.items).filter(w => !w.base);
  try {
    const found = await lookupWordsInCorpus(blanks.map(w => w.en));
    for (const w of blanks) {
      const r = found.get(w.en.toLowerCase());
      if (!r) continue;
      w.base = r.base || '';
      w.ipa = r.ipa || '';
      if (!w.sentence) w.sentence = r.sentence || '';
      if (r.level) w.level = r.level;
      if (r.analysis) w.analysis = r.analysis;
    }
  } catch(e){}

  // 2) 사전에 없던 단어만 AI 로 채우고, 페이지별로 저장한다
  let savedPages = 0, savedWords = 0;
  try {
    for (let i = 0; i < groups.length; i++) {
      const g = groups[i], pg = nums[i];
      await _fillMeanings(g.items, bookId, (done, need) => {
        if (btn) btn.textContent = `${TT('저장 중','Saving')} ${i+1}/${groups.length} · ${done}/${need}`;
      });
      if (btn) btn.textContent = `${TT('저장 중','Saving')} ${i+1}/${groups.length}`;
      const n = await _savePageAndMerge(bookId, pg, g.items);
      if (n) { savedPages++; savedWords += n; }
    }
  } catch(e){
    console.error('[importSheetsAsPages]', e);
    toast(TT('저장 중 문제가 생겼어요. 저장된 페이지까지는 남아 있어요','Something went wrong — the pages saved so far are kept'));
  }

  window._manualWords = [];
  closeSheetSplit();
  updateTotalWords();
  toast(TX(`${savedPages}개 페이지에 ${savedWords}단어를 저장했어요`,'Saved {v1} words across {v0} pages',{v0:(savedPages), v1:(savedWords)}), 4000);
  replace({ name: 'book', bookId });
}

// 여러 단어를 한 번에 조회한다. 엑셀로 100개를 올릴 때 100번 요청하면 느리고
// 서버에도 부담이라, in.(...) 으로 한 번에 받는다. URL 길이 때문에 100개씩 끊는다.
async function lookupWordsInCorpus(list){
  const found = new Map();
  const ko = (userNativeLang === 'ko');
  const words = [...new Set(list.map(w => String(w||'').trim().toLowerCase()).filter(Boolean))];
  const score = (r) => (r.base?2:0) + (r.sentence?2:0) + (r.analysis?1:0) + (r.ipa?1:0);
  for (let i = 0; i < words.length; i += 100) {
    const chunk = words.slice(i, i + 100);
    try {
      // in.() 안의 값은 쉼표·따옴표가 구분자라서 각 단어를 큰따옴표로 감싼다
      const inList = chunk.map(w => '"' + w.replace(/"/g, '') + '"').join(',');
      const rows = await sbFetch(`/rest/v1/voca_words?en=in.(${encodeURIComponent(inList)})&select=en,base,ipa,sentence,level,analysis`);
      if (!Array.isArray(rows)) continue;
      for (const r of rows) {
        if (!r.base) continue;
        const k = String(r.en || '').toLowerCase();
        const prev = found.get(k);
        if (!prev || score(r) > score(prev)) {
          // 한국어 사용자가 아니면 한국어 뜻·해설은 빼고 언어 무관 항목만 (발음·예문·등급·품사)
          found.set(k, ko ? r : { en: r.en, base: '', ipa: r.ipa || '', sentence: r.sentence || '',
                                  level: r.level || '', analysis: (r.analysis && r.analysis.pos) ? { pos: r.analysis.pos } : null });
        }
      }
    } catch(e){}
  }
  // 낱개 조회 캐시와 공유해서, 같은 단어를 또 찾지 않게 한다
  for (const [k, v] of found) _corpusCache.set(k, v);
  return found;
}

function _posLabel(a){
  const POS = { n:'명사', v:'동사', adj:'형용사', adv:'부사', prep:'전치사',
                conj:'접속사', pron:'대명사', int:'감탄사', phr:'숙어' };
  const p = a && a.pos ? String(a.pos).toLowerCase() : '';
  return p ? (POS[p] || p) : '';
}

function renderManualWordList() {
  if (!window._manualWords?.length) {
    return `<div style="text-align:center;padding:20px;font-size:12px;color:var(--ink-40);">${t('noManualWords')}<br>${TT('영어 단어를 입력하고 추가 버튼을 눌러주세요','Enter a word and click Add')}</div>`;
  }
  // 방금 추가한 단어가 입력칸 바로 밑에 보이도록 최신순으로 그린다.
  // (저장 순서는 _manualWords 원본 그대로이고, 지우기 버튼도 원래 index 를 쓴다)
  return window._manualWords.map((w, i) => ({ w, i })).reverse().map(({ w, i }) => {
    // 상태 3가지: 찾는 중 / 사전에서 찾음 / 저장할 때 검색 예정
    const icon = w._looking ? '🔎' : (w.base ? '✅' : '📝');

    const sub = w._looking
      ? `<div style="font-size:11px;color:var(--ink-40);margin-top:2px;">${TT('사전에서 찾는 중…','Looking up…')}</div>`

      ? `<div style="font-size:12.5px;color:var(--ink-100);margin-top:3px;">${esc(w.base)}</div>
         <div style="font-size:11px;color:var(--ink-40);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px;">
           ${pos?`<span>${esc(pos)}</span>`:''}
           ${w.ipa?`<span>${esc(w.ipa)}</span>`:''}
           ${w.level?`<span>CEFR ${esc(w.level)}</span>`:''}
         </div>
         ${w.sentence?`<div style="font-size:11.5px;color:var(--ink-60);margin-top:4px;line-height:1.5;">📝 ${esc(w.sentence)}</div>`:''}`
      : `<div style="font-size:11px;color:var(--ink-40);margin-top:2px;">${t('pendingMeaning')}</div>`;
    return `
    <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--bg-card);border-radius:10px;margin-bottom:6px;">
      <div style="font-size:16px;line-height:1.4;">${icon}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:700;color:var(--ink-100);">${esc(w.en)}</div>
        ${sub}
      </div>
      <button onclick="removeManualWord(${i})" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--ink-40);padding:4px;">✕</button>
    </div>`;
  }).join('');
}

function addManualWord() {
  const enInput = document.getElementById('manual-en');
  const en = enInput?.value.trim();
  if (!en) { toast(TT('영어 단어를 입력해주세요','Type an English word first')); return; }
  if (window._manualWords.find(w => w.en.toLowerCase() === en.toLowerCase())) { toast(TT('이미 추가된 단어예요','Already on the list')); enInput.value=''; enInput.focus(); return; }
  const item = { en, base: '', ctx: '', level: 'B1', ipa: '', _looking: true };
  window._manualWords.push(item);
  enInput.value = ''; enInput.focus();
  _manualSuggSeq++;                       // 날아오던 추천 응답 무효화
  if (typeof _setManualGhost === 'function') { _setManualGhost(''); _renderManualSugg([]); }
  _refreshManualList();

  // 입력을 막지 않고 뒤에서 찾는다 — 사용자는 계속 다음 단어를 칠 수 있다
  lookupWordInCorpus(en).then((hit) => {
    item._looking = false;
    if (hit) {
      item.base = hit.base || '';
      item.ipa = hit.ipa || '';
      item.sentence = hit.sentence || '';
      if (hit.level) item.level = hit.level;
      if (hit.analysis) item.analysis = hit.analysis;
    }
    // 그 사이 사용자가 지웠을 수 있으니 목록에 아직 있을 때만 다시 그린다
    if (window._manualWords.includes(item)) _refreshManualList();
  }).catch(() => { item._looking = false; _refreshManualList(); });
}

// 목록 + 저장 버튼 라벨을 함께 갱신 (여러 곳에서 같은 일을 하던 것을 모음)
function _refreshManualList(){
  const list = document.getElementById('manual-word-list');
  if (list) list.innerHTML = renderManualWordList();
  const saveBtn = document.getElementById('manual-save-btn');
  if (!saveBtn) return;
  const n = window._manualWords.length;
  if (n > 0) {

    // 몇 개가 남았는지 버튼에 알려줘 기다릴 시간을 가늠하게 한다.
    const need = window._manualWords.filter(w => !w.base).length;

      ? `${t('saveWithMeaning')} (${n}${TT('개','')})`
