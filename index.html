*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { height: 100%; font-family: var(--font-body); color: var(--ink-100); -webkit-font-smoothing: antialiased; background: #e3d9c9; }
#root { position: fixed; inset: 0; height: 100dvh; }
.scr { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 20px 22px 0; overflow: hidden; background: radial-gradient(135% 90% at 50% -12%, #f8f2e8 0%, var(--bg-page) 52%); }
@media (min-width: 768px) {
  /* ===== PC 최적화: 좌측 사이드바 + 넓은 콘텐츠 + 가운데 정렬 ===== */
  :root { --sidebar-w: 264px; }

  /* 하단 탭바 → 좌측 세로 사이드바 */
  .dock {
    top: 0 !important; bottom: 0 !important; left: 0 !important; right: auto !important;
    transform: none !important;
    width: var(--sidebar-w) !important; max-width: var(--sidebar-w) !important; height: 100vh !important;
    flex-direction: column !important; justify-content: flex-start !important; align-items: stretch !important;
    gap: 8px; padding: 34px 18px !important;
    border-top: none !important; border-right: 1px solid var(--ink-12) !important;
    background: var(--bg-card) !important;
    backdrop-filter: none !important;
  }
  /* 사이드바 상단 로고 영역 */
  .dock::before {
    content: "IM VOCA";
    font-family: var(--font-display); font-size: 25px; font-weight: 700;
    color: var(--accent); letter-spacing: -0.02em;
    padding: 0 16px 26px; margin-bottom: 12px;
    border-bottom: 1px solid var(--ink-07);
  }
  .dock__btn {
    flex-direction: row !important; justify-content: flex-start !important; align-items: center !important; gap: 16px !important;
    padding: 16px 18px !important; font-size: 17px !important; font-weight: 600 !important; border-radius: 13px;
    width: 100% !important; height: auto !important; transition: background .15s, color .15s;
  }
  .dock__btn:hover { background: var(--bg-input); }
  .dock__btn--active { background: var(--gold-bg); }
  .dock__btn span:first-child { font-size: 26px !important; width: 30px !important; text-align: center; }
  .dock__btn span:last-child { font-size: 16px !important; }

  /* 콘텐츠 영역: 사이드바 오른쪽 전체, 내부에서 가운데 정렬 */
  .scr {
    left: var(--sidebar-w) !important; right: 0 !important; width: auto !important; max-width: none !important;
    transform: none !important;
    padding: 0 !important; border: none !important;
    align-items: center;
    overflow-y: auto;
  }
  /* 실제 내용은 적당한 폭으로 가운데, 내용 적으면 위아래도 가운데 */
  .scr > *:not(.btn-fixed):not(.dock):not(.study-start-bar) { width: 100%; max-width: 720px; }
  .scr-scroll {
    width: 100%; max-width: 720px;
    margin-left: auto !important; margin-right: auto !important;
    padding: 40px 40px 60px !important;
    min-height: 100%;
    display: block;
  }
  /* scr-scroll 직속 자식이 flex로 찌그러지지 않게 (복습 카드 등) */
  .scr-scroll > * { flex-shrink: 0; }
  /* 내용이 적을 때 세로 가운데 정렬되도록: 스크롤 컨테이너를 flex로 채움 */
  .scr { justify-content: flex-start; }
  .scr::before, .scr::after { content: none; }

  /* 책장/리스트가 들어가는 화면은 더 넓게 + 확실히 가운데 */
  .scr.scr-wide > * { max-width: 1180px !important; margin-left: auto !important; margin-right: auto !important; }

  /* 책장 격자: 넓은 화면이니 여러 열 자동 채움 */
  .book-grid { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)) !important; gap: 30px 26px !important; }
  .scr-wide .book-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important; gap: 36px 30px !important; }
  .scr-wide .lib-header { max-width: 100%; }

  .overlay { left: 0; right: 0; max-width: none; transform: none; }
  .sheet { max-width: 520px; margin: 0 auto; }
  /* 하단 버튼: 사이드바 오른쪽 영역 하단에 고정, 가운데 정렬 */
  .btn-fixed { position: fixed !important; left: var(--sidebar-w) !important; right: 0 !important; bottom: 0 !important; top: auto !important; width: auto !important; max-width: none !important; min-width: 0 !important; margin: 0 !important; align-self: auto !important; display: flex !important; flex-direction: row !important; justify-content: center !important; align-items: center !important; gap: 12px !important; padding: 16px 40px calc(16px + env(safe-area-inset-bottom,0px)) !important; background: var(--bg-page) !important; border-top: 1px solid var(--ink-07) !important; z-index: 100 !important; box-sizing: border-box !important; }
  .btn-fixed .btn, .btn-fixed--row .btn { flex: 0 1 280px !important; width: auto !important; max-width: 280px !important; }

  /* 암기/설정 화면의 시작 버튼바도 하단 고정 */
  .study-start-bar { position: fixed !important; left: var(--sidebar-w) !important; right: 0 !important; bottom: 0 !important; top: auto !important; max-width: none !important; flex-direction: row !important; justify-content: center !important; gap: 12px !important; margin: 0 !important; padding: 16px 40px calc(16px + env(safe-area-inset-bottom,0px)) !important; background: var(--bg-page) !important; border-top: 1px solid var(--ink-07); z-index: 100 !important; box-sizing: border-box !important; }
  .study-start-bar .btn { flex: 0 1 300px !important; width: auto !important; max-width: 300px !important; }

  /* 상단 우측 버튼이 제목과 안 겹치게: 제목 영역에 오른쪽 여백 */
  .scr-wide .lib-header { padding-right: 0; }

.scr-scroll { flex: 1; overflow-y: auto; padding-bottom: 24px; }

// 카카오톡 공유용 JavaScript 키 (developers.kakao.com → 내 앱 → 앱 키 → JavaScript 키).
// 비워두면 학부모 카드는 자동으로 '복사/공유' 방식으로 동작합니다.
const KAKAO_JS_KEY = '3dd23d57fa02271fab74897b38ecfeff';

async function sbFetch(path, method='GET', body=null, useAuth=true, extraHeaders={}) {
  const buildHeaders = () => {
    const h = { 'Content-Type': 'application/json', 'apikey': SB_KEY, ...extraHeaders };
    h['Authorization'] = (useAuth && _authToken) ? 'Bearer ' + _authToken : 'Bearer ' + SB_KEY;
    return h;
  };
  let res = await fetch(SB_URL + path, { method, headers: buildHeaders(), body: body ? JSON.stringify(body) : null });
  // 401/403이면 세션 갱신 후 재시도
  if (res.status === 401 || res.status === 403) {
    const refreshed = await refreshSession();
    if (refreshed) {
      res = await fetch(SB_URL + path, { method, headers: buildHeaders(), body: body ? JSON.stringify(body) : null });
    }
  }
  // 빈 본문(204/return=minimal) 안전 처리: res.json() 은 빈 본문에서 예외를 던져
  // 배정 등 return=minimal POST/PATCH 가 실패한 것처럼 보이는 버그를 유발함 → 빈 본문은 null 반환.
  const text = await res.text();
  if (!text) return null;
  try { return JSON.parse(text); } catch(e){ return null; }
}

// 인증 GET + 401/403(토큰 만료)이면 세션 갱신 후 1회 재시도.
// 실패(네트워크/여전히 인증 오류)면 null 을 돌려 "빈 데이터"와 구분되게 함.
async function authGet(path) {
  const doFetch = () => fetch(SB_URL + path, { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken } });
  let res;
  try { res = await doFetch(); } catch(e) { return null; }
  if (res.status === 401 || res.status === 403) {
    if (await refreshSession()) { try { res = await doFetch(); } catch(e) { return null; } }
  }
  if (!res.ok) return null;
  try { return await res.json(); } catch(e) { return null; }
}

async function refreshSession() {
  try {
    const session = JSON.parse(localStorage.getItem('imvoca.session') || '{}');
    const refreshToken = session.refresh_token;
    if (!refreshToken) return false;
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ refresh_token: refreshToken })
    });
    const data = await res.json();
    if (data.access_token) {
      _authToken = data.access_token;
      localStorage.setItem('imvoca.session', JSON.stringify(data));
      return true;
    }
    return false;
  } catch(e) { return false; }
}

// 토큰 자동 갱신: 만료(약 1시간) 전에 미리 갱신 + 앱으로 돌아올 때 갱신
let _lastTokenRefresh = Date.now();
async function autoRefreshToken() {
  if (!_authToken) return;
  const ok = await refreshSession();
  if (ok) _lastTokenRefresh = Date.now();
}
setInterval(autoRefreshToken, 45 * 60 * 1000); // 45분마다
document.addEventListener('visibilitychange', async () => {
  // 다시 화면을 볼 때, 5분 이상 백그라운드였으면 토큰 갱신 + 화면 새로고침.
  // (오래 켜둔 뒤 돌아오면 토큰 만료로 복습/명예의전당이 빈 화면처럼 보이던 문제 방지)
  if (document.visibilityState === 'visible' && _authToken && (Date.now() - _lastTokenRefresh > 5 * 60 * 1000)) {
    await autoRefreshToken();
    if (typeof flushPending === 'function') flushPending(); // 밀린 학습/테스트 기록 재전송
    // 갱신 후, 학습/퀴즈 중이 아니면 현재 화면을 다시 그려 데이터를 새로 불러옴
    try {
      const _r = (typeof stack !== 'undefined' && stack.length) ? stack[stack.length-1] : null;
      const _busy = ['study-cards', 'quiz', 'study-done'];
      if (currentUser && _r && !_busy.includes(_r.name)) {
        window._hallData = null; // 명예의 전당 캐시 무효화 → 재요청
        if (typeof render === 'function') render();
      }
    } catch(e) {}
  } else if (document.visibilityState === 'visible' && _authToken && typeof flushPending === 'function') {
    flushPending(); // 짧게 나갔다 와도 밀린 기록이 있으면 전송
  }
});
// 인터넷이 다시 연결되면 밀린 기록 재전송
window.addEventListener('online', () => { if (typeof flushPending === 'function') flushPending(); });
// 주기적으로도 재전송 시도(2분마다) — 백그라운드에서 조용히 밀린 진도 동기화

// ── 페이지 정렬 함수 ──
function pageSort(a, b) {
  const ROMAN = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx',
                 'xxi','xxii','xxiii','xxiv','xxv','intro','preface','prologue','foreword','appendix'];
  const aStr = String(a.num).toLowerCase().trim();
  const bStr = String(b.num).toLowerCase().trim();
  const aRoman = ROMAN.indexOf(aStr);
  const bRoman = ROMAN.indexOf(bStr);
  const aNum = parseInt(a.num);
  const bNum = parseInt(b.num);
  const aIsNum = !isNaN(aNum) && String(aNum) === String(a.num).trim();
  const bIsNum = !isNaN(bNum) && String(bNum) === String(b.num).trim();

  // 로마숫자/특수단어 → 맨 앞
  if (aRoman >= 0 && bRoman >= 0) return aRoman - bRoman;
  if (aRoman >= 0) return -1;
  if (bRoman >= 0) return 1;
  // 둘 다 숫자 → 숫자 순
  if (aIsNum && bIsNum) return aNum - bNum;
  // 숫자 → 문자 앞
  if (aIsNum) return -1;
  if (bIsNum) return 1;
  // 나머지("Day 1"·"Day 10" 등 숫자 포함 라벨)는 숫자 자연 정렬 (1,2,…,10,11 순)
  return aStr.localeCompare(bStr, undefined, { numeric: true, sensitivity: 'base' });
}

async function loadUserPlan() {
  try {
    const res = await fetch(SB_URL + `/rest/v1/members?id=eq.${currentUser.id}&select=plan,scan_count,stripe_customer_id,visit_count,org_id,org_role,org_status`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }
    });
    const data = await res.json();
    if (data[0]) {
      userPlan = data[0].plan || 'free';
      userScanCount = data[0].scan_count || 0;
      userDailyScanCount = data[0].daily_scan_count || 0;
      userDailyScanDate = data[0].daily_scan_date || null;
      userStripeId = data[0].stripe_customer_id || '';
      userOrgId = data[0].org_id || null;
      userOrgRole = data[0].org_role || null;
      userOrgStatus = data[0].org_status || null;
      if (userOrgRole === 'owner' || userOrgId) { await loadMyOrg(); }
      // 최종 접속 시각(last_seen_at)은 매번 갱신, 누적 접속수(visit_count)는 하루 1회만 증가
      const today = new Date().toISOString().slice(0,10);
      const isNewDay = localStorage.getItem('imvoca.lastVisitDay') !== today;
      const visitPatch = { last_seen_at: new Date().toISOString() };
      if (isNewDay) visitPatch.visit_count = (data[0].visit_count||0) + 1;
      sbFetch(`/rest/v1/members?id=eq.${currentUser.id}`, 'PATCH', visitPatch,
        true, { 'Prefer': 'return=representation' })
        .then(r => { if (isNewDay && Array.isArray(r) && r.length) localStorage.setItem('imvoca.lastVisitDay', today); })
        .catch(()=>{});
    }
  } catch(e) {}
}

let _reviewStatus = {};

async function loadReviewStatus(bookId) {
  if (_reviewStatusLoaded[bookId]) return; // 이미 불러왔으면 다시 안 함
  // 먼저 로컬 백업을 덮어 그림(서버 실패해도 학습한 점이 안 사라지게)
  _overlayLocalStudied();
  const data = await authGet(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=eq.${bookId}&select=page_num,completed`);
  if (!Array.isArray(data)) { console.error('[복습 상태 로드 실패]'); return; } // 실패 → loaded 플래그 안 세우고 다음에 재시도
  _reviewStatusLoaded[bookId] = true;
  let changed = false;
  data.forEach(r => {
    const key = bookId + '|' + r.page_num;
    const val = r.completed ? 'done' : 'doing';
    if (_reviewStatus[key] !== val) { _reviewStatus[key] = val; changed = true; }
  });
  // 실제로 새 상태가 생겼고, 지금 그 책 화면이면 한 번만 다시 그림
  if (changed && stack[stack.length-1]?.name === 'book' && stack[stack.length-1]?.bookId === bookId) render();
}

async function deletePageWord(bookId, pageNum, wordIdx) {
  if (isAssignedReadonly(bookId)) { toast(userNativeLang==='ko'?'과제 책은 편집할 수 없어요':'Assigned books are read-only'); return; }
  const book = findBook(bookId);
  const page = book ? findPage(book, pageNum) : null;
  if (!page) return;
  const word = page.words[wordIdx];
  if (!word) return;
  const ko = userNativeLang === 'ko';
  if (!confirm(ko ? `"${word.en}" 단어를 삭제할까요?` : `Delete "${word.en}"?`)) return;
  try {
    if (word.id) {
      await fetch(SB_URL + `/rest/v1/voca_words?id=eq.${word.id}`, {
        method: 'DELETE',
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }
      });
    }
page.words.splice(wordIdx, 1);
    updateTotalWords(true);   // 삭제: 마지막 단어면 0 기록 허용
    renderKeepScroll();
    toast(ko ? '삭제됐어요' : 'Deleted');
  } catch(e) { toast(ko ? '삭제 실패' : 'Delete failed'); }
}

const NOTICE_EMOJIS = ['👍','❤️','🎉','👏','🔥'];
let _noticeReactions = {}; // { noticeId: { emoji: { count, mine } } }

async function loadNoticeReactions(noticeIds) {
  _noticeReactions = {};
  const ids = (noticeIds||[]).filter(x => x!=null);
  if (!ids.length) return;
  try {
    const inList = ids.map(id => `"${String(id)}"`).join(',');
    const res = await fetch(SB_URL + `/rest/v1/voca_notice_reactions?notice_id=in.(${inList})&select=notice_id,user_id,emoji`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }
    });
    const rows = await res.json();
    if (!Array.isArray(rows)) return;
    rows.forEach(r => {
      const nid = String(r.notice_id);
      (_noticeReactions[nid] = _noticeReactions[nid] || {});
      const slot = (_noticeReactions[nid][r.emoji] = _noticeReactions[nid][r.emoji] || { count:0, mine:false });
      slot.count++;
      if (r.user_id === currentUser?.id) slot.mine = true;
    });
  } catch(e) {}
}

function reactionBar(notice) {
  const nid = String(notice.id);
  const data = _noticeReactions[nid] || {};
  return `<div class="notice-reactions" data-nid="${nid}" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;" onclick="event.stopPropagation()">
    ${NOTICE_EMOJIS.map(em => {
      const r = data[em] || { count:0, mine:false };
      return `<button onclick="toggleReaction('${nid}','${em}')" style="display:inline-flex;align-items:center;gap:3px;border:1px solid ${r.mine?'var(--accent)':'var(--ink-12)'};background:${r.mine?'var(--gold-bg)':'var(--bg-card)'};border-radius:99px;padding:3px 8px;font-size:10px;cursor:pointer;font-family:var(--font-body);line-height:1;">${em}${r.count>0?`<span style="font-size:10px;font-weight:700;color:${r.mine?'var(--accent)':'var(--ink-60)'};">${r.count}</span>`:''}</button>`;
    }).join('')}
  </div>`;
}

function updateReactionBarUI(nid) {
  const bar = document.querySelector(`.notice-reactions[data-nid="${nid}"]`);
  if (bar) bar.outerHTML = reactionBar({ id: nid });
}

async function toggleReaction(noticeId, emoji) {
  if (!currentUser) { toast(userNativeLang==='ko'?'로그인이 필요해요':'Please log in'); return; }
  const nid = String(noticeId);
  (_noticeReactions[nid] = _noticeReactions[nid] || {});
  const r = (_noticeReactions[nid][emoji] = _noticeReactions[nid][emoji] || { count:0, mine:false });
  const wasMine = r.mine;
  r.mine = !wasMine; r.count = Math.max(0, r.count + (wasMine ? -1 : 1));
  updateReactionBarUI(nid);
  const baseHdr = () => ({ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken });
  const doFetch = async (path, opts) => {
    let res = await fetch(SB_URL + path, opts);
    if ((res.status===401||res.status===403) && await refreshSession()) { opts.headers.Authorization = 'Bearer '+_authToken; res = await fetch(SB_URL + path, opts); }
    return res;
  };
  try {
    let res;
    if (wasMine) {
      res = await doFetch(`/rest/v1/voca_notice_reactions?notice_id=eq.${encodeURIComponent(nid)}&user_id=eq.${currentUser.id}&emoji=eq.${encodeURIComponent(emoji)}`, { method:'DELETE', headers: baseHdr() });
    } else {
      res = await doFetch('/rest/v1/voca_notice_reactions', { method:'POST', headers: { ...baseHdr(), 'Prefer':'return=minimal' }, body: JSON.stringify({ notice_id: nid, user_id: currentUser.id, emoji }) });
    }
    if (!res.ok) throw new Error('reaction write failed');
  } catch(e) {
    r.mine = wasMine; r.count = Math.max(0, r.count + (wasMine ? 1 : -1)); updateReactionBarUI(nid);
    toast(userNativeLang==='ko'?'잠시 후 다시 시도해주세요':'Please try again');
  }
}

function checkRecoveryToken() {
  // hash와 search 둘 다 확인
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const raw = hash.startsWith('#') ? hash.substring(1) : hash;

  if (!raw) return false;

  const params = new URLSearchParams(raw);
  const type = params.get('type');
  const error = params.get('error');

  // 에러 감지
  if (error) {
    history.replaceState(null, '', window.location.pathname);
    setTimeout(() => {
      renderLogin();
      toast('⚠️ 링크가 만료됐어요. 비밀번호 찾기를 다시 시도해주세요.');
    }, 300);
    return true;
  }

  // recovery 타입 확인
  if (type !== 'recovery') return false;

  const accessToken = params.get('access_token');
  if (!accessToken) return false;

  // URL 깔끔하게
  history.replaceState(null, '', window.location.pathname);
  _authToken = accessToken;
  showNewPasswordForm();
  return true;
}

function jsq(s){ if(s==null) return ''; return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\r\n]+/g,' '); }

}

function fmtSeenShort(iso){ try{ const d=new Date(iso); if(isNaN(d)) return '-'; return (d.getMonth()+1)+'.'+d.getDate(); }catch(e){ return '-'; } }

async function loadOrgStudents(){
  if (!userOrg) return;
  // 학생 목록 컨테이너(org-students)는 '학생·관리자' 탭에만 있음. 대시보드 탭에는 없지만
  // 상단 통계(학생/승인대기/관리자/월예상)는 채워야 하므로, box 유무와 무관하게 진행한다.
  const box = document.getElementById('org-students');
  const ko = userNativeLang==='ko';
  try {
    const list = await sbFetch(`/rest/v1/members?org_id=eq.${userOrg.id}&org_role=in.(student,owner)&select=id,name,email,total_words,scan_count,last_seen_at,visit_count,org_status,org_role,teacher_id&order=total_words.desc`);
    if (!Array.isArray(list)) { if (box) box.innerHTML = `<div class="muted" style="font-size:13px;text-align:center;padding:16px;">${ko?'학생 정보를 불러오지 못했어요':'Failed to load'}</div>`; return; }
    // 복습 완료 집계 (RLS 있으면 동작, 없으면 생략)
    let reviewByUser = {};
    const ids = list.map(m=>m.id);
    if (ids.length) {
      try {
        const rv = await sbFetch(`/rest/v1/voca_review?user_id=in.(${ids.join(',')})&select=user_id,completed`);
        if (Array.isArray(rv)) rv.forEach(r=>{ if(!reviewByUser[r.user_id]) reviewByUser[r.user_id]={done:0,total:0}; reviewByUser[r.user_id].total++; if(r.completed) reviewByUser[r.user_id].done++; });
      } catch(e){}
    }
    window._orgStudentsList = list;
    if (box) box.innerHTML = renderOrgStudentsHTML(list, reviewByUser);
    const _appr = list.filter(m=>(m.org_status||'')==='approved' && m.id!==(userOrg&&userOrg.owner_id)).length;
    const _est = document.getElementById('org-bill-est');
    if (_est) _est.textContent = '$'+(_appr*2.99).toFixed(2)+(ko?` (선생님·학생 ${_appr}명)`:` (${_appr})`);
    // 히어로 통계 스트립 채우기
    const nStudents = list.filter(m=>m.org_role==='student' && (m.org_status||'')==='approved').length;
    const nPending  = list.filter(m=>m.org_role==='student' && (m.org_status||'')==='pending').length;
    const nAdmins   = list.filter(m=>m.org_role==='owner').length;
    const setStat = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent=val; };
    setStat('org-stat-students', nStudents);
    setStat('org-stat-pending', nPending);
    setStat('org-stat-admins', nAdmins);
    setStat('org-stat-bill', '$'+(_appr*2.99).toFixed(2));
  } catch(e){ if (box) box.innerHTML = `<div class="muted" style="font-size:13px;text-align:center;padding:16px;">${ko?'학생 정보를 불러오지 못했어요':'Failed to load'}</div>`; }
}

// ===== 오늘의 리포트 (실시간 — voca_activity 오늘치로 즉시 계산. cron·9시 안 기다림) =====
async function loadDailyReport(){
  const box = document.getElementById('org-daily-report');
  if (!box || !userOrg) return;
  const ko = userNativeLang==='ko';
  const myId = currentUser && currentUser.id;
  const isPrimary = !!(userOrg && userOrg.owner_id && myId && userOrg.owner_id===myId);
  try {
    const kstToday = new Date(new Date().getTime()+9*3600*1000).toISOString().slice(0,10);
    const [acts, studs] = await Promise.all([
      sbFetch(`/rest/v1/voca_activity?org_id=eq.${userOrg.id}&day=eq.${kstToday}&select=user_id,kind`),
      sbFetch(`/rest/v1/members?org_id=eq.${userOrg.id}&org_role=eq.student&org_status=eq.approved&select=id,name,email,teacher_id&order=name`)
    ]);
    let students = Array.isArray(studs)?studs:[];
    if (!isPrimary) students = students.filter(s=>s.teacher_id===myId);
    const byUser = {};
    (Array.isArray(acts)?acts:[]).forEach(a=>{ const u=(byUser[a.user_id]=byUser[a.user_id]||{study:0,review:0}); if(a.kind==='review')u.review++; else u.study++; });
    box.innerHTML = renderDailyLiveHTML(students, byUser, kstToday);
  } catch(e){
    box.innerHTML = `<div style="background:var(--bg-card);border:1px solid var(--ink-07);border-radius:14px;padding:16px;margin-bottom:16px;"><div class="muted" style="font-size:12px;">${ko?'리포트를 불러오지 못했어요':'Failed to load report'}</div></div>`;
  }
}
function renderDailyLiveHTML(students, byUser, dateStr){
  const ko = userNativeLang==='ko';
  const d=(dateStr||'').split('-'); const dLabel=d.length===3?(ko?`${+d[1]}월 ${+d[2]}일`:`${+d[1]}/${+d[2]}`):dateStr;
  const N=students.length;
  const active=students.filter(s=>byUser[s.id]);
  const idle=students.filter(s=>!byUser[s.id]);
  const totNew=Object.values(byUser).reduce((a,u)=>a+u.study,0);
  const totRev=Object.values(byUser).reduce((a,u)=>a+u.review,0);
  const tile=(v,l,c)=>`<div style="flex:1;background:var(--bg-input);border-radius:10px;padding:9px 4px;text-align:center;"><div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:${c||'var(--ink-100)'};line-height:1;">${v}</div><div class="muted" style="font-size:10px;margin-top:4px;">${l}</div></div>`;
  const sorted=[...idle, ...active.slice().sort((a,b)=>(byUser[b.id].review+byUser[b.id].study)-(byUser[a.id].review+byUser[a.id].study))];
  const rows = N ? sorted.map(s=>{
    const u=byUser[s.id];
    const right = u ? `<span style="font-size:11px;color:#1c3553;font-weight:600;">📘 ${u.study} · 🔁 ${u.review}</span>`
                    : `<span style="font-size:11px;color:#c0392b;">${ko?'오늘 안 함':'idle'}</span>`;
    return `<div onclick="openStudentDetail('${jsq(s.id)}')" style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ink-07);cursor:pointer;"><div style="flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink-100);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.name||s.email||'학생')}</div>${right}</div>`;
  }).join('') : `<div class="muted" style="font-size:12px;padding:8px 0;">${ko?'승인된 학생이 없어요':'No students'}</div>`;
  return `<div style="background:var(--bg-card);border:1px solid var(--ink-07);border-radius:14px;padding:16px;margin-bottom:16px;">
    <div style="font-size:15px;font-weight:700;color:var(--ink-100);">📊 ${ko?'오늘의 리포트':'Today'} <span class="muted" style="font-weight:400;font-size:12px;">· ${dLabel} ${ko?'· 실시간':'· live'}</span></div>
    <div style="display:flex;gap:7px;margin:12px 0;">
      ${tile(active.length+'/'+N, ko?'오늘 공부':'Studied', active.length?'#1c7c3c':null)}
      ${tile(totNew, ko?'새 단어(P)':'New')}
      ${tile(totRev, ko?'복습(P)':'Review')}
      ${tile(idle.length, ko?'안 함':'Idle', idle.length?'#c0392b':null)}
    </div>
    ${rows}
  </div>`;
}
function renderDailyReportHTML(day, dateStr, isPrimary){
  const ko = userNativeLang==='ko';
  const d = (dateStr||'').split('-');
  const dLabel = d.length===3 ? (ko?`${+d[1]}월 ${+d[2]}일`:`${+d[1]}/${+d[2]}`) : dateStr;
  if (!day.length){
    return `<div style="background:var(--bg-card);border:1px solid var(--ink-07);border-radius:14px;padding:16px;margin-bottom:16px;">
      <div style="font-size:15px;font-weight:700;color:var(--ink-100);margin-bottom:4px;">📊 ${ko?'오늘의 리포트':'Daily report'} <span class="muted" style="font-weight:400;font-size:12px;">· ${dLabel}</span></div>
      <div class="muted" style="font-size:12px;line-height:1.6;">${ko?'담당 학생이 없어요. 학생 목록에서 \'내 담당\'으로 지정하면 여기에 나와요.':'No students assigned to you yet.'}</div></div>`;
  }
  // 걱정 순 정렬: 밀린 복습 많은 순 → 오늘 안 한 학생 위로
  const rows = day.slice().sort((a,b)=>
    (b.reviews_overdue-a.reviews_overdue) || ((a.studied_today?1:0)-(b.studied_today?1:0)) || (b.reviews_done_today-a.reviews_done_today));
  const n = rows.length;
  const studied = rows.filter(r=>r.studied_today).length;
  const notStudied = n - studied;
  const overdueStu = rows.filter(r=>r.reviews_overdue>0).length;
  const pill = (bg,c,txt)=>`<span style="background:${bg};color:${c};font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;">${txt}</span>`;
  const summary = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;">
    ${pill('#e6f4ea','#1c7c3c',(ko?'복습함':'Studied')+` ${studied}`)}
    ${notStudied?pill('#fdecec','#c0392b',(ko?'오늘 안 함':'Idle')+` ${notStudied}`):''}
    ${overdueStu?pill('#fff4e0','#b5720a',(ko?'밀린 복습':'Overdue')+` ${overdueStu}`):''}
  </div>`;
  const card = (r)=>{
    const done = r.studied_today;
    const badges = [];
    badges.push(`<span style="color:${done?'#1c7c3c':'#c0392b'};font-weight:700;">${done?(ko?'✅ 공부함':'✅ Active'):(ko?'⚠️ 오늘 안 함':'⚠️ Idle')}</span>`);
    if (r.reviews_done_today>0) badges.push(`🔁 ${ko?'복습':'Rev'} ${r.reviews_done_today}`);
    if (r.reviews_overdue>0) badges.push(`<span style="color:#c0392b;font-weight:700;">⛔ ${ko?'밀림':'Overdue'} ${r.reviews_overdue}</span>`);
    else if (r.reviews_due_today>0) badges.push(`<span style="color:#b5720a;">📌 ${ko?'오늘 예정':'Due'} ${r.reviews_due_today}</span>`);
    if (r.assign_total>0) badges.push(`📝 ${ko?'과제':'Task'} ${r.assign_done}/${r.assign_total}`);
    if (r.personal_pages>0) badges.push(`<span class="muted">📖 ${ko?'개인':'Own'} ${r.personal_pages}</span>`);
    if (r.new_words_today>0) badges.push(`<span class="muted">＋${r.new_words_today}${ko?'단어':'w'}</span>`);
    if (r.streak_days>1) badges.push(`🔥 ${r.streak_days}${ko?'일':'d'}`);
    return `<div onclick="openStudentDetail('${r.student_id}')" style="background:var(--bg-card);border:1px solid ${r.reviews_overdue>0?'#f0c9c0':(done?'var(--ink-07)':'#f2ddc0')};border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;">
      <div style="font-weight:600;color:var(--ink-100);font-size:14px;margin-bottom:5px;">${esc(r.student_name)||(ko?'학생':'Student')}</div>
      <div style="display:flex;gap:5px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-60);">${badges.join('')}</div>
    </div>`;
  };
  return `<div style="background:var(--bg-card);border:1px solid var(--ink-07);border-radius:14px;padding:16px;margin-bottom:16px;">
    <div style="font-size:15px;font-weight:700;color:var(--ink-100);">📊 ${ko?'오늘의 리포트':'Daily report'} <span class="muted" style="font-weight:400;font-size:12px;">· ${dLabel} · ${ko?`학생 ${n}명`:`${n}`}</span></div>
    <div class="muted" style="font-size:11.5px;line-height:1.5;margin-top:3px;">${ko?'매일 밤 9시 자동 집계. 걱정되는 학생(밀린 복습·오늘 안 함) 순으로 정렬돼요.':'Auto at 9pm nightly, sorted by concern.'}</div>
    ${summary}
    ${rows.map(card).join('')}
  </div>`;
}
function teacherSelectHTML(studentId, currentTid, owners){
  const ko = userNativeLang==='ko';
  const opts = [`<option value="">${ko?'담당 미지정':'No teacher'}</option>`].concat(
    owners.map(o=>`<option value="${esc(o.id)}" ${o.id===currentTid?'selected':''}>${esc(o.name||o.email||(ko?'선생님':'Teacher'))}</option>`)
  ).join('');
  return `<select onclick="event.stopPropagation();" onchange="event.stopPropagation();setStudentTeacher('${jsq(studentId)}', this.value)" style="background:var(--bg-input);border:1px solid var(--ink-12);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--ink-100);font-family:var(--font-body);max-width:120px;flex-shrink:0;">${opts}</select>`;
}
async function setStudentTeacher(id, tid){
  const ko = userNativeLang==='ko';
  const myId = currentUser && currentUser.id;
  // 주 관리자: 아무 선생님으로나 지정 가능. 공동 관리자: 본인 담당으로 지정(claim)/본인 담당 해제만.
  if (!orgIsPrimary()) {
    const cur = (window._orgStudentsList||[]).find(x=>x.id===id);
    const claimSelf = (tid===myId);
    const releaseOwn = ((!tid) && cur && cur.teacher_id===myId);
    if (!(orgIsAdmin() && (claimSelf || releaseOwn))) {
      toast(ko?'공동 관리자는 본인 담당으로만 지정/해제할 수 있어요':'Co-admins can only assign/release their own students'); return;
    }
  }
  try {
    await sbFetch(`/rest/v1/members?id=eq.${id}`, 'PATCH', { teacher_id: tid||null }, true, {'Prefer':'return=representation'});
    toast(tid ? (ko?'담당 선생님을 지정했어요':'Teacher assigned') : (ko?'담당을 해제했어요':'Unassigned'));
    loadOrgStudents();
  } catch(e){ toast(ko?'지정 실패':'Failed'); }
}
// 공동 관리자: 학생을 내 담당으로 가져오기(이미 다른 선생님 담당이면 확인)
function claimStudent(id){
  const ko = userNativeLang==='ko';
  const cur = (window._orgStudentsList||[]).find(x=>x.id===id);
  if (cur && cur.teacher_id && cur.teacher_id!==(currentUser&&currentUser.id)) {
    if (!confirm(ko?'이 학생은 이미 다른 선생님 담당이에요.\n내 담당으로 가져올까요?':'This student is assigned to another teacher. Claim to yourself?')) return;
  }
  setStudentTeacher(id, currentUser && currentUser.id);
}
function releaseStudent(id){ setStudentTeacher(id, ''); }
function renderOrgStudentsHTML(list, reviewByUser){
  const ko = userNativeLang==='ko';
  const myId = currentUser && currentUser.id;
  const isPrimary = !!(userOrg && userOrg.owner_id && myId && userOrg.owner_id===myId);
  const owners = list.filter(m=>m.org_role==='owner');
  const teacherName = (tid)=>{ const t=owners.find(o=>o.id===tid); return t? (t.name||t.email||(ko?'선생님':'Teacher')) : null; };
  const studentRow = (m,i)=>{
    const rv = reviewByUser[m.id];
    const rvTxt = rv && rv.total ? `${rv.done}/${rv.total}` : '-';
    const seen = m.last_seen_at ? fmtSeenShort(m.last_seen_at) : '-';
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
    const tname = teacherName(m.teacher_id);
    return `
      <div onclick="openStudentDetail('${m.id}')" style="display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1px solid var(--ink-07);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;" title="${ko?'학생 상세 보기':'View detail'}">
        <div style="width:26px;text-align:center;font-weight:700;color:var(--ink-60);font-size:14px;flex-shrink:0;">${medal}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;color:var(--ink-100);font-size:14px;">${esc(m.name)||(ko?'이름없음':'No name')}</div>
          <div class="muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.email?`✉️ ${esc(m.email)}`:`<span style="color:var(--ink-40);">${ko?'이메일 없음':'No email'}</span>`}</div>
          <div class="muted" style="font-size:11px;">${ko?'단어':'Words'} ${(m.total_words||0).toLocaleString()} · ${ko?'복습':'Rev'} ${rvTxt} · 📅 ${seen}${m.visit_count?` · 🔁 ${m.visit_count}`:''}${tname?` · 👩‍🏫 ${esc(tname)}`:(isPrimary?` · <span style="color:#c0392b;">${ko?'담당 미지정':'No teacher'}</span>`:'')}</div>
        </div>
        ${isPrimary?teacherSelectHTML(m.id, m.teacher_id, owners):''}
        ${isPrimary?`<button onclick="event.stopPropagation();promoteStudentToCoAdmin('${m.id}')" style="background:var(--gold-bg);border:1px solid var(--ink-12);border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;color:var(--accent);font-weight:600;font-family:var(--font-body);flex-shrink:0;white-space:nowrap;" title="${ko?'이 학생을 공동 관리자로 임명':'Make co-admin'}">${ko?'🛡️ 공동관리자':'🛡️ Co-admin'}</button>`:''}
        ${isPrimary?`<button onclick="event.stopPropagation();removeStudent('${m.id}')" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--ink-40);padding:4px;flex-shrink:0;" title="${ko?'내보내기':'Remove'}">✕</button>`:''}
        ${(!isPrimary && m.org_role==='student') ? (m.teacher_id===myId
            ? `<button onclick="event.stopPropagation();releaseStudent('${m.id}')" style="background:var(--bg-input);border:1px solid var(--ink-12);border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer;color:var(--ink-60);font-family:var(--font-body);flex-shrink:0;">${ko?'담당 해제':'Release'}</button>`
            : `<button onclick="event.stopPropagation();claimStudent('${m.id}')" style="background:var(--gold-bg);border:1px solid var(--ink-12);border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer;color:var(--accent);font-weight:600;font-family:var(--font-body);flex-shrink:0;">${ko?'내 담당':'Claim'}</button>`) : ''}
      </div>`;
  };

  // ===== 공동 관리자(선생님): 내 담당 학생 + 단체 전체 학생(읽기전용) =====
  if (!isPrimary) {
    const isAppr = m=>(m.org_status||'')==='approved' && m.org_role==='student';
    const mine = list.filter(m=>isAppr(m) && m.teacher_id===myId)
                     .sort((a,b)=>(b.total_words||0)-(a.total_words||0));
    const all = list.filter(isAppr).sort((a,b)=>(b.total_words||0)-(a.total_words||0));
    let h = `<div style="font-size:14px;font-weight:700;color:var(--ink-100);margin:4px 0 8px;">👥 ${ko?'내 담당 학생':'My students'} (${mine.length})</div>`;
    if (!mine.length) h += `<div class="muted" style="font-size:13px;text-align:center;padding:14px;line-height:1.6;">${ko?'아직 배정된 담당 학생이 없어요.<br>주 관리자에게 담당 학생 지정을 요청하세요.':'No students assigned to you yet.'}</div>`;

    else h += all.map((m,i)=>studentRow(m,i)).join('');
    return h;
  }

  // ===== 주 관리자: 전체 =====
  const pending = list.filter(m=>(m.org_status||'')==='pending' && m.org_role!=='owner');
  const approved = list.filter(m=>(m.org_status||'')==='approved' && m.org_role!=='owner');
  let html = '';
  // 🛡️ 관리자 섹션 (주/공동)
  html += `<div style="font-size:14px;font-weight:700;color:var(--ink-100);margin:4px 0 8px;">🛡️ ${ko?'관리자':'Admins'} (${owners.length})</div>`;
  html += owners.map(m=>{
    const isPrim = userOrg && m.id===userOrg.owner_id;
    const tag = isPrim ? (ko?'주 관리자':'Primary') : (ko?'공동 관리자':'Co-admin');
    const showDemote = isPrimary && !isPrim;
    return `<div style="display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--ink-07);border-radius:12px;padding:12px 14px;margin-bottom:8px;">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;color:var(--ink-100);font-size:14px;">${esc(m.name)||(ko?'이름없음':'No name')}${m.id===myId?` <span class="muted" style="font-size:11px;">(${ko?'나':'me'})</span>`:''}</div>
        <div class="muted" style="font-size:11px;">${isPrim?'👑 ':''}${tag} · ${esc(m.email||'')}</div>
      </div>
      ${showDemote?`<button onclick="demoteCoAdmin('${m.id}')" style="background:var(--bg-input);color:var(--ink-60);border:1px solid var(--ink-12);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font-body);flex-shrink:0;">${ko?'해지':'Remove'}</button>`:''}
    </div>`;
  }).join('');
  if (pending.length){
    html += `<div style="font-size:14px;font-weight:700;color:var(--ink-100);margin:4px 0 8px;">⏳ ${ko?'승인 대기 학생':'Pending'} (${pending.length})</div>`;
    html += pending.map(m=>`
      <div style="display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--ink-07);border-radius:12px;padding:12px 14px;margin-bottom:8px;">
        <div style="flex:1;min-width:0;"><div style="font-weight:600;color:var(--ink-100);font-size:14px;">${esc(m.name)||(ko?'이름없음':'No name')}</div><div class="muted" style="font-size:11px;">${esc(m.email||'')}</div></div>
        <button onclick="setStudentStatus('${m.id}','approved')" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-body);">${ko?'승인':'OK'}</button>
        <button onclick="setStudentStatus('${m.id}','rejected')" style="background:var(--bg-input);color:var(--ink-60);border:1px solid var(--ink-12);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;font-family:var(--font-body);">${ko?'거절':'No'}</button>
      </div>`).join('');
  }
  html += `<div style="font-size:14px;font-weight:700;color:var(--ink-100);margin:14px 0 8px;">👥 ${ko?'학생':'Students'} (${approved.length})</div>`;
  if (!approved.length){
    html += `<div class="muted" style="font-size:13px;text-align:center;padding:16px;">${ko?'아직 승인된 학생이 없어요. 학생들에게 코드를 알려주세요.':'No approved students yet.'}</div>`;
  } else {
    html += approved.map((m,i)=>studentRow(m,i)).join('');
  }
  return html;
}

async function setStudentStatus(id, status){
  try{
    await sbFetch(`/rest/v1/members?id=eq.${id}`, 'PATCH', { org_status: status }, true, {'Prefer':'return=representation'});
    toast(status==='approved'?(userNativeLang==='ko'?'학생을 승인했어요':'Approved'):(userNativeLang==='ko'?'거절했어요':'Rejected'));
    syncOrgSeats(); // 승인 인원 변동 → 구독 좌석수 동기화(중도 가입자 일할 청구)
    loadOrgStudents();
  }catch(e){ toast(userNativeLang==='ko'?'변경 실패, 잠시 후 다시':'Failed'); }
}

// 단체 구독 좌석수 동기화: 승인 학생/공동관리자 수가 바뀌면 Stripe quantity 를 맞춘다.
// 결제중(billing_active)일 때만 의미가 있으며, 미결제 시 서버에서 무시한다. (fire-and-forget)
async function syncOrgSeats(){
  try{
    if (!userOrg || !userOrg.id || !isOrgBillingActive()) return;
    await fetch(SB_URL+'/functions/v1/sync-org-seats', {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+_authToken},
      body:JSON.stringify({ org_id: userOrg.id })
    });
  }catch(e){ console.warn('[seat sync]', e); }
}

async function promoteStudentToCoAdmin(id){

  if(!confirm(ko?'이 학생을 공동 관리자로 임명할까요?\n\n학생 승인·관리 권한을 함께 갖게 돼요. (단어장은 그대로 사용 가능)':'Make this student a co-admin?')) return;

  }catch(e){ toast(ko?'임명 실패 (주 관리자만 가능)':'Failed'); }

async function demoteCoAdmin(id){

async function renameOrg(){
  const ko = userNativeLang==='ko';
  if (!userOrg) return;
  const cur = userOrg.name || '';
  const name = prompt(ko?'단체 이름을 입력하세요':'Enter organization name', cur);
  if (name===null) return;
  const trimmed = name.trim();
  if (!trimmed) { toast(ko?'이름을 입력해주세요':'Please enter a name'); return; }
  if (trimmed === cur) return;
  try{
    const res = await sbFetch(`/rest/v1/orgs?id=eq.${userOrg.id}`, 'PATCH', { name: trimmed }, true, {'Prefer':'return=representation'});
    if (!res || (Array.isArray(res) && res.length===0)) { toast(ko?'변경 실패 (권한 확인)':'Update failed'); return; }
    userOrg.name = trimmed;
    toast(ko?'단체 이름을 변경했어요':'Organization renamed');
    render();
  }catch(e){ toast((ko?'변경 실패: ':'Failed: ')+e.message); }
}

async function regenerateOrgCode(){
  if (!userOrg) return;
  if (!confirm(userNativeLang==='ko'?'새 코드를 발급할까요?\n기존 코드로는 더 이상 가입할 수 없어요. (이미 가입한 학생은 그대로예요)':'Regenerate code? The old code will stop working.')) return;
  const code = 'IMV-' + Math.random().toString(36).substring(2,7).toUpperCase();
  try {
    const r = await sbFetch(`/rest/v1/orgs?id=eq.${userOrg.id}`, 'PATCH', { code }, true, {'Prefer':'return=representation'});
    if (!(Array.isArray(r) && r[0])) { toast(userNativeLang==='ko'?'재발급 실패':'Failed'); return; }
    userOrg.code = code;
    toast(userNativeLang==='ko'?'✅ 새 코드가 발급됐어요':'New code issued');
    stack=[{name:'org-admin'}]; render();
  } catch(e){ toast('오류: '+e.message); }
}

async function removeStudent(id){
  if (!confirm(userNativeLang==='ko'?'이 학생을 단체에서 내보낼까요?\n(학생 계정과 단어는 유지되고, 단체 소속만 해제돼요)':'Remove this student from the org?')) return;
  try {
    await sbFetch(`/rest/v1/members?id=eq.${id}`, 'PATCH', { org_id: null, org_role: null, org_status: 'approved' }, true, {'Prefer':'return=representation'});
    toast(userNativeLang==='ko'?'학생을 내보냈어요':'Removed');
    syncOrgSeats(); // 인원 감소 → 구독 좌석수 동기화(다음 청구일에 반영)
    loadOrgStudents();
  } catch(e){ toast(userNativeLang==='ko'?'실패':'Failed'); }
}

    const revMap = {}; reviews.forEach(r=>{ revMap[r.book_id+'|'+r.page_num] = r.completed?'done':'doing'; });
    const list = Array.isArray(books)?books:[];
    const totalWords = list.reduce((n,b)=>n+(b.voca_pages||[]).reduce((mm,p)=>mm+(p.voca_words||[]).length,0),0);
    let bodyHtml;
    if (!list.length) bodyHtml = `<div style="text-align:center;color:var(--ink-45);font-size:12.5px;padding:18px;">${ko?'학생이 직접 등록한 단어장은 아직 없어요':'No personal books yet'}</div>`;
    else bodyHtml = list.map(b=>{

      return `

          <div style="display:flex;flex-wrap:wrap;gap:4px;">
            ${pages.map(p=>{ const st=revMap[b.id+'|'+p.page_num]; const c= st==='done'?'#1c3553': st==='doing'?'#e23d3d':'var(--ink-12)'; const tc= st?'#fff':'var(--ink-60)'; return `<span style="font-size:9px;padding:2px 6px;border-radius:99px;background:${c};color:${tc};">${esc(String(p.page_num))}·${(p.voca_words||[]).length}</span>`; }).join('')}

        const byDay = {};
        av.forEach(r=>{ const d=r.day; if(!byDay[d]) byDay[d]={study:[],review:[]}; const isRev=r.kind==='review';
          const lbl = pgLabel(r.page_num) + (isRev && r.step ? (ko?` (${r.step}회차)`:` (R${r.step})`) : '');
          (isRev?byDay[d].review:byDay[d].study).push({title:(bookTitle[r.book_id]||(ko?'단어장':'Book')), page:lbl}); });

          return `<div style="border:1px solid var(--ink-07);border-radius:10px;padding:10px 12px;margin-bottom:6px;">
            <div style="font-size:12px;font-weight:700;color:var(--ink-100);margin-bottom:6px;">${esc(String(d).slice(5))}</div>

        <div style="min-width:0;"><div style="font-family:var(--font-serif-ko);font-size:18px;font-weight:700;color:var(--ink-100);">👤 ${esc(name||'')}</div>${email?`<div class="muted" style="font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">✉️ ${esc(email)}</div>`:''}</div>

      ${orgIsAdmin()?`<button onclick="assignBooksToStudent('${jsq(id)}','${jsq(name||'')}')" style="width:100%;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;font-family:var(--font-body);cursor:pointer;margin-bottom:14px;">📚 ${ko?'이 학생에게 단어장 배정':'Assign wordbooks'}</button>`:''}
      ${assignedHtml}
      ${activityHtml}
      ${list.length?`<div style="font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--ink-60);margin:14px 2px 8px;">📖 ${ko?'개인 단어장':'Personal books'} (${list.length})</div>`:''}
      ${bodyHtml}`;
  } catch(e){
    card.innerHTML = `<div style="text-align:center;color:var(--ink-45);font-size:13px;padding:24px;">${ko?'불러오지 못했어요 (권한 정책 확인)':'Failed to load'}</div><div style="text-align:center;"><button onclick="document.getElementById('student-detail-modal').remove()" style="margin-top:10px;background:var(--bg-input);border:1px solid var(--ink-12);border-radius:8px;padding:8px 16px;cursor:pointer;font-family:var(--font-body);">${ko?'닫기':'Close'}</button></div>`;
  }
}

// 배정한 과제를 '이 학생에게서만' 빼기. (다른 학생은 그대로)
// - '지정' 배정: 이 학생 링크만 제거(마지막이면 비활성화).
// - '전체' 배정: 이 학생만 뺄 수 없으므로 '지정(현재 학생 전원 - 이 학생)'으로 전환해 나머지는 유지.
//   (전환 후엔 '학원 전체'가 아니라서, 이후 새로 들어오는 학생은 자동 배정되지 않음)
async function unassignTask(assignmentId, targetType, studentId, label){
  const ko = userNativeLang==='ko';
  if (!orgIsAdmin() || !userOrg) { toast(ko?'관리자만 할 수 있어요':'Admins only'); return; }
  const isAll = targetType==='all';
  const msg = isAll
    ? (ko?`'${label}'\n이 학생에게서만 뺄까요? (다른 학생은 그대로 유지돼요)\n※ 이후 이 과제는 '전체'가 아닌 '지정'이 되어, 새로 들어오는 학생에게는 자동 배정되지 않아요.`
         :`Remove '${label}' from THIS student only? (others keep it)`)
    : (ko?`'${label}' 과제를 이 학생에게서 뺄까요? (다른 학생은 그대로)`:`Remove '${label}' from this student?`);
  if (!confirm(msg)) return;
  try {
    if (isAll) {
      // 현재 승인 학생 전원 - 이 학생 → 지정 배정으로 전환
      const studs = await sbFetch(`/rest/v1/members?org_id=eq.${userOrg.id}&org_role=eq.student&org_status=eq.approved&select=id`);
      const others = (Array.isArray(studs)?studs:[]).map(s=>s.id).filter(sid=>sid!==studentId);
      await sbFetch(`/rest/v1/voca_assignment_students?assignment_id=eq.${assignmentId}`, 'DELETE', null, true, {'Prefer':'return=minimal'});
      if (others.length){
        await sbFetch('/rest/v1/voca_assignment_students', 'POST', others.map(sid=>({assignment_id:assignmentId, student_id:sid})), true, {'Prefer':'return=minimal'});
        await sbFetch(`/rest/v1/voca_assignments?id=eq.${assignmentId}`, 'PATCH', { target_type:'selected' }, true, {'Prefer':'return=minimal'});
      } else {
        // 나 혼자였으면 그냥 비활성화
        await sbFetch(`/rest/v1/voca_assignments?id=eq.${assignmentId}`, 'PATCH', { active:false }, true, {'Prefer':'return=minimal'});

// 학생 중심 배정: 한 학생에게 여러 단어장을 골라 배정 (개별 맞춤용)
async function assignBooksToStudent(studentId, studentName){
  const ko = userNativeLang==='ko';
  if (!orgIsAdmin() || !userOrg) { toast(ko?'관리자만 배정할 수 있어요':'Admins only'); return; }
  const assignable = books.filter(b=>!b._assigned);   // 내 책 + 공식책 (배정받은 책 제외)
  // 이 학생에게 이미 배정된 책 파악
  let assignedBooks = new Set();
  try {
    const as = await sbFetch(`/rest/v1/voca_assignments?org_id=eq.${userOrg.id}&active=eq.true&page_num=is.null&select=id,book_id,target_type`);
    if (Array.isArray(as) && as.length) {
      const selIds = as.filter(a=>a.target_type==='selected').map(a=>a.id);

      if (selIds.length){
        const links = await sbFetch(`/rest/v1/voca_assignment_students?student_id=eq.${studentId}&assignment_id=in.(${selIds.join(',')})&select=assignment_id`);
        if (Array.isArray(links)) links.forEach(l=>mine.add(l.assignment_id));
      }
      as.forEach(a=>{ if (a.target_type==='all' || mine.has(a.id)) assignedBooks.add(a.book_id); });
    }
  } catch(e){}
  const overlay = document.createElement('div');
  overlay.id = 'assign2stu-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:flex-end;justify-content:center;';
  const rows = assignable.length ? assignable.map(b=>{ const done = assignedBooks.has(b.id);

      <input type="date" id="astu-due" style="width:100%;background:var(--bg-input);border:1px solid var(--ink-07);border-radius:10px;padding:11px 14px;font-family:var(--font-body);font-size:14px;color:var(--ink-100);box-sizing:border-box;">
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn btn-outline" style="flex:1;" onclick="var o=document.getElementById('assign2stu-overlay');if(o)o.remove()">${ko?'취소':'Cancel'}</button>
        <button class="btn btn-solid" style="flex:1;" onclick="doAssignToStudent('${jsq(studentId)}')">${ko?'배정하기':'Assign'}</button>
      </div>
    </div>`;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

async function doAssignToStudent(studentId){
  const ko = userNativeLang==='ko';
  const checked = [...document.querySelectorAll('.astu-book:checked:not(:disabled)')].map(c=>c.value);
  if (!checked.length){ toast(ko?'새로 배정할 단어장을 선택해주세요':'Select a wordbook'); return; }
  const due = (document.getElementById('astu-due')||{}).value || null;
  let n = 0;
  try {
    for (const bookId of checked){
      const book = findBook(bookId);
      // 이 책의 활성 selected 배정(책 전체)이 있으면 재사용, 없으면 생성 → 그 배정에 학생 추가
      let aid = null;
      const as = await sbFetch(`/rest/v1/voca_assignments?org_id=eq.${userOrg.id}&book_id=eq.${bookId}&page_num=is.null&target_type=eq.selected&active=eq.true&select=id&limit=1`);
      if (Array.isArray(as) && as[0]) aid = as[0].id;
      if (!aid){
        const rowsR = await sbFetch('/rest/v1/voca_assignments','POST',{
          org_id:userOrg.id, assigned_by:currentUser.id, book_id:bookId, page_num:null,
          title:(book?book.title:''), due_date:due||null, target_type:'selected', active:true
        }, true, {'Prefer':'return=representation'});
        if (Array.isArray(rowsR) && rowsR[0]) aid = rowsR[0].id;
      }
      if (aid){
        await sbFetch('/rest/v1/voca_assignment_students','POST',[{assignment_id:aid, student_id:studentId}],
          true, {'Prefer':'return=minimal,resolution=ignore-duplicates'});
        n++;
      }
    }
    const ov=document.getElementById('assign2stu-overlay'); if(ov) ov.remove();
    toast(ko?`✅ 단어장 ${n}권 배정했어요`:`✅ Assigned ${n} wordbook(s)`);
  } catch(e){ toast((ko?'배정 오류: ':'Error: ')+(e&&e.message||e)); }
}

async function saveMyName() {
  const ko = userNativeLang === 'ko';
  const next = (document.getElementById('info-name')?.value || '').trim();
  if (!next) { toast(ko?'이름을 입력해주세요':'Please enter a name'); return; }
  if (next === userName) { toast(ko?'이름이 같아요':'Same name'); return; }
  try {
    await fetch(SB_URL + `/rest/v1/members?id=eq.${currentUser.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken },
      body: JSON.stringify({ name: next })
    });
    userName = next;
    toast(ko?'이름이 변경됐어요 ✓':'Name updated ✓');
    document.getElementById('info-modal')?.remove();
    render();
  } catch(e) { toast(ko?'변경 실패, 다시 시도해주세요':'Failed, please try again'); }
}

async function saveMyPassword() {
  const ko = userNativeLang === 'ko';
  const pw = document.getElementById('info-pw1')?.value;
  const pw2 = document.getElementById('info-pw2')?.value;
  if (!pw || pw.length < 6) { toast(ko?'비밀번호는 6자 이상이어야 해요':'Password must be 6+ characters'); return; }
  if (pw !== pw2) { toast(ko?'비밀번호가 일치하지 않아요':'Passwords do not match'); return; }
  try {
    const res = await fetch(SB_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (data.id) {
      document.getElementById('info-modal')?.remove();
      toast(ko?'✅ 비밀번호가 변경됐어요!':'✅ Password changed!');
    } else {
      toast(data.msg || (ko?'변경 실패. 다시 시도해주세요':'Failed. Please try again'));
    }
  } catch(e) { toast(ko?'오류가 발생했어요':'An error occurred'); }
}

async function updatePassword() {

let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _deferredInstallPrompt = e;
});

function setupInstallBanner(isStandalone) {
  // 이미 앱으로 설치해서 쓰는 중이면 안 띄움
  if (isStandalone) return;
  // 최근에 닫았으면 7일간 안 띄움
  const dismissed = localStorage.getItem('imvoca.installDismissed');
  if (dismissed && (Date.now() - Number(dismissed)) < 7*24*60*60*1000) return;

  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  const isAndroid = /android/i.test(ua);
  // 모바일이 아니면(데스크톱) 안내 불필요
  if (!isIOS && !isAndroid) return;

  const banner = document.getElementById('install-banner');
  const titleEl = document.getElementById('install-title');
  const descEl = document.getElementById('install-desc');
  const btnEl = document.getElementById('install-action-btn');
  if (!banner) return;

  const ko = userNativeLang === 'ko';
  if (isIOS) {
    // 아이폰: 자동 설치 버튼이 없어서 방법을 안내
    titleEl.textContent = ko ? '📲 홈 화면에 추가하세요' : '📲 Add to Home Screen';
    descEl.innerHTML = ko
      ? '사파리 아래쪽 <b>공유 버튼</b>을 누르고<br>“홈 화면에 추가”를 선택하세요.'
      : 'Tap the <b>Share</b> button below,<br>then “Add to Home Screen”.';
    btnEl.style.display = 'none';
  } else {
    // 안드로이드: 설치 버튼 제공
    titleEl.textContent = ko ? '📲 앱으로 설치하세요' : '📲 Install the app';
    descEl.textContent = ko ? '홈 화면에서 앱처럼 빠르게 열 수 있어요.' : 'Open it like an app from your home screen.';
    btnEl.textContent = ko ? '설치하기' : 'Install';
    btnEl.style.display = 'block';
  }
  // 3초 후 띄우기 (들어오자마자 방해되지 않게)
  setTimeout(() => { banner.classList.add('show'); }, 3000);
}

function dismissInstall() {
  const b = document.getElementById('install-banner');
  if (b) b.classList.remove('show');
  localStorage.setItem('imvoca.installDismissed', String(Date.now()));
}

async function triggerInstall() {
  if (_deferredInstallPrompt) {
    _deferredInstallPrompt.prompt();
    const { outcome } = await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt = null;
    if (outcome === 'accepted') dismissInstall();
  } else {
    toast(userNativeLang==='ko' ? '브라우저 메뉴에서 “홈 화면에 추가”를 눌러주세요' : 'Use "Add to Home Screen" in your browser menu');
  }
}

async function sbInit() {
  initDarkMode();
  // 앱 모드 vs 브라우저 모드 감지
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  document.documentElement.style.setProperty('--ox-bottom', isStandalone ? '16px' : '90px');
  document.documentElement.style.setProperty('--ox-hint-bottom', isStandalone ? '0px' : '70px');
  setupInstallBanner(isStandalone);

  // ── 비밀번호 재설정 토큰 체크 (최우선) ──
  if (checkRecoveryToken()) return;

  // ── 소셜 로그인 리다이렉트 처리 ──
  if (await handleOAuthRedirect()) return;

  // 저장된 세션이 있으면 로그인 화면 대신 로딩 표시 (깜빡임 방지)
  const hasSavedSession = !!localStorage.getItem('imvoca.session');
  if (hasSavedSession) {
    document.getElementById('root').innerHTML = '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-page);gap:18px;"><img src="https://imvoca.app/2.png" style="width:96px;height:96px;object-fit:contain;border-radius:22px;box-shadow:0 6px 24px rgba(28,53,83,0.15);animation:imvocaPulse 1.6s ease-in-out infinite;"><div style="font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent);letter-spacing:0.02em;">IM VOCA</div></div>';
  } else {
    // 광고·단체코드로 처음 온 사람은 '회원가입' 탭 먼저
    const _p = new URLSearchParams(window.location.search);
    const _code = (_p.get('code') || '').trim();
    if (_p.get('signup') === '1' || _code) {
      if (_code) { window._suType = 'student'; window._prefillCode = _code.toUpperCase(); }
      renderLogin('signup');
    } else {
      renderLogin();
    }
  }

  // ── 데모 링크 토큰 감지 ──
  const urlParams = new URLSearchParams(window.location.search);
  const demoToken = urlParams.get('demo');
  if (demoToken) {
    // URL에서 토큰 제거 (주소창 깔끔하게)
    window.history.replaceState({}, '', window.location.pathname);
    await loginWithDemoToken(demoToken);
    return;
  }

  const saved = localStorage.getItem('imvoca.session');
  if (saved) {
    try {
      const sess = JSON.parse(saved);
      if (!sess.access_token || !sess.user) { localStorage.removeItem('imvoca.session'); return; }
      const verify = await fetch(SB_URL + '/auth/v1/user', {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + sess.access_token }
      });
      if (!verify.ok) { localStorage.removeItem('imvoca.session'); renderLogin(); return; }
      const userData = await verify.json();
      _authToken = sess.access_token;
      currentUser = userData;
      // ⚠️ loadUserPlan(→loadMyOrg) 이 org 역할/승인을 세팅해야 loadBooksFromDB 안의
      // appendOfficialBooks 가 _seesAllOfficialLangs()=true 로 공식책 전체를 로드함(경합 방지).
      await loadUserPlan();
      await Promise.all([
        loadApiKey(),
        loadUserName(),
        loadBooksFromDB(),
        loadNotices(),
        loadAssignments()   // 단체 학생: 배정 단어장을 첫 렌더 전에 미리 로드(안 보이던 문제 방지)
      ]);
      await maybeSeedSampleBook();
      applyEntryStack();
      render();
      // 렌더 후 배지 업데이트 (상단 버튼이 그려진 다음)
      setTimeout(updateNoticeBadge, 100);
      setTimeout(checkReviews, 1000);
    } catch(e) {
      console.error('세션 복원 실패:', e);
      localStorage.removeItem('imvoca.session');
      renderLogin();
    }
  }
}


// ── 데모 링크로 로그인 ──
async function loginWithDemoToken(code) {
  try {
    // 로딩 표시
    document.getElementById('root').innerHTML = `
      <div class="scr" style="justify-content:center;align-items:center;gap:16px;">
        <div class="ring"></div>

          <div class="muted" style="font-size:12px;margin-top:4px;">${userNativeLang==='ko'?'잠깐만 기다려주세요':'Please wait a moment'}</div>
        </div>
      </div>`;

    // DB에서 코드로 토큰 조회
    const res = await fetch(SB_URL + `/rest/v1/demo_links?code=eq.${code}&select=*`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    const data = await res.json();

    if (!data?.length) { toast('유효하지 않은 링크예요'); renderLogin(); return; }

    if (new Date() > new Date(expires_at)) {
      toast('링크가 만료됐어요. 새 링크를 받아주세요');
      renderLogin();
      return;
    }

    // 토큰 유효성 서버 확인
    const verify = await fetch(SB_URL + '/auth/v1/user', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + access_token }
    });
    if (!verify.ok) { toast('유효하지 않은 링크예요'); renderLogin(); return; }

    const userData = await verify.json();
    _authToken = access_token;
    currentUser = userData;

    // 세션 저장
    localStorage.setItem('imvoca.session', JSON.stringify({ access_token, user: userData }));

    toast('✅ 입장했어요!');
    await loadApiKey();
    await loadUserName();
    await loadUserPlan();
    await loadBooksFromDB();
    await loadAssignments();   // 배정 단어장 미리 로드

  } catch(e) {

}

// ── 소셜 로그인 (구글/카카오) ──
function signInWithProvider(provider){
  try{
    // 가입 탭에서 입력한 이름/단체코드/유형을 저장 (구글 갔다와도 유지)
    const ko = userNativeLang==='ko';
    const onSignupTab = !!document.getElementById('su-nm');
    const nameEl = document.getElementById('su-nm');
    const name = nameEl ? (nameEl.value||'').trim() : '';
    // 회원가입 탭에서 소셜 가입 시 이름 필수
    if (onSignupTab && !name) {
      toast(ko?'이름을 먼저 입력해주세요':'Please enter your name first');
      if (nameEl) nameEl.focus();
      return;
    }
    const codeEl = document.getElementById('su-code');
    const code = codeEl ? (codeEl.value||'').trim().toUpperCase() : '';
    const suType = window._suType || 'personal';
    if (onSignupTab && suType === 'student' && !code) {
      toast(ko?'단체 코드를 입력해주세요':'Please enter the org code');
      if (codeEl) codeEl.focus();
      return;
    }
    // 가입 경로 수집 (모든 유형)
    let source = '';
    if (onSignupTab) {
      const srcSel = window._signupSource || '';
      if (srcSel === 'referral') { const refn=(document.getElementById('su-referral')?.value||'').trim(); source = refn ? ('지인소개: '+refn) : '지인소개'; }
      else if (srcSel === 'other') { const oth=(document.getElementById('su-other')?.value||'').trim(); source = oth ? ('기타: '+oth) : '기타'; }
      else if (srcSel) source = srcSel;
    }
    const pending = { suType, code, name, source };
    try { localStorage.setItem('imvoca.oauthPending', JSON.stringify(pending)); } catch(e){}
    const redirect = encodeURIComponent(location.origin + location.pathname);
    let authUrl = SB_URL + '/auth/v1/authorize?provider=' + provider + '&redirect_to=' + redirect;
    // 회원가입에서는 구글 계정 선택 화면을 강제로 띄운다.
    // (브라우저에 이미 로그인된 계정으로 자동 진행돼 원치 않는 아이디로 가입/로그인되는 문제 방지)
    if (onSignupTab) authUrl += '&prompt=select_account';
    location.href = authUrl;
  }catch(e){ toast('로그인 이동 실패: ' + e.message); }
}

// 소셜 로그인 후 돌아왔을 때 (#access_token=... 처리)
async function handleOAuthRedirect(){
  const h = window.location.hash || '';
  if (h.indexOf('access_token=') === -1) return false;
  const hp = new URLSearchParams(h.replace(/^#/,''));
  const access_token = hp.get('access_token');
  const refresh_token = hp.get('refresh_token');
  if (!access_token) return false;
  history.replaceState({}, '', window.location.pathname);
  try{
    const res = await fetch(SB_URL + '/auth/v1/user', { headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+access_token }});
    if(!res.ok){ renderLogin(); return true; }
    const user = await res.json();
    _authToken = access_token; currentUser = user;
    localStorage.setItem('imvoca.session', JSON.stringify({ access_token, refresh_token, user }));
    await ensureMemberRow(user);
    // 승인 대기(단체 학생/관리자) 체크
    if (user.email !== 'koreayjk@gmail.com') {
      try{
        const r = await fetch(SB_URL + `/rest/v1/members?id=eq.${user.id}&select=org_status,org_role`, { headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }});
        const md = await r.json();
        if (md[0] && md[0].org_status === 'pending') {
          toast(userNativeLang==='ko'?'아직 승인 대기 중이에요. 관리자 승인 후 사용 가능해요':'Pending approval.');
          _authToken=null; currentUser=null; localStorage.removeItem('imvoca.session');
          renderLogin(); return true;
        }
      }catch(e){}
    }
    await loadUserPlan();   // org 역할 먼저(공식책 로드 경합 방지)
    await Promise.all([ loadApiKey(), loadUserName(), loadBooksFromDB(), loadNotices(), loadAssignments() ]);
    await maybeSeedSampleBook();
    applyEntryStack(); render();
    setTimeout(updateNoticeBadge, 100); setTimeout(checkReviews, 1000);
  }catch(e){
    console.error('OAuth 처리 실패:', e);
    toast((userNativeLang==='ko'?'가입/로그인 오류: ':'Signup/login error: ') + (e.message||e), 6000);
    _authToken=null; currentUser=null;
    try{ localStorage.removeItem('imvoca.session'); }catch(_){}
    renderLogin();
  }
  return true;
}

// 소셜 첫 로그인 시 members 행 없으면 생성
async function ensureMemberRow(user){
  try{
    const r = await fetch(SB_URL + `/rest/v1/members?id=eq.${user.id}&select=id`, { headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }});
    const rows = await r.json();
    if (Array.isArray(rows) && rows.length>0) return; // 이미 있음(기존/연결 계정)
    const meta = user.user_metadata || {};
    // 가입 직전 저장해둔 이름/단체코드/유형
    let pending = null;
    try { pending = JSON.parse(localStorage.getItem('imvoca.oauthPending')||'null'); } catch(e){}
    try { localStorage.removeItem('imvoca.oauthPending'); } catch(e){}
    // 이메일 (카카오는 없을 수 있음)
    const emailVal = user.email || meta.email || null;
    // 사용자가 입력한 이름 우선, 없으면 소셜 계정 이름/닉네임
    const nm = (pending && pending.name) ? pending.name
      : (meta.name || meta.full_name || meta.nickname || meta.user_name || (emailVal ? emailVal.split('@')[0] : '사용자'));
    const body = { id:user.id, name:nm, role:'멤버', plan:'free', scan_count:0 };
    if (emailVal) body.email = emailVal;  // 이메일 있을 때만 저장 (카카오 무이메일 대비)
    if (pending && pending.source) body.signup_source = pending.source;
    if (pending && pending.suType === 'owner') {
      body.org_role = 'owner'; body.org_status = 'approved'; // 단체장 자동 승인(가드가 student로 낮춰도 아래 플래그로 단체 만들기 유도)
      try { localStorage.setItem('imvoca.ownerIntent.' + user.id, '1'); } catch(e){}
    } else if (pending && (pending.suType === 'student' || pending.code) && pending.code) {
      const org = await lookupOrgByCode(pending.code);
      if (org) { body.org_id = org.id; body.org_role = 'student'; body.org_status = 'pending'; }
    }
    const ins = await fetch(SB_URL + '/rest/v1/members', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken, 'Prefer':'return=representation' },
      body: JSON.stringify(body)
    });
    if (!ins.ok) {
      const errTxt = await ins.text().catch(()=> '');
      console.error('member 생성 실패:', ins.status, errTxt);
      // 이메일 중복(409) 등은 이미 계정이 있다는 뜻 → 통과시킴(연결)
      if (ins.status === 409 || /duplicate|unique/i.test(errTxt)) {
        return; // 이미 존재 → 정상 진행
      }
      throw new Error('가입 처리 오류 ('+ins.status+'): '+ (errTxt||'알 수 없는 오류'));
    }
  }catch(e){
    console.error('member 생성 실패:', e);
    throw e; // 상위(handleOAuthRedirect)에서 사용자에게 표시
  }
}

async function sbSignIn(email, pw) {

          localStorage.removeItem('imvoca.session');

          if (emailEl) emailEl.disabled = false;
          if (pwEl) pwEl.disabled = false;
          return;
        }
      } catch(e) {}

    if (pwEl) pwEl.disabled = false;
  }
}

async function sbSignUp(email, pw, name, acctType='personal', orgCode='', source='') {
  // 입력값 검증
  if (!name?.trim()) { toast(userNativeLang==='ko'?'이름을 입력해주세요':'Please enter your name'); return; }
  if (!email?.trim()) { toast(userNativeLang==='ko'?'이메일을 입력해주세요':'Please enter your email'); return; }
  if (!email.includes('@')) { toast(userNativeLang==='ko'?'올바른 이메일을 입력해주세요':'Please enter a valid email'); return; }
  if (!pw?.trim()) { toast(userNativeLang==='ko'?'비밀번호를 입력해주세요':'Please enter a password'); return; }
  if (pw.length < 6) { toast(userNativeLang==='ko'?'비밀번호는 6자 이상이어야 해요':'Password must be at least 6 characters'); return; }
  // 학생용 학원 코드가 있으면 먼저 확인 (학원장 가입은 코드 불필요)
  let org = null;
  const codeTrim = (orgCode||'').trim().toUpperCase();
  if (acctType === 'student') {
    if (!codeTrim) { toast(userNativeLang==='ko'?'단체 코드를 입력해주세요':'Please enter the org code'); return; }
    org = await lookupOrgByCode(codeTrim);
    if (!org) { toast(userNativeLang==='ko'?'단체 코드를 찾을 수 없어요. 코드를 확인해주세요':'Org code not found. Please check the code.'); return; }
  } else if (acctType !== 'owner' && codeTrim) {
    org = await lookupOrgByCode(codeTrim);
    if (!org) { toast(userNativeLang==='ko'?'단체 코드를 찾을 수 없어요. 코드를 확인해주세요':'Org code not found. Please check the code.'); return; }
  }
  try {
    const data = await sbFetch('/auth/v1/signup', 'POST', { email, password: pw, data: { name } }, false);
    if (data.error) { toast('가입 실패: ' + data.error.message); return; }
    if (data.user?.id) {
      const body = { id: data.user.id, name, email, role: '멤버', plan: 'free', scan_count: 0 };
      if (source) body.signup_source = source;
      if (acctType === 'owner') { body.org_role = 'owner'; body.org_status = 'approved'; try { localStorage.setItem('imvoca.ownerIntent.' + data.user.id, '1'); } catch(e){} } // 단체장 자동 승인
      else if (org) { body.org_id = org.id; body.org_role = 'student'; body.org_status = 'pending'; }
      const mRes = await fetch(SB_URL + '/rest/v1/members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Prefer': 'return=minimal' },
        body: JSON.stringify(body)
      });
      if (!mRes.ok) {
        const errTxt = await mRes.text();
        console.error('[members 저장 실패]', mRes.status, errTxt);
        toast('계정은 생성됐지만 회원정보 저장에 실패했어요. 관리자에게 문의해주세요.');
      }
    } else {
      console.error('[회원가입] user.id 없음 - 이메일 인증 대기 상태일 수 있음', data);
    }
    let msg;
    if (acctType === 'owner') msg = userNativeLang==='ko'?'단체장 가입 완료! 로그인 후 바로 단체를 만들 수 있어요 😊':'Owner signup complete! Log in and create your organization.';
    else if (org) msg = userNativeLang==='ko'?`가입 완료! '${org.name}' 승인 후 이용할 수 있어요 😊`:`Signed up! Active after '${org.name}' approves you.`;
    else msg = userNativeLang==='ko'?'가입 완료! 바로 로그인해서 사용할 수 있어요 😊':'Signed up! Log in to start.';
    toast(msg);
    window._suType = 'personal';
    renderLogin('login');
  } catch(e) { toast('가입 오류: ' + e.message); }
}

async function sbSignOut() {
  localStorage.removeItem('imvoca.session');
  try { localStorage.removeItem('imvoca.ownerIntent'); } catch(e){} // 공용 브라우저: 다음 사용자에게 '단체 만들기'가 뜨지 않도록 정리
  _authToken = null; currentUser = null; books = [];
  _assignLoaded = false; window._assignList = [];
  renderLogin();
}

async function loadBooksFromDB() {
  try {
    // 책 + 페이지 + 단어를 한 번에 (embed)
    const bd = await sbFetch(`/rest/v1/voca_books?user_id=eq.${currentUser.id}&select=*,voca_pages(*,voca_words(*))&order=created_at`);
    if (!Array.isArray(bd)) return;
    books = bd.map(b => ({
      id: b.id, title: b.title, author: b.author, color: b.color,
      desc: b.description || '', cover: b.is_official ? _officialCover(b.title, b.cover_url) : (b.cover_url || ''), category: b.category || 'general',
      _officialContent: !!b.is_official, // 공식 콘텐츠 책: 촬영/직접입력 버튼 숨김(소유자 본인이 봐도)
      // 소유자 본인이 봐도 공식 책은 잠금(Day1만 무료) 적용 → _official/_readonly 부여(무료=다 락, 유료만 풀림)
      ...(b.is_official ? { _official: true, _readonly: true } : {}),
      pages: (b.voca_pages || [])
        .sort((a,c) => (a.page_num+'').localeCompare(c.page_num+'', undefined, { numeric: true }))
        .map(p => ({
          num: p.page_num, _pid: p.id,
          words: (p.voca_words || [])
            .sort((a,c) => new Date(a.created_at) - new Date(c.created_at))
            .map(w => ({ id: w.id, en: w.en, ipa: w.ipa||'', base: w.base, ctx: w.ctx, sentence: w.sentence||'', level: w.level||'', fav: w.is_favorite||false, analysis: w.analysis || null }))
        }))
}));
    updateTotalWords();
    // 공식 단어장(~6천 단어, 큰 payload)은 비동기로 붙임 → 소유 책 먼저 그려 첫 화면
    // 블로킹을 없애고, 로드 완료 후 현재 화면을 다시 렌더한다.
    appendOfficialBooks().then(() => {
      updateTotalWords();
      if (currentUser && typeof render === 'function') { try { render(); } catch(e){} }
    }).catch(e => console.warn('[official load]', e));
  } catch(e) { console.error('DB load error:', e); }
}

// 공식 책 표지: 제목에 따라 레포에 호스팅된 표지 이미지를 매핑(DB cover_url이 비어도 적용).
function _officialCover(title, dbCover){
  const t = title || '';
  // 수능 전용 표지 — 제목에 '수능'이 있을 때만. (중등 핵심/스페인어 등이 '핵심' 같은
  // 공통어로 수능 표지를 잘못 가져가던 문제 방지)
  if (t.indexOf('수능') >= 0) {
    if (t.indexOf('기본') >= 0) return 'cover-suneung-basic.jpg?v=5';
    if (t.indexOf('핵심') >= 0) return 'cover-suneung-core.jpg?v=5';
    if (t.indexOf('고난도') >= 0) return 'cover-suneung-hard.jpg?v=5';
    if (t.indexOf('숙어') >= 0) return 'cover-suneung-idiom.jpg?v=5';
  }
  return dbCover || '';
}
// 공식 단어장(is_official)을 읽어 책장에 추가 (읽기전용). 이미 있으면(소유자 본인) 중복 제거.
// 공식책의 학습언어 판별: '스페인어…'=es, 그 외(수능·중등)=en. (앱은 학습언어=userTargetLang 에 맞는 공식책만 노출)
function _officialLang(title){ return String(title||'').startsWith('스페인어') ? 'es' : 'en'; }

// 공식책 카탈로그(페이지·단어 포함)를 한 번만 받아 캐시. 추가 모달 선택 목록·개인 추가에 재사용.
async function ensureOfficialCatalog(){
  if (Array.isArray(window._officialCatalogFull)) return window._officialCatalogFull;
  try {
    const od = await sbFetch(`/rest/v1/voca_books?is_official=eq.true&select=*,voca_pages(*,voca_words(*))&order=created_at`);
    if (Array.isArray(od)) window._officialCatalogFull = od;
  } catch(e){ console.warn('[official catalog]', e); }
  return Array.isArray(window._officialCatalogFull) ? window._officialCatalogFull : [];
}
// DB 공식책 행 → 메모리 book 객체(읽기전용)
function _mapOfficialBook(b){
  return {
    id: b.id, title: b.title, author: b.author, color: b.color,
    desc: b.description || '', cover: _officialCover(b.title, b.cover_url), category: b.category || 'general',
    _official: true, _readonly: true, _officialContent: true,
    pages: (b.voca_pages || [])
      .sort((a,c) => (a.page_num+'').localeCompare(c.page_num+'', undefined, { numeric: true }))
      .map(p => ({
        num: p.page_num, _pid: p.id,
        words: (p.voca_words || [])
          .sort((a,c) => new Date(a.created_at) - new Date(c.created_at))
          .map(_dbRowToWord)
      }))
  };
}
// 개인(비단체) 사용자가 '추가'한 공식책 id 목록 — 기기별 기억(학습 진도는 DB에 저장돼 기기 무관 유지)
function _myOfficialKey(){ return 'imvoca_offbooks_' + ((currentUser && currentUser.id) || 'anon'); }
function getMyOfficialIds(){
  try { const v = JSON.parse(localStorage.getItem(_myOfficialKey())||'[]'); return Array.isArray(v)?v:[]; } catch(e){ return []; }
}
function _setMyOfficialIds(arr){ try{ localStorage.setItem(_myOfficialKey(), JSON.stringify([...new Set(arr)])); }catch(e){} }

async function appendOfficialBooks() {
  try {
    // 단체 소속이면서 '승인된 관리자(owner)'가 아닌 사람 = 단체 학생/대기자.
    // → 공식 단어장을 자동으로 보여주지 않는다. 배정(_assigned)받은 것만 loadAssignments 로 보임.
    const approvedOwner = (userOrgRole === 'owner' && userOrgStatus === 'approved');
    if (userOrgId && !approvedOwner) return;

    const od = await ensureOfficialCatalog();
    if (!Array.isArray(od) || !od.length) return;
    const have = new Set(books.map(b => b.id));
    // 승인된 관리자: 배정 위해 전체 언어 공식책 모두 노출.
    // 개인 사용자: 본인이 '추가'한 공식책만 노출(자동 노출 안 함).
    const allLangs = approvedOwner;
    // 개인 사용자 최초 1회: 이미 복습 진도가 있는 공식책은 유지(공부 중이던 책이 사라지지 않도록 시딩).
    if (!allLangs && currentUser && localStorage.getItem(_myOfficialKey()) === null) {
      try {
        const offIds = od.map(b => b.id);
        const rv = offIds.length
          ? await sbFetch(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=in.(${offIds.join(',')})&select=book_id`)
          : [];
        _setMyOfficialIds(Array.isArray(rv) ? rv.map(r => r.book_id) : []);
      } catch(e){ _setMyOfficialIds([]); }
    }
    const picked = allLangs ? null : new Set(getMyOfficialIds());
    od.filter(b => allLangs ? true : picked.has(b.id)).forEach(b => {
      const ex = findBook(b.id);
      if (ex) {
        // 이미 책장에 있음(예: 배정 로드가 먼저 실행돼 _assigned 로 주입된 경우) →
        // 공식 속성을 보강해서 책장에 공식책으로 정상 노출되게 한다.
        // (예전엔 have.has 로 건너뛰어 _official 이 안 붙고, 배정한 수능책이 책장에서 사라졌음)
        ex._official = true; ex._readonly = true; ex._officialContent = true;
        if (!ex.cover) ex.cover = _officialCover(b.title, b.cover_url);
      } else {
        books.push(_mapOfficialBook(b));
      }
    });
  } catch(e) { console.warn('[official load]', e); }
}

// 개인 사용자: 공식책을 책장에 추가/제거
function addOfficialToShelf(id){
  const od = Array.isArray(window._officialCatalogFull) ? window._officialCatalogFull : [];
  const row = od.find(b => b.id === id);
  if (!row) return;
  if (!books.some(b => b.id === id)) books.push(_mapOfficialBook(row));
  _setMyOfficialIds([...getMyOfficialIds(), id]);
  try { loadReviewStatus(id); } catch(e){}
  renderOfficialPicker();
  try { render(); } catch(e){}
  toast(userNativeLang==='ko' ? '📚 단어장을 책장에 추가했어요' : 'Added to your shelf');
}
function removeOfficialFromShelf(id){
  const i = books.findIndex(b => b.id === id && b._official);
  if (i >= 0) books.splice(i, 1);
  _setMyOfficialIds(getMyOfficialIds().filter(x => x !== id));
  renderOfficialPicker();
  try { render(); } catch(e){}
  toast(userNativeLang==='ko' ? '책장에서 뺐어요' : 'Removed from shelf');
}

async function saveBookToDB(title, author, color, desc, cover='', category='general') {
  try {
    const body = { user_id:currentUser.id, title, author, color, description:desc, cover_url:cover };
    if (category && category !== 'general') body.category = category;
    const data = await sbFetch('/rest/v1/voca_books', 'POST',
      body,
      true, { 'Prefer': 'return=representation' });
    if (data.code || data.error) { toast('DB 오류: ' + (data.message || data.error)); return null; }
    return Array.isArray(data) ? data[0] : data;
  } catch(e) { toast('저장 오류: ' + e.message); return null; }
}

function calcWordScore(words) {
  // CEFR 난이도별 가중치
  const WEIGHTS = { 'A2': 1, 'B1': 2, 'B2': 3, 'C1': 4, 'C2': 5 };
  return words.reduce((sum, w) => sum + (WEIGHTS[w.level] || 1), 0);
}

async function updateTotalWords(allowZero=false) {
  if (!currentUser) return;
  try {
    // 전체 단어 가중치 점수(CEFR) 계산 → members.total_words에 저장
    // 공식책·배정책(_assigned)은 '내 단어'가 아니므로 제외.
    const totalScore = books.filter(b => !b._official && !b._assigned).reduce((sum, b) =>
      sum + b.pages.reduce((s, p) =>
        s + calcWordScore(p.words), 0), 0);
    // ⚠️ 스푸리어스 제로화 방지: 책 로드가 아직 안 됐거나, 토큰 만료 등으로 목록이 일시적으로
    // 비어 total=0 이 나올 때 total_words 를 0 으로 덮어쓰면 관리자·랭킹에 '단어 0'으로 표시됨.
    // 실제 0 은 '삭제'로 마지막 단어까지 지운 경우뿐 → 그때만 allowZero=true 로 0 기록 허용.
    if (totalScore === 0 && !allowZero) return;
    await sbFetch(`/rest/v1/members?id=eq.${currentUser.id}`, 'PATCH', { total_words: totalScore });
  } catch(e) {}
}

async function savePageWordsToDB(bookId, pageNum, words) {
  try {
    // 단어 0개면 페이지 자체를 만들지 않음 (빈 유령 페이지 방지)
    if (!words || !words.length) return { pageId: null, savedRows: [] };
    const book = findBook(bookId);
    let pageId;
    const ex = book?.pages.find(p => String(p.num) === String(pageNum));
    if (ex?._pid) { pageId = ex._pid; }
    if (!pageId) {
      // DB에 같은 책+페이지번호가 이미 있는지 확인 (중복 페이지 방지)
      try {
        const found = await sbFetch(`/rest/v1/voca_pages?book_id=eq.${bookId}&page_num=eq.${encodeURIComponent(String(pageNum))}&select=id&limit=1`);
        if (Array.isArray(found) && found[0]?.id) pageId = found[0].id;
      } catch(e) {}
    }
    if (!pageId) {
      const data = await sbFetch('/rest/v1/voca_pages', 'POST',
        { book_id:bookId, page_num:String(pageNum) },
        true, { 'Prefer': 'return=representation' });
      pageId = (Array.isArray(data) ? data[0] : data)?.id;
    }
    if (!pageId) return null;

    // 행 배열로 한 번에 INSERT (원자적 · 빠름 · 누락 방지)
    // created_at 을 1초씩 증가시켜 부여 → 재로딩(=created_at 정렬) 시에도
    // 추출 순서(책 본문 등장 순서)가 그대로 유지됨. (bulk insert 는 now() 동률이라 순서 보장 안 됨)
    const _seqBase = Date.now();
    const rows = words.map((w, i) => {
      const r = { page_id:pageId, en:w.en, ipa:w.ipa||'', base:w.base, ctx:w.ctx, sentence:w.sentence||'', level:w.level||'', created_at: new Date(_seqBase + i*1000).toISOString() };
      if (w.analysis && typeof w.analysis === 'object') r.analysis = w.analysis;
      return r;
    });
    const resp = await sbFetch('/rest/v1/voca_words', 'POST', rows, true, { 'Prefer': 'return=representation' });
    // (정상) 저장 검증: 반환된 행 수가 보낸 수와 같은지 확인
    let savedRows = Array.isArray(resp) ? resp.slice() : [];
    if (savedRows.length === rows.length) return { pageId, savedRows };

    // 일부/전체 실패 → 개별 재시도 (실패한 것만 다시)
    const failed = [];
    for (let i = savedRows.length; i < rows.length; i++) {
      try {
        const one = await sbFetch('/rest/v1/voca_words', 'POST', rows[i], true, { 'Prefer': 'return=representation' });
        const row = Array.isArray(one) ? one[0] : one;
        if (row?.id) savedRows.push(row);
        else failed.push(rows[i]);
      } catch(e) { failed.push(rows[i]); }
    }
    if (failed.length > 0) {
      toast(userNativeLang==='ko'
        ? `⚠️ 단어 ${failed.length}개 저장 실패 — 다시 시도해주세요`
        : `⚠️ ${failed.length} word(s) failed to save — please retry`);
      window._failedWords = { bookId, pageNum, words: failed };
    }
    return { pageId, savedRows };
  } catch(e) {
    toast(userNativeLang==='ko' ? '⚠️ 단어 저장 중 오류가 발생했어요' : '⚠️ Error saving words');
    return null;
  }
}

// 저장된 DB 행을 메모리 단어 객체로 변환
function _dbRowToWord(w) {
  return { id: w.id, en: w.en, ipa: w.ipa||'', base: w.base, ctx: w.ctx, sentence: w.sentence||'', level: w.level||'', fav: w.is_favorite||false, analysis: w.analysis || null };
}

async function sendResetEmail() {
  const email = document.getElementById('reset-email')?.value?.trim();
  if (!email) { toast(userNativeLang==='ko'?'이메일을 입력해주세요':'Please enter your email'); return; }
  
  const btn = document.getElementById('reset-btn');
  if (btn) { btn.disabled = true; btn.textContent = userNativeLang==='ko'?'보내는 중...':'Sending...'; }
  
  try {
    const res = await fetch(SB_URL + '/auth/v1/recover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ 
        email,
        options: { redirectTo: 'https://imvoca.app/?type=recovery' }
      })
    });
    
    if (res.ok || res.status === 200) {
      // 팝업 닫기
      document.getElementById('reset-overlay')?.remove();
      toast(userNativeLang==='ko'?'📧 이메일을 보냈어요! 받은 편지함을 확인해주세요':'📧 Email sent! Check your inbox');
    } else {
      const data = await res.json();
      toast(data.msg || (userNativeLang==='ko'?'이메일 전송 실패':'Failed to send email'));
      if (btn) { btn.disabled = false; btn.textContent = userNativeLang==='ko'?'재설정 이메일 보내기':'Send Reset Email'; }
    }
  } catch(e) {
    toast(userNativeLang==='ko'?'오류가 발생했어요':'An error occurred');
    if (btn) { btn.disabled = false; btn.textContent = userNativeLang==='ko'?'재설정 이메일 보내기':'Send Reset Email'; }
  }
}
