async function fetchWordMeaning(word, categoryContext='', isExam=false) {
  // Gemini로 단어 뜻 찾기 (정확도 ↑, 카테고리 문맥 반영, 시험 단어는 심화 분석 포함)
  if (!apiKey) {
    console.warn('[fetchWordMeaning] apiKey 없음! voca_settings.gemini_key 확인 필요');
    if (window._wordMeaningWarned !== true) { window._wordMeaningWarned = true; toast('⚠️ Gemini API 키가 없어요. 관리자에게 문의해주세요', 5000); }
    return { base: '(API 키 없음)', ipa: '', level: 'B1' };
  }
  // 설명 언어 = 사용자의 모국어 설정 그대로. (구버전 버그: ko/ja 외 전부 'Korean'으로 굳어
  //  중국어 등 다른 언어 사용자에게 한국어 뜻이 나오던 문제 → promptLangName 으로 교체)
  const native = promptLangName(userNativeLang);
  const ctxLine = categoryContext ? `\n중요: 이 단어는 "${categoryContext}"로 가장 적합한 뜻을 골라줘.` : '';

  // 시험 단어용 심화 분석 프롬프트
  const examPrompt = `다음 영어 단어를 시험 학습자(${native} 사용자)를 위해 자세히 분석해줘.${ctxLine}

단어: ${word}

다음 JSON 형식으로만 답해. 다른 설명 없이 JSON만 (각 필드는 모두 ${native}로):
{
  "base": "핵심 뜻 1~2개 (쉼표로 구분, 간결하게)",
  "ipa": "발음기호",
  "level": "CEFR 난이도 (A2/B1/B2/C1/C2)",
  "nuance": "뉘앙스와 사용 상황을 2~3문장으로 (긍정/부정/중립, 어떤 맥락에서 쓰는지)",
  "synonyms": ["유의어1", "유의어2", "유의어3"],
  "antonyms": ["반의어1", "반의어2"],
  "confusing": [{"word":"헷갈리는 단어1","diff":"이 단어와 어떻게 다른지 1문장"}, {"word":"헷갈리는 단어2","diff":"차이점 1문장"}],
  "example": "이 단어가 자연스럽게 쓰인 영어 예문 1개 (시험에 나올법한 수준)",
  "example_kr": "예문의 ${native} 번역"
}

각 필드 모두 채워줘. 헷갈리는 단어가 없으면 빈 배열 []로. 시험 학습자에게 도움 되는 핵심 정보만 간결하게.

⚠️ 언어 규칙: base·nuance·diff·example_kr 등 모든 설명 값은 반드시 ${native}로 작성해. ${native} 이외의 언어(특히 한국어)로 쓰는 것은 금지야. (example 필드만 영어)`;

  const simplePrompt = `다음 영어 단어의 가장 흔하게 쓰이는 ${native} 뜻을 알려줘.${ctxLine}

단어: ${word}

다음 JSON 형식으로만 답해. 다른 설명 없이 JSON만:
{"base":"${native} 뜻 (간결하게 1~2개, 쉼표로 구분)","ipa":"발음기호 (있으면, 없으면 빈 문자열)","level":"CEFR 난이도 (A2/B1/B2/C1/C2 중 하나)"}

⚠️ "base" 값은 반드시 ${native}로만 작성해. ${native} 이외의 언어(특히 한국어)로 쓰지 마.${TX(`

예시:
- "bank" + "비즈니스 영어" → {"base":"은행","ipa":"/bæŋk/","level":"A2"}
- "operation" + "의학 영어" → {"base":"수술","ipa":"/ˌɒpəˈreɪʃən/","level":"B2"}
- "ubiquitous" + "" → {"base":"어디에나 있는, 편재하는","ipa":"/juːˈbɪkwɪtəs/","level":"C1"}`,`

Format example — the "base" value MUST be in {v0}:
- "bank" → {"base":"<meaning of bank written in {v0}>","ipa":"/bæŋk/","level":"A2"}`,{v0:(native)})}`;

  const prompt = isExam ? examPrompt : simplePrompt;

  try {
    const data = await geminiWithRetry({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0, maxOutputTokens: isExam ? 1500 : 500 }
    }, 3);
    let text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    // 마크다운 코드 블록 제거 (```json ... ```)
    text = text.replace(/```json\s*/gi, '').replace(/```/g, '').trim();
    // JSON 추출 (시험용은 중첩 객체/배열이라 greedy로, 일반은 non-greedy로)
    const m = isExam ? text.match(/\{[\s\S]*\}/) : text.match(/\{[\s\S]*?\}/);
    if (m) {
      try {
        const parsed = JSON.parse(m[0]);
        const result = {
          base: parsed.base || '(뜻을 찾지 못했어요)',
          ipa: parsed.ipa || '',
          level: parsed.level || 'B1'
        };
        // 시험용: 심화 분석 필드 같이 반환
        if (isExam) {
          result.analysis = {
            nuance: parsed.nuance || '',
            synonyms: Array.isArray(parsed.synonyms) ? parsed.synonyms : [],
            antonyms: Array.isArray(parsed.antonyms) ? parsed.antonyms : [],
            confusing: Array.isArray(parsed.confusing) ? parsed.confusing : [],
            example: parsed.example || '',
            example_kr: parsed.example_kr || ''
          };
        }
        return result;
      } catch(e) { console.warn('[fetchWordMeaning] JSON 파싱 실패, 부분추출 시도', e); }
    }
    // JSON 파싱 실패 시 텍스트에서 base 값만 긁기 (응답이 잘렸을 때도 대응)
    // 정상: "base":"은행" 또는 잘림: "base":"은행 또는 "base":"
    let baseMatch = text.match(/"base"\s*:\s*"([^"]+)"/);
    if (!baseMatch) {
      // 닫는 따옴표 없이 잘린 경우: "base":"은행, 둑\n...
      baseMatch = text.match(/"base"\s*:\s*"([^"\n,}]+)/);
    }
    return {
      base: baseMatch ? baseMatch[1] : '(뜻을 찾지 못했어요)',
      ipa: '',
      level: 'B1'
    };
  } catch(e) {
    console.error('[fetchWordMeaning] Gemini 호출 실패:', word, e);
    return { base: '(뜻을 찾지 못했어요)', ipa: '', level: 'B1' };
  }
}

// 뜻이 비어 있는 단어만 AI 로 채운다 (사전에서 이미 찾은 단어는 건너뛴다 → 호출 0회)
async function _fillMeanings(words, bookId, onProgress){
  const bookForCtx = findBook(bookId);
  const bookCat = bookForCtx?.category || 'general';
  let categoryContext = '';
  if (bookCat && bookCat !== 'general') {
    categoryContext = bookCat.startsWith('custom:')
      ? categoryToContext('custom', bookCat.slice(7))
      : categoryToContext(bookCat, '');
  }
  // 심화 분석은 모든 추가 단어에 생성(학생이 직접 추가한 단어도 심화 분석 보기 제공).
  // fetchWordMeaning 은 어차피 단어당 1회 호출이라 호출 수 증가 없음(프롬프트만 풍부해짐).
  const need = (words || []).filter(w => !w.base);
  for (let i = 0; i < need.length; i++) {
    const w = need[i];
    if (onProgress) onProgress(i + 1, need.length);
    const result = await fetchWordMeaning(w.en, categoryContext, true);
    w.base = result.base; w.ipa = result.ipa; w.ctx = '';
    if (result.level) w.level = result.level;
    if (result.analysis) w.analysis = result.analysis;
  }
  return need.length;
}

// 한 페이지를 DB 에 저장하고 화면의 책 데이터에도 반영한다. 이번에 저장한 단어 수를 돌려준다.
async function _savePageAndMerge(bookId, pg, wordList){
  const book = findBook(bookId);
  if (!book) return 0;
  const saveRes = await savePageWordsToDB(bookId, pg, wordList);
  const pid = saveRes?.pageId || null;
  const savedCount = (saveRes?.savedRows || []).length;
  let words = (saveRes?.savedRows || []).map(_dbRowToWord);
  // 안전장치: 저장 후 DB에서 단어 다시 가져와 동기화
  let synced = false;
  if (pid) {
    try {
      const fresh = await sbFetch(`/rest/v1/voca_words?page_id=eq.${pid}&order=created_at`);
      if (Array.isArray(fresh) && fresh.length >= words.length) {
        words = fresh.map(_dbRowToWord);
        synced = true;
        console.log('[savePage] DB 동기화: ' + words.length + '개');
      }
    } catch(e) { console.warn('[savePage] DB 동기화 실패', e); }
  }
  const ex = findPage(book, pg);
  // 동기화된 목록은 '그 페이지의 전부' 다 — 기존 단어에 덧붙이면 화면에서 두 번 보인다
  if (ex) ex.words = synced ? words : [...ex.words, ...words];
  else { book.pages.push({ num: pg, _pid: pid, words }); book.pages.sort((a,b)=>pageSort(a,b)); }
  return savedCount;
}

async function saveManualWords(bookId) {
  if (isAssignedReadonly(bookId)) { toast(TT('과제 책은 편집할 수 없어요','Assigned books are read-only')); return; }
  const pg = document.getElementById('manual-pg')?.value.trim();
  if (!pg) { toast(TT('페이지 번호를 입력해주세요','Enter a page number')); return; }
  if (!window._manualWords?.length) { toast(TT('추가된 단어가 없어요','No words added yet')); return; }
  const btn = document.getElementById('manual-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = t('searchingMeaning'); btn.style.opacity = '0.6'; }
  toast(TT('단어 뜻을 검색하는 중이에요...','Looking up meanings...'));

  await _fillMeanings(window._manualWords, bookId, (done, need) => {
    if (btn) btn.textContent = `${t('searchingMeaning')} (${done}/${need})`;
  });
  const n = await _savePageAndMerge(bookId, pg, window._manualWords);
  toast(TX(`Page {v0} 저장 완료 ({v1}개)`,`Page {v0} saved ({v1} words)`,{v0:(pg),v1:(n)}));
  updateTotalWords();
  window._manualWords = [];
  replace({ name: 'page-words', bookId, pageNum: pg });
}

// HTML5 draggable 은 모바일에서 동작하지 않아 포인터 이벤트로 직접 구현.
(function _shelfDragInit(){
  const HOLD_MS = 320;      // 이만큼 누르고 있어야 드래그 시작 (스크롤과 구분)
  const SLOP = 10;          // 시작 전 이만큼 움직이면 스크롤로 간주하고 취소
  let timer = null, dragId = null, el = null, target = null, sx = 0, sy = 0, armed = false;

  const tileOf = (n) => n && n.closest ? n.closest('[data-bid]') : null;
  function clearTarget(){ if (target) { target.classList.remove('shelf-drop-target'); target = null; } }
  function cancel(){
    clearTimeout(timer); timer = null; armed = false;
    if (el) el.classList.remove('shelf-drag');
    clearTarget(); dragId = null; el = null;
  }

  document.addEventListener('pointerdown', (e) => {
    if (!_shelfEditing || e.button) return;
    if (e.target.closest('.tile-move')) return;          // ▲▼ 버튼은 그대로 클릭
    const t = tileOf(e.target);
    if (!t || !t.dataset.bid) return;
    sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => {
      armed = true; dragId = t.dataset.bid; el = t;
      el.classList.add('shelf-drag');
      try { navigator.vibrate && navigator.vibrate(12); } catch(_){}
    }, HOLD_MS);
  }, true);

  document.addEventListener('pointermove', (e) => {
    if (timer && !armed) {
      if (Math.abs(e.clientX - sx) > SLOP || Math.abs(e.clientY - sy) > SLOP) { clearTimeout(timer); timer = null; }
      return;
    }
    if (!armed) return;
    e.preventDefault();
    const over = tileOf(document.elementFromPoint(e.clientX, e.clientY));
    if (over === target) return;
    clearTarget();
    if (over && over !== el) { target = over; target.classList.add('shelf-drop-target'); }
  }, { passive: false });

  document.addEventListener('pointerup', () => {
    if (armed && dragId && target && target.dataset.bid) {
      const to = target.dataset.bid, from = dragId;
      cancel();
      dropShelfBook(from, to);   // 재렌더가 뒤따르므로 상태를 먼저 정리
      return;
    }
    cancel();
  });
  document.addEventListener('pointercancel', cancel);
})();

// 알림'이 있으면 OS 가 런처 아이콘에 배지를 붙여준다 → 배지를 띄우려면 알림을 보내야 한다.
// 웹에는 예약 알림이 없어서 서버(pg_cron + send-review-push)가 현지 시각에 맞춰 밀어준다.
// iOS 16.4+ / PC 설치형은 setAppBadge 로 숫자까지 직접 찍는다.
const VAPID_PUBLIC_KEY = 'BD5eG82STmtIqMQOpMOjoZfBS1xHRpyPvSBiM9rTV1ogVDcNAHD6OTOaa8QMcEnIudUL3AcOdwH37-LTm7uJVG8';   // ← VAPID 공개키. 비어 있으면 알림 기능이 숨겨진다(docs/push-setup.md)

function pushSupported(){
  // iOS 앱 안에서는 웹 푸시가 아예 없다(WKWebView 에 PushManager/ServiceWorker 없음).
  // 애플 서버(APNs)가 직접 기기로 보내는 네이티브 알림을 쓴다.
  if (_isIosApp()) return !!_capPlugin('PushNotifications');
  return !!(VAPID_PUBLIC_KEY && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window);
}
function _b64ToU8(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function _myTz(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Seoul'; } catch(e){ return 'Asia/Seoul'; } }

// 현재 구독 상태: 'unsupported' | 'denied' | 'off' | 'on'
async function pushState(){
  if (!pushSupported()) return 'unsupported';
  if (_isIosApp()) return nativePushState();
  if (Notification.permission === 'denied') return 'denied';
  try {
    const reg = await navigator.serviceWorker.ready;
    return (await reg.pushManager.getSubscription()) ? 'on' : 'off';
  } catch(e){ return 'off'; }
}

// 구독이 '지금 앱에 박힌 공개키'로 만들어졌는지 확인한다.
// VAPID 키를 바꾸면 기존 구독은 옛 키에 묶인 채로 남고, 발송할 때 푸시 서버가
// VapidPkHashMismatch(400) 로 거부한다 — 사용자는 아무 것도 모른 채 알림이 끊긴다.
// 그래서 키가 다르면 조용히 다시 구독하고 서버 행도 갱신한다.
function _sameKey(subKey){
  try {
    if (!subKey) return false;
    const a = new Uint8Array(subKey), b = _b64ToU8(VAPID_PUBLIC_KEY);
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  } catch(e){ return false; }
}
async function ensurePushKeyFresh(){
  try {
    if (_isIosApp()) return;                 // 네이티브는 VAPID 를 안 쓴다
    if (!pushSupported() || !currentUser) return;
    if (Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return;
    if (_sameKey(sub.options && sub.options.applicationServerKey)) return;   // 정상
    // 옛 키로 묶인 구독 → 버리고 새로 만든다
    const oldEp = sub.endpoint;
    await sub.unsubscribe().catch(()=>{});
    try { await sbFetch('/rest/v1/voca_push_subs?endpoint=eq.' + encodeURIComponent(oldEp), 'DELETE'); } catch(e){}
    await enablePush(Number(localStorage.getItem('imvoca.pushHour') || 9), true);
  } catch(e){}
}

// ── 네이티브 알림(APNs) ─────────────────────────────────────────
// 웹 푸시와 서버 표(voca_push_subs)를 공유한다. platform 컬럼으로 갈라서
// 엣지 함수가 웹은 VAPID, iOS 는 APNs 로 보낸다 — 문구·시간대 로직은 그대로 재사용.
// endpoint 컬럼에는 웹이면 푸시 URL, iOS 면 기기 토큰이 들어간다.
const _NATIVE_PUSH_ON = 'imvoca.nativePushOn';
let _apnsTokenPromise = null;

// register() 를 부르면 'registration' 이벤트로 토큰이 온다. 토큰이 올 때까지 기다린다.
function _apnsToken(){
  const PN = _capPlugin('PushNotifications');
  if (!PN) return Promise.reject(new Error('no-plugin'));
  if (_apnsTokenPromise) return _apnsTokenPromise;
  _apnsTokenPromise = new Promise((resolve, reject) => {
    const to = setTimeout(() => reject(new Error('APNs 토큰 시간 초과')), 20000);
    PN.addListener('registration', (t) => { clearTimeout(to); resolve(t && t.value); });
    PN.addListener('registrationError', (e) => { clearTimeout(to); reject(new Error((e && e.error) || 'registrationError')); });
    PN.register();
  });
  // 실패하면 캐시를 비워서 다음에 다시 시도할 수 있게 한다
  _apnsTokenPromise.catch(() => { _apnsTokenPromise = null; });
  return _apnsTokenPromise;
}

async function nativePushState(){
  const PN = _capPlugin('PushNotifications');
  if (!PN) return 'unsupported';
  try {
    const p = await PN.checkPermissions();
    if (p.receive === 'denied') return 'denied';
    if (p.receive !== 'granted') return 'off';
    // 권한이 있어도 사용자가 앱 안에서 끈 상태일 수 있다(서버 행을 지운 상태)
    return localStorage.getItem(_NATIVE_PUSH_ON) === '1' ? 'on' : 'off';
  } catch(e){ return 'off'; }
}

async function enableNativePush(hour, silent){
  const PN = _capPlugin('PushNotifications');
  if (!PN || !currentUser) return false;
  try {
    let perm = await PN.checkPermissions();
    if (perm.receive !== 'granted') perm = await PN.requestPermissions();
    if (perm.receive !== 'granted') {
      toast(perm.receive === 'denied'
        ? TT('알림이 차단돼 있어요. 설정 → IM VOCA → 알림에서 허용해주세요','Notifications are blocked — allow them in Settings → IM VOCA')
        : TT('알림을 켜지 않았어요','Notifications not enabled'));
      return false;
    }
    const token = await _apnsToken();
    if (!token) { toast(TT('알림을 켜지 못했어요','Could not enable notifications')); return false; }
    const res = await authPost('/rest/v1/voca_push_subs?on_conflict=endpoint', {
      user_id: currentUser.id, endpoint: token, platform: 'ios',
      tz: _myTz(), send_hour: Number(hour) || 9,
      lang: (userNativeLang || 'ko'), enabled: true, fail_count: 0,
    }, 'resolution=merge-duplicates,return=minimal');
    if (!res || !res.ok) { toast(TT('알림 설정 저장에 실패했어요','Could not save notification settings')); return false; }
    try { localStorage.setItem(_NATIVE_PUSH_ON, '1'); } catch(e){}
    if (!silent) toast(TT('🔔 복습 알림을 켰어요','🔔 Review reminders on'));
    try { track('enable_push', { hour: Number(hour) || 9, platform: 'ios' }); } catch(e){}
    return true;
  } catch(e){
    toast(TT('알림을 켜지 못했어요','Could not enable notifications'));
    return false;
  }
}

async function disableNativePush(){
  try {
    // 기기 토큰은 그대로 둔 채 서버 행만 지운다 (다시 켤 때 권한을 또 묻지 않아도 된다)
    const token = await _apnsToken().catch(() => null);
    if (token) await sbFetch('/rest/v1/voca_push_subs?endpoint=eq.' + encodeURIComponent(token), 'DELETE');
    try { localStorage.removeItem(_NATIVE_PUSH_ON); } catch(e){}
    const Badge = _capPlugin('Badge');
    if (Badge) await Badge.clear().catch(() => {});
    toast(TT('알림을 껐어요','Reminders off'));
  } catch(e){}
}

async function enablePush(hour, silent){
  if (_isIosApp()) return enableNativePush(hour, silent);
  if (!pushSupported()) { toast(TT('이 브라우저는 알림을 지원하지 않아요','Notifications are not supported here')); return false; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      toast(perm === 'denied'
        ? TT('알림이 차단돼 있어요. 브라우저 설정에서 허용해주세요','Notifications are blocked — allow them in browser settings')
        : TT('알림을 켜지 않았어요','Notifications not enabled'));
      return false;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: _b64ToU8(VAPID_PUBLIC_KEY) });
    const j = sub.toJSON();
    // 같은 endpoint 면 갱신(upsert) — 기기를 바꾸거나 권한을 다시 켤 때 중복 행이 쌓이지 않게.
    // sbFetch 는 빈 본문을 null 로 돌려줘 성공/실패 구분이 안 되므로 authPost(Response)를 쓴다.
    const res = await authPost('/rest/v1/voca_push_subs?on_conflict=endpoint', {
      user_id: currentUser.id, endpoint: j.endpoint,
      p256dh: j.keys.p256dh, auth: j.keys.auth,
      tz: _myTz(), send_hour: Number(hour) || 9,
      lang: (userNativeLang || 'ko'), enabled: true, fail_count: 0,
    }, 'resolution=merge-duplicates,return=minimal');
    if (!res || !res.ok) {
      await sub.unsubscribe().catch(()=>{});   // 서버에 못 남겼으면 구독도 되돌린다(유령 구독 방지)
      toast(TT('알림 설정 저장에 실패했어요','Could not save notification settings'));
      return false;
    }
    if (!silent) toast(TT('🔔 복습 알림을 켰어요','🔔 Review reminders on'));
    try { track('enable_push', { hour: Number(hour) || 9 }); } catch(e){}
    return true;
  } catch(e){
    toast(TT('알림을 켜지 못했어요','Could not enable notifications'));
    return false;
  }
}

async function disablePush(){
  if (_isIosApp()) return disableNativePush();
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      const ep = sub.endpoint;
      await sub.unsubscribe().catch(()=>{});
      await sbFetch('/rest/v1/voca_push_subs?endpoint=eq.' + encodeURIComponent(ep), 'DELETE');
    }
    try { if (navigator.clearAppBadge) await navigator.clearAppBadge(); } catch(e){}
    toast(TT('알림을 껐어요','Reminders off'));
  } catch(e){}
}

// 아이콘 배지 동기화 (iOS 16.4+ / PC 설치형에서만 숫자가 보인다. 안드로이드는 알림이 배지를 만든다)
async function syncAppBadge(){
  try {
    const n = (window._reviewBadgeCount || 0) + (typeof unreadNoticeCount === 'function' ? unreadNoticeCount() : 0);
    // 네이티브 앱: setAppBadge 가 없으므로 플러그인으로 직접 찍는다.
    // (APNs 가 보낸 배지는 알림을 지워도 남기 때문에, 앱을 열 때 실제 개수로 맞춰줘야 한다)
    const Badge = _capPlugin('Badge');
    if (Badge) { if (n > 0) await Badge.set({ count: n }); else await Badge.clear(); return; }
    if (!navigator.setAppBadge) return;
    if (n > 0) await navigator.setAppBadge(n); else await navigator.clearAppBadge();
  } catch(e){}
}

// ── 알림 권한 요청 타이밍 ───────────────────────────────────────
// 브라우저 알림 권한은 '한 번 차단하면 다시 물을 수 없다'. 게다가 크롬은 사이트의
// 허용률이 낮으면 팝업 자체를 막아버린다(조용한 알림). 그래서 접속하자마자 묻는 건
// 최악이다 — 대부분 거부 → 사이트가 통째로 차단돼 아무도 못 켜게 된다.
//
// 그래서 두 단계로 간다:
//   1) 우리 화면으로 먼저 묻는다 (브라우저 권한을 안 태운다)
//   2) '네'를 누른 사람에게만 진짜 브라우저 팝업을 띄운다 — 버튼 클릭 = 사용자 제스처라
//      requestPermission() 이 정상 동작한다
// '나중에'를 고른 사람은 권한이 'default' 로 남아 며칠 뒤 다시 물어볼 수 있다.
const _PUSH_ASK_KEY = 'imvoca.pushAsk';   // { n: 물어본 횟수, at: 마지막 시각 }
function _pushAskState(){ try { return JSON.parse(localStorage.getItem(_PUSH_ASK_KEY) || '{}') || {}; } catch(e){ return {}; } }
function _pushAskSave(o){ try { localStorage.setItem(_PUSH_ASK_KEY, JSON.stringify(o)); } catch(e){} }

// 암기 카드를 막 끝내 복습 일정이 생긴 직후에만 호출한다 (가치가 눈앞에 증명된 순간)
async function maybeAskPush(wordCount){
  try {
    if (!pushSupported()) return;
    const st = _pushAskState();
    if ((st.n || 0) >= 3) return;                            // 평생 3번까지만
    if (st.at && Date.now() - st.at < 7 * 86400000) return;  // 거절 후 7일은 쉰다
    if (_isIosApp()) {
      // iOS 도 권한 팝업은 '딱 한 번'만 뜬다. 아직 안 물어본 상태에서만 우리 화면을 먼저 띄운다.
      const nst = await nativePushState();
      if (nst !== 'off') return;                             // unsupported/denied/on → 건드리지 않음
      const PN = _capPlugin('PushNotifications');
      const perm = await PN.checkPermissions();
      if (perm.receive === 'granted') return;                // 권한은 있는데 꺼둔 것 → 본인 선택 존중
    } else {
      if (Notification.permission !== 'default') return;     // 이미 허용/차단 → 건드리지 않음
      const reg = await navigator.serviceWorker.ready;
      if (await reg.pushManager.getSubscription()) return;   // 이미 구독 중
    }
    _pushAskSave({ n: (st.n || 0) + 1, at: Date.now() });
    _showPushPrePrompt(wordCount);
  } catch(e){}
}

function _showPushPrePrompt(wordCount){
  if (document.getElementById('push-pre')) return;
  const hour = Number(localStorage.getItem('imvoca.pushHour') || 9);
  const hourOpts = Array.from({length:24}, (_,h) =>
    `<option value="${h}" ${h===hour?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('');
  const ov = document.createElement('div');
  ov.id = 'push-pre';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML = `
    <div style="background:var(--bg-card,#fff);border-radius:18px;padding:24px 22px;max-width:330px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.25);text-align:center;">
      <div style="font-size:38px;line-height:1;margin-bottom:10px;">🔔</div>
      <div style="font-family:var(--font-serif-ko);font-size:18px;font-weight:700;color:var(--ink-100);line-height:1.45;margin-bottom:8px;">
        ${TX(`방금 외운 {v0}개,<br>잊어버릴 때쯤 알려드릴까요?`,`Want a nudge before you forget<br>these {v0} words?`,{v0:(wordCount||0)})}
      </div>
      <div style="font-size:13px;color:var(--ink-60);line-height:1.7;margin-bottom:18px;">
        ${TT('망각곡선에 맞춰 복습할 날에만 딱 한 번 알려드려요. 광고는 보내지 않아요.','One reminder on the days your review is due — nothing else, ever.')}
      </div>
      <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-100);margin-bottom:16px;">
        <span>${TT('알림 받을 시각','Reminder time')}</span>
        <select id="push-pre-hour" style="font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--ink-100);background:var(--bg-page);border:1px solid var(--ink-12);border-radius:10px;padding:8px 12px;">${hourOpts}</select>
      </label>
      <button id="push-pre-yes" class="btn btn-solid" style="width:100%;padding:14px;font-size:14.5px;">${TT('네, 알려주세요','Yes, remind me')}</button>
      <button id="push-pre-no" style="width:100%;padding:12px;margin-top:6px;background:none;color:var(--ink-45);border:none;font-size:13px;cursor:pointer;font-family:var(--font-body);">${TT('나중에','Not now')}</button>
    </div>`;
  document.body.appendChild(ov);
  document.getElementById('push-pre-no').onclick = () => ov.remove();
  document.getElementById('push-pre-yes').onclick = async (e) => {
    const h = Number(document.getElementById('push-pre-hour')?.value || 9);
    try { localStorage.setItem('imvoca.pushHour', String(h)); } catch(_){}
    e.currentTarget.disabled = true;
    // 이 클릭이 사용자 제스처 → 여기서만 진짜 브라우저 권한 팝업이 뜬다
    const ok = await enablePush(h);
    ov.remove();
    if (ok) _pushAskSave({ n: 99, at: Date.now() });   // 켰으면 다시 묻지 않는다
  };
}

// ── 알림 설정 모달 ──────────────────────────────────────────────
async function showPushSettings(){
  const st = await pushState();
  const hour = Number(localStorage.getItem('imvoca.pushHour') || 9);
  const ov = document.createElement('div');
  ov.id = 'push-modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  const hourOpts = Array.from({length:24}, (_,h) =>
    `<option value="${h}" ${h===hour?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('');
  const body = st === 'unsupported'
    ? `<div style="font-size:13.5px;color:var(--ink-60);line-height:1.7;">${TT('이 브라우저에서는 알림을 지원하지 않아요.<br>안드로이드는 Play 스토어 앱, 아이폰은 사파리에서 <b>홈 화면에 추가</b> 후 사용할 수 있어요.','Not supported in this browser.<br>Use the Play Store app on Android, or add to Home Screen in Safari on iPhone.')}</div>`

    : `

        <span>${TT('알림 받을 시각','Reminder time')}</span>
        <select id="push-hour" style="font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--ink-100);background:var(--bg-page);border:1px solid var(--ink-12);border-radius:10px;padding:8px 12px;">${hourOpts}</select>

  ov.innerHTML = `

      <div style="font-family:var(--font-serif-ko);font-size:19px;font-weight:600;color:var(--ink-100);margin-bottom:12px;">🔔 ${TT('복습 알림','Review reminders')}</div>
      ${body}
      <button onclick="document.getElementById('push-modal').remove()" style="width:100%;padding:12px;margin-top:10px;background:none;color:var(--ink-45);border:none;font-size:13px;cursor:pointer;font-family:var(--font-body);">${TT('닫기','Close')}</button>
    </div>`;
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);

  const btn = document.getElementById('push-toggle');
  if (btn) btn.onclick = async () => {
    const h = Number(document.getElementById('push-hour')?.value || 9);
    try { localStorage.setItem('imvoca.pushHour', String(h)); } catch(e){}
    btn.disabled = true;
    if (st === 'on') await disablePush(); else await enablePush(h);
    ov.remove();
  };
}

// Service Worker 등록 (오프라인 지원 + 속도 향상)
// 업데이트는 조용히 처리한다: 새 HTML 은 SW 가 백그라운드에서 받아 캐시에 넣어두고,
// 다음 실행 때 자동으로 새 버전이 뜬다. 예전엔 '✨ 새 버전이 있어요' 토스트를 띄웠는데
// 배포할 때마다 떠서 성가셔 없앴다. (되살리려면 sw.js 의 HTML_UPDATED 도 함께 복원)
// 네이티브 앱은 화면이 이미 기기 안에 있어서 캐시가 필요 없다. 오히려 서비스워커
// 캐시가 남으면 앱을 업데이트해도 옛 화면이 뜨는 사고가 난다 (빌드 스크립트도 sw.js 를
// 일부러 번들에서 뺀다).
if (!_isIosApp() && 'serviceWorker' in navigator) {
  // 알림을 눌러 들어오면 복습 탭으로 보낸다
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'OPEN_REVIEW') { try { goTab('review'); } catch(_){} }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .catch((e) => console.warn('[SW] 등록 실패:', e));
    // 로그인·SW 준비가 끝날 즈음 구독 키가 최신인지 점검 (키 교체 시 자가 복구)
    setTimeout(() => { try { ensurePushKeyFresh(); } catch(e){} }, 5000);
  });
}
// 앱을 열면 배지를 정리한다 (알림으로 생긴 배지는 알림을 지우면 사라진다)
window.addEventListener('focus', () => { try { syncAppBadge(); } catch(e){} });

// ── 네이티브 앱 초기화 ──────────────────────────────────────────
(function initNativeApp(){
  if (!_capNative()) return;

  const App = _capPlugin('App');
  const Browser = _capPlugin('Browser');
  const PN = _capPlugin('PushNotifications');

  // 1) 소셜 로그인 복귀 — app.imvoca://auth#access_token=... 로 앱이 깨어난다
  if (App) {
    // 우리 스킴으로 앱이 깨어나면 = 소셜 로그인이 끝난 것.
    // 경로까지 일일이 맞추지 않고 스킴만 본다 — iOS 가 넘겨주는 문자열이
    // app.imvoca://auth / app.imvoca://auth/ 처럼 조금씩 다를 수 있어서,
    // 엄격하게 비교하면 창이 안 닫히고 사파리에 갇힌다.
    const handleAuthUrl = async (url) => {
      if (!url || url.indexOf('app.imvoca://') !== 0) return;
      // 토큰 처리보다 창 닫기를 먼저 — 실패하더라도 사용자가 앱으로 돌아오게 한다
      if (Browser) { try { await Browser.close(); } catch(e){} }
      const hash = url.indexOf('#') >= 0 ? url.slice(url.indexOf('#')) : '';
      if (hash.indexOf('access_token=') === -1) {
        toast(TT('로그인이 취소됐어요','Sign-in cancelled'));
        return;
      }
      try { await handleOAuthRedirect(hash); }
      catch(e){ toast(TT('로그인 처리에 실패했어요','Sign-in failed')); }
    };

    App.addListener('appUrlOpen', (ev) => { handleAuthUrl((ev && ev.url) || ''); });

    // 앱이 완전히 종료된 상태에서 딥링크로 켜지면 appUrlOpen 을 놓칠 수 있다.
    // 그때는 실행 URL 을 직접 물어본다.
    if (typeof App.getLaunchUrl === 'function') {
      App.getLaunchUrl().then(r => { if (r && r.url) handleAuthUrl(r.url); }).catch(()=>{});
    }

    // 2) 앱으로 돌아올 때 배지를 실제 개수로 맞춘다.
    //    APNs 가 찍은 배지는 알림을 지워도 남기 때문에 우리가 직접 지워줘야 한다.
    App.addListener('resume', () => {
      try { syncAppBadge(); } catch(e){}
      try { if (typeof checkReviews === 'function' && currentUser) checkReviews(); } catch(e){}
    });
  }

  // 3) 알림을 눌러 들어오면 복습 탭으로
  if (PN) {
    PN.addListener('pushNotificationActionPerformed', () => {
      try { goTab('review'); } catch(e){}
      try { syncAppBadge(); } catch(e){}
    });
  }

  // 4) 앱 안에서 바깥 링크(target=_blank 등)를 누르면 인앱 사파리로.
  //    그냥 두면 웹뷰가 그 페이지로 넘어가버려 앱으로 돌아올 방법이 없다.
  document.addEventListener('click', (e) => {
    const a = e.target && e.target.closest && e.target.closest('a[href^="http"]');
    if (!a) return;
    e.preventDefault();
    goExternal(a.href);
  }, true);

  // 5-a) 인앱 사파리를 닫고 돌아오면 iOS 가 웹뷰를 화면 전체 높이로 되돌린다.
  //      (innerHeight 820 → 874 로 확인) 그러면 상태바 자리가 없어져서, 화면 위쪽
  //      top:14px 에 있는 버튼 줄(관리·사용법·🔔·My)이 노치 밑에 깔려 보이지도
  //      눌리지도 않는다.
  //      StatusBar 플러그인은 값이 그대로면 아무 일도 하지 않으므로(내부 상태는
  //      여전히 false), true → false 로 한 번 흔들어서 웹뷰 크기를 다시 잡게 한다.
  const relayoutStatusBar = () => {
    const sb = _capPlugin('StatusBar');
    if (!sb) return;
    try {
      sb.setOverlaysWebView({ overlay: true })
        .then(() => sb.setOverlaysWebView({ overlay: false }))
        .catch(() => {});
    } catch(e){}
  };
  // 닫히는 애니메이션이 끝난 뒤에 잡아야 원래 크기로 되돌아가지 않는다
  if (Browser && typeof Browser.addListener === 'function') {
    Browser.addListener('browserFinished', () => setTimeout(relayoutStatusBar, 80));
  }
  if (App) {
    App.addListener('appStateChange', (st) => { if (st && st.isActive) setTimeout(relayoutStatusBar, 80); });
  }

  // 5) 상태바를 앱 배경색에 맞춘다.
  //    웹뷰는 capacitor.config.json 의 overlaysWebView:false 로 이미 상태바 아래에서
  //    시작한다(그래야 상단 버튼 줄이 노치에 가려지지 않는다). 여기서는 그 상태바
  //    영역의 배경색과 글씨 색만 테마에 맞춰 바꾼다.
  const SB = _capPlugin('StatusBar');
  if (SB) {
    const applyBar = () => {
      const dark = document.body.classList.contains('dark');
      // Style.Dark = 밝은 글씨(어두운 배경용), Style.Light = 어두운 글씨(밝은 배경용)
      try { SB.setStyle({ style: dark ? 'DARK' : 'LIGHT' }); } catch(e){}
      try { SB.setBackgroundColor({ color: dark ? '#1a1714' : '#f3ece0' }); } catch(e){}
    };
    applyBar();
    window.addEventListener('imvoca:theme', applyBar);
  }
})();
</script>
