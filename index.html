<script>
// ── Gemini API 모델 폴백 + 재시도 ──
const GEMINI_MODELS = ['gemini-2.5-flash', 'gemini-2.5-flash-lite'];
let _geminiModelIdx = 0;

// Gemini 응답에서 단어 목록을 최대한 견고하게 추출 (JSON이 잘려도 완성된 단어는 모두 살림)
// Gemini 응답에서 AI가 읽은 페이지 번호만 추출 (없으면 '')
function parsePageNum(rawText) {
  const clean = (rawText || '').replace(/```json|```/g, '').trim();
  // 정상 JSON에서 page 필드
  try {
    const p = JSON.parse(clean);
    if (p && typeof p.page !== 'undefined' && p.page !== null) return String(p.page).trim();
  } catch(e) {}
  // JSON이 깨졌어도 page 필드만 정규식으로
  const m = clean.match(/"page"\s*:\s*"([^"]*)"/);
  if (m) return m[1].trim();
  const m2 = clean.match(/"page"\s*:\s*(\d+)/);
  if (m2) return m2[1].trim();
  return '';
}

function parseWordsRobust(rawText) {
  const clean = (rawText || '').replace(/```json|```/g, '').trim();
  // 1차: 정상 JSON 시도
  try {
    const p = JSON.parse(clean);
    if (p.words && p.words.length) return p.words;
  } catch(e) {}
  // 2차: 마지막 불완전 객체만 잘라내고 닫기
  try {
    let fixed = clean.replace(/,?\s*\{[^}]*$/, '').replace(/,\s*$/, '');
    if (!fixed.endsWith(']}')) {
      if (!fixed.includes(']')) fixed += ']';
      if (!fixed.endsWith('}')) fixed += '}';
    }
    const p = JSON.parse(fixed);
    if (p.words && p.words.length) return p.words;
  } catch(e) {}
  // 3차: 완성된 단어 객체를 통째로 정규식으로 추출 (가장 견고)
  const words = [];
  const objRe = /\{[^{}]*?"en"\s*:\s*"([^"]+)"[^{}]*?\}/g;
  let m;
  while ((m = objRe.exec(clean)) !== null) {
    const block = m[0];
    const en = (block.match(/"en"\s*:\s*"([^"]+)"/) || [])[1] || '';
    const base = (block.match(/"base"\s*:\s*"([^"]+)"/) || [])[1] || '';
    const ctx = (block.match(/"ctx"\s*:\s*"([^"]+)"/) || [])[1] || '';
    const level = (block.match(/"level"\s*:\s*"([^"]+)"/) || [])[1] || '';
    const sentence = (block.match(/"sentence"\s*:\s*"([^"]+)"/) || [])[1] || '';
    if (en) words.push({ en, base, ctx, sentence, level });
  }
  if (words.length) return words;
  // 4차: 객체 매칭도 실패하면 en 필드만이라도 순서대로 긁기
  const ens = clean.match(/"en"\s*:\s*"([^"]+)"/g) || [];
  const bases = clean.match(/"base"\s*:\s*"([^"]+)"/g) || [];
  const ctxs = clean.match(/"ctx"\s*:\s*"([^"]+)"/g) || [];
  const levels = clean.match(/"level"\s*:\s*"([^"]+)"/g) || [];
  const sents = clean.match(/"sentence"\s*:\s*"([^"]+)"/g) || [];
  return ens.map((e, i) => ({
    en: e.match(/"en"\s*:\s*"([^"]+)"/)[1],
    base: bases[i] ? bases[i].match(/"base"\s*:\s*"([^"]+)"/)[1] : '',
    ctx: ctxs[i] ? ctxs[i].match(/"ctx"\s*:\s*"([^"]+)"/)[1] : '',
    sentence: sents[i] ? sents[i].match(/"sentence"\s*:\s*"([^"]+)"/)[1] : '',
    level: levels[i] ? levels[i].match(/"level"\s*:\s*"([^"]+)"/)[1] : ''
  }));
}

async function geminiWithRetry(body, maxRetry=7) {
  const totalModels = GEMINI_MODELS.length;
  let lastError = null;
  for (let attempt = 0; attempt < maxRetry; attempt++) {
    const modelIdx = (_geminiModelIdx + attempt) % totalModels;
    const model = GEMINI_MODELS[modelIdx];
    try {
      // Gemini 키는 서버(Edge Function 'gemini-proxy')에서만 사용 — 클라이언트에 노출 안 됨
      const res = await fetch(SB_URL + '/functions/v1/gemini-proxy', { method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+(_authToken||SB_KEY)}, body:JSON.stringify({ model, body }) });
      const data = await res.json();
      if (data.error) {
        const code = data.error.code, msg = data.error.message||'';
        const isRetryable = code===429||code===503||msg.includes('demand')||msg.includes('quota')||msg.includes('overloaded')||msg.includes('unavailable')||msg.includes('busy');
        if (isRetryable && attempt < maxRetry-1) {
          const nextModel = GEMINI_MODELS[(modelIdx+1)%totalModels];
          toast(`⚡ ${model} 혼잡 → ${nextModel} 전환 중...`);
          await new Promise(r=>setTimeout(r,2000)); continue;
        }
        return data;
      }
      _geminiModelIdx = modelIdx; return data;
    } catch(e) {
      lastError = e;
      if (attempt < maxRetry-1) { toast('네트워크 오류. 재시도 중...'); await new Promise(r=>setTimeout(r,3000)); }
    }
  }
  throw lastError || new Error('모든 모델 시도 실패');
}

async function openCamera() {
  if (!window._cameraShots) window._cameraShots = [];
  const area = document.getElementById('camera-area');
  const video = document.getElementById('camera-video');
  const isMobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
  if (isMobile) {
    video.style.width = '100%'; video.style.aspectRatio = '3/4'; video.style.maxHeight = ''; video.style.objectFit = 'cover';
  } else {
    video.style.width = '100%'; video.style.aspectRatio = '16/9'; video.style.maxHeight = ''; video.style.objectFit = 'cover';
  }
  try {
    const constraints = isMobile
      ? { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1080 }, height: { ideal: 1440 } } }
      : { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream; area.style.display = 'block'; window._cameraStream = stream;
  } catch(e) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream; area.style.display = 'block'; window._cameraStream = stream;
    } catch(e2) {
      // 라이브 카메라 실패(안드로이드 인앱브라우저 등) → OS 기본 카메라(1장)로 폴백
      area.style.display = 'none';
      const camInput = document.getElementById('camera-input');
      if (camInput) { camInput.value = ''; camInput.click(); }
      else { toast('카메라 접근 권한이 필요해요'); }
      return;
    }
  }
  updateCameraCounter();
}

function updateCameraCounter() {
  const shots = window._cameraShots || [];
  const counter = document.getElementById('camera-counter');
  const captureBtn = document.getElementById('camera-capture-btn');
  const useBtn = document.getElementById('camera-use-btn');
  if (counter) {
    counter.textContent = shots.length > 0 ? `${shots.length}/10 ${userNativeLang==='ko'?'장 촬영됨':'shots taken'}` : '';
    counter.style.display = shots.length > 0 ? 'block' : 'none';
  }
  if (captureBtn) {
    captureBtn.textContent = shots.length >= 10 ? userNativeLang==='ko'?'📸 최대 10장':'📸 Max 10' : userNativeLang==='ko'?'📸 촬영하기':'📸 Capture';
    captureBtn.disabled = shots.length >= 10;
    captureBtn.style.opacity = shots.length >= 10 ? '0.5' : '1';
  }
  if (useBtn) {
    useBtn.style.display = shots.length > 0 ? 'block' : 'none';
    useBtn.textContent = shots.length === 1 ? userNativeLang==='ko'?'✅ 이 사진 사용하기':'✅ Use This Photo' : userNativeLang==='ko'?`✅ ${shots.length}장 사용하기`:`✅ Use ${shots.length} Photos`;
  }
  // 썸네일 업데이트
  const thumbWrap = document.getElementById('camera-thumbs');
  if (thumbWrap) {
    thumbWrap.innerHTML = shots.map((d,i) => `
      <div style="position:relative;flex-shrink:0;">
        <img src="${d}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid var(--accent);">
        <button onclick="removeCameraShot(${i})" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#e74c3c;border:none;color:#fff;font-size:10px;cursor:pointer;line-height:18px;text-align:center;padding:0;">✕</button>
      </div>`).join('');
    thumbWrap.style.display = shots.length > 0 ? 'flex' : 'none';
  }
}

function removeCameraShot(i) {
  window._cameraShots.splice(i, 1);
  updateCameraCounter();
}

function closeCamera() {
  const video = document.getElementById('camera-video');
  const area = document.getElementById('camera-area');
  if (window._cameraStream) { window._cameraStream.getTracks().forEach(t => t.stop()); window._cameraStream = null; }
  video.srcObject = null; area.style.display = 'none';
}

function cancelCamera() {
  window._cameraShots = [];
  closeCamera();
}

function capturePhoto() {
  if ((window._cameraShots||[]).length >= 10) { toast('최대 10장까지 촬영할 수 있어요'); return; }
  const video = document.getElementById('camera-video');
  const canvas = document.getElementById('camera-canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const shot = canvas.toDataURL('image/jpeg', 0.82);
  if (!window._cameraShots) window._cameraShots = [];
  window._cameraShots.push(shot);
  // 플래시 효과
  const flash = document.getElementById('camera-flash');
  if (flash) { flash.style.opacity='1'; setTimeout(()=>flash.style.opacity='0', 150); }
  toast(`${window._cameraShots.length}${userNativeLang==='ko'?'장 촬영됨':' photos taken'}`);
  updateCameraCounter();
}

function useCameraShots() {
  const shots = window._cameraShots || [];
  if (!shots.length) return;
  closeCamera();
  if (shots.length === 1) {
    imgData = shots[0];
    window._cameraShots = [];
    window._multiImgData = null;
    renderUploadPreview();
  } else {
    window._multiImgData = [...shots];
    window._cameraShots = [];
    imgData = null;
    renderMultiPreview(window._multiImgData);
  }
}

// ── PDF 지원: pdf.js 를 필요할 때만 CDN 로드 후 페이지를 이미지로 변환 ──
const _PDF_MAX_PAGES = 10; // PDF 한 번에 처리할 최대 페이지(사진 10장 제한과 동일)
let _pdfjsPromise = null;
function _loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e){}
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { _pdfjsPromise = null; reject(new Error('pdf.js load failed')); };
    document.head.appendChild(s);
  });
  return _pdfjsPromise;
}
// PDF 파일 → 페이지별 JPEG dataURL 배열 (limit 만큼만)
async function _pdfToImages(file, limit) {
  const lib = await _loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  const n = Math.min(pdf.numPages, limit);
  const out = [];
  for (let i = 1; i <= n; i++) {
    const page = await pdf.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const targetMax = 1600; // 텍스트 인식 위해 사진(1200)보다 약간 높게
    const scale = Math.max(1, targetMax / Math.max(base.width, base.height));
    const vp = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    out.push(canvas.toDataURL('image/jpeg', 0.82));
  }
  return { images: out, total: pdf.numPages };
}
// 선택된 PDF(들) 처리 → 기존 단일/멀티 스캔 흐름으로 합류
async function handlePdfFiles(pdfs) {
  const ko = userNativeLang === 'ko';
  try {
    toast(ko ? 'PDF 변환 중...' : 'Converting PDF...');
    let all = [], totalPages = 0;
    for (const f of pdfs) {
      if (all.length >= _PDF_MAX_PAGES) break;
      const { images, total } = await _pdfToImages(f, _PDF_MAX_PAGES - all.length);
      all = all.concat(images); totalPages += total;
    }
    if (!all.length) { toast(ko ? 'PDF에서 페이지를 읽지 못했어요' : 'Could not read PDF'); return; }
    if (totalPages > all.length) toast(ko ? `PDF가 길어 처음 ${all.length}페이지만 처리해요` : `Long PDF — using first ${all.length} pages`);
    if (all.length === 1) { imgData = all[0]; window._multiImgData = null; renderUploadPreview(); }
    else { window._multiImgData = all; imgData = null; renderMultiPreview(all); }
  } catch (err) {
    console.warn('[pdf]', err);
    toast(ko ? 'PDF 처리 실패 — 사진으로 시도해주세요' : 'PDF failed — try images');
  }
}

function handleFileChange(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  // PDF 가 포함되면 PDF 경로로 처리 (이미지와 섞이면 PDF 우선)
  const pdfs = files.filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (pdfs.length) { handlePdfFiles(pdfs); if (e.target) e.target.value = ''; return; }
  if (files.length > 10) { toast('최대 10장까지만 선택할 수 있어요'); return; }
  const readers = files.map(f => new Promise(resolve => {
    const img = new Image(), r = new FileReader();
    r.onload = ev => {
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1200; let w = img.width, h = img.height;
        if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h*MAX/w); w=MAX; } else { w=Math.round(w*MAX/h); h=MAX; } }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  }));
  Promise.all(readers).then(dataUrls => {
    if (dataUrls.length === 1) {
      imgData = dataUrls[0];
      window._multiImgData = null;
      renderUploadPreview();
    } else {
      window._multiImgData = dataUrls;
      imgData = null;
      renderMultiPreview(dataUrls);
    }
    // 같은 파일을 다시 선택해도 onchange가 동작하도록 초기화
    if (e.target) e.target.value = '';
  });
}

// ── 여러 장 순서대로 스캔 ──
async function doMultiScan() {
  const bId = document.getElementById('up-book-sel')?.value;
  if (!bId) { toast('책을 먼저 선택해주세요'); return; }
  const dataUrls = window._multiImgData;
  if (!dataUrls?.length) return;
  window._multiQueue = [...dataUrls];
  window._multiTotal = dataUrls.length;
  window._multiImgData = null; // 원본 배열 참조 해제 → 장을 처리할 때마다 메모리 회수됨
  window._multiIdx = 0;
  window._multiBookId = bId;
  window._multiAccumWords = [];
  window._multiPageNums = [];
  window._multiLastPage = '';
  await processNextMultiScan();
}

async function processNextMultiScan() {
  // 스캔 제한 체크 (멀티스캔 첫 장에서만)
  // 무료 스캔 제한: 매 장마다 확인 (멀티에서 제한 우회 방지)
  if (!canScan()) {
    if ((window._multiAccumWords||[]).length) { await finalizeMultiScan(); }
    else { window._multiImgData = null; window._multiAccumWords = []; window._multiPageNums = []; window._multiLastPage = ''; }
    handleScanBlocked();
    return;
  }
  const idx = window._multiIdx;
  const total = window._multiTotal || 0;
  const bId = window._multiBookId;
  if (idx >= total) {
    await finalizeMultiScan();
    return;
  }
  const currentImg = window._multiQueue[idx];
  window._multiQueue[idx] = null;
  renderScanLoading(idx+1, total);
  let words;
  try {
    const b64 = currentImg.split(',')[1], mt = currentImg.split(';')[0].split(':')[1];
    const data = await geminiWithRetry({ contents:[{parts:[{inline_data:{mime_type:mt,data:b64}},{text:buildScanPrompt(false)}]}], generationConfig:{temperature:0.1,maxOutputTokens:16384} });
    if (data.error) {
      if (data.error.code==='scan_limit') { handleScanBlocked(); return; } // 서버 한도 초과 → 중단
      if (data.error.code===403) { toast('API 키를 확인해주세요'); render(); return; }
      toast(userNativeLang==='ko'?`${idx+1}번 사진 처리 실패, 건너뛰어요`:`Photo ${idx+1} failed, skipping`);
      window._multiIdx++; await processNextMultiScan(); return;
    }
    if (!data.candidates?.[0]) { toast(userNativeLang==='ko'?`${idx+1}번 사진 응답 오류, 건너뛰어요`:`Photo ${idx+1} no response, skipping`); window._multiIdx++; await processNextMultiScan(); return; }
    const txt = data.candidates[0].content.parts[0].text;
    words = parseWordsRobust(txt);
    if (!words?.length) { toast(userNativeLang==='ko'?`${idx+1}번 사진에서 단어를 찾지 못했어요, 건너뛰어요`:`No words in photo ${idx+1}, skipping`); window._multiIdx++; await processNextMultiScan(); return; }
    window._aiPageNum = parsePageNum(txt);
  } catch(e) { toast(userNativeLang==='ko'?`${idx+1}번 사진 네트워크 오류, 건너뛰어요`:`Photo ${idx+1} network error, skipping`); window._multiIdx++; await processNextMultiScan(); return; }
  await incrementScanCount();
  pendingW = words; pendingB = bId; pendingP = null;
  renderWordSelectionMulti(words, idx, total);
}

async function saveMultiWords(idx, total) {
  const btn = document.getElementById('save-words-btn');
  if (btn?.disabled) return;
  const pg = document.getElementById('multi-pg-inp')?.value.trim();
  const selected = pendingW.filter((_, i) => window._wordSelected[i]);
  // 페이지마다 저장하지 않고, 고른 단어를 모았다가 마지막에 한 페이지로 합침
  window._multiAccumWords = window._multiAccumWords || [];
  window._multiPageNums = window._multiPageNums || [];
  if (selected.length) window._multiAccumWords.push(...selected);
  if (pg) { window._multiPageNums.push(pg); window._multiLastPage = pg; }
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; }
  window._multiIdx = idx + 1;
  await processNextMultiScan();
}

// 멀티 스캔 마무리: 모은 단어를 하나의 페이지(범위 제목)로 저장
async function finalizeMultiScan() {
  const bId = window._multiBookId;
  const all = window._multiAccumWords || [];
  const book = findBook(bId);
  if (!all.length || !book) {
    toast(userNativeLang==='ko'?'저장된 단어가 없어요':'No words saved');
    window._multiImgData=null; window._multiAccumWords=[]; window._multiPageNums=[]; window._aiPageNum='';
    stack = [{ name:'library' }, { name:'book', bookId:bId }];
    render(); return;
  }
  // 입력된 페이지 번호로 범위 제목 만들기 (처음-끝)
  const nums = (window._multiPageNums||[]).filter(x=>x);
  let title;
  if (nums.length >= 2 && nums[0] !== nums[nums.length-1]) title = `${nums[0]}-${nums[nums.length-1]}`;
  else if (nums.length >= 1) title = `${nums[0]}`;
  else title = userNativeLang==='ko' ? '묶음' : 'group';
  // 같은 제목이 이미 있으면 뒤에 번호
  let finalTitle = title, n = 2;
  while (book.pages.some(p => String(p.num) === finalTitle)) finalTitle = `${title}-${n++}`;
  renderScanLoading();
  const saveRes = await savePageWordsToDB(bId, finalTitle, all);
  const pid = saveRes?.pageId || null;
  // DB에 실제 저장된 행만 메모리에 반영 (진짜 id 사용)
  const words = (saveRes?.savedRows||[]).map(_dbRowToWord);
  book.pages.push({ num: finalTitle, _pid: pid, words });
  book.pages.sort((a,b)=>pageSort(a,b));
  updateTotalWords();
  window._multiImgData=null; window._multiAccumWords=[]; window._multiPageNums=[]; window._aiPageNum='';
  toast(userNativeLang==='ko'?`✅ Page ${finalTitle} 저장 완료 (${words.length}개)`:`✅ Page ${finalTitle} saved (${words.length})`);
  stack = [{ name:'library' }, { name:'book', bookId:bId }, { name:'page-words', bookId:bId, pageNum:finalTitle }];
  render();
}

function buildScanPrompt(useExclude=true) {
  const target = getTargetLang(), native = getNativeLang();
  const exclude = useExclude ? buildExcludePrompt() : '';
  const wordCount = getScanWordCount();
  const isEnglish = (target.code === 'en' || target.name === 'English' || target.name === '영어');
  const levelGuide = isEnglish
    ? `CEFR 난이도 기준으로 각 단어를 반드시 분류하세요:\n- C2: 원어민 수준\n- C1: 대학/원서 수준 고급 어휘\n- B2: 고급 중급\n- B1: 중급\n- A2: 초급\n어떤 단어를 고를지는 어려운 단어(C1~C2)를 우선 선택하되, 필요하면 B2·B1도 포함하세요.`
    : `각 단어의 난이도를 5단계로 분류하세요. 사용 빈도가 낮고 어려울수록 높은 등급입니다:\n- C2: 매우 어려움 (전문·희귀 어휘)\n- C1: 어려움 (고급 어휘)\n- B2: 중상급\n- B1: 중급\n- A2: 초급 (기초 어휘)\n어떤 단어를 고를지는 어려운 단어(C1~C2)를 우선 선택하되, 필요하면 B2·B1도 포함하세요.`;
  return `이 ${target.name} 책 페이지에서 어려운 ${target.name} 단어를 추출해주세요.\n목표 분량은 약 ${wordCount}개입니다. 어려운 단어(C1~C2)를 우선으로 약 ${wordCount}개를 골라주세요. 개수를 채우려고 쉬운 단어(A2~B1)를 억지로 넣지 마세요. 이 페이지에 어려운 단어가 ${wordCount}개보다 적으면 ${wordCount}개보다 적게 뽑아도 됩니다.\n${levelGuide}${exclude}\n\n⚠️ 단어 배열 순서: 고른 단어들을 난이도순이 아니라, 책 본문에 등장하는 순서대로(페이지 위 → 아래, 왼쪽 → 오른쪽) "words" 배열에 넣어주세요. 독자가 본문을 읽으며 단어를 쉽게 찾을 수 있게 하는 것이 목적입니다.\n\n또한 이 사진에서 페이지 번호가 보이면 읽어서 page 필드에 넣어주세요. 페이지 번호가 안 보이면 page는 빈 문자열("")로 두세요. 페이지 번호는 보통 페이지 위쪽이나 아래쪽 모서리에 있는 숫자나 로마숫자입니다. 연도, 각주 번호, 본문 속 숫자는 페이지 번호가 아닙니다.\n\n중요: "en" 필드에는 ${target.name} 단어를 넣고, "base"와 "ctx" 필드에는 ${native.name}로 된 뜻을 넣어주세요. "en"이라는 이름이지만 실제로는 ${target.name} 단어가 들어갑니다. 또한 각 단어를 사용한 짧고 자연스러운 ${target.name} 예문 한 문장을 "sentence" 필드에 넣어주세요.\n\n전문 용어(의학·법률·화학·공학 등 전문 분야 어휘)인 경우, "ctx" 필드에 단순 번역에 그치지 말고 그 개념을 이해하는 데 도움이 되는 간단한 부연 설명(정의·역할·상위 개념)을 한 문장 더해주세요. 예: "ketone" → "카르보닐기(C=O)를 가진 유기 화합물의 한 종류로, 알데하이드와 함께 카르보닐 화합물에 속한다".\n\n반드시 JSON만 반환 (level 필드는 C2/C1/B2/B1/A2 중 하나):\n{"page":"34","words":[{"en":"${target.name} 단어","base":"${native.name} 뜻","ctx":"${native.name} 문맥 뜻 + (전문 용어면) 개념 설명","sentence":"그 단어를 사용한 짧은 ${target.name} 예문","level":"C1"}]}`;
}

// ── 이미 등록된 단어 목록 추출 ──
function getExistingWordList() {
  const words = [];
  books.forEach(book => {
    book.pages.forEach(page => {
      page.words.forEach(w => {
        if (w.en) words.push(w.en.toLowerCase().trim());
      });
    });
  });
  // 중복 제거
  return [...new Set(words)];
}

function buildExcludePrompt() {
  const existing = getExistingWordList();
  if (!existing.length) return '';
  // 최근 100개만 (너무 많으면 Gemini 응답 품질 저하)
  const limited = existing.slice(-100);
  return `\n\n가능하면 이미 등록된 단어는 피해주세요 (필수는 아님):\n${limited.join(', ')}`;
}

async function doScan() {
  // 스캔 제한 체크
  if (!canScan()) { handleScanBlocked(); return; }
  const bId = document.getElementById('up-book-sel')?.value;
  if (!bId) { toast('책을 먼저 선택해주세요'); return; }
  let pg;
  if (window._captureMode === 'add') {
    if (!window._addTargetPage) { toast('추가할 페이지를 선택해주세요'); return; }
    pg = window._addTargetPage;
    const newName = document.getElementById('rename-pg-inp')?.value.trim();
    if (newName) window._renamedPageNum = newName; else window._renamedPageNum = null;
  } else {
    pg = document.getElementById('up-pg-inp')?.value.trim();
    if (!pg) { toast('페이지 번호를 입력해주세요'); return; }
  updateTotalWords();
  window._renamedPageNum = null;
}
  if (!imgData) { toast('사진을 먼저 선택해주세요'); return; }
  renderScanLoading();
  let words;
  try {
    const b64 = imgData.split(',')[1], mt = imgData.split(';')[0].split(':')[1];
    const data = await geminiWithRetry({ contents:[{parts:[{inline_data:{mime_type:mt,data:b64}},{text:buildScanPrompt(true)}]}], generationConfig:{temperature:0.1,maxOutputTokens:16384} });
    if (data.error) {
      if (data.error.code==='scan_limit') { handleScanBlocked(); return; } // 서버 한도 초과
      if (data.error.code===403) toast('API 키를 확인해주세요');
      else toast('오류가 발생했어요\n잠시 후 다시 시도해주세요');
      render(); return;
    }
    if (!data.candidates?.[0]) { toast('응답 오류, 다시 시도해주세요'); render(); return; }
    const txt = data.candidates[0].content.parts[0].text;
    words = parseWordsRobust(txt);
    if (!words?.length) { toast('단어를 찾지 못했어요'); render(); return; }
  } catch(e) { toast('네트워크 오류\n잠시 후 다시 시도해주세요'); render(); return; }
  await incrementScanCount();
  pendingW = words; pendingB = bId; pendingP = pg;
  renderWordSelection(words);
}

async function acceptWords() {
  const book = findBook(pendingB); if (!book) return;
  const saveRes = await savePageWordsToDB(pendingB, pendingP, pendingW);
  const pid = saveRes?.pageId || null;
  let words = (saveRes?.savedRows||[]).map(_dbRowToWord);
  // 안전장치 1: 저장 후 DB에서 이 페이지의 모든 단어를 다시 가져와 메모리와 동기화 (다른 기기에서 추가한 단어 보존)
  if (pid) {
    try {
      const fresh = await sbFetch(`/rest/v1/voca_words?page_id=eq.${pid}&order=created_at`);
      if (Array.isArray(fresh) && fresh.length >= words.length) {
        // DB에서 가져온 게 우선 (다른 기기에서 추가한 것 포함)
        words = fresh.map(_dbRowToWord);
        console.log('[acceptWords] DB 동기화: ' + words.length + '개 단어 확인');
      }
    } catch(e) { console.warn('[acceptWords] DB 동기화 실패, 로컬 사용', e); }
  }
  const ex = findPage(book, pendingP);
  const newName = window._renamedPageNum;
  if (ex) {
    ex.words = [...ex.words, ...words];
    if (newName && newName !== pendingP) {
      try {

// 시험용 단어 심화 분석을 백그라운드로 채워넣기
async function enrichExamWords(bookId, pageId) {
  const book = findBook(bookId);
  if (!book) return;
  const page = book.pages.find(p => p._pid === pageId);
  if (!page || !page.words) return;
  // analysis 없는 단어만 (이미 있는 건 스킵)
  const targets = page.words.filter(w => w.id && !w.analysis);
  if (targets.length === 0) return;
  const bookCat = book.category || 'general';
  let categoryContext = '';
  if (bookCat && bookCat !== 'general') {
    if (bookCat.startsWith('custom:')) categoryContext = categoryToContext('custom', bookCat.slice(7));
    else categoryContext = categoryToContext(bookCat, '');
  }
  for (const w of targets) {
    try {
      const result = await fetchWordMeaning(w.en, categoryContext, true);
      if (result.analysis) {
        w.analysis = result.analysis;
        // DB에도 저장
        try {
          await sbFetch(`/rest/v1/voca_words?id=eq.${w.id}`, 'PATCH', { analysis: result.analysis });
        } catch(e) { console.warn('[enrichExamWords] DB 저장 실패', w.en, e); }
      }
    } catch(e) { console.warn('[enrichExamWords] 분석 실패', w.en, e); }
  }
  // 현재 페이지를 보고 있으면 다시 렌더 (사용자가 그동안 그 화면에 있으면 분석 보이게)
  if (typeof render === 'function' && route && route.name === 'page-words' && String(route.pageNum) === String(page.num)) {
    render();
  }
}

async function toggleFavorite(bookId, pageNum, wordIdx) {
  const book = findBook(bookId);
  const page = book ? findPage(book, pageNum) : null;
  const word = page?.words[wordIdx];
  if (!word) return;
  if (!word.id) { toast(userNativeLang==='ko'?'새로고침 후 즐겨찾기를 쓸 수 있어요':'Reload to favorite this word'); return; }
  const next = !word.fav;
  word.fav = next;
  renderKeepScroll();
  const url = `/rest/v1/voca_words?id=eq.${word.id}`;
  const send = async () => {
    const opt = { method:'PATCH', headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }, body: JSON.stringify({ is_favorite: next }) };
    let res = await fetch(SB_URL + url, opt);
    if ((res.status===401||res.status===403) && await refreshSession()) { opt.headers.Authorization = 'Bearer '+_authToken; res = await fetch(SB_URL + url, opt); }
    return res;
  };
  try {
    const res = await send();
    if (!res.ok) throw new Error('fav write failed ' + res.status);
  } catch(e) { word.fav = !next; renderKeepScroll(); toast(userNativeLang==='ko'?'잠시 후 다시 시도해주세요':'Please try again'); }
}

// 예문 일괄 채우기 (묶음 호출, 1회성) - 책 메뉴에서 실행
async function backfillSentences(bookId) {
  if (!apiKey) { toast(userNativeLang==='ko'?'먼저 AI(API) 키 설정이 필요해요':'API key required first'); return; }
  const book = findBook(bookId); if (!book) return;
  const targets = [];
  book.pages.forEach(p => p.words.forEach(w => { if (w.id && !w.sentence) targets.push(w); }));
  if (!targets.length) { toast(userNativeLang==='ko'?'이미 모든 단어에 예문이 있어요':'All words already have examples'); return; }
  if (!confirm(userNativeLang==='ko'?`예문 없는 단어 ${targets.length}개에 AI로 예문을 채울까요?`:`Generate examples for ${targets.length} words?`)) return;
  const target = getTargetLang();
  const BATCH = 20; let done = 0;
  for (let i=0; i<targets.length; i+=BATCH) {
    const chunk = targets.slice(i, i+BATCH);
    toast(userNativeLang==='ko'?`예문 생성 중... (${done}/${targets.length})`:`Generating... (${done}/${targets.length})`);
    const wordList = chunk.map(w => w.en).join(', ');
    const prompt = `다음 ${target.name} 단어 각각에 대해 그 단어를 사용한 짧고 자연스러운 ${target.name} 예문을 하나씩 만들어주세요. 단어: ${wordList}\n\n반드시 JSON만 반환: {"sentences":{"단어":"예문"}}`;
    let map = {};
    try {
      const data = await geminiWithRetry({ contents:[{parts:[{text:prompt}]}], generationConfig:{temperature:0.3,maxOutputTokens:4096} });
      const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const clean = txt.replace(/```json|```/g,'').trim();
      try { map = JSON.parse(clean).sentences || {}; }
      catch(e2) { const re=/"([^"]+)"\s*:\s*"([^"]+)"/g; let m; while((m=re.exec(clean))!==null){ if(m[1]!=='sentences') map[m[1]]=m[2]; } }
    } catch(e) { toast(userNativeLang==='ko'?'생성 실패, 잠시 후 다시 시도':'Failed, try later'); render(); return; }
    for (const w of chunk) {
      const key = Object.keys(map).find(k => k.toLowerCase() === w.en.toLowerCase());
      const sent = key ? map[key] : '';
      if (sent) { w.sentence = sent; try { await sbFetch(`/rest/v1/voca_words?id=eq.${w.id}`, 'PATCH', { sentence: sent }); } catch(e){} }
      done++;
    }
  }
  render();
  toast(userNativeLang==='ko'?`✅ 예문 ${done}개 채웠어요!`:`✅ Filled ${done} examples!`);
}

  }

  else if (route.name === 'page-words') {

    if (isPageLocked(route.bookId, route.pageNum)) {
      root.innerHTML = `
        <div class="scr">
          <div class="topnav"><span class="topnav__back" onclick="back()">←</span><span class="topnav__title">${esc(book.title)} · ${String(page.num)}</span><span></span></div>

            <div style="font-size:13px;color:var(--ink-60);line-height:1.7;max-width:300px;margin:0 auto 20px;">${userNativeLang==='ko'?`${String(page.num)}부터는 프리미엄 또는 단체 결제로 열려요.<br>Day 1은 무료로 체험할 수 있어요!`:'Day 2+ unlocks with Premium or an academy plan. Day 1 is free!'}</div>

    // 안전장치: 이 페이지의 단어를 DB에서 fresh 로드 (백그라운드, 다른 기기 동기화)

        <div class="scr-scroll" style="margin-top:12px">
          ${page.words.map((w,wi)=>{const lc={'C2':'#7b2d8b','C1':'#c0392b','B2':'#e67e22','B1':'#2980b9','A2':'#27ae60','A1':'#95a5a6'};const lv=w.level||'';return `<div class="word-item"><div style="display:flex;align-items:center;gap:8px;"><div class="word-item__en">${esc(w.en)}</div>${(lv&&!/^\d+$/.test(lv))?`<span style="font-size:10px;font-weight:700;color:#fff;background:${lc[lv]||'#999'};border-radius:99px;padding:2px 7px;">CEFR ${lv}</span>`:''}<button onclick="_playSmart('${jsq(w.en)}','${_audioUrl(w,'w')}')" style="background:none;border:none;cursor:pointer;font-size:16px;padding:0;">🔊</button>${book._readonly ? `<span style="margin-left:auto;"></span>` : `<button onclick="toggleFavorite('${jsq(book.id)}','${jsq(page.num)}',${wi})" style="background:none;border:none;cursor:pointer;font-size:15px;padding:0;margin-left:auto;color:${w.fav?'#f39c12':'var(--ink-40)'};" title="${userNativeLang==='ko'?'즐겨찾기':'Favorite'}">${w.fav?'⭐':'☆'}</button><button onclick="deletePageWord('${jsq(book.id)}','${jsq(page.num)}',${wi})" style="background:none;border:none;cursor:pointer;font-size:14px;padding:0;color:var(--ink-40);" title="${userNativeLang==='ko'?'단어 삭제':'Delete word'}">🗑️</button>`}</div><div class="word-item__base">${esc(w.base)}</div><div class="word-item__ctx">↳ <em>${esc(w.ctx)}</em></div>${w.sentence?`<div class="word-item__ctx" style="color:var(--ink-60);margin-top:3px;">📝 ${esc(w.sentence)}</div>`:''}${w.analysis?renderWordAnalysis(w.analysis, book.id, page.num, wi):''}</div>`;}).join('')}

  else if (route.name === 'stats') { renderStats(root, dock); return; }

  else if (route.name === 'study-setup') {

        <div class="label-xs" style="margin-top:20px">${t('bookLabel')}</div>
        <div style="margin-top:6px">
          ${books.map(b=>`<div class="list-row" onclick="ssSelectBook('${b.id}')"><div style="width:38px;height:52px;border-radius:5px;background:${b.color};flex-shrink:0"></div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--ink-100);">${esc(b.title)}</div><div style="font-size:11px;color:var(--ink-60);margin-top:2px">${esc(b.author)} · ${countWords(b)} words</div></div><div class="radio ${s.bookId===b.id?'radio--on':''}">${s.bookId===b.id?'✓':''}</div></div>`).join('')}
        </div>
        ${book?`<div class="label-xs" style="margin-top:16px">${t('scopeLabel')}</div><div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">
          <div class="scope-card ${s.scope==='all'?'scope-card--on':''}" onclick="ssSelectScope('all')"><div class="scope-card__head"><div><div class="scope-card__name">${t('scopeAll')}</div><div class="scope-card__hint">${countWords(book)} words · 무작위로 섞기</div></div><div class="radio ${s.scope==='all'?'radio--on':''}">${s.scope==='all'?'✓':''}</div></div></div>
          <div class="scope-card ${s.scope==='page'?'scope-card--on':''}" onclick="ssSelectScope('page')"><div class="scope-card__head"><div><div class="scope-card__name">${t('scopePage')}</div><div class="scope-card__hint">${userNativeLang==='ko'?'한 페이지씩 끊어서':'One page at a time'}</div></div><div class="radio ${s.scope==='page'?'radio--on':''}">${s.scope==='page'?'✓':''}</div></div>${s.scope==='page'?`<div class="chip-wrap" style="margin-top:12px">${book.pages.map(p=>`<span class="chip" style="${String(s.page)===String(p.num)?'background:var(--ink-100);color:var(--bg-page);border-color:var(--ink-100)':''}" onclick="event.stopPropagation();window._ss.page='${p.num}';ssRender()">Page ${p.num} · ${p.words.length}</span>`).join('')}</div>`:''}</div>
        </div>`:''}
        <div style="height:22px"></div>
        <div class="study-start-bar" style="position:sticky;bottom:0;background:linear-gradient(to top,var(--bg-page) 75%,transparent);padding:12px 0 14px;display:flex;flex-direction:column;gap:10px;margin-top:8px;">
          <button class="btn ${canStart?'btn-solid':'btn-outline'}" style="opacity:${canStart?1:0.4};cursor:${canStart?'pointer':'default'}" onclick="${canStart?'ssStart()':''}">${t('flashCard')}${canStart?` — ${total}개`:''}</button>
          <button class="btn btn-outline" style="opacity:${canStart?1:0.4};cursor:${canStart?'pointer':'default'}" onclick="${canStart?`startQuiz('${s.bookId}','${s.scope}','${s.page}')`:''}" >${t('quizModeBtn')}${canStart?` — ${total}개`:''}</button>
        </div>`;
    };
    root.innerHTML = `<div class="scr" style="padding-bottom:90px;padding-top:50px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><img src="https://imvoca.app/2.png" style="width:36px;height:36px;object-fit:contain;"><div style="font-family:var(--font-body);font-weight:500;letter-spacing:-0.02em;font-size:24px;color:var(--ink-100);">${userNativeLang==='ko'?'암기 카드':'Flashcards'}</div></div><div class="muted" style="font-size:12px;margin-top:2px;">${t('whichBook')}</div><div class="scr-scroll" id="study-setup-inner"></div></div>` + dock;
    ssRender();
  }

  else if (route.name === 'study-cards') {
    if (!studyState || studyState.bookId !== route.bookId) { initStudy(route.bookId, route.scope, route.pageNum); }
    renderStudyCard(); return;
  }

  else if (route.name === 'quiz') {
    if (!window._quiz || window._quiz.bookId !== route.bookId) { startQuiz(route.bookId, route.scope, route.pageNum); }
    renderQuiz(); return;
  }

  else if (route.name === 'study-done') {
    const book = findBook(route.bookId);
    root.innerHTML = `
      <div class="scr">
        <div class="topnav"><span></span><span class="topnav__title">${book?.title||''}</span><span class="topnav__right" onclick="goTab('books')">✕</span></div>
        <div class="done">
          ${(window._lastEarnedScore>0)?(
            window._lastReviewFinished ? `
          <div class="celebrate-card celebrate-card--master">
            <div class="celebrate-coin">🏆</div>
            <div class="celebrate-title" style="color:#b8860b;">${userNativeLang==='ko'?'완벽하게 마스터했어요! 🎉':'Fully Mastered! 🎉'}</div>
            <div class="celebrate-score" style="color:#d4af37;">+${window._lastEarnedScore}<span style="font-size:20px;font-weight:600;">${userNativeLang==='ko'?'점':'pts'}</span></div>
            <div class="celebrate-bonus">${userNativeLang==='ko'?`🔥 완주 보너스 2배! (${window._lastBaseScore} × 2)`:`🔥 Completion bonus ×2! (${window._lastBaseScore} × 2)`}</div>
            <div class="celebrate-sub" style="margin-top:6px;">${userNativeLang==='ko'?'모든 복습 단계를 끝까지 완주했어요!':'You completed every review stage!'}</div>
          </div>` : `
          <div class="celebrate-card">
            <div class="celebrate-coin">🪙</div>
            <div class="celebrate-title">${userNativeLang==='ko'?'축하합니다! 🎉':'Congratulations! 🎉'}</div>
            <div class="celebrate-score">+${window._lastEarnedScore}<span style="font-size:20px;font-weight:600;">${userNativeLang==='ko'?'점':'pts'}</span></div>
            <div class="celebrate-sub">${userNativeLang==='ko'?'복습 점수를 획득했어요':'Review points earned'}</div>
            <div class="celebrate-hint">${userNativeLang==='ko'?'🔥 마지막 단계까지 완주하면 점수 2배!':'🔥 Finish all stages for double points!'}</div>
          </div>`
          ):(window._lastReviewLate ? `
          <div class="celebrate-card" style="background:var(--bg-input);">
            <div class="celebrate-coin">⏰</div>
            <div class="celebrate-title" style="color:var(--ink-60);">${userNativeLang==='ko'?'점수 없음 · 늦은 복습':'No points · late review'}</div>
            <div style="display:inline-block;background:#fdecec;color:#c0392b;font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px;margin:8px 0 4px;">${userNativeLang==='ko'?`복습 예정일 ${window._lastReviewDue} · ${window._lastReviewLateDays}일 지남`:`Due ${window._lastReviewDue} · ${window._lastReviewLateDays}d late`}</div>
            <div class="celebrate-sub" style="margin-top:8px;line-height:1.6;">${userNativeLang==='ko'?`예정일(${window._lastReviewDue})을 넘겨서 이번 복습은 <b>점수를 받지 못했어요.</b><br>다음 복습은 오늘 기준으로 등록됐어요 — <b>제때 하면 점수를 받아요!</b>`:`Reviewed after the due date, so no points this time.<br>Do it on time next round to earn points.`}</div>
          </div>` : '')}
          <div class="label-xs">${t('memoryDone')}</div>
          <div class="done__n">${route.total}</div>
          <div class="done__label">${t('wordsMemorized')}</div>
          ${(route.scope==='page' && !route.isReview)?`<div style="margin-top:12px;background:var(--gold-bg);border-radius:12px;padding:10px 14px;text-align:left;width:100%;">
            <div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px;">${t('reviewRegistered')}</div>
            <div style="font-size:11px;color:var(--ink-60);line-height:1.6;">${t('reviewSchedule')}<br>${t('reviewScheduleDesc')}</div>
          </div>`:''}
          <div class="done__grid">
            <div class="done__tile"><div class="done__tile-label">Rounds</div><div class="done__tile-value">${route.rounds}</div></div>
            <div class="done__tile"><div class="done__tile-label">Scope</div><div class="done__tile-value" style="font-size:16px;">${route.scope==='page'?`Page ${route.pageNum}`:'All'}</div></div>

          <div style="width:100%;margin-top:20px;display:flex;flex-direction:column;gap:10px">

            <button class="btn btn-outline" onclick="startQuiz('${route.bookId}','${route.scope}','${route.pageNum}')">${t('quizMode')}</button>
            ${route.isReview ?

              `<button class="btn btn-outline" onclick="goTab('books')">${t('toBookshelf')}</button>`}

const _LVC={'C2':'#7b2d8b','C1':'#c0392b','B2':'#e67e22','B1':'#2980b9','A2':'#27ae60','A1':'#95a5a6'};
function _boldWord(text, en){
  try{ const stem=en.slice(0,Math.max(3,en.length-3)); return text.replace(new RegExp('\\b('+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','i'), '<b>$1</b>'); }catch(e){ return text; }
}
// 공식 단어장 — 앞면(배지 위·단어·발음 pill)
function _cardFrontBody(w){
  const a=w.analysis||{}, ex=a.exam||{}, lv=w.level||'';
  const isScore=/^\d+$/.test(lv);   // 토익(600/800/900)은 수능 기출·CEFR 배지 미표시
  const pos=a.pos || (a.meanings&&a.meanings[0]&&a.meanings[0].pos) || '';
  return `<div style="display:flex;flex-direction:column;height:100%;width:100%;">
    <div style="display:flex;gap:7px;justify-content:center;flex-wrap:wrap;">
      ${(!isScore&&ex.tested)?`<span style="font-size:11px;font-weight:700;color:#fff;background:#c0392b;border-radius:99px;padding:3px 11px;">🎯 수능 기출 ${ex.exams||ex.count||0}회</span>`:''}
      ${(!isScore&&lv)?`<span style="font-size:11px;font-weight:700;color:#fff;background:${_LVC[lv]||'#999'};border-radius:99px;padding:3px 11px;">CEFR ${lv}</span>`:''}
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;">
      <div class="card__word" style="font-size:clamp(28px,7.5vw,46px);">${esc(w.en)}</div>
      <div class="card__ipa">${w.ipa||''}</div>
      ${pos?`<div style="font-size:14px;color:#9a7b3a;font-style:italic;">${pos}</div>`:''}
      <button onclick="event.stopPropagation();_playSmart('${jsq(w.en)}','${_audioUrl(w,'w')}')" style="background:var(--gold-bg);border:1px solid var(--ink-12);border-radius:99px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:var(--font-body);color:var(--accent);margin-top:6px;">${t('pronounce')}</button>
    </div>
    <div class="card__tap">${t('cardFront')}</div>
  </div>`;
}
// 카드 뒷면 본문
function _cardBackBody(w){
  const a=w.analysis||{}, ko=userNativeLang==='ko';
  if(!a._official){
    return `<div class="back__label">${t('cardMeaning')}</div><div class="back__meaning">${esc(w.base||'')}</div>`+
      (w.ctx?`<div class="back__label">${t('cardContext')}</div><div class="back__meaning">${esc(w.ctx)}</div>`:'')+
      (w.sentence?`<div class="back__label">${ko?'예문':'Example'}</div><div class="back__meaning" style="font-size:14px;">${esc(w.sentence)}</div>`:'');
  }
  let h=`<div style="display:flex;align-items:baseline;gap:10px;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,0.08);padding-bottom:10px;margin-bottom:13px;">
    <span style="font-family:var(--font-display);font-size:24px;font-weight:600;color:#1c3553;">${esc(w.en)}</span>
    <span style="font-size:13px;color:#8a8a8a;white-space:nowrap;">${w.ipa||''}</span></div>`;
  h+=`<div style="font-size:11px;font-weight:700;color:#9a7b3a;letter-spacing:0.04em;margin-bottom:5px;">${ko?'뜻':'MEANING'}</div>`;
  const ms=(a.meanings&&a.meanings.length)?a.meanings:[{pos:a.pos||'',ko:w.base||''}].concat(w.ctx?[{pos:'',ko:w.ctx}]:[]);
  h+=ms.map((m,i)=>`<div style="font-size:15px;color:#2b2b2b;margin:3px 0;line-height:1.4;"><span style="color:#b8860b;font-weight:700;">${['①','②','③','④'][i]||'·'}</span> ${m.pos?`<span style="color:#9a7b3a;font-style:italic;font-size:13px;">${m.pos}</span> `:''}${m.ko||''}</div>`).join('');
  const ex=a.example||w.sentence;
  if(ex){
    h+=`<div style="background:#faf6ef;border:1px solid #efe6d6;border-radius:11px;padding:11px 13px;margin-top:15px;">`;
    if(a.src) h+=`<div style="display:inline-block;font-size:11px;font-weight:700;color:#b03a2e;background:#fbeae7;border-radius:7px;padding:2px 9px;margin-bottom:7px;">🎯 ${a.src} · ${ko?'기출 변형':'adapted'}</div>`;

// ===== 저장 음원(Gemini TTS) 우선 재생, 없으면 기기 TTS 폴백 =====
let _curAudio = null;
function _safeAudio(en){ return (en||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,'-'); }
const _AUDIO_BASE = 'https://ziatqkjlafucqtwshhla.supabase.co/storage/v1/object/public/audio';
// 시리즈별 예문이 갈리는 '중복 단어' 목록. 이 단어만 시리즈별 예문 오디오가 필요하고,
// 나머지(유니크)는 기존 원어민 s/{단어}.mp3 를 그대로 쓴다. (실패 시 null → 전부 시리즈경로/TTS)
window._conflictWords = window._conflictWords || null;
fetch('wordbooks/_audio/conflict-words.json').then(r=>r.json()).then(a=>{ if(Array.isArray(a)) window._conflictWords = new Set(a); }).catch(()=>{});
// 책 제목 → 오디오 시리즈 폴더 키. 같은 단어라도 시리즈별 예문이 달라서, 예문 발음은 시리즈별로 분리 저장.
function _audioSeriesFromTitle(t){ t=String(t||''); if(t.indexOf('중등')>=0)return 'mid'; if(t.indexOf('토익')>=0)return 'toeic'; if(t.indexOf('수능')>=0)return 'suneung'; return ''; }
function _audioUrl(w, kind){
  if(!(w&&w.analysis&&w.analysis._official)) return '';
  const s=_safeAudio(w.en); if(!s) return '';
  if(w.analysis._lang==='es') return _AUDIO_BASE+'/es/'+kind+'/'+s+'.mp3'; // 스페인어는 기존 es/ 유지
  if(kind==='s'){
    const cw = window._conflictWords;
    // 유니크 단어(시리즈별 예문이 안 갈리는 단어): 기존 원어민 예문 MP3(s/{단어}.mp3) 그대로 사용.
    if (cw && !cw.has(s)) return _AUDIO_BASE+'/s/'+s+'.mp3';
    // 중복 단어(또는 목록 미로드): 시리즈별 예문 오디오(Supabase). 파일 없으면 _playSmart 가 예문 텍스트를 TTS로.
    const ser = w.analysis._series || window._audioSeries || '';

}
let _aWatch = null; // mp3 재생 완료 감지 워치독(onended 누락 대비)
let _sharedAudio = null; // ⚠️ iOS: 제스처로 한 번 잠금해제된 엘리먼트만 이후 프로그램적 재생 허용 → 단일 엘리먼트 재사용
function _getAudioEl(){ if(!_sharedAudio){ _sharedAudio = new Audio(); _sharedAudio.preload='auto'; } return _sharedAudio; }
function _stopAudio(){ if(_aWatch){ clearInterval(_aWatch); _aWatch=null; } if(_curAudio){ try{_curAudio.pause();}catch(e){} _curAudio=null; } }
function _playSmart(text, url, onDone){
  // iOS는 유휴 상태에서 cancel을 반복 호출하면 다음 음성이 쉰 목소리로 깨짐 → 재생 중일 때만 cancel
  _stopAudio(); const _sy=window.speechSynthesis; if(_sy && (_sy.speaking||_sy.pending)) _sy.cancel();
  let done=false; const fin=()=>{ if(done)return; done=true; if(_aWatch){clearInterval(_aWatch);_aWatch=null;} if(onDone)onDone(); };
  if(url){
    try{
      // ⚠️ new Audio()를 매번 만들면 iOS 자동재생 잠금이 매번 풀려, 첫 재생(제스처)만 되고
      //    반복(setTimeout)은 차단돼 TTS로 빠짐. → 잠금해제된 단일 엘리먼트를 재사용한다.
      const a=_getAudioEl(); _curAudio=a;
      let fb=false; const fall=()=>{ if(fb)return; fb=true; if(_aWatch){clearInterval(_aWatch);_aWatch=null;} try{ a.pause(); a.onended=null; a.onerror=null; }catch(e){} if(_curAudio===a)_curAudio=null; speak(text, fin); };
      a.onended=fin; a.onerror=fall;
      if(a.src!==url){ a.src=url; }
      try{ a.currentTime=0; }catch(e){}
      // play()가 pause()와 겹쳐 나는 AbortError는 무시(워치독이 처리). 그 외 실패만 TTS 폴백.
      const p=a.play(); if(p&&p.catch) p.catch(err=>{ if(err&&err.name==='AbortError')return; fall(); });

        else if(ticks>=10){ fall(); return; } // ~3초간 재생 시작조차 못함 → TTS 폴백(느린망 조기폴백·겹침 방지)
      }, 300);
      return;
    }catch(e){}
  }
  speak(text, fin);
}

// ===== 자동 반복 읽기 (선호 설정) =====
let _autoRead = (typeof localStorage!=='undefined' && localStorage.getItem('imvoca.autoRead')==='1');
let _autoTok = 0;
function _autoStop(){ _autoTok++; _stopAudio(); if(_ttsWatch){ clearInterval(_ttsWatch); _ttsWatch=null; } if(window.speechSynthesis) window.speechSynthesis.cancel(); }
function _autoText(w, flipped){ if(!flipped) return w.en; const a=w.analysis||{}; return a.example || w.sentence || w.en; }
function _autoAfterRender(w, flipped){
  _autoTok++;                 // 카드 바뀌면 이전 루프 취소
  if(!_autoRead) return;
  const my=_autoTok, text=_autoText(w, flipped), url=_audioUrl(w, flipped?'s':'w');
  if(!text) return;
  // 재생이 "끝나면" → 1.1초 쉬고 → 다시.
  // ⚠️ iOS는 mp3 <audio>의 onended나 TTS의 onend가 끝내 발화되지 않는 경우가 있어 콜백에만
  //    의존하면 예문이 한 번만 재생되고 멈춤. → 추정 재생시간 기반 안전망 타이머를 함께 둬
  //    콜백이 안 와도 다음 반복으로 넘어가게 한다(둘 중 먼저 오는 쪽만 1회 진행).
  const loop=()=>{
    if(my!==_autoTok || !_autoRead || !studyState) return;
    let advanced=false;
    const next=()=>{ if(advanced || my!==_autoTok) return; advanced=true;
      setTimeout(()=>{ if(my===_autoTok && _autoRead && studyState) loop(); }, 1100); };
    _playSmart(text, url, next);
    const estMs = (text.length*90)/0.85 + (url?5000:2500); // mp3는 디코딩/무음 여유를 더 둠

  };

function renderStudyCard() {

function flipCard() {

  else { studyState.flipped=false; renderStudyCard(); }
}

document.addEventListener('keydown', function(e) {
  if (!studyState) return;
  const route = stack[stack.length-1];
  if (route.name !== 'study-cards') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyO') { advance(true); }
  else if (e.code === 'ArrowLeft' || e.code === 'KeyX') { advance(false); }

async function advance(isKnown) {
  const s=studyState; s.stats.seen++; if(isKnown)s.stats.oCount++;
  const newX=isKnown?s.xList:[...s.xList,s.queue[s.idx]];
  if (s.idx+1<s.queue.length) { s.idx++; s.xList=newX; s.flipped=false; renderStudyCard(); }
  else if (newX.length===0) {
    saveStats(s.bookId, s.stats.total, s.stats.oCount);
    if (s.scope === 'page' && s.pageNum) {
      if (s._reviewId && s._reviewStepKey) {
        // 복습 카드 완료 → 곧바로 점수 주지 않고 '퀴즈 통과'를 조건으로 함.
        // 점수·다음 단계 이동은 퀴즈를 모두 맞혔을 때(renderQuiz)만 updateReviewStep 으로 처리.
        window._pendingReview = { id: s._reviewId, _stepKey: s._reviewStepKey, _scheduledDate: s._scheduledDate, book_id: s.bookId, page_num: s.pageNum };
        toast(userNativeLang==='ko'?'복습 끝! 퀴즈를 모두 맞히면 점수를 받아요':'Review done! Pass the quiz to earn points');
        startReviewQuiz(s.bookId, s.pageNum);
        return;
      } else {
        // 첫 암기: 카드를 끝내면 '학습'을 바로 등록(복습일정+기록). 점수는 퀴즈 통과 시.
        // (예전엔 퀴즈 통과해야만 등록돼서, 카드만 하고 퀴즈를 안 끝내면 학습이 기록 안 되던 문제 수정)
        const _newFS = await _registerFirstStudy(s.bookId, s.pageNum);
        window._pendingFirstStudy = { book_id: s.bookId, page_num: s.pageNum, isNew: _newFS };
        toast(userNativeLang==='ko'?'암기 끝! 퀴즈를 모두 맞히면 점수를 받아요':'Done! Pass the quiz to earn points');
        startReviewQuiz(s.bookId, s.pageNum);
        return;
      }
    }
    replace({name:'study-done',bookId:s.bookId,scope:s.scope,pageNum:s.pageNum,rounds:s.round,total:s.stats.total,isReview:!!(s._reviewId)});
  }
  else { s.round++; s.queue=shuffle(newX); s.idx=0; s.xList=[]; s.flipped=false; renderStudyCard(); }
}

async function applyLangSettings() {

  document.getElementById('lang-settings-overlay')?.remove();
  const native=getNativeLang(), target=getTargetLang();
  toast(userNativeLang==='ko'?`${native.flag} ${native.name} → ${target.flag} ${target.name} 설정됐어요!`:`${native.flag} ${native.name} → ${target.flag} ${target.name} set!`);
  // 학습언어가 바뀌면 공식 단어장을 해당 언어에 맞게 다시 로드(예: 한국어→Español 선택 시 스페인어 3권만 노출)
  if (targetChanged && currentUser) {
    books = books.filter(b => !b._official);
    await appendOfficialBooks();
  }
  if (!currentUser) renderLogin(); else render();
}

async function renamePage(bookId, pageNum) {
  if (isAssignedReadonly(bookId)) { toast(userNativeLang==='ko'?'과제 책은 편집할 수 없어요':'Assigned books are read-only'); return; }
  const book = findBook(bookId);
  const page = book ? findPage(book, pageNum) : null;
  if (!page) return;
  const cur = String(page.num);
  const next = prompt(userNativeLang==='ko'?'새 페이지 이름 (예: 15-20)':'New page name (e.g. 15-20)', cur);
  if (next === null) return;
  const name = next.trim();
  if (!name || name === cur) return;
  if (book.pages.some(p => String(p.num) === name)) { toast(userNativeLang==='ko'?'같은 이름의 페이지가 있어요':'A page with that name already exists'); return; }
  try {
    if (page._pid) {
      const opt = { method:'PATCH', headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }, body: JSON.stringify({ page_num: name }) };
      let res = await fetch(SB_URL+`/rest/v1/voca_pages?id=eq.${page._pid}`, opt);
      if ((res.status===401||res.status===403) && await refreshSession()) { opt.headers.Authorization='Bearer '+_authToken; res = await fetch(SB_URL+`/rest/v1/voca_pages?id=eq.${page._pid}`, opt); }
      if (!res.ok) throw new Error('rename failed '+res.status);
    }
    page.num = name;
    book.pages.sort((a,b)=>pageSort(a,b));
    render();
    toast(userNativeLang==='ko'?`페이지 이름이 '${name}'(으)로 바뀌었어요`:`Renamed to '${name}'`);
  } catch(e) { toast(userNativeLang==='ko'?'변경 실패, 잠시 후 다시 시도':'Rename failed, try later'); }
}

// ── 페이지 병합 (merge) ──
function mergePage(bookId, pageNum) {
  if (isAssignedReadonly(bookId)) { toast(userNativeLang==='ko'?'과제 책은 편집할 수 없어요':'Assigned books are read-only'); return; }
  const book = findBook(bookId);
  const src = book ? findPage(book, pageNum) : null;
  if (!src) return;
  const others = book.pages.filter(p => String(p.num) !== String(pageNum));
  if (!others.length) { toast(userNativeLang==='ko'?'합칠 다른 페이지가 없어요':'No other page to merge'); return; }
  const ov = document.createElement('div');
  ov.id = 'merge-modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';

    <div style="max-height:50vh;overflow-y:auto;">

        <span style="font-size:14px;font-weight:600;color:var(--ink-100);">→ Page ${esc(String(p.num))}</span>
        <span style="font-size:12px;color:var(--ink-60);">${p.words.length} words</span></button>`).join('')}
    </div>
    <button onclick="document.getElementById('merge-modal').remove()" style="width:100%;padding:12px;margin-top:6px;background:none;border:none;color:var(--ink-60);font-family:var(--font-body);font-size:13px;cursor:pointer;">${userNativeLang==='ko'?'취소':'Cancel'}</button>
  </div>`;
  ov.onclick = (e)=>{ if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov);
}

async function doMergePage(bookId, srcNum, dstNum) {
  document.getElementById('merge-modal')?.remove();
  const book = findBook(bookId);
  const src = book ? findPage(book, srcNum) : null;
  const dst = book ? findPage(book, dstNum) : null;
  if (!src || !dst || !dst._pid) { toast(userNativeLang==='ko'?'페이지 오류':'Page error'); return; }
  toast(userNativeLang==='ko'?'합치는 중...':'Merging...');
  try {
    if (src._pid) {
      const opt = { method:'PATCH', headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }, body: JSON.stringify({ page_id: dst._pid }) };
      let res = await fetch(SB_URL + `/rest/v1/voca_words?page_id=eq.${src._pid}`, opt);
      if ((res.status===401||res.status===403) && await refreshSession()) { opt.headers.Authorization='Bearer '+_authToken; res = await fetch(SB_URL + `/rest/v1/voca_words?page_id=eq.${src._pid}`, opt); }
      if (!res.ok) throw new Error('move failed '+res.status);
      await fetch(SB_URL + `/rest/v1/voca_pages?id=eq.${src._pid}`, { method:'DELETE', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken } });
      await fetch(SB_URL + `/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=eq.${bookId}&page_num=eq.${encodeURIComponent(String(srcNum))}`, { method:'DELETE', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken } });
    }
    dst.words = [...dst.words, ...src.words];
    book.pages = book.pages.filter(p => String(p.num) !== String(srcNum));
    updateTotalWords(); render();
    toast(userNativeLang==='ko'?`✅ Page ${srcNum} → Page ${dstNum} 합쳤어요 (${dst.words.length}개)`:`✅ Merged into Page ${dstNum} (${dst.words.length})`);
  } catch(e) { toast(userNativeLang==='ko'?'합치기 실패: '+e.message:'Merge failed: '+e.message); }
}

async function doAssign(bookId, pageNum){
  const ko = userNativeLang==='ko';
  if (!orgIsAdmin() || !userOrg) { toast(ko?'관리자만 배정할 수 있어요':'Admins only'); return; }
  const book = findBook(bookId);
  let target = (document.querySelector('input[name="assign-target"]:checked')||{}).value || 'all';
  const due = (document.getElementById('assign-due')||{}).value || null;
  let studentIds = [];
  if (target==='selected'){
    // 이미 배정된(disabled) 학생은 제외하고 '새로 체크한' 학생만 배정(중복 방지)
    studentIds = [...document.querySelectorAll('.assign-stu:checked:not(:disabled)')].map(c=>c.value);
    if (!studentIds.length){ toast(ko?'새로 배정할 학생을 선택해주세요 (✓ 배정됨은 이미 배정된 학생)':'Select a student to add'); return; }
  } else if (!orgIsPrimary()) {
    // 공동 관리자의 '전체' = 자기 담당 학생 전체를 지정 배정
    studentIds = (window._assignStudents||[]).map(s=>s.id);
    if (!studentIds.length){ toast(ko?'담당 학생이 없어요. 주 관리자에게 배정을 요청하세요.':'No students assigned to you.'); return; }
    target = 'selected';
  }
  const hasPage = (pageNum!=null && pageNum!=='null');
  const titleSnap = (book?book.title:'') + (hasPage?` · p.${pageNum}`:'');
  try {
    const rows = await sbFetch('/rest/v1/voca_assignments','POST',{
      org_id: userOrg.id, assigned_by: currentUser.id, book_id: bookId,
      page_num: hasPage?String(pageNum):null, title: titleSnap,
      due_date: due||null, target_type: target, active: true
    }, true, {'Prefer':'return=representation'});
    const row = Array.isArray(rows)?rows[0]:null;
    if (!row || !row.id){ toast(ko?'배정 실패, 잠시 후 다시':'Assign failed'); return; }
    let n = (window._assignStudents||[]).length;
    if (target==='selected' && studentIds.length){
      await sbFetch('/rest/v1/voca_assignment_students','POST', studentIds.map(sid=>({assignment_id:row.id, student_id:sid})), true, {'Prefer':'return=representation'});
      n = studentIds.length;
    }
    if (target==='all'){
      // '학원 전체'는 전원(+향후 학생)을 커버하므로, 같은 책(+페이지)의 기존 배정
      // (옛 1명짜리 selected·중복 all)을 비활성화해 중복/혼란을 없앤다.
      const pf = hasPage ? `page_num=eq.${encodeURIComponent(String(pageNum))}` : 'page_num=is.null';
      try { await sbFetch(`/rest/v1/voca_assignments?org_id=eq.${userOrg.id}&book_id=eq.${bookId}&${pf}&id=neq.${row.id}&active=eq.true`, 'PATCH', { active:false }); } catch(e){}
    }
    const ov = document.getElementById('assign-overlay'); if (ov) ov.remove();
    toast(ko?`✅ ${n}명에게 배정했어요`:`✅ Assigned to ${n}`);
  } catch(e){ toast((ko?'배정 오류: ':'Error: ')+(e&&e.message||e)); }
}

// ===== 학생: 배정받은 과제 수신 (Phase 3) =====
let _assignLoaded = false;
function isAssignedReadonly(bookId){ const b = findBook(bookId); return !!(b && b._readonly); }
async function loadAssignments(force){
  if (_assignLoaded && !force) return;
  // 아직 org 승인 상태/토큰이 준비 안 됐으면 '로드됨'으로 표시하지 말고 그냥 반환.
  // (준비되면 다음 호출에서 실제로 로드. 예전엔 여기서 _assignLoaded=true 로 막혀
  //  단체 학생이 첫 진입 때 배정 단어장이 안 뜨던 버그가 있었음)
  if (!(userOrgId && userOrgStatus === 'approved' && _authToken)) return;
  _assignLoaded = true;
  try {
    const res = await fetch(SB_URL + '/functions/v1/assignments-for-student', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken },
      body:'{}'
    });
    const data = await res.json().catch(()=>({}));
    const assignments = Array.isArray(data.assignments) ? data.assignments : [];
    const rawBooks = Array.isArray(data.books) ? data.books : [];
    window._assignList = assignments;
    // 받은 책을 메모리 books 에 읽기전용 주입 (원본 참조 유지, DB 저장 안 함)
    const existingIds = new Set(books.map(b=>b.id));
    rawBooks.forEach(b=>{
      if (existingIds.has(b.id)) { const eb = findBook(b.id); if (eb){ eb._assigned=true; eb._readonly=true; } return; }
      books.push({
        id:b.id, title:b.title, author:b.author||'', color:b.color,
        // 공식 단어장(수능 등)은 표지가 제목 기반으로 매핑됨 → 배정 책도 동일한 표지로 보이게 _officialCover 적용
        desc:b.description||'', cover:_officialCover(b.title, b.cover_url), category:b.category||'general',
        _assigned:true, _readonly:true,
        pages:(b.voca_pages||[])
          .sort((a,c)=>(a.page_num+'').localeCompare(c.page_num+'', undefined, { numeric:true }))
          .map(p=>({ num:p.page_num, _pid:p.id, words:(p.voca_words||[])
            .sort((a,c)=>new Date(a.created_at)-new Date(c.created_at))
            .map(w=>({ id:w.id, en:w.en, ipa:w.ipa||'', base:w.base, ctx:w.ctx, sentence:w.sentence||'', level:w.level||'', fav:w.is_favorite||false, analysis:w.analysis||null })) }))
      });
      existingIds.add(b.id);
    });
    // 배정 책 복습 상태 미리 로드(배지용)
    [...new Set(assignments.map(a=>a.book_id))].forEach(bid=>{ try{ loadReviewStatus(bid); }catch(e){} });
    const top = stack[stack.length-1];
    if (top && top.name === 'library') render();
  } catch(e){ console.warn('[loadAssignments]', e); }
}
function _assignBadge(a){
  const ko = userNativeLang==='ko';
  let status='none';
  if (a.page_num != null) {
    status = _reviewStatus[a.book_id+'|'+a.page_num] || 'none';
  } else {
    const bk = findBook(a.book_id);
    const ss = bk ? bk.pages.map(p=>_reviewStatus[a.book_id+'|'+p.num]) : [];
    if (ss.some(s=>s==='doing')) status='doing';
    else if (ss.length && ss.every(s=>s==='done')) status='done';
    else if (ss.some(s=>s==='done')) status='doing';
    else status='none';
  }
  if (status==='done') return { label: ko?'복습 완료':'Done', color:'#1c7c3c', bg:'#e6f4ea' };
  if (status==='doing') return { label: ko?'복습 중':'Reviewing', color:'#b35900', bg:'#fff3e0' };

}

async function renderReportPage(root){

      <div id="report-body" class="scr-scroll" style="margin-top:12px;"><div class="muted" style="text-align:center;padding:36px;font-size:13px;">${ko?'불러오는 중…':'Loading…'}</div></div>

// 과제별 상세 리포트를 지정한 컨테이너(boxId)에 채움. 리포트 페이지·단체관리 리포트 탭 공용.
// '지정(selected)' 배정은 org-report 가 대상 학생을 안 걸러줌 → assignment_students 로 클라에서 필터.
// (배정에서 빼도 리포트/상세에 계속 보이던 문제 해결. 엣지함수 재배포 불필요)
async function _filterSelectedAssignments(report){
  const selIds = (report||[]).filter(a=>a.target_type==='selected').map(a=>a.assignment_id).filter(Boolean);
  if (!selIds.length) return report||[];
  const map = {};
  try {
    const links = await sbFetch(`/rest/v1/voca_assignment_students?assignment_id=in.(${selIds.join(',')})&select=assignment_id,student_id`);
    if (Array.isArray(links)) links.forEach(l=>{ (map[l.assignment_id] = map[l.assignment_id] || new Set()).add(l.student_id); });
  } catch(e){ return report||[]; }
  return (report||[]).map(a=>{
    if (a.target_type!=='selected') return a;
    const set = map[a.assignment_id] || new Set();
    return { ...a, students: (a.students||[]).filter(s=>set.has(s.student_id)) };
  }).filter(a=> a.target_type!=='selected' || (a.students && a.students.length));
}
async function loadOrgReport(boxId){
  const ko = userNativeLang==='ko';
  if (!userOrg) return;
  window._reportBox = boxId;
  try {
    const res = await fetch(SB_URL+'/functions/v1/org-report', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken },
      body: JSON.stringify({ org_id: userOrg.id })
    });
    const data = await res.json().catch(()=>({}));
    window._lastReport = await _filterSelectedAssignments(Array.isArray(data.report) ? data.report : []);
    renderReportInto(boxId);
  } catch(e){
    const box=document.getElementById(boxId);
    if(box) box.innerHTML = `<div class="muted" style="text-align:center;padding:36px;font-size:13px;">${(ko?'리포트 로드 실패: ':'Failed: ')+esc(e&&e.message||String(e))}</div>`;
  }
}
function setReportView(v){ window._reportView = v; renderReportInto(window._reportBox||'report-body'); }
function _isTodayLocal(iso){ if(!iso) return false; const d=new Date(iso), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
// 책×학생 리포트를 학생 중심으로 피벗
function _pivotReportByStudent(report){
  const map = {};
  report.forEach(a=>{ (a.students||[]).forEach(s=>{
    const k = s.student_id || s.name;
    if(!map[k]) map[k]={id:s.student_id, name:s.name, assigned:0, started:0, completed:0, inprog:0, notstarted:0, late:0, lastReviewedAt:null, books:[]};
    const m=map[k]; m.assigned++;
    if(s.exists){ m.started++; if(s.completed)m.completed++; else m.inprog++; if(s.onTime===false)m.late++; } else m.notstarted++;
    if(s.lastReviewedAt && (!m.lastReviewedAt || s.lastReviewedAt>m.lastReviewedAt)) m.lastReviewedAt=s.lastReviewedAt;
    m.books.push({title:a.title, exists:s.exists, completed:s.completed, onTime:s.onTime, stageLabel:s.stageLabel});
  }); });
  return Object.values(map);
}
function renderReportInto(boxId){
  const ko = userNativeLang==='ko';
  const box = document.getElementById(boxId||window._reportBox||'report-body');
  if (!box) return;
  const report = window._lastReport || [];
  if (!report.length){ box.innerHTML = `<div class="muted" style="text-align:center;padding:36px;font-size:13px;">${ko?'아직 배정한 과제가 없어요. 단어장에서 책·페이지를 학생에게 배정하면 여기에 진행 상황이 나와요.':'No assignments yet.'}</div>`; return; }
  const view = window._reportView || 'student';
  const studs = _pivotReportByStudent(report);
  const hasToday = studs.some(s=>s.lastReviewedAt);
  studs.forEach(s=>{ s._notToday = hasToday && !_isTodayLocal(s.lastReviewedAt); s._att = (s.started===0)||(s.late>0)||s._notToday; s._sev = (s.started===0?3:0)+(s.late>0?2:0)+(s._notToday?1:0); });
  const N = studs.length;
  const todayDone = hasToday ? studs.filter(s=>!s._notToday).length : null;
  const noneStarted = studs.filter(s=>s.started===0).length;
  const behind = studs.filter(s=>s.late>0).length;
  const attList = studs.filter(s=>s._att).sort((a,b)=> b._sev-a._sev || (b.late+b.notstarted)-(a.late+a.notstarted));

  const statCard=(n,label,color)=>`<div style="flex:1;background:var(--bg-card);border:1px solid var(--ink-07);border-radius:12px;padding:12px 8px;text-align:center;"><div style="font-family:var(--font-display);font-size:22px;font-weight:700;color:${color||'var(--ink-100)'};line-height:1;">${n}</div><div class="muted" style="font-size:10.5px;margin-top:5px;">${label}</div></div>`;
  let html = `<div style="display:flex;gap:8px;margin-bottom:${hasToday?14:4}px;">
    ${statCard(N, ko?'학생':'Students')}
    ${hasToday?statCard(todayDone, ko?'오늘 공부 ✅':'Today ✅', '#1c7c3c'):''}
    ${statCard(behind, ko?'밀린 복습':'Behind', behind?'#c0392b':'var(--ink-100)')}
    ${statCard(noneStarted, ko?'미시작':'Not started', noneStarted?'#b35900':'var(--ink-100)')}
  </div>`;
  if(!hasToday) html += `<div class="muted" style="font-size:10.5px;margin:0 2px 14px;">${ko?'※ ‘오늘 공부’ 실시간 표시는 org-report 함수 재배포 후 켜집니다.':''}</div>`;

  if(attList.length){
    html += `<div style="font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--ink-60);margin:4px 2px 8px;">🚨 ${ko?'챙겨야 할 학생':'Needs attention'} (${attList.length})</div>`;
    html += `<div style="background:var(--bg-card);border:1px solid var(--ink-07);border-radius:14px;padding:4px 14px;margin-bottom:16px;">` + attList.map(s=>{
      const r=[];
      if(s.started===0) r.push(`<span style="color:#b35900;">${ko?'미시작':'not started'}</span>`);
      if(s.late>0) r.push(`<span style="color:#c0392b;">${ko?`밀린복습 ${s.late}`:`${s.late} late`}</span>`);
      if(s._notToday) r.push(`<span style="color:var(--ink-60);">${ko?'오늘 안 함':'not today'}</span>`);
      return `<div onclick="openStudentDetail('${jsq(s.id)}')" style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ink-07);cursor:pointer;">
        <div style="flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink-100);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.name)}</div>
        <div style="font-size:11px;font-weight:700;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0;">${r.join('<span style="color:var(--ink-12);font-weight:400;">·</span>')}</div>
      </div>`;
    }).join('') + `</div>`;
  } else {
    html += `<div style="background:#e6f4ea;border:1px solid #b6e0c4;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#1c7c3c;font-weight:600;text-align:center;">✅ ${ko?'모든 학생이 잘 따라오고 있어요!':'Everyone is on track!'}</div>`;
  }

  const tabBtn=(key,label)=>`<button onclick="setReportView('${key}')" style="flex:1;padding:8px;border:1.5px solid ${view===key?'var(--accent)':'var(--ink-12)'};background:${view===key?'var(--gold-bg)':'var(--bg-input)'};border-radius:9px;font-family:var(--font-body);font-size:12.5px;font-weight:${view===key?700:500};color:var(--ink-100);cursor:pointer;">${label}</button>`;
  html += `<div style="display:flex;gap:6px;margin-bottom:12px;">${tabBtn('student',ko?'학생별':'By student')}${tabBtn('matrix',ko?'진도표':'Matrix')}${tabBtn('book',ko?'과제별':'By book')}</div>`;

  if(view==='student') html += _studentViewHTML(studs);
  else if(view==='matrix') html += _matrixHTML(report, studs);
  else html += report.map((a,i)=>reportSectionHTML(a,i)).join('');
  box.innerHTML = html;
}

function sendParentCard(){
  const ko = userNativeLang==='ko';
  const title = ((document.getElementById('pcard-title')||{}).value || 'IM VOCA').trim();
  const desc = (document.getElementById('pcard-body')||{}).value || '';
  const ov = document.getElementById('pcard-overlay'); if (ov) ov.remove();
  const link = { mobileWebUrl: 'https://imvoca.app', webUrl: 'https://imvoca.app' };
  // 1순위: 카카오톡 공유 (feed 템플릿 — 이미지+제목+설명+버튼)
  if (window.Kakao && KAKAO_JS_KEY) {
    try { if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); } catch(e){}
    try {
      if (Kakao.isInitialized() && Kakao.Share) {
        Kakao.Share.sendDefault({
          objectType: 'feed',
          content: {
            title: title,
            description: desc.slice(0, 190),
            imageUrl: (userOrg && userOrg.logo_url) ? userOrg.logo_url : 'https://imvoca.app/og-image.png',
            link: link
          },
          buttons: [{ title: ko?'앱에서 보기':'Open app', link: link }]
        });
        return;
      }
    } catch(e){ /* 폴백 */ }
  }
  // 폴백: 시스템 공유 시트 / 클립보드 복사
  const full = '['+title+'] 📚\n'+desc;
  if (navigator.share){ navigator.share({ text: full }).catch(()=>{}); }
  else if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(full).then(()=>toast(ko?'복사했어요 (카톡에 붙여넣기)':'Copied — paste into chat')).catch(()=>alert(full)); }
  else { alert(full); }
}

// TTS 음성 목록 캐시 (iOS/iPadOS는 getVoices()가 첫 호출 때 비어 있어 voiceschanged로 늦게 로드됨)
let _ttsVoices = [];
function _loadTtsVoices() {
  try { _ttsVoices = window.speechSynthesis.getVoices() || []; } catch (e) { _ttsVoices = []; }
  return _ttsVoices;
}
if (typeof window !== 'undefined' && window.speechSynthesis) {
  _loadTtsVoices();
  // onvoiceschanged: 음성 목록이 준비되면 캐시 갱신
  try { window.speechSynthesis.addEventListener('voiceschanged', _loadTtsVoices); } catch (e) {}
}
function _pickTtsVoice(ttsLang) {
  const voices = (_ttsVoices && _ttsVoices.length) ? _ttsVoices : _loadTtsVoices();
  if (!voices.length) return null;
  const norm = v => (v.lang || '').replace('_', '-');
  const prefix = ttsLang.split('-')[0];
  const nm = v => ((v.name||'') + ' ' + (v.voiceURI||''));
  const isCompact = v => /compact/i.test(nm(v));
  const isEnhanced = v => /(enhanced|premium|neural|siri)/i.test(nm(v));
  // iOS/macOS 노벨티·저품질 음성(로봇처럼 들림) → 강하게 회피
  const isNovelty = v => /(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|princess|ralph|grandma|grandpa|reed|rocko|sandy|shelley|flo|eddy)/i.test(nm(v));
  // 점수: 정확한 로캘>같은 언어, 고품질>표준>compact, 노벨티 제외
  const score = v => {
    const lang = norm(v); let s;
    if (lang === ttsLang) s = 100; else if (lang.startsWith(prefix)) s = 50; else return -1;
    if (isNovelty(v)) s -= 1000;
    if (isEnhanced(v)) s += 40;
    if (isCompact(v)) s -= 20;
    if (v.localService) s += 5;
    if (v.default) s += 3;
    return s;
  };
  let best = null, bestS = -1;
  for (const v of voices) { const s = score(v); if (s > bestS) { bestS = s; best = v; } }
  return (bestS >= 0) ? best : null;
}
let _ttsWatch = null;   // onend 누락 감지 워치독
let _ttsUtterRef = null; // ⚠️ Chrome: 발화 중 utterance가 GC되면 onend가 유실됨 → 참조 유지
function speak(word, onEnd) {
  if (!window.speechSynthesis) { if(onEnd) onEnd(); return; }
  const synth = window.speechSynthesis;
  // iOS: 유휴 상태에서 불필요한 cancel을 반복하면 음성이 쉰 목소리로 깨짐 → 재생 중일 때만 cancel
  if (synth.speaking || synth.pending) synth.cancel();
  if (_ttsWatch) { clearInterval(_ttsWatch); _ttsWatch = null; }
  // 학습 언어에 맞는 발음 언어 코드
  const ttsMap = { en:'en-US', ko:'ko-KR', es:'es-ES', zh:'zh-CN', ja:'ja-JP', fr:'fr-FR', de:'de-DE', pt:'pt-BR', vi:'vi-VN', id:'id-ID' };
  const tcode = (typeof getTargetLang === 'function' && getTargetLang()?.code) || 'en';
  const ttsLang = ttsMap[tcode] || 'en-US';
  const doSpeak = () => {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = ttsLang; u.rate = 0.85; u.pitch = 1;
    const v = _pickTtsVoice(ttsLang);
    // ⚠️ iOS는 voice 미지정 시 u.lang을 무시하고 기기 기본(한국어 등) 음성으로 읽어버림 → 반드시 voice를 명시
    if (v) u.voice = v;
    _ttsUtterRef = u; // GC 방지
    // ⚠️ 긴 문장(예문)은 Web Speech API의 onend가 발화되지 않는 경우가 많음(엔진 ~15초 컷오프/콜백 유실).
    //    또한 iOS Safari는 재생이 끝나도 synth.speaking이 true로 박혀 복구되지 않는 버그가 있어
    //    speaking 상태만 믿으면 자동 반복이 멈춤 → 글자수 기반 추정 시간 상한으로 강제 종료해 보완.
    let fired = false, sawSpeaking = false, ticks = 0;
    const startTs = Date.now();
    const estMs = (word.length * 95) / u.rate + 1500; // 추정 발화 시간
    const hardCapMs = estMs + 5000;                    // iOS speaking 멈춤 대비 상한(여유 5초)
    const finish = () => {
      if (fired) return; fired = true;
      if (_ttsWatch) { clearInterval(_ttsWatch); _ttsWatch = null; }
      _ttsUtterRef = null;
      if (onEnd) onEnd();
    };
    u.onend = finish; u.onerror = finish;
    synth.speak(u);
    if (_ttsWatch) clearInterval(_ttsWatch);
    _ttsWatch = setInterval(() => {
      if (fired) { clearInterval(_ttsWatch); _ttsWatch = null; return; }
      ticks++;
      const elapsed = Date.now() - startTs;
      if (synth.speaking) {
        sawSpeaking = true;
        if (elapsed > 10000) { try { synth.resume(); } catch(e) {} } // Chrome ~15초 컷오프 방지(장문)
      }
      if (sawSpeaking && !synth.speaking) { finish(); return; }  // 정상 종료(PC/안드로이드)
      if (elapsed >= hardCapMs) { finish(); return; }            // iOS: speaking 멈춤 미복구 → 강제 종료
      if (!sawSpeaking && ticks >= 6) { finish(); return; }      // ~3.6초간 재생 시작조차 안 됨
    }, 600);
  };
  // 음성 목록이 아직 안 떴으면(iOS 콜드 스타트) voiceschanged를 기다렸다 재시도
  if (!(_ttsVoices && _ttsVoices.length)) {
    _loadTtsVoices();
    if (!_ttsVoices.length) {
      let done = false;
      const run = () => { if (done) return; done = true; _loadTtsVoices(); doSpeak(); };
      try { synth.addEventListener('voiceschanged', run, { once: true }); } catch (e) {}
      setTimeout(run, 300); // 폴백: 이벤트가 안 와도 강제 실행
      return;
    }
  }
  doSpeak();
}

function fmtScoreDate(iso) {
  try {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return (d.getMonth()+1) + '.' + d.getDate();
  } catch(e) { return ''; }
}

function renderHallBody() {
  const ko = userNativeLang==='ko';
  const el = document.getElementById('hall-inner');
  if (!el) return;
  const all = window._hallData || [];
  const medals = ['🥇','🥈','🥉'];
  const PER = 10, MAXR = 100;
  const tab = window._hallTab;

  // ── 순위 목록 만들기 ──
  let list = []; // {name, _score, sub, mine, crown?}
  if (tab === 'team') {
    const orgMap = {};
    all.forEach(m => {
      if (m.org_id && m.org_status==='approved' && m.org_role==='student') {
        const sc=(m.perfect_reviews||0);
        if(!orgMap[m.org_id]) orgMap[m.org_id]={score:0,count:0};
        orgMap[m.org_id].score+=sc; if(sc>0) orgMap[m.org_id].count+=1;
      }
    });
    list = Object.keys(orgMap).filter(id=>orgMap[id].score>0)
      .map(id=>({ name:'🏫 '+( window._hallOrgNames[id]||(ko?'단체':'Org')), _score:orgMap[id].score, sub:`👥 ${orgMap[id].count}${ko?'명':''}`, mine: id===userOrgId }))
      .sort((a,b)=>b._score-a._score).slice(0,MAXR);
  } else if (tab === 'members') {
    list = all.filter(m=>m.org_id===userOrgId && m.org_status==='approved' && m.org_role==='student')
      .map(m=>({ name:m.name||(ko?'익명':'Anon'), _score:(m.perfect_reviews||0), sub:m.last_scored_at?('📅 '+fmtScoreDate(m.last_scored_at)):'', mine:m.name===userName }))
      .filter(m=>m._score>0).sort((a,b)=>b._score-a._score).slice(0,MAXR);
  } else { // indiv — 전체 사용자
    list = all.map(m=>({ name:m.name||(ko?'익명':'Anon'), _score:(m.perfect_reviews||0), sub:m.last_scored_at?('📅 '+fmtScoreDate(m.last_scored_at)):'', mine:m.name===userName }))
      .filter(m=>m._score>0).sort((a,b)=>b._score-a._score).slice(0,MAXR);
  }

  if (list.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:60px 20px;">
      <div style="font-size:48px;margin-bottom:16px;">🏆</div>
      <div style="font-size:15px;color:var(--ink-60);">${ko?'아직 등록된 기록이 없어요':'No records yet'}</div>
      <div style="font-size:13px;color:var(--ink-40);margin-top:8px;">${ko?'복습을 완료하면 순위에 올라가요!':'Complete reviews to appear!'}</div>
    </div>`;
    return;
  }

  // 내 순위
  const myIdx = list.findIndex(m=>m.mine);
  const totalPages = Math.min(Math.ceil(list.length/PER), Math.ceil(MAXR/PER));
  let page = window._hallPage || 1;
  if (page > totalPages) page = totalPages;
  const startI = (page-1)*PER;
  const pageItems = list.slice(startI, startI+PER);

  const myCard = (myIdx>=0) ? `
    <div style="background:var(--gold-bg);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;">
      <div style="font-size:20px;">${myIdx<3?medals[myIdx]:(myIdx+1)+(ko?'위':'')}</div>
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--accent);">${tab==='team'?(ko?'우리 단체':'My Team'):(ko?'내 순위':'My Rank')}</div>
        <div style="font-size:12px;color:var(--ink-60);">⚡ ${list[myIdx]._score}${ko?'점':'pts'}</div>
      </div>
    </div>` : '';

  const rows = pageItems.map((m,idx) => {
    const rank = startI + idx;
    return `
    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ink-07);${m.mine?'background:var(--gold-bg);':''}">
      <div style="font-size:${rank<3?'22px':'14px'};width:32px;text-align:center;font-weight:700;color:${rank<3?'inherit':'var(--ink-40)'};">${rank<3?medals[rank]:rank+1}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:${m.mine?'700':'500'};color:var(--ink-100);display:flex;align-items:center;gap:6px;">
          ${esc(m.name)}
          ${m.mine?`<span style="font-size:10px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;">${tab==='team'?(ko?'우리':'Mine'):(ko?'나':'Me')}</span>`:''}
        </div>
        <div style="font-size:11px;color:var(--ink-40);margin-top:2px;">⚡ ${m._score}${ko?'점':'pts'}${m.sub?' · '+m.sub:''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">${rank===0?'<div style="font-size:20px;">👑</div>':''}</div>
    </div>`;
  }).join('');

  // 페이지네이션 (1,2,3...)
  let pager = '';
  if (totalPages > 1) {
    let btns = '';
    for (let i=1;i<=totalPages;i++){
      const act = i===page;
      btns += `<button onclick="window._hallPage=${i};renderHallBody();" style="min-width:28px;height:28px;padding:0 6px;border:1px solid ${act?'var(--accent)':'var(--ink-12)'};background:${act?'var(--accent)':'transparent'};color:${act?'#fff':'var(--ink-60)'};border-radius:7px;font-size:12px;font-weight:${act?700:500};cursor:pointer;font-family:var(--font-body);">${i}</button>`;
    }
    pager = `<div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:14px;">${btns}</div>`;
  }

  el.innerHTML = `
    ${myCard}
    <div style="background:var(--bg-card);border-radius:16px;overflow:hidden;">${rows}</div>
    ${pager}
  `;
}
