<style>
:root {
  --font-display: 'Lora', Georgia, serif;
  --font-body: 'Gowun Dodum', system-ui, sans-serif;
  --ink-100: #1a1511; --ink-60: rgba(26,21,17,0.6); --ink-40: rgba(26,21,17,0.4);
  --ink-12: rgba(26,21,17,0.1); --ink-07: rgba(26,21,17,0.07); --ink-05: rgba(26,21,17,0.04);
  --gold: #cc5500; --gold-bg: rgba(204,85,0,0.09);
  --bg-page: #f5f0e8; --bg-card: #faf7f2; --bg-input: #f0ebe0;
  --accent: #cc5500; --accent-dark: #a84400;
}
body.dark {
  --ink-100: #f0ece4; --ink-60: rgba(240,236,228,0.6); --ink-40: rgba(240,236,228,0.4);
  --ink-12: rgba(240,236,228,0.12); --ink-07: rgba(240,236,228,0.07); --ink-05: rgba(240,236,228,0.04);
  --gold-bg: rgba(204,85,0,0.15);
  --bg-page: #1a1714; --bg-card: #242019; --bg-input: #2e2923;
  --accent: #e06010; --accent-dark: #cc5500;
}
/* 기본 */
body.dark { background: #111; color: #f0ece4; }
body.dark #root { background: #1a1714; }

/* 화면 전체 */
body.dark .scr { background: #1a1714; color: #f0ece4; }
body.dark .scr-scroll { color: #f0ece4; }

/* 텍스트 */
body.dark h1, body.dark h2, body.dark h3,
body.dark .h-display, body.dark .book-tile__title,
body.dark .book-hero__title, body.dark .sect-row__name,
body.dark .page-row__num, body.dark .word-item__en,
body.dark .scope-card__name, 

body.dark .muted, body.dark .book-tile__sub,
body.dark .book-hero__author, body.dark .label-xs,
body.dark .word-item__base, body.dark .word-item__ctx,
body.dark .page-row__right, body.dark .sect-row__count { color: rgba(240,236,228,0.55); }

/* 카드/배경 */
body.dark .book-cover { opacity: 0.9; }
body.dark .face-front { background: #2e2923; }
body.dark .back__word, body.dark .back__meaning { color: #f0ece4; }
body.dark .done__tile { background: #2e2923; border-color: rgba(240,236,228,0.1); }
body.dark .done__tile-value { color: #f0ece4; }

/* 리스트/행 */
body.dark .page-row { border-color: rgba(240,236,228,0.07); }
body.dark .list-row { border-color: rgba(240,236,228,0.07); }
body.dark .word-item { border-color: rgba(240,236,228,0.07); }
body.dark .rule { border-color: rgba(240,236,228,0.07); }

/* 입력창 */
body.dark input, body.dark textarea {
  background: #2e2923 !important;
  color: #f0ece4 !important;
  border-color: rgba(240,236,228,0.1) !important;
}
body.dark input::placeholder { color: rgba(240,236,228,0.3) !important; }
body.dark select {
  background: #2e2923 !important;
  color: #f0ece4 !important;
}

/* 버튼 */
body.dark .btn-outline { border-color: rgba(240,236,228,0.2); color: #f0ece4; }
body.dark .ox-x { background: #2e2923; color: #f0ece4; border-color: rgba(240,236,228,0.15); }
body.dark .topnav__back, body.dark .topnav__title,
body.dark .topnav__right { color: #f0ece4; }

/* 스코프 카드 */
body.dark .scope-card { border-color: rgba(240,236,228,0.15); background: #242019; }
body.dark .scope-card--on { border-color: #f0ece4; }
body.dark .scope-card__hint { color: rgba(240,236,228,0.5); }
body.dark .radio { border-color: rgba(240,236,228,0.4); }

/* 시트/모달 */
body.dark .sheet { background: #242019; color: #f0ece4; }
body.dark .sheet h3 { color: #f0ece4; }
body.dark .sheet-note { color: rgba(240,236,228,0.6); }
body.dark .action-sheet__menu { background: #242019; }
body.dark .action-sheet__item { color: #f0ece4; }
body.dark .action-sheet__divider { background: rgba(240,236,228,0.07); }

/* 독/네비 */
body.dark .dock {
  background: rgba(26,23,20,0.95);
  border-color: rgba(240,236,228,0.07);
}
body.dark .dock__btn { color: rgba(240,236,228,0.4); }
body.dark .dock__btn--active { color: var(--accent); }

/* 단어 선택 화면 */
body.dark #word-sel-list > div { background: #242019 !important; }
body.dark #word-sel-list > div div { color: #f0ece4; }

/* 통계 */
body.dark .done__grid .done__tile { background: #2e2923; }

/* 검색 */
body.dark #search-results > div { border-color: rgba(240,236,228,0.07); color: #f0ece4; }

/* 복습 배너 */
body.dark .review-banner { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg-card); border-bottom: 2px solid var(--accent); padding: 12px 16px; z-index: 15; display: none; pointer-events: none; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.review-banner.show { display: block; pointer-events: all; }
.review-banner__title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.review-banner__desc { font-size: 12px; color: var(--ink-60); }
.review-banner__btns { display: flex; gap: 8px; margin-top: 10px; }
.review-banner__btn { flex: 1; padding: 8px; border-radius: 8px; border: none; font-family: var(--font-body); font-size: 12px; cursor: pointer; color: var(--ink-100); }
.install-banner { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 440px; background: var(--bg-card); border-radius: 16px; padding: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.15); z-index: 550; display: none; }
.install-banner.show { display: block; }
.install-banner__title { font-size: 14px; font-weight: 700; color: var(--ink-100); margin-bottom:6px; }
.install-banner__desc { font-size: 12px; color: var(--ink-60); line-height: 1.6; }
.install-banner__close { position: absolute; top: 12px; right: 14px; font-size: 18px; cursor: pointer; color: var(--ink-40); background: none; border: none; }
.install-banner__icon { font-size: 24px; margin-bottom: 6px; }
/* 다크모드 */
body.dark .review-banner { background: #242019; border-color: var(--accent); color: #f0ece4; }
/* 설치 배너 */
body.dark .install-banner { background: #242019; color: #f0ece4; }

/* 스크롤바 */
body.dark .scr-scroll::-webkit-scrollbar-thumb { background: rgba(240,236,228,0.15); }

/* 칩 */
body.dark .chip { background: #2e2923; border-color: rgba(240,236,228,0.15); color: #f0ece4; }

/* 게임 setup 리스트 */
body.dark #study-setup-inner .list-row { background: transparent; }
body.dark #study-setup-inner .list-row div { color: #f0ece4; }

/* ── 다크모드 인라인 스타일 보완 ── */
body.dark .scr input,
body.dark .scr textarea,
body.dark .scr select {
  background: #2e2923 !important;
  color: #f0ece4 !important;
  border-color: rgba(240,236,228,0.12) !important;
}
body.dark .scr input::placeholder { color: rgba(240,236,228,0.35) !important; }

/* 퀴즈 보기 버튼 */
body.dark .quiz-choice {
  background: #242019 !important;
  color: #f0ece4 !important;
  border-color: rgba(240,236,228,0.15) !important;
}

/* 단어 선택 카드 */
body.dark .word-sel-card {
  background: #242019 !important;
  color: #f0ece4 !important;
}
body.dark .word-sel-card div { color: #f0ece4 !important; }

/* 책 검색 결과 */
body.dark .book-search-btn {
  background: transparent !important;
  color: #f0ece4 !important;
  border-color: rgba(240,236,228,0.07) !important;
}
body.dark .book-search-btn div:first-child { color: #f0ece4 !important; }
body.dark .book-search-btn div:last-child { color: rgba(240,236,228,0.5) !important; }

/* 기존 페이지 선택 */
body.dark [id^="ep-"] {
  background: #242019 !important;
  border-color: rgba(240,236,228,0.15) !important;
  color: #f0ece4 !important;
}
body.dark [id^="ep-"] div { color: #f0ece4 !important; }

/* 수동 입력 단어 카드 */
body.dark #manual-word-list > div {
  background: #242019 !important;
  color: #f0ece4 !important;
}
body.dark #manual-word-list div { color: #f0ece4 !important; }

/* 로그인 탭 버튼 */
body.dark .login-tab-btn {
  color: #f0ece4 !important;
}

/* 복습 배너 나중에 버튼 */
body.dark .review-banner__btn {
  color: #f0ece4 !important;
}

/* 통계 카드 */
body.dark #stats-inner > div > div {
  background: #242019 !important;
}

/* 설치 배너 제목 */
body.dark .install-banner__title { color: #f0ece4 !important; }

/* topnav 버튼 (책장 상단) */
body.dark .topbar-btn {
  border-color: rgba(240,236,228,0.2) !important;
  color: rgba(240,236,228,0.7) !important;
}

/* 스터디 앞면 카드 */
body.dark .card__word { color: #f0ece4 !important; }
body.dark .card__ipa { color: rgba(240,236,228,0.5) !important; }
body.dark .card__tap { color: rgba(240,236,228,0.4) !important; }

/* ox 버튼 */

/* scope-card 다크 */
body.dark .scope-card--on { border-color: #f0ece4 !important; }
body.dark .scope-card--on .radio--on { background: #f0ece4 !important; border-color: #f0ece4 !important; color: #1a1714 !important; }

/* 단어 ctx */
body.dark .word-item__ctx { color: rgba(240,236,228,0.7) !important; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { height: 100%; font-family: var(--font-body); color: var(--ink-100); -webkit-font-smoothing: antialiased; background: #d4cabb; }
#root { position: fixed; inset: 0; }
.scr { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 20px 22px 0; overflow: hidden; background: var(--bg-page); }
@media (min-width: 768px) {
  .scr { left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 28px 32px 0; border-left: 1px solid var(--ink-12); border-right: 1px solid var(--ink-12); }
  .book-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .dock { left: 50% !important; transform: translateX(-50%) !important; width: 100% !important; max-width: 480px !important; border-left: 1px solid var(--ink-12); border-right: 1px solid var(--ink-12); }
  .overlay { max-width: none; left: 0; transform: none; }
  .sheet { max-width: 480px; margin: 0 auto; }
  .btn-fixed { left: 48px !important; right: 48px !important; }
}
.scr-scroll { flex: 1; overflow-y: auto; padding-bottom: 24px; }
.scr-scroll::-webkit-scrollbar { width: 4px; }
.scr-scroll::-webkit-scrollbar-thumb { background: var(--ink-12); border-radius: 2px; }
.h-display { font-family: var(--font-display); letter-spacing: -0.03em; line-height: 0.97; color: var(--ink-100); }

.label-xs { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-40); font-weight: 500; }
.muted { color: var(--ink-60); }
.topnav { display: flex; justify-content: space-between; align-items: center; height: 30px; margin-bottom: 2px; flex-shrink: 0; }
.topnav__back { font-size: 20px; cursor: pointer; padding: 4px 8px 4px 0; color: var(--ink-100); user-select: none; }
.topnav__title { font-size: 13px; color: var(--ink-60); letter-spacing: -0.02em; }
.topnav__right { font-size: 16px; cursor: pointer; padding: 4px 0 4px 8px; }
.dock { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 80px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; background: rgba(245,240,232,0.92); border-top: 1px solid var(--ink-07); backdrop-filter: blur(20px); z-index: 20; }
.dock__btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 20px; font-size: 10px; color: var(--ink-40); background: none; border: none; font-family: var(--font-body); }
.dock__btn--active { color: var(--accent); }
button:active, .dock__btn:active, .book-tile:active, .scope-card:active, .list-row:active, .page-row:active, .chip:active {
  opacity: 0.6 !important;
  transform: scale(0.97);
  transition: opacity 0.05s, transform 0.05s;
}
.btn:active { filter: brightness(0.88); transform: scale(0.98); transition: all 0.05s; }
.ox-btn:active { filter: brightness(0.85); transform: scale(0.96); transition: all 0.05s; }
.dock__glyph { font-family: var(--font-display); font-size: 22px; line-height: 1; letter-spacing: -0.04em; }
.btn { width: 100%; padding: 15px 14px; border-radius: 13px; font-family: var(--font-body); font-weight: 500; font-size: 15px; cursor: pointer; border: none; text-align: center; }
.btn-solid { background: var(--accent); color: #fff; }
.btn-outline { background: transparent; color: var(--ink-100); border: 1.5px solid var(--ink-12); }
.btn-fixed { position: absolute; left: 22px; right: 22px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
.lib-header { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4px; }
.lib-plus { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; color: var(--accent); }
.book-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; margin-top: 20px; }
.book-tile { cursor: pointer; }
.book-cover { width: 100%; aspect-ratio: 2/3; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 12px 14px; color: #fff; font-family: var(--font-display); letter-spacing: -0.04em; line-height: 0.97; overflow: hidden; }
.book-cover__title { font-size: 18px; } .book-cover__author { font-family: var(--font-body); font-size: 10px; opacity: 0.75; }
.book-tile__title { font-size: 13px; font-weight: 600; margin-top: 8px; color: var(--ink-100); }
.book-tile__sub { font-size: 11px; color: var(--ink-60); margin-top: 2px; }
.book-hero { display: flex; gap: 14px; margin-top: 14px; align-items: flex-start; }
.book-hero__cover { width: 88px; height: 132px; border-radius: 8px; flex-shrink: 0; }
.book-hero__title { font-family: var(--font-display); font-size: 20px; letter-spacing: -0.04em; color: var(--ink-100); line-height: 1.1; }
.book-hero__author { font-size: 12px; color: var(--ink-60); margin-top: 5px; }
.book-hero__badge { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-40); margin-top: 10px; }
.book-hero__desc { font-size: 11px; color: var(--ink-60); line-height: 1.55; margin-top: 4px; }
.rule { margin-top: 16px; border-top: 1px solid var(--ink-07); }
.sect-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.sect-row__name { font-size: 13px; font-weight: 600; color: var(--ink-100); }
.sect-row__count { font-size: 11px; color: var(--ink-60); }
.page-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--ink-07); }
.page-row:last-child { border-bottom: none; }
.page-row__num { font-size: 13px; font-weight: 500; color: var(--ink-100); }
.page-row__right { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-60); }

.scanning { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.ring { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--ink-07); border-top-color: var(--ink-100); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 11px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--ink-12); color: var(--ink-100); background: var(--bg-card); }
.word-item { padding: 10px 0; border-bottom: 1px solid var(--ink-07); }
.word-item:last-child { border-bottom: none; }
.word-item__en { font-weight: 600; font-size: 16px; color: var(--ink-100); }
.word-item__base { font-size: 11px; color: var(--ink-60); margin-top: 2px; }
.word-item__ctx { font-size: 11px; color: var(--ink-100); margin-top: 2px; }
.word-item__ctx em { font-style: normal; background: var(--gold-bg); padding: 0 2px; }
.scope-card { border: 1.5px solid var(--ink-12); border-radius: 13px; padding: 15px; cursor: pointer; }
.scope-card--on { border-color: var(--ink-100); border-width: 2px; padding: 14px; }
.scope-card__head { display: flex; justify-content: space-between; align-items: center; }
.scope-card__name { font-size: 14px; font-weight: 600; color: var(--ink-100); }
.scope-card__hint { font-size: 11px; color: var(--ink-60); margin-top: 4px; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-40); display: flex; align-items: center; justify-content: center; font-size: 10px; }
.radio--on { background: var(--ink-100); border-color: var(--ink-100); color: var(--bg-page); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--ink-07); cursor: pointer; }
.list-row:last-child { border-bottom: none; }
.study { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 18px 22px 22px; z-index: 25; background: var(--bg-page); }
.study__top { display: flex; justify-content: space-between; align-items: center; }
.study__info { font-size: 11px; color: var(--ink-60); }
.study__close { font-size: 16px; cursor: pointer; padding: 4px; color: var(--ink-100); }
.study__bar { height: 3px; background: var(--ink-07); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.study__fill { height: 100%; background: var(--accent); transition: width 250ms ease; }
.study__round { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-40); margin-top: 8px; }
.card-wrap { flex: 1; perspective: 1400px; cursor: pointer; margin: 14px 0; }
.card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 500ms cubic-bezier(.4,0,.2,1); }
.card--flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 20px; -webkit-backface-visibility: hidden; backface-visibility: hidden; padding: 24px; display: flex; flex-direction: column; }
.face-front { background: var(--bg-input); }
.face-back { background: #2a1f15; border: 1px solid rgba(255,255,255,0.06); transform: rotateY(180deg); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.face-front__center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.card__word { font-family: var(--font-display); font-size: 40px; letter-spacing: -0.04em; color: var(--ink-100); text-align: center; line-height: 1; }
.card__ipa { font-size: 13px; color: var(--ink-40); }
.card__tap { font-size: 11px; color: var(--ink-40); text-align: center; margin-top: 16px; }
.back__word { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.04em; color: #f5ede0; text-align:center; }
.back__label { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(245,237,224,0.45); margin-top: 14px; text-align:center; }
.back__meaning { font-size: 16px; margin-top: 4px; line-height: 1.3; color: #f5ede0; text-align:center; }
.ox-row { display: flex; gap: 10px; }
.ox-btn { flex: 1; height: 52px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 22px; cursor: pointer; border: none; }
.ox-x { border: 1.5px solid var(--ink-12); background: var(--bg-card); color: var(--ink-100); }
.ox-o { background: var(--accent); color: #fff; }
.ox-btn:disabled { opacity: 0.3; cursor: default; }
.ox-hint { text-align: center; font-size: 10px; color: var(--ink-40); margin-top: 6px; }
.done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 0 8px; }
.done__n { font-family: var(--font-display); font-size: 96px; letter-spacing: -0.05em; color: var(--accent); line-height: 1; }
.done__label { font-size: 14px; color: var(--ink-60); }
.done__grid { margin-top: 24px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

<script>
const SB_URL = 'https://ziatqkjlafucqtwshhla.supabase.co';
const SB_KEY = 'sb_publishable_anybo402FSdDKMNiWcQzSA_oc7LIzZC';
let currentUser = null, _authToken = null;

async function sbFetch(path, method='GET', body=null, useAuth=true) {
  const headers = { 'Content-Type': 'application/json', 'apikey': SB_KEY };
  headers['Authorization'] = (useAuth && _authToken) ? 'Bearer ' + _authToken : 'Bearer ' + SB_KEY;
  const res = await fetch(SB_URL + path, { method, headers, body: body ? JSON.stringify(body) : null });
  return res.json();
}

// ── 언어 설정 ──
const LANG_OPTIONS = [
  {code:'ko',name:'한국어',flag:'🇰🇷'},{code:'en',name:'English',flag:'🇺🇸'},
  {code:'es',name:'Español',flag:'🇪🇸'},{code:'zh',name:'中文',flag:'🇨🇳'},
  {code:'ja',name:'日本語',flag:'🇯🇵'},{code:'fr',name:'Français',flag:'🇫🇷'},
  {code:'de',name:'Deutsch',flag:'🇩🇪'},{code:'pt',name:'Português',flag:'🇧🇷'},
  {code:'vi',name:'Tiếng Việt',flag:'🇻🇳'},{code:'id',name:'Bahasa',flag:'🇮🇩'},
];
const TARGET_LANG_OPTIONS = [
  {code:'en',name:'English',flag:'🇺🇸'},{code:'ko',name:'한국어',flag:'🇰🇷'},
  {code:'es',name:'Español',flag:'🇪🇸'},{code:'zh',name:'中文',flag:'🇨🇳'},
  {code:'ja',name:'日本語',flag:'🇯🇵'},{code:'fr',name:'Français',flag:'🇫🇷'},
  {code:'de',name:'Deutsch',flag:'🇩🇪'},{code:'pt',name:'Português',flag:'🇧🇷'},
];
let userNativeLang = localStorage.getItem('imvoca.nativeLang')||'ko';
let userTargetLang = localStorage.getItem('imvoca.targetLang')||'en';
function getNativeLang(){return LANG_OPTIONS.find(l=>l.code===userNativeLang)||LANG_OPTIONS[0];}
function getTargetLang(){return TARGET_LANG_OPTIONS.find(l=>l.code===userTargetLang)||TARGET_LANG_OPTIONS[0];}

const UI_TEXT = {
  ko:{bookshelf:'님 책장',addBook:'새 책 추가',appInfo:'앱 소개',dark:'다크',light:'라이트',logout:'로그아웃',manage:'⚙️ 관리',
    game:'게임',review:'복습',stats:'통계',search:'검색',

    fileSelect:'🖼️ 파일 선택 (최대 5장)',cameraCapture:'📷 카메라 촬영',
    wordSelect:'단어 선택',selectWords:'저장할 단어를 선택해주세요',saveWords:'선택한 단어 저장',allSelect:'전체선택',

  },

    game:'Study',review:'Review',stats:'Stats',search:'Search',

    sendToCard:'Study with Flashcards',adminMenu:'AI Settings',memberMgmt:'Members',demoLink:'Generate Demo Link',
  }
};
function t(key){const lang=userNativeLang==='ko'?'ko':'en';return UI_TEXT[lang][key]||UI_TEXT['en'][key]||key;}

async function sbInit() {
  initDarkMode();
  renderLogin();

  // ── 데모 링크 토큰 감지 ──
  const urlParams = new URLSearchParams(window.location.search);
  const demoToken = urlParams.get('demo');
  if (demoToken) {
    // URL에서 토큰 제거 (주소창 깔끔하게)
    window.history.replaceState({}, '', window.location.pathname);
    await loginWithDemoToken(demoToken);
    return;
  }

  const saved = localStorage.getItem('imvoca.session');
  if (saved) {
    try {
      const sess = JSON.parse(saved);
      if (!sess.access_token || !sess.user) { localStorage.removeItem('imvoca.session'); return; }
      const verify = await fetch(SB_URL + '/auth/v1/user', {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + sess.access_token }
      });
      if (!verify.ok) { localStorage.removeItem('imvoca.session'); renderLogin(); return; }
      const userData = await verify.json();
      _authToken = sess.access_token;
      currentUser = userData;
      if (currentUser.email !== 'koreayjk@gmail.com') {
        const res = await fetch(SB_URL + `/rest/v1/members?id=eq.${currentUser.id}&select=role`, {
          headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }
        });
        const roleData = await res.json();
        const role = roleData[0]?.role;
        if (role === '대기중') {
          localStorage.removeItem('imvoca.session');
          renderLogin();
          toast('승인 대기 중이에요. 관리자 승인 후 사용 가능해요');
          return;
        }
      }
      await loadApiKey();
      await loadUserName();
      await loadBooksFromDB();
      render();
      setTimeout(checkReviews, 1000);
    } catch(e) {
      console.error('세션 복원 실패:', e);
      localStorage.removeItem('imvoca.session');
      renderLogin();
    }
  }
}


// ── 데모 링크로 로그인 ──
async function loginWithDemoToken(code) {
  try {
    // 로딩 표시
    document.getElementById('root').innerHTML = `
      <div class="scr" style="justify-content:center;align-items:center;gap:16px;">
        <div class="ring"></div>
        <div style="text-align:center">
          <div style="font-size:15px;font-weight:600;color:var(--ink-100);">입장 중...</div>
          <div class="muted" style="font-size:12px;margin-top:4px;">잠깐만 기다려주세요</div>
        </div>
      </div>`;

    // DB에서 코드로 토큰 조회
    const res = await fetch(SB_URL + `/rest/v1/demo_links?code=eq.${code}&select=*`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    const data = await res.json();

    if (!data?.length) { toast('유효하지 않은 링크예요'); renderLogin(); return; }

    const { access_token, expires_at } = data[0];

    // 만료 확인
    if (new Date() > new Date(expires_at)) {
      toast('링크가 만료됐어요. 새 링크를 받아주세요');
      renderLogin();
      return;
    }

    // 토큰 유효성 서버 확인
    const verify = await fetch(SB_URL + '/auth/v1/user', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + access_token }
    });
    if (!verify.ok) { toast('유효하지 않은 링크예요'); renderLogin(); return; }

    const userData = await verify.json();
    _authToken = access_token;
    currentUser = userData;

    // 세션 저장
    localStorage.setItem('imvoca.session', JSON.stringify({ access_token, user: userData }));

    toast('✅ 입장했어요!');
    await loadApiKey();
    await loadUserName();
    await loadBooksFromDB();
    render();
    setTimeout(checkReviews, 1000);
  } catch(e) {
    toast('링크 오류: ' + e.message);
    renderLogin();
  }
}

// ── 데모 링크 생성 (관리자 전용) ──
async function generateDemoLink() {
  if (!_authToken) { toast('로그인 상태가 아니에요'); return; }

  toast('링크 생성 중...');

  // 6자리 랜덤 코드 생성
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  const expires_at = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();

  try {
    // Supabase demo_links 테이블에 저장
    const res = await fetch(SB_URL + '/rest/v1/demo_links', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + _authToken,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ code, access_token: _authToken, expires_at })
    });

    if (!res.ok) { toast('링크 생성 실패: ' + res.status); return; }

    const link = `https://koreayjk.github.io/voca/?demo=${code}`;
    showDemoLinkModal(link, code);
  } catch(e) { toast('오류: ' + e.message); }
}

function showDemoLinkModal(link, code) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';

      <div style="background:var(--bg-input);border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="font-size:10px;color:var(--ink-40);margin-bottom:6px;">링크</div>
        <div style="font-size:13px;color:var(--accent);font-weight:600;word-break:break-all;">${link}</div>
      </div>

      <!-- 복사 버튼 -->
      <button id="demo-copy-btn" onclick="
        navigator.clipboard.writeText('${link}').then(()=>{
          document.getElementById('demo-copy-btn').textContent='✅ 복사됐어요!';
          setTimeout(()=>document.getElementById('demo-copy-btn').textContent='링크 복사하기',2000);
        }).catch(()=>{
          document.getElementById('demo-copy-btn').textContent='✅ 복사됐어요!';
        });
        "
        style="width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;">
        링크 복사하기
      </button>

      <button onclick="this.closest('[style*=fixed]').remove();"
        style="width:100%;padding:12px;background:none;color:var(--ink-60);border:none;font-family:var(--font-body);font-size:13px;cursor:pointer;">
        닫기
      </button>
    </div>`;
  document.body.appendChild(overlay);

  }).catch(() => {});
}

async function loadBooksFromDB() {
  try {
    const bd = await sbFetch(`/rest/v1/voca_books?user_id=eq.${currentUser.id}&order=created_at`);
    if (!Array.isArray(bd)) return;
    books = [];
    for (const b of bd) {
      const pd = await sbFetch(`/rest/v1/voca_pages?book_id=eq.${b.id}&order=page_num`);
      const pages = [];
      for (const p of (Array.isArray(pd) ? pd : [])) {
        const wd = await sbFetch(`/rest/v1/voca_words?page_id=eq.${p.id}&order=created_at`);
        pages.push({ num:p.page_num, _pid:p.id, words:(Array.isArray(wd)?wd:[]).map(w=>({id:w.id,en:w.en,ipa:w.ipa||'',base:w.base,ctx:w.ctx,sentence:w.sentence||'',level:w.level||''})) });
      }
      books.push({ id:b.id, title:b.title, author:b.author, color:b.color, desc:b.description||'', cover:b.cover_url||'', pages });
    }
  } catch(e) { console.error('DB load error:', e); }
}

async function saveBookToDB(title, author, color, desc, cover='') {
  try {
    const headers = { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken, 'Prefer': 'return=representation' };
    const res = await fetch(SB_URL + '/rest/v1/voca_books', { method:'POST', headers, body: JSON.stringify({ user_id:currentUser.id, title, author, color, description:desc, cover_url:cover }) });
    const data = await res.json();
    if (data.code || data.error) { toast('DB 오류: ' + (data.message || data.error)); return null; }
    return Array.isArray(data) ? data[0] : data;
  } catch(e) { toast('저장 오류: ' + e.message); return null; }
}

async function savePageWordsToDB(bookId, pageNum, words) {
  try {
    const book = findBook(bookId);
    let pageId;
    const ex = book?.pages.find(p => String(p.num) === String(pageNum));
    if (ex?._pid) { pageId = ex._pid; }
    else {
      const headers = { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken, 'Prefer': 'return=representation' };
      const res = await fetch(SB_URL + '/rest/v1/voca_pages', { method:'POST', headers, body: JSON.stringify({ book_id:bookId, page_num:String(pageNum) }) });
      const data = await res.json();
      pageId = (Array.isArray(data) ? data[0] : data)?.id;
    }
    if (!pageId) return null;
    for (const w of words) {
      const headers = { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken };
      await fetch(SB_URL + '/rest/v1/voca_words', { method:'POST', headers, body: JSON.stringify({ page_id:pageId, en:w.en, ipa:w.ipa||'', base:w.base, ctx:w.ctx, sentence:w.sentence||'', level:w.level||'' }) });
    }
    return pageId;
  } catch(e) { return null; }
}

<script>
// ── Gemini API 모델 폴백 + 재시도 ──
const GEMINI_MODELS = [
  'gemini-3-flash-preview',
  'gemini-2.5-flash',
  'gemini-2.0-flash',
  'gemini-2.0-flash-lite',
];
let _geminiModelIdx = 0;

async function geminiWithRetry(body, maxRetry=7) {
  const totalModels = GEMINI_MODELS.length;
  let lastError = null;
  for (let attempt = 0; attempt < maxRetry; attempt++) {
    const modelIdx = (_geminiModelIdx + attempt) % totalModels;
    const model = GEMINI_MODELS[modelIdx];
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
    try {
      const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const data = await res.json();
      if (data.error) {
        const code = data.error.code, msg = data.error.message||'';
        const isRetryable = code===429||code===503||msg.includes('demand')||msg.includes('quota')||msg.includes('overloaded')||msg.includes('unavailable')||msg.includes('busy');
        if (isRetryable && attempt < maxRetry-1) {
          const nextModel = GEMINI_MODELS[(modelIdx+1)%totalModels];
          toast(`⚡ ${model} 혼잡 → ${nextModel} 전환 중...`);
          await new Promise(r=>setTimeout(r,2000)); continue;
        }
        return data;
      }
      _geminiModelIdx = modelIdx; return data;
    } catch(e) {
      lastError = e;
      if (attempt < maxRetry-1) { toast('네트워크 오류. 재시도 중...'); await new Promise(r=>setTimeout(r,3000)); }
    }
  }
  throw lastError || new Error('모든 모델 시도 실패');
}

const COLORS = ['#8b4513','#6b5a3e','#7a4a2a','#5a6b3e','#4a3a6b','#6b3a4a','#3e5a4a'];
let books = [], apiKey = '', userName = '';
let imgData = null, pendingW = null, pendingB = null, pendingP = null;

function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

let stack = [{ name:'library' }];
function push(r) { stack.push(r); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function goTab(t) {
  if (t==='study') stack = [{name:'study-setup'}];
  else if (t==='stats') stack = [{name:'stats'}];
  else if (t==='search') stack = [{name:'search'}];
  else if (t==='review') stack = [{name:'review'}];
  else stack = [{name:'library'}];
  render();
}
function replace(r) { stack[stack.length-1] = r; render(); }
function currentTab() { const n = stack[stack.length-1].name; if (['study-setup','study-cards','study-done'].includes(n)) return 'study'; if (n==='stats') return 'stats'; if (n==='search') return 'search'; if (n==='review') return 'review'; return 'books'; }

function findBook(id) { return books.find(b => b.id === id); }
function findPage(book, num) { return book.pages.find(p => String(p.num) === String(num)); }
function countWords(book) { return book.pages.reduce((n,p) => n + p.words.length, 0); }
function allWords(book) { const out=[]; book.pages.forEach(p => p.words.forEach(w => out.push({...w, pageNum:p.num}))); return out; }
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

async function openCamera() {
  if (!window._cameraShots) window._cameraShots = [];
  const area = document.getElementById('camera-area');
  const video = document.getElementById('camera-video');
  const isMobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
  if (isMobile) {
    video.style.width = '100%'; video.style.aspectRatio = '3/4'; video.style.maxHeight = ''; video.style.objectFit = 'cover';
  } else {
    video.style.width = '100%'; video.style.aspectRatio = '16/9'; video.style.maxHeight = ''; video.style.objectFit = 'cover';
  }
  try {
    const constraints = isMobile
      ? { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1080 }, height: { ideal: 1440 } } }
      : { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream; area.style.display = 'block'; window._cameraStream = stream;
  } catch(e) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream; area.style.display = 'block'; window._cameraStream = stream;
    } catch(e2) { toast('카메라 접근 권한이 필요해요'); }
  }
  updateCameraCounter();
}

function updateCameraCounter() {
  const shots = window._cameraShots || [];
  const counter = document.getElementById('camera-counter');
  const captureBtn = document.getElementById('camera-capture-btn');
  const useBtn = document.getElementById('camera-use-btn');
  if (counter) {
    counter.textContent = shots.length > 0 ? `${shots.length}/5 ${userNativeLang==='ko'?'장 촬영됨':'shots taken'}` : '';
    counter.style.display = shots.length > 0 ? 'block' : 'none';
  }
  if (captureBtn) {
    captureBtn.textContent = shots.length >= 5 ? userNativeLang==='ko'?'📸 최대 5장':'📸 Max 5' : userNativeLang==='ko'?'📸 촬영하기':'📸 Capture';
    captureBtn.disabled = shots.length >= 5;
    captureBtn.style.opacity = shots.length >= 5 ? '0.5' : '1';
  }
  if (useBtn) {
    useBtn.style.display = shots.length > 0 ? 'block' : 'none';
    useBtn.textContent = shots.length === 1 ? userNativeLang==='ko'?'✅ 이 사진 사용하기':'✅ Use This Photo' : userNativeLang==='ko'?`✅ ${shots.length}장 사용하기`:`✅ Use ${shots.length} Photos`;
  }
  // 썸네일 업데이트
  const thumbWrap = document.getElementById('camera-thumbs');
  if (thumbWrap) {
    thumbWrap.innerHTML = shots.map((d,i) => `
      <div style="position:relative;flex-shrink:0;">
        <img src="${d}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid var(--accent);">
        <button onclick="removeCameraShot(${i})" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#e74c3c;border:none;color:#fff;font-size:10px;cursor:pointer;line-height:18px;text-align:center;padding:0;">✕</button>
      </div>`).join('');
    thumbWrap.style.display = shots.length > 0 ? 'flex' : 'none';
  }
}

function removeCameraShot(i) {
  window._cameraShots.splice(i, 1);
  updateCameraCounter();
}

function closeCamera() {
  const video = document.getElementById('camera-video');
  const area = document.getElementById('camera-area');
  if (window._cameraStream) { window._cameraStream.getTracks().forEach(t => t.stop()); window._cameraStream = null; }
  video.srcObject = null; area.style.display = 'none';
}

function cancelCamera() {
  window._cameraShots = [];
  closeCamera();
}

function capturePhoto() {
  if ((window._cameraShots||[]).length >= 5) { toast('최대 5장까지 촬영할 수 있어요'); return; }
  const video = document.getElementById('camera-video');
  const canvas = document.getElementById('camera-canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const shot = canvas.toDataURL('image/jpeg', 0.92);
  if (!window._cameraShots) window._cameraShots = [];
  window._cameraShots.push(shot);
  // 플래시 효과
  const flash = document.getElementById('camera-flash');
  if (flash) { flash.style.opacity='1'; setTimeout(()=>flash.style.opacity='0', 150); }
  toast(`${window._cameraShots.length}장 촬영됨`);
  updateCameraCounter();
}

function useCameraShots() {
  const shots = window._cameraShots || [];
  if (!shots.length) return;
  closeCamera();
  if (shots.length === 1) {
    imgData = shots[0];
    window._cameraShots = [];
    window._multiImgData = null;
    renderUploadPreview();
  } else {
    window._multiImgData = [...shots];
    window._cameraShots = [];
    imgData = null;
    renderMultiPreview(window._multiImgData);
  }
}

function handleFileChange(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  if (files.length > 5) { toast('최대 5장까지만 선택할 수 있어요'); return; }
  const readers = files.map(f => new Promise(resolve => {
    const img = new Image(), r = new FileReader();
    r.onload = ev => {
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1200; let w = img.width, h = img.height;
        if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h*MAX/w); w=MAX; } else { w=Math.round(w*MAX/h); h=MAX; } }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  }));
  Promise.all(readers).then(dataUrls => {
    if (dataUrls.length === 1) {
      imgData = dataUrls[0];
      window._multiImgData = null;
      renderUploadPreview();
    } else {
      window._multiImgData = dataUrls;
      imgData = null;
      renderMultiPreview(dataUrls);
    }
  });
}

async function doMultiScan() {
  const bId = document.getElementById('up-book-sel')?.value;
  if (!bId) { toast('책을 먼저 선택해주세요'); return; }
  const dataUrls = window._multiImgData;
  if (!dataUrls?.length) return;
  window._multiQueue = [...dataUrls];
  window._multiIdx = 0;
  window._multiBookId = bId;
  await processNextMultiScan();
}

async function processNextMultiScan() {
  const idx = window._multiIdx;
  const total = window._multiImgData.length;
  const bId = window._multiBookId;
  if (idx >= total) {
    toast(`✅ ${total}장 모두 완료!`);
    window._multiImgData = null;
    render();
    return;
  }
  const currentImg = window._multiQueue[idx];
  window._multiQueue[idx] = null;
  renderScanLoading(idx+1, total);
  let words;
  try {
    const b64 = currentImg.split(',')[1], mt = currentImg.split(';')[0].split(':')[1];
    const data = await geminiWithRetry({ contents:[{parts:[{inline_data:{mime_type:mt,data:b64}},{text:buildScanPrompt(false)}]}], generationConfig:{temperature:0.1,maxOutputTokens:4096} });
    if (data.error) {
      if (data.error.code===403) toast('API 키를 확인해주세요');
      else toast('오류가 발생했어요\n잠시 후 다시 시도해주세요');
      render(); return;
    }
    if (!data.candidates?.[0]) { toast('응답 오류, 다시 시도해주세요'); render(); return; }
    const txt = data.candidates[0].content.parts[0].text;
    const clean = txt.replace(/```json|```/g,'').trim();
    let parsed;
    try { parsed = JSON.parse(clean); }
    catch(pe) {
      const fixed = clean.replace(/,?\s*\{[^}]*$/,'').replace(/,\s*$/,'') + ']}';
      try { parsed = JSON.parse(fixed); }
      catch(pe2) {
        const matches = clean.match(/"en"\s*:\s*"([^"]+)"/g)||[];
        const bases = clean.match(/"base"\s*:\s*"([^"]+)"/g)||[];
        const ctxs = clean.match(/"ctx"\s*:\s*"([^"]+)"/g)||[];
        if (matches.length>0) { parsed={words:matches.map((m,i)=>({en:m.match(/"en"\s*:\s*"([^"]+)"/)[1],base:bases[i]?bases[i].match(/"base"\s*:\s*"([^"]+)"/)[1]:'',ctx:ctxs[i]?ctxs[i].match(/"ctx"\s*:\s*"([^"]+)"/)[1]:''}))}; }
        else { toast('단어를 찾지 못했어요'); window._multiIdx++; await processNextMultiScan(); return; }
      }
    }
    words = parsed.words;
    if (!words?.length) { toast(`${idx+1}번 사진에서 단어를 찾지 못했어요`); window._multiIdx++; await processNextMultiScan(); return; }
  } catch(e) { toast('네트워크 오류'); render(); return; }
  pendingW = words; pendingB = bId; pendingP = null;
  renderWordSelectionMulti(words, idx, total);
}

function toggleWord(i) {
  window._wordSelected[i] = !window._wordSelected[i];
  const sel = window._wordSelected[i];
  const el = document.getElementById(`wsel-${i}`);
  const check = document.getElementById(`wsel-check-${i}`);
  const levelColor = { 'C2':'#7b2d8b','C1':'#c0392b','B2':'#e67e22','B1':'#2980b9','A2':'#27ae60','A1':'#95a5a6' };
  const level = pendingW[i]?.level || '?';
  if (sel) {
    el.style.border = `2px solid ${levelColor[level]||'#ddd'}`;
    el.style.opacity = '1';
    el.style.background = 'var(--bg-card)';
    check.style.display = 'flex';
  } else {
    el.style.border = '2px solid var(--ink-12)';
    el.style.opacity = '0.4';
    el.style.background = 'var(--bg-input)';
    check.style.display = 'none';
  }
}

function toggleAllWords() {
  const allSelected = window._wordSelected.every(v => v);
  window._wordSelected = window._wordSelected.map(() => !allSelected);
  window._wordSelected.forEach((sel, i) => {
    const el = document.getElementById(`wsel-${i}`);
    const check = document.getElementById(`wsel-check-${i}`);
    const levelColor = { 'C2':'#7b2d8b','C1':'#c0392b','B2':'#e67e22','B1':'#2980b9','A2':'#27ae60','A1':'#95a5a6' };
    const level = pendingW[i]?.level || '?';
    if (el && check) {
      el.style.border = sel ? `2px solid ${levelColor[level]||'#ddd'}` : '2px solid var(--ink-12)';
      el.style.opacity = sel ? '1' : '0.4';
      el.style.background = sel ? 'var(--bg-card)' : 'var(--bg-input)';
      check.style.display = sel ? 'flex' : 'none';
    }
  });
}

async function saveSelectedWords() {
  const btn = document.getElementById('save-words-btn');
  if (btn?.disabled) return;
  if (btn) { btn.disabled = true; btn.textContent = t('saving'); btn.style.opacity = '0.6'; }
  const selected = pendingW.filter((_, i) => window._wordSelected[i]);
  if (!selected.length) {
    toast('선택한 단어가 없어요');
    if (btn) { btn.disabled = false; btn.textContent = t('saveWordsBtn'); btn.style.opacity = '1'; }
    return;
  }
  pendingW = selected;
  await acceptWords();
}

async function acceptWords() {
  const book = findBook(pendingB); if (!book) return;
  const pid = await savePageWordsToDB(pendingB, pendingP, pendingW);
  const words = pendingW.map((w,i) => ({...w, id:`${pendingB}-${pendingP}-${i+1}`}));
  const ex = findPage(book, pendingP);
  const newName = window._renamedPageNum;
  if (ex) {
    ex.words = [...ex.words, ...words];
    if (newName && newName !== pendingP) {
      try {
        await fetch(SB_URL + `/rest/v1/voca_pages?id=eq.${ex._pid}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }, body: JSON.stringify({ page_num: newName }) });
        ex.num = newName; toast(`Page ${newName} 단어 추가 완료`);
        replace({ name:'page-words', bookId:pendingB, pageNum:newName });
      } catch(e) { toast(`Page ${pendingP} 단어 추가 완료`); replace({ name:'page-words', bookId:pendingB, pageNum:pendingP }); }
    } else { toast(`Page ${pendingP} 단어 추가 완료`); replace({ name:'page-words', bookId:pendingB, pageNum:pendingP }); }
  } else {
    book.pages.push({num:pendingP, _pid:pid, words});
    book.pages.sort((a,b)=>String(a.num).localeCompare(String(b.num)));
    toast(`Page ${pendingP} 저장 완료`);
    replace({ name:'page-words', bookId:pendingB, pageNum:pendingP });
  }
  window._renamedPageNum = null;
}

let studyState = null;
function initStudy(bookId, scope, pageNum) {
  const book = findBook(bookId); if (!book) return;
  let ws = scope === 'page' ? (findPage(book,pageNum)?.words||[]).map(w=>({...w,pageNum})) : allWords(book);
  studyState = { bookId, scope, pageNum, round:1, queue:shuffle([...ws]), idx:0, flipped:false, xList:[], stats:{total:ws.length,seen:0,oCount:0} };
}

function renderStudyCard() {
  const root=document.getElementById('root'), s=studyState, route=stack[stack.length-1];
  if (!s||s.queue.length===0) { replace({name:'study-done',bookId:route.bookId,scope:route.scope,pageNum:route.pageNum,rounds:s.round,total:s.stats.total}); return; }
  const w=s.queue[s.idx], prog=s.idx/s.queue.length*100;
  root.innerHTML=`<div class="study"><div class="study__top"><span class="study__info">${s.idx+1} / ${s.queue.length}</span><span class="study__info">${findBook(s.bookId)?.title||''}</span><span class="study__close" onclick="back();studyState=null">✕</span></div><div class="study__bar"><div class="study__fill" style="width:${Math.round(prog)}%"></div></div><div class="study__round">Round ${s.round} · ${s.xList.length} ✕ so far</div><div class="card-wrap" onclick="flipCard()"><div class="card ${s.flipped?'card--flip':''}"><div class="face face-front"><div class="face-front__center"><div class="card__word">${w.en}</div><div class="card__ipa">${w.ipa||''}</div><button onclick="event.stopPropagation();speak('${w.en}')" style="background:var(--gold-bg);border:1px solid var(--ink-12);border-radius:99px;padding:6px 16px;font-size:12px;cursor:pointer;font-family:var(--font-body);color:var(--accent);margin-top:8px;">${t('pronounce')}</button></div><div class="card__tap">${t('cardFront')}</div></div><div class="face face-back"><div class="back__word">${w.en}</div><div class="back__label">${t('cardMeaning')}</div><div class="back__meaning">${w.base}</div><div class="back__label">${t('cardContext')}</div><div class="back__meaning">${w.ctx}</div></div></div></div><div class="ox-row"><button class="ox-btn ox-x" onclick="advance(false)">✕</button><button class="ox-btn ox-o" onclick="advance(true)">○</button></div><div class="ox-hint">${s.flipped?'○ 외움 · ✕ 다음 사이클  |  Space = 앞면':'탭해서 뜻 보기  |  ○✕ 바로 선택 가능'}</div></div>`;
}

function flipCard() {
  if (!studyState.flipped) { studyState.flipped=true; renderStudyCard(); }
  else { studyState.flipped=false; renderStudyCard(); }
}

document.addEventListener('keydown', function(e) {
  if (!studyState) return;
  const route = stack[stack.length-1];
  if (route.name !== 'study-cards') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyO') { advance(true); }
  else if (e.code === 'ArrowLeft' || e.code === 'KeyX') { advance(false); }
});

function advance(isKnown) {
  const s=studyState; s.stats.seen++; if(isKnown)s.stats.oCount++;
  const newX=isKnown?s.xList:[...s.xList,s.queue[s.idx]];
  if (s.idx+1<s.queue.length) { s.idx++; s.xList=newX; s.flipped=false; renderStudyCard(); }
  else if (newX.length===0) {
    saveStats(s.bookId, s.stats.total, s.stats.oCount);
    if (s.scope === 'page' && s.pageNum) {
      if (s._reviewId && s._reviewStepKey) {
        // 복습 모드 - 다음 단계로 업데이트
        updateReviewStep({ id: s._reviewId, _stepKey: s._reviewStepKey });
        toast('✅ 복습 완료! 다음 단계로 넘어갔어요');
      } else {
        // 일반 학습 - 복습 일정 새로 등록
        saveReviewSchedule(s.bookId, s.pageNum);
      }
    }
    replace({name:'study-done',bookId:s.bookId,scope:s.scope,pageNum:s.pageNum,rounds:s.round,total:s.stats.total});
  }
  else { s.round++; s.queue=shuffle(newX); s.idx=0; s.xList=[]; s.flipped=false; renderStudyCard(); }
}


function showLangSettings() {
  const overlay = document.createElement('div');
  overlay.id = 'lang-settings-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';
  overlay.innerHTML = `
    <div style="background:var(--bg-card);border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:480px;">
      <div style="width:32px;height:3px;background:var(--ink-12);border-radius:2px;margin:0 auto 18px;"></div>
      <div style="font-family:var(--font-display);font-size:20px;letter-spacing:-0.03em;margin-bottom:4px;color:var(--ink-100);">${t('langSetting')}</div>
      <div style="font-size:12px;color:var(--ink-60);margin-bottom:20px;">${t('langDesc')}</div>
      <div style="font-size:11px;font-weight:700;color:var(--ink-40);margin-bottom:8px;text-transform:uppercase;">${t('nativeLang')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
        ${LANG_OPTIONS.map(l=>`<button onclick="selectNativeLang('${l.code}')" id="nl-${l.code}" style="padding:8px 14px;border-radius:99px;border:1.5px solid ${userNativeLang===l.code?'var(--accent)':'var(--ink-12)'};background:${userNativeLang===l.code?'var(--gold-bg)':'var(--bg-card)'};font-family:var(--font-body);font-size:13px;cursor:pointer;color:${userNativeLang===l.code?'var(--accent)':'var(--ink-100)'};">${l.flag} ${l.name}</button>`).join('')}
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--ink-40);margin-bottom:8px;text-transform:uppercase;">${t('targetLangLabel')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;">
        ${TARGET_LANG_OPTIONS.map(l=>`<button onclick="selectTargetLang('${l.code}')" id="tl-${l.code}" style="padding:8px 14px;border-radius:99px;border:1.5px solid ${userTargetLang===l.code?'var(--accent)':'var(--ink-12)'};background:${userTargetLang===l.code?'var(--gold-bg)':'var(--bg-card)'};font-family:var(--font-body);font-size:13px;cursor:pointer;color:${userTargetLang===l.code?'var(--accent)':'var(--ink-100)'};">${l.flag} ${l.name}</button>`).join('')}
      </div>
      <button onclick="applyLangSettings()" style="width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;">${t('save')}</button>
      <button onclick="document.getElementById('lang-settings-overlay').remove()" style="width:100%;padding:12px;background:none;color:var(--ink-60);border:none;font-family:var(--font-body);font-size:13px;cursor:pointer;">${t('cancel')}</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });
  window._pendingNative = userNativeLang;
  window._pendingTarget = userTargetLang;
}

function selectNativeLang(code) {
  window._pendingNative = code;
  document.querySelectorAll('[id^="nl-"]').forEach(btn => {
    const c = btn.id.replace('nl-','');
    btn.style.borderColor = c===code?'var(--accent)':'var(--ink-12)';
    btn.style.background = c===code?'var(--gold-bg)':'var(--bg-card)';
    btn.style.color = c===code?'var(--accent)':'var(--ink-100)';
  });
}

function selectTargetLang(code) {
  window._pendingTarget = code;
  document.querySelectorAll('[id^="tl-"]').forEach(btn => {
    const c = btn.id.replace('tl-','');
    btn.style.borderColor = c===code?'var(--accent)':'var(--ink-12)';
    btn.style.background = c===code?'var(--gold-bg)':'var(--bg-card)';
    btn.style.color = c===code?'var(--accent)':'var(--ink-100)';
  });
}

function applyLangSettings() {
  if (window._pendingNative===window._pendingTarget) { toast('모국어와 학습 언어는 달라야 해요!'); return; }
  saveLangSettings(window._pendingNative, window._pendingTarget);
  document.getElementById('lang-settings-overlay')?.remove();
  const native=getNativeLang(), target=getTargetLang();
  toast(`${native.flag} ${native.name} → ${target.flag} ${target.name} 설정됐어요!`);
  if (!currentUser) renderLogin(); else render();
}

function openEditBook(bookId) {
  const book=findBook(bookId); if(!book)return;
  document.getElementById('edit-book-id').value=bookId;
  document.getElementById('edit-title').value=book.title;
  document.getElementById('edit-author').value=book.author;
  document.getElementById('edit-desc').value=book.desc||'';
  document.getElementById('modal-edit').classList.add('open');
}

async function saveEditBook() {
  const bookId=document.getElementById('edit-book-id').value;
  const title=document.getElementById('edit-title').value.trim();
  const author=document.getElementById('edit-author').value.trim();
  const desc=document.getElementById('edit-desc').value.trim();
  if (!title) { toast('제목을 입력해주세요'); return; }
  try {
    await fetch(SB_URL+`/rest/v1/voca_books?id=eq.${bookId}`,{method:'PATCH',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+_authToken},body:JSON.stringify({title,author,description:desc})});
    const book=findBook(bookId); if(book){book.title=title;book.author=author;book.desc=desc;}
    closeModal('modal-edit'); render(); toast('수정됐어요!');
  } catch(e) { toast('수정 실패: '+e.message); }
}

async function deleteBook(bookId) {
  if (!confirm('이 책을 삭제할까요? 저장된 단어도 모두 삭제돼요.')) return;
  try {
    await fetch(SB_URL+`/rest/v1/voca_books?id=eq.${bookId}`,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+_authToken}});
    books=books.filter(b=>b.id!==bookId); back(); render(); toast('삭제됐어요');
  } catch(e) { toast('삭제 실패: '+e.message); }

function speak(word) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1;
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google US English') || v.name.includes('Aaron') || v.name.includes('Alex') || (v.lang === 'en-US' && v.localService)) || voices.find(v => v.lang === 'en-US');
  if (preferred) u.voice = preferred;
  window.speechSynthesis.speak(u);
}

async function saveReviewSchedule(bookId, pageNum) {
  try {
    const check = await fetch(SB_URL + `/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=eq.${bookId}&page_num=eq.${pageNum}&select=id`, { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken } });
    const existing = await check.json();
    if (existing?.length > 0) return;
    const now = new Date();
    // 날짜만 비교하기 위해 자정(00:00:00) 기준으로 저장
    const toMidnight = (d, n) => {
      const date = new Date(d);
      date.setDate(date.getDate() + n);
      date.setHours(0, 0, 0, 0);
      return date.toISOString();
    };
    const addDays = (d, n) => toMidnight(d, n);
    const res = await fetch(SB_URL + '/rest/v1/voca_review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken, 'Prefer': 'return=representation' },
      body: JSON.stringify({ user_id: currentUser.id, book_id: bookId, page_num: String(pageNum), first_studied_at: now.toISOString(), review_2d: addDays(now, 1), review_3d: addDays(now, 2), review_6d: addDays(now, 3), review_15d: addDays(now, 6), review_30d: addDays(now, 15), review_60d: addDays(now, 30) })
    });
    const data = await res.json();
    if (data.error || data.code) console.error('[복습 저장 오류]', data);
    else console.log('[복습 저장 성공]');
  } catch(e) { console.error('[복습 저장 오류]', e); }
}

function startWrongQuiz() {

}

function startQuiz(bookId, scope, pageNum) {
  const book = findBook(bookId); if (!book) return;
  let ws = scope === 'page' ? (findPage(book,pageNum)?.words||[]) : allWords(book);
  ws = shuffle([...ws]);
  window._quiz = { bookId, scope, pageNum, words: ws, idx: 0, correct: 0 };
  push({ name: 'quiz', bookId, scope, pageNum });
}

function answerQuiz(chosen, correct) {
  const q = window._quiz;
  const isCorrect = chosen === correct;
  if (isCorrect) { q.correct++; if(!q._correct)q._correct=[]; q._correct.push(q.idx); }
  const btns = document.querySelectorAll('.scr button[onclick^="answerQuiz"]');
  btns.forEach(btn => {
    btn.disabled = true;
    const txt = btn.textContent.trim().substring(3);
    const word = q.words.find(w => w.base === txt);
    if (word?.en === correct) btn.style.background = '#eafaf1';
    else if (word?.en === chosen && !isCorrect) btn.style.background = '#fdeaea';
  });
  setTimeout(() => { q.idx++; renderQuiz(); }, 800);
}

async function checkReviews() {
  try {
    // 오늘 날짜 끝(23:59:59)까지를 today로 설정 → 오늘 복습 대상 모두 포함
    const todayEnd = new Date();
    todayEnd.setHours(23, 59, 59, 999);
    const today = todayEnd.toISOString();
    const res = await fetch(SB_URL + `/rest/v1/voca_review?user_id=eq.${currentUser.id}&completed=eq.false&select=*`, { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken } });
    const reviews = await res.json();
    if (!Array.isArray(reviews)) return;
    const due = [];
    reviews.forEach(r => {
      // 책이 삭제됐으면 복습 알림에서 제외
      if (!findBook(r.book_id)) return;
      const steps = [
        { key: 'review_2d',  label: t('step1'),  date: r.review_2d  },
        { key: 'review_3d',  label: t('step2'),  date: r.review_3d  },
        { key: 'review_6d',  label: t('step3'),  date: r.review_6d  },
        { key: 'review_15d', label: t('step6'),  date: r.review_15d },
        { key: 'review_30d', label: t('step15'), date: r.review_30d },
        { key: 'review_60d', label: t('step30'), date: r.review_60d },
      ];
      const oldest = steps.find(s => s.date && s.date <= today);
      if (oldest) due.push({ ...r, _stepKey: oldest.key, _stepLabel: oldest.label });
    });
    if (!due.length) return;
    let totalWords = 0;
    due.forEach(r => { const book = findBook(r.book_id); const page = book ? findPage(book, r.page_num) : null; if (page) totalWords += page.words.length; });
    window._dueReviews = due;
    const stepCounts = {};
    due.forEach(r => { stepCounts[r._stepLabel] = (stepCounts[r._stepLabel]||0) + 1; });
    const stepText = Object.entries(stepCounts).map(([k,v]) => `${k} ${v}${userNativeLang==='ko'?'개':''}`).join(' · ');
    document.getElementById('review-banner-desc').textContent = `${due.length}${t('pageAndWords')} ${totalWords}${t('wordsApprox')}를 복습할 시간이에요!`;
    document.getElementById('review-banner-step').textContent = `📊 ${stepText}  |  ${t('reviewBannerStep')}`;
    // 현재 암기카드/퀴즈 중이면 배너 띄우지 않음
    const _currentRoute = stack[stack.length-1];
    const _noShowScreens = ['study-cards', 'quiz', 'study-done'];
    if (_noShowScreens.includes(_currentRoute?.name)) return;
    const rb = document.getElementById('review-banner');
    rb.style.pointerEvents = '';
    rb.style.display = '';
    rb.style.zIndex = '15';
    rb.classList.add('show');
  } catch(e) {}
}

function closeReviewBanner() {
  const banner = document.getElementById('review-banner');
  banner.classList.remove('show');
  banner.style.pointerEvents = 'none';
  banner.style.display = 'none';
  banner.style.zIndex = '15';
}

async function startReviewSession() {
  closeReviewBanner();
  const due = window._dueReviews;
  if (!due?.length) return;
  const first = due[0];
  const book = findBook(first.book_id);
  if (!book) return;
  toast(`${book.title} Page ${first.page_num} 복습 시작!`);
  initStudy(first.book_id, 'page', first.page_num);
  // reviewId, stepKey를 studyState에 저장해서 완료 시 업데이트
  studyState._reviewId = first.id;
  studyState._reviewStepKey = first._stepKey;

}

async function updateReviewStep(review) {
  try {
    const patch = {};
    const key = review._stepKey;
    if (key === 'review_60d') { patch.review_60d = null; patch.completed = true; }
    else { patch[key] = null; }
    await fetch(SB_URL + `/rest/v1/voca_review?id=eq.${review.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }, body: JSON.stringify(patch) });
  } catch(e) {}
}

async function fetchWordMeaning(word) {
  try {
    // 1단계: Free Dictionary API로 영어 뜻 가져오기
    let engMeaning = '';
    try {
      const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (dictRes.ok) {
        const dictData = await dictRes.json();
        const meanings = dictData[0]?.meanings;
        if (meanings?.length) {
          // 첫 번째 뜻만 가져오기 (짧게)
          engMeaning = meanings[0]?.definitions?.[0]?.definition || '';
          if (engMeaning.length > 200) engMeaning = engMeaning.slice(0, 200);
        }
      }
    } catch(e) {}

    // 번역할 텍스트: 영어 뜻이 있으면 그걸 번역, 없으면 단어 자체를 번역
    const textToTranslate = engMeaning || word;

    // 2단계: MyMemory로 한국어 번역 (무료, API 키 불필요)
    const mmRes = await fetch(
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(textToTranslate)}&langpair=${userTargetLang}|${userNativeLang}&de=imvoca@gmail.com`
    );
    const mmData = await mmRes.json();

    if (mmData.responseStatus === 200) {
      const translated = mmData.responseData.translatedText;
      return { base: translated || t('noMeaning'), ipa: '' };
    }
    // MyMemory 실패 시 단어 자체를 번역 시도
    if (engMeaning) {
      const fallRes = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${userTargetLang}|${userNativeLang}&de=imvoca@gmail.com`
      );
      const fallData = await fallRes.json();
      if (fallData.responseStatus === 200) {
        return { base: fallData.responseData.translatedText || t('noMeaning'), ipa: '' };
      }
    }
    return { base: t('noMeaning'), ipa: '' };
  } catch(e) { return { base: '뜻을 찾지 못했어요', ipa: '' }; }
}

async function saveManualWords(bookId) {
  const pg = document.getElementById('manual-pg')?.value.trim();
  if (!pg) { toast('페이지 번호를 입력해주세요'); return; }
  if (!window._manualWords?.length) { toast('추가된 단어가 없어요'); return; }
  const btn = document.getElementById('manual-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = t('searchingMeaning'); btn.style.opacity = '0.6'; }
  toast('단어 뜻을 검색하는 중이에요...');
  for (let i = 0; i < window._manualWords.length; i++) {
    const w = window._manualWords[i];
    if (!w.base) { if (btn) btn.textContent = `${t('searchingMeaning')} (${i+1}/${window._manualWords.length})`; const result = await fetchWordMeaning(w.en); w.base = result.base; w.ipa = result.ipa; w.ctx = ''; }
  }
  const book = findBook(bookId); if (!book) return;
  const pid = await savePageWordsToDB(bookId, pg, window._manualWords);
  const words = window._manualWords.map((w, i) => ({ ...w, id: `${bookId}-${pg}-m${i+1}` }));
  const ex = findPage(book, pg);
  if (ex) ex.words = [...ex.words, ...words];
  else { book.pages.push({ num: pg, _pid: pid, words }); book.pages.sort((a,b) => String(a.num).localeCompare(String(b.num))); }
  toast(`Page ${pg} 저장 완료 (${words.length}개)`);
  window._manualWords = [];
  replace({ name: 'page-words', bookId, pageNum: pg });
}

      document.getElementById('install-btn-wrap').innerHTML =
        '<div style="display:flex;gap:8px;">' +
        `<button onclick="doInstall()" style="flex:1;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:var(--font-body);font-size:13px;cursor:pointer;">${t('installBtn')}</button>` +
        `<button onclick="dismissInstall()" style="flex:1;padding:10px;background:transparent;color:var(--ink-100);border:1px solid var(--ink-12);border-radius:10px;font-family:var(--font-body);font-size:13px;cursor:pointer;">${t('installDismiss')}</button>` +
        '</div>';
      document.getElementById('install-banner').classList.add('show');
    });
  }
})();

function doInstall() {
  if (window._deferredPrompt) { window._deferredPrompt.prompt(); window._deferredPrompt.userChoice.then(() => { window._deferredPrompt = null; dismissInstall(); }); }
}

function dismissInstall() {
  document.getElementById('install-banner').classList.remove('show');
  localStorage.setItem('imvoca.install.dismissed', '1');
}

sbInit();
</script>
</body>
</html>
