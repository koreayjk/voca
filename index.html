// 시험용 단어 심화 분석을 백그라운드로 채워넣기
async function enrichExamWords(bookId, pageId) {
  const book = findBook(bookId);
  if (!book) return;
  const page = book.pages.find(p => p._pid === pageId);
  if (!page || !page.words) return;
  // analysis 없는 단어만 (이미 있는 건 스킵)
  const targets = page.words.filter(w => w.id && !w.analysis);
  if (targets.length === 0) return;
  const bookCat = book.category || 'general';
  let categoryContext = '';
  if (bookCat && bookCat !== 'general') {
    if (bookCat.startsWith('custom:')) categoryContext = categoryToContext('custom', bookCat.slice(7));
    else categoryContext = categoryToContext(bookCat, '');
  }
  for (const w of targets) {
    try {
      const result = await fetchWordMeaning(w.en, categoryContext, true);
      if (result.analysis) {
        w.analysis = result.analysis;
        // DB에도 저장
        try {
          await sbFetch(`/rest/v1/voca_words?id=eq.${w.id}`, 'PATCH', { analysis: result.analysis });
        } catch(e) { console.warn('[enrichExamWords] DB 저장 실패', w.en, e); }
      }
    } catch(e) { console.warn('[enrichExamWords] 분석 실패', w.en, e); }
  }
  // 현재 페이지를 보고 있으면 다시 렌더 (사용자가 그동안 그 화면에 있으면 분석 보이게)
  if (typeof render === 'function' && route && route.name === 'page-words' && String(route.pageNum) === String(page.num)) {
    render();
  }
}

let studyState = null;
// ── 즐겨찾기 로컬 저장소 ─────────────────────────────────────────
// 공식·배정 단어장은 DB word.id 가 없어서 서버(voca_words.is_favorite)에 저장할 수 없음.
// → 모든 단어장에서 즐겨찾기가 되도록 로컬(localStorage)에도 저장하고, DB 단어는 서버에도 함께 동기화.
let _localFavsCache = null;
function _localFavs(){ if(_localFavsCache) return _localFavsCache; try{ _localFavsCache = JSON.parse(localStorage.getItem('imvoca.favs')||'{}')||{}; }catch(e){ _localFavsCache={}; } return _localFavsCache; }
function _saveLocalFavs(m){ _localFavsCache=m; try{ localStorage.setItem('imvoca.favs', JSON.stringify(m)); }catch(e){} }
function _favKey(bookId,pageNum,en){ return bookId+'|'+pageNum+'|'+String(en||'').trim().toLowerCase(); }
// 이 단어가 즐겨찾기인지: 서버 플래그(w.fav) 또는 로컬 저장 둘 중 하나면 true
function isFav(bookId,pageNum,w){ return !!(w && (w.fav || _localFavs()[_favKey(bookId,pageNum,w.en)])); }

// 모든 책의 즐겨찾기 단어 모으기 (공식·배정 포함)
function allFavoriteWords() {
  const out=[]; books.forEach(b=>b.pages.forEach(p=>p.words.forEach(w=>{ if(isFav(b.id,p.num,w)) out.push({...w, pageNum:p.num, bookId:b.id}); }))); return out;
}
// 모든 책의 전체 단어 (퀴즈 보기용)
function allWordsGlobal() {
  const out=[]; books.forEach(b=>b.pages.forEach(p=>p.words.forEach(w=>out.push({...w})))); return out;
}
// 즐겨찾기 목록에서 별표 해제(단어 en으로 페이지 내 인덱스 찾아 토글 — 공식책은 id가 없어서 en으로 매칭)
function favToggleByEn(bookId, pageNum, en){
  const book=findBook(bookId); const page=book?findPage(book,pageNum):null;
  if(!page) return;
  const key=String(en||'').trim().toLowerCase();
  const idx=page.words.findIndex(w=>String(w.en||'').trim().toLowerCase()===key);
  if(idx>=0) toggleFavorite(bookId, pageNum, idx);
}

// 재렌더하되 현재 스크롤 위치를 유지 (즐겨찾기/삭제/숨기기 시 목록이 맨 위로 튀는 것 방지)
// 모바일은 .scr-scroll, PC는 .scr 이 스크롤 컨테이너라 둘 다 보존한다.
function renderKeepScroll(){
  const sels = ['.scr-scroll', '.scr'];
  const pos = sels.map(s => { const el = document.querySelector(s); return el ? el.scrollTop : 0; });
  render();
  const apply = () => sels.forEach((s, i) => { if (!pos[i]) return; const el = document.querySelector(s); if (el) try { el.scrollTop = pos[i]; } catch(e){} });
  apply(); requestAnimationFrame(apply);
}

async function toggleFavorite(bookId, pageNum, wordIdx) {
  const book = findBook(bookId);
  const page = book ? findPage(book, pageNum) : null;
  const word = page?.words[wordIdx];
  if (!word) return;
  const next = !isFav(bookId, pageNum, word);
  word.fav = next;
  // 1) 로컬 저장(모든 단어장 공통 — 공식·배정도 여기서 즉시 반영·유지)
  const m = _localFavs(), k = _favKey(bookId, pageNum, word.en);
  if (next) m[k] = true; else delete m[k];
  _saveLocalFavs(m);
  renderKeepScroll();
  // 2) 내가 만든(DB) 단어면 서버에도 동기화(다른 기기 반영). 실패해도 로컬은 유지.
  if (word.id) {
    const url = `/rest/v1/voca_words?id=eq.${word.id}`;
    const opt = { method:'PATCH', headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }, body: JSON.stringify({ is_favorite: next }) };
    try {
      let res = await fetch(SB_URL + url, opt);
      if ((res.status===401||res.status===403) && await refreshSession()) { opt.headers.Authorization = 'Bearer '+_authToken; res = await fetch(SB_URL + url, opt); }
    } catch(e) {}
  }
}

// 예문 일괄 채우기 (묶음 호출, 1회성) - 책 메뉴에서 실행
async function backfillSentences(bookId) {
  if (!apiKey) { toast(TT('먼저 AI(API) 키 설정이 필요해요','API key required first')); return; }
  const book = findBook(bookId); if (!book) return;
  const targets = [];
  book.pages.forEach(p => p.words.forEach(w => { if (w.id && !w.sentence) targets.push(w); }));
  if (!targets.length) { toast(TT('이미 모든 단어에 예문이 있어요','All words already have examples')); return; }
  if (!confirm(TX(`예문 없는 단어 {v0}개에 AI로 예문을 채울까요?`,`Generate examples for {v0} words?`,{v0:(targets.length)}))) return;
  const target = getTargetLang();
  const BATCH = 20; let done = 0;
  for (let i=0; i<targets.length; i+=BATCH) {
    const chunk = targets.slice(i, i+BATCH);
    toast(TX(`예문 생성 중... ({v0}/{v1})`,`Generating... ({v0}/{v1})`,{v0:(done),v1:(targets.length)}));
    const wordList = chunk.map(w => w.en).join(', ');
    const prompt = `다음 ${target.name} 단어 각각에 대해 그 단어를 사용한 짧고 자연스러운 ${target.name} 예문을 하나씩 만들어주세요. 단어: ${wordList}\n\n반드시 JSON만 반환: {"sentences":{"단어":"예문"}}`;
    let map = {};
    try {
      const data = await geminiWithRetry({ contents:[{parts:[{text:prompt}]}], generationConfig:{temperature:0.3,maxOutputTokens:4096} });
      const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const clean = txt.replace(/```json|```/g,'').trim();
      try { map = JSON.parse(clean).sentences || {}; }
      catch(e2) { const re=/"([^"]+)"\s*:\s*"([^"]+)"/g; let m; while((m=re.exec(clean))!==null){ if(m[1]!=='sentences') map[m[1]]=m[2]; } }
    } catch(e) { toast(TT('생성 실패, 잠시 후 다시 시도','Failed, try later')); render(); return; }
    for (const w of chunk) {
      const key = Object.keys(map).find(k => k.toLowerCase() === w.en.toLowerCase());
      const sent = key ? map[key] : '';
      if (sent) { w.sentence = sent; try { await sbFetch(`/rest/v1/voca_words?id=eq.${w.id}`, 'PATCH', { sentence: sent }); } catch(e){} }
      done++;
    }
  }
  render();
  toast(TX(`✅ 예문 {v0}개 채웠어요!`,`✅ Filled {v0} examples!`,{v0:(done)}));
}

  let ws;
  if (scope === 'favorite') { ws = allFavoriteWords(); }
  else { const book = findBook(bookId); if (!book) return; ws = scope === 'page' ? (findPage(book,pageNum)?.words||[]).map(w=>({...w,pageNum})) : allWords(book); }
  studyState = { bookId, scope, pageNum, round:1, queue:shuffle([...ws]), idx:0, flipped:false, xList:[], stats:{total:ws.length,seen:0,oCount:0} };
}

function _healthClose(){ const el=document.getElementById('health-overlay'); if(el) el.remove(); }
function copyHealth(b64){
  try {

    navigator.clipboard.writeText(txt).then(()=>{
      toast(TT('📋 복사됐어요 — 클로드에게 붙여넣고 "이거 고쳐줘" 하세요','Copied — paste to Claude'));
    }).catch(()=>{ toast('복사 실패'); });
  } catch(e){ toast('복사 실패'); }
}

}
function _renderHealth(integ, errs){
  const _b64 = (s)=>{ try { return btoa(unescape(encodeURIComponent(s))); } catch(e){ return ''; } };
  // ── 정합성 ──
  const integBad = integ.filter(r=>Number(r.issues)>0);
  let html = `<div style="font-size:14px;font-weight:800;color:var(--ink-100);margin:4px 0 8px;">📊 데이터 정합성</div>`;
  if (!integ.length) {
    html += `<div class="muted" style="font-size:12px;padding:10px 0;">점검 함수를 못 불러왔어요 (integrity-checks.sql 실행 필요)</div>`;
  } else if (!integBad.length) {
    html += `<div style="background:rgba(28,124,60,0.08);border:1px solid #1c7c3c;border-radius:12px;padding:12px 14px;font-size:13px;color:#1c7c3c;font-weight:700;">✅ 이상 없음 (전 항목 0)</div>`;
  } else {
    html += integBad.map(r=>{
      const sev = r.severity==='high'?'#c0392b':r.severity==='medium'?'#b35900':'#8a8a8a';
      const copy = _b64(`[IMVOCA 정합성 이상]\n항목: ${r.check_name}\n건수: ${r.issues}\n심각도: ${r.severity}\n설명: ${r.note}\n→ 이거 고쳐줘(정리 SQL 만들어줘)`);
      return `<div style="display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--ink-07);border-left:4px solid ${sev};border-radius:12px;padding:11px 13px;margin-bottom:8px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:700;color:var(--ink-100);">${esc(r.check_name)} <span style="color:${sev};">· ${r.issues}건</span></div>
          <div class="muted" style="font-size:11px;margin-top:2px;">${esc(r.note)}</div>
        </div>
        <button onclick="copyHealth('${copy}')" style="flex-shrink:0;background:var(--gold-bg);border:1px solid var(--ink-12);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-100);cursor:pointer;">복사</button>
      </div>`;
    }).join('');
  }
  // ── 에러 (kind|context 로 묶기) ──
  html += `<div style="font-size:14px;font-weight:800;color:var(--ink-100);margin:20px 0 8px;">⚠️ 최근 에러 (48h)</div>`;
  const groups = {};
  errs.forEach(e=>{
    const key = (e.kind||'')+'|'+(e.context||'');
    const g = groups[key] || (groups[key] = { kind:e.kind, context:e.context, count:0, users:new Set(), last:e.created_at, msg:e.message, detail:e.detail, ver:e.app_version });
    g.count++; if (e.user_email) g.users.add(e.user_email);
    if (e.created_at > g.last) g.last = e.created_at;
  });
  const arr = Object.values(groups).sort((a,b)=>b.count-a.count);
  if (!arr.length) {
    html += `<div style="background:rgba(28,124,60,0.08);border:1px solid #1c7c3c;border-radius:12px;padding:12px 14px;font-size:13px;color:#1c7c3c;font-weight:700;">✅ 최근 48시간 에러 없음</div>`;
  } else {
    html += arr.map(g=>{
      const sev = g.kind==='write_fail'||g.kind==='js_error'?'#c0392b':'#b35900';
      const detailStr = g.detail ? JSON.stringify(g.detail) : '';
      const copy = _b64(`[IMVOCA 에러 리포트]\n종류: ${g.kind}\n위치: ${g.context}\n건수: ${g.count} (최근 48h)\n영향 사용자: ${g.users.size}명\n앱버전: ${g.ver||''}\n메시지: ${g.msg||''}\n예시 detail: ${detailStr}\n마지막: ${g.last}\n→ 이거 고쳐줘`);
      return `<div style="display:flex;align-items:flex-start;gap:10px;background:var(--bg-card);border:1px solid var(--ink-07);border-left:4px solid ${sev};border-radius:12px;padding:11px 13px;margin-bottom:8px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:700;color:var(--ink-100);">${esc(g.context||g.kind)} <span style="color:${sev};">· ${g.count}건</span></div>
          <div class="muted" style="font-size:11px;margin-top:2px;">${esc(g.kind)} · 👤${g.users.size} · ${esc(String(g.msg||'').slice(0,80))}</div>
          ${detailStr?`<div class="muted" style="font-size:10px;margin-top:3px;color:var(--ink-40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(detailStr.slice(0,120))}</div>`:''}
        </div>
        <button onclick="copyHealth('${copy}')" style="flex-shrink:0;background:var(--gold-bg);border:1px solid var(--ink-12);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-100);cursor:pointer;">복사</button>
      </div>`;
    }).join('');
  }
  return html;
}

          fresh = fresh.filter(w => !_hiddenWords.has(w.id));

let _autoRead = (typeof localStorage!=='undefined' && localStorage.getItem('imvoca.autoRead')==='1');
let _autoTok = 0;
function _autoStop(){ _autoTok++; _stopAudio(); if(_ttsWatch){ clearInterval(_ttsWatch); _ttsWatch=null; } if(window.speechSynthesis) window.speechSynthesis.cancel(); }
function _autoText(w, flipped){ if(!flipped) return w.en; return _exOf(w) || w.en; }
function _autoAfterRender(w, flipped){
  _autoTok++;                 // 카드 바뀌면 이전 루프 취소
  if(!_autoRead) return;
  const my=_autoTok, text=_autoText(w, flipped), url=_audioUrl(w, flipped?'s':'w');
  if(!text) return;
  // 재생이 "끝나면" → 1.1초 쉬고 → 다시.
  // ⚠️ iOS는 mp3 <audio>의 onended나 TTS의 onend가 끝내 발화되지 않는 경우가 있어 콜백에만
  //    의존하면 예문이 한 번만 재생되고 멈춤. → 추정 재생시간 기반 안전망 타이머를 함께 둬
  //    콜백이 안 와도 다음 반복으로 넘어가게 한다(둘 중 먼저 오는 쪽만 1회 진행).
  const loop=()=>{
    if(my!==_autoTok || !_autoRead || !studyState) return;
    let advanced=false;
    const next=()=>{ if(advanced || my!==_autoTok) return; advanced=true;
      setTimeout(()=>{ if(my===_autoTok && _autoRead && studyState) loop(); }, 1100); };
    _playSmart(text, url, next);
    const estMs = (text.length*90)/0.85 + (url?5000:2500); // mp3는 디코딩/무음 여유를 더 둠
    setTimeout(next, Math.max(4000, estMs));               // onended/onend 누락 대비 안전망
  };
  loop();   // 첫 재생은 즉시(탭 제스처 컨텍스트 유지 → iOS autoplay 통과)
}
// 테스트 화면의 자동 읽기 — 문제가 뜨면 그 단어를 한 번 읽어준다.
// 암기카드처럼 반복해서 읽으면 답을 고르는 동안 계속 소리가 나 방해가 된다.
function _autoQuizAfterRender(w){
  _autoTok++;                     // 문제가 바뀌면 이전 재생 취소
  if(!_autoRead || !w || !w.en) return;
  _playSmart(w.en, _audioUrl(w,'w'));
}
// 버튼 모양만 바꾼다. 테스트 중에 화면을 다시 그리면 보기 순서가 섞여버린다.
function _syncAutoChip(){
  document.querySelectorAll('.auto-chip').forEach(el=>{
    el.style.color = _autoRead ? 'var(--accent)' : 'var(--ink-60)';
    el.style.background = _autoRead ? 'var(--gold-bg)' : 'transparent';
    el.textContent = _autoRead ? TT('🔊 자동 ON','🔊 Auto ON') : TT('🔇 자동','🔇 Auto');
  });
}
function toggleAutoRead(){
  _autoRead=!_autoRead; try{localStorage.setItem('imvoca.autoRead', _autoRead?'1':'0');}catch(e){}
  _autoTok++; if(!_autoRead && window.speechSynthesis) window.speechSynthesis.cancel();
  if(studyState) renderStudyCard();
  else {
    _syncAutoChip();
    // 켠 직후 바로 한 번 읽어준다. 켜는 '탭' 자체가 사용자 제스처라,
    // 이 순간에 재생해야 iOS 자동재생 차단에 걸리지 않는다.
    const q = window._quiz;
    if (_autoRead && q && q.words && q.idx < q.words.length) _playSmart(q.words[q.idx].en, _audioUrl(q.words[q.idx],'w'));
  }
  toast(_autoRead?TT('🔊 자동 읽기 켜짐 — 단어를 소리로 읽어줘요','🔊 Auto-read on'):TT('🔇 자동 읽기 꺼짐','🔇 Auto-read off'));
}
function renderStudyCard() {
  const root=document.getElementById('root'), s=studyState, route=stack[stack.length-1];
  if (!s||s.queue.length===0) { replace({name:'study-done',bookId:route.bookId,scope:route.scope,pageNum:route.pageNum,rounds:s?s.round:1,total:s?s.stats.total:0}); return; }
  // 예문 발음 시리즈 폴더 결정용(현재 학습 중인 책 기준). 즐겨찾기 등 섞인 경우엔 '' → 예문은 TTS.
  window._audioSeries = (s.scope==='favorite') ? '' : _audioSeriesFromTitle(findBook(s.bookId)?.title||'');
  const w=s.queue[s.idx], prog=s.idx/s.queue.length*100;
  root.innerHTML=`<div class="study"><div class="study__top"><span class="study__info">${s.idx+1} / ${s.queue.length}</span><span class="study__info">${s.scope==='favorite'?'⭐ '+(TT('즐겨찾기','Favorites')):(findBook(s.bookId)?.title||'')}</span><span class="auto-chip" onclick="toggleAutoRead()" style="font-size:12px;cursor:pointer;padding:4px 10px;border-radius:99px;border:1px solid var(--ink-12);font-family:var(--font-body);white-space:nowrap;color:${_autoRead?'var(--accent)':'var(--ink-60)'};background:${_autoRead?'var(--gold-bg)':'transparent'};">${_autoRead?TT('🔊 자동 ON','🔊 Auto ON'):TT('🔇 자동','🔇 Auto')}</span><span class="study__close" onclick="back();studyState=null;_autoStop()">✕</span></div><div class="study__bar"><div class="study__fill" style="width:${Math.round(prog)}%"></div></div><div class="study__round">${TX(`${s.round}라운드 · ${s.xList.length}번 틀림`,'Round {v0} · {v1} ✕ so far',{v0:(s.round),v1:(s.xList.length)})}</div><div class="card-wrap" onclick="cardClick(event)"><div class="card ${s.flipped?'card--flip':''} ${(w.analysis&&w.analysis._official)?'card--official':''}"><div class="face face-front">${(w.analysis&&w.analysis._official)?_cardFrontBody(w):`<div class="face-front__center"><div class="card__word" style="font-size:clamp(26px,7.5vw,44px);white-space:normal;overflow-wrap:break-word;word-break:break-word;">${esc(w.en)}</div><div class="card__ipa">${w.ipa||''}</div><button onclick="event.stopPropagation();speak('${jsq(w.en)}')" style="background:var(--gold-bg);border:1px solid var(--ink-12);border-radius:99px;padding:6px 16px;font-size:12px;cursor:pointer;font-family:var(--font-body);color:var(--accent);margin-top:8px;">${t('pronounce')}</button></div><div class="card__tap">${t('cardFront')}</div>`}</div><div class="face face-back">${(w.analysis&&w.analysis._official)?_cardBackBody(w):`<div class="back__word" style="font-size:clamp(18px,5vw,27px);white-space:normal;overflow-wrap:break-word;word-break:break-word;">${esc(w.en)}</div>${_cardBackBody(w)}`}</div></div></div><div class="ox-row"><button class="ox-btn ox-x" onclick="advance(false)">✕</button><button class="ox-btn ox-o" onclick="advance(true)">○</button></div><div class="ox-hint"><div class="ox-hint__nav">${TT('👈 이전　·　🔄 가운데 탭 뜻보기　·　외움 👉','👈 Prev　·　🔄 Tap center to flip　·　Got it 👉')}</div><div class="ox-hint__sub">${TT('아래 <b class="hx">✕</b> 모름　<b class="ho">○</b> 외움','<b class="hx">✕</b> Again　<b class="ho">○</b> Got it')}<span class="kbd-only">　·　<kbd>←</kbd> ${TT('이전','Prev')} <kbd>↑</kbd> ${TT('모름','Again')} <kbd>→</kbd> ${TT('외움','Got it')} <kbd>Space</kbd> ${TT('뒤집기','Flip')}</span></div></div></div>`;
  _autoAfterRender(w, s.flipped);
}

function flipCard() {
  if (!studyState.flipped) { studyState.flipped=true; renderStudyCard(); }
  else { studyState.flipped=false; renderStudyCard(); }
}

// 카드를 좌/중/우 세 구역으로 나눠 처리: 왼쪽=이전, 가운데=뒤집기, 오른쪽=외움+다음
function cardClick(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  if (x < 0.33) prevCard();
  else if (x > 0.67) advance(true);
  else flipCard();
}

// 이전 단어로 되돌아가기 (advance 가 쌓아둔 히스토리를 되돌림)
function prevCard() {
  const s = studyState; if (!s) return;
  if (!s._hist || !s._hist.length) { toast(TT('첫 단어예요','First card')); return; }
  const p = s._hist.pop();
  s.idx = p.idx; s.xList = p.xList; s.queue = p.queue; s.round = p.round;
  s.stats.seen = p.seen; s.stats.oCount = p.oCount; s.flipped = false;
  renderStudyCard();
}

document.addEventListener('keydown', function(e) {
  if (!studyState) return;
  const route = stack[stack.length-1];
  if (route.name !== 'study-cards') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyO') { advance(true); }
  else if (e.code === 'ArrowUp' || e.code === 'KeyX') { e.preventDefault(); advance(false); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); prevCard(); }
});

async function advance(isKnown) {
  const s=studyState;
  // 이전 단어(prevCard)용 되돌리기 스냅샷 — 변경 전 상태를 저장
  (s._hist = s._hist || []).push({ idx:s.idx, xList:s.xList.slice(), queue:s.queue.slice(), round:s.round, seen:s.stats.seen, oCount:s.stats.oCount });
  if (s._hist.length > 300) s._hist.shift();
  s.stats.seen++; if(isKnown)s.stats.oCount++;
  const newX=isKnown?s.xList:[...s.xList,s.queue[s.idx]];
  if (s.idx+1<s.queue.length) { s.idx++; s.xList=newX; s.flipped=false; renderStudyCard(); }
  else if (newX.length===0) {
    saveStats(s.bookId, s.stats.total, s.stats.oCount);
    if (s.scope === 'page' && s.pageNum) {
      if (s._reviewId && s._reviewStepKey) {
        // 복습 카드 완료 → 곧바로 점수 주지 않고 '퀴즈 통과'를 조건으로 함.
        // 점수·다음 단계 이동은 퀴즈를 모두 맞혔을 때(renderQuiz)만 updateReviewStep 으로 처리.
        window._pendingReview = { id: s._reviewId, _stepKey: s._reviewStepKey, _scheduledDate: s._scheduledDate, book_id: s.bookId, page_num: s.pageNum };
        toast(TT('복습 끝! 퀴즈를 모두 맞히면 점수를 받아요','Review done! Pass the quiz to earn points'));
        startReviewQuiz(s.bookId, s.pageNum);
        return;
      } else {
        // 첫 암기: 카드를 끝내면 '학습'을 바로 등록(복습일정+기록). 점수는 퀴즈 통과 시.
        // (예전엔 퀴즈 통과해야만 등록돼서, 카드만 하고 퀴즈를 안 끝내면 학습이 기록 안 되던 문제 수정)
        const _newFS = await _registerFirstStudy(s.bookId, s.pageNum);
        window._pendingFirstStudy = { book_id: s.bookId, page_num: s.pageNum, isNew: _newFS };
        toast(TT('암기 끝! 퀴즈를 모두 맞히면 점수를 받아요','Done! Pass the quiz to earn points'));
        startReviewQuiz(s.bookId, s.pageNum);
        return;
      }
    }
    replace({name:'study-done',bookId:s.bookId,scope:s.scope,pageNum:s.pageNum,rounds:s.round,total:s.stats.total,isReview:!!(s._reviewId)});
  }
  else { s.round++; s.queue=shuffle(newX); s.idx=0; s.xList=[]; s.flipped=false; renderStudyCard(); }
}

      </div>
      <div style="font-size:11px;font-weight:700;color:var(--ink-40);margin-bottom:8px;text-transform:uppercase;">${t('targetLangLabel')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;">

      </div>
      <button onclick="applyLangSettings()" style="width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;">${t('save')}</button>
      <button onclick="document.getElementById('lang-settings-overlay').remove()" style="width:100%;padding:12px;background:none;color:var(--ink-60);border:none;font-family:var(--font-body);font-size:13px;cursor:pointer;">${t('cancel')}</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });

function selectNativeLang(code) {
  window._pendingNative = code;
  document.querySelectorAll('[id^="nl-"]').forEach(btn => {
    const c = btn.id.replace('nl-','');
    btn.style.borderColor = c===code?'var(--accent)':'var(--ink-12)';
    btn.style.background = c===code?'var(--gold-bg)':'var(--bg-card)';
    btn.style.color = c===code?'var(--accent)':'var(--ink-100)';
  });
}

function selectTargetLang(code) {
  window._pendingTarget = code;
  document.querySelectorAll('[id^="tl-"]').forEach(btn => {
    const c = btn.id.replace('tl-','');
    btn.style.borderColor = c===code?'var(--accent)':'var(--ink-12)';
    btn.style.background = c===code?'var(--gold-bg)':'var(--bg-card)';
    btn.style.color = c===code?'var(--accent)':'var(--ink-100)';
  });
}

async function applyLangSettings() {
  // 영어는 예외: 영어 네이티브도 영어 어휘(SAT·GRE 등)를 영영사전식으로 공부할 수 있게 en→en 허용
  if (window._pendingNative===window._pendingTarget && window._pendingTarget!=='en') { toast('모국어와 학습 언어는 달라야 해요!'); return; }
  const targetChanged = window._pendingTarget !== userTargetLang;
  saveLangSettings(window._pendingNative, window._pendingTarget);
  document.getElementById('lang-settings-overlay')?.remove();
  const native=getNativeLang(), target=getTargetLang();
  toast(TX(`{v0} {v1} → {v2} {v3} 설정됐어요!`,`{v0} {v1} → {v2} {v3} set!`,{v0:(native.flag),v1:(native.name),v2:(target.flag),v3:(target.name)}));
  // 학습언어가 바뀌면 공식 단어장을 해당 언어에 맞게 다시 로드(예: 한국어→Español 선택 시 스페인어 3권만 노출)
  if (targetChanged && currentUser) {
    books = books.filter(b => !b._official);
    await appendOfficialBooks();
  }
  if (!currentUser) renderLogin(); else render();
}

}
function closeActionSheet() { document.getElementById('action-sheet').classList.remove('open'); }
function showBookMenu(bookId) {
  if (isAssignedReadonly(bookId)) return;
  const _b = findBook(bookId);
  const _needsExamples = _b ? _b.pages.some(p => p.words.some(w => w.id && !w.sentence)) : false;
  const items = [{icon:'✏️',label:t('editBook'),action:`openEditBook('${bookId}')`}];
  if (_needsExamples) items.push({icon:'✨',label:TT('예문 채우기','Fill examples'),action:`backfillSentences('${bookId}')`});
  items.push('divider',{icon:'🗑️',label:TT('책 삭제','Delete book'),danger:true,action:`deleteBook('${bookId}')`});
  showActionSheet(items);
}
async function renamePage(bookId, pageNum) {
  if (isAssignedReadonly(bookId)) { toast(TT('과제 책은 편집할 수 없어요','Assigned books are read-only')); return; }
  const book = findBook(bookId);
  const page = book ? findPage(book, pageNum) : null;
  if (!page) return;
  const cur = String(page.num);
  const next = prompt(TT('새 페이지 이름 (예: 15-20)','New page name (e.g. 15-20)'), cur);
  if (next === null) return;
  const name = next.trim();
  if (!name || name === cur) return;
  if (book.pages.some(p => String(p.num) === name)) { toast(TT('같은 이름의 페이지가 있어요','A page with that name already exists')); return; }
  try {
    if (page._pid) {
      const opt = { method:'PATCH', headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }, body: JSON.stringify({ page_num: name }) };
      let res = await fetch(SB_URL+`/rest/v1/voca_pages?id=eq.${page._pid}`, opt);
      if ((res.status===401||res.status===403) && await refreshSession()) { opt.headers.Authorization='Bearer '+_authToken; res = await fetch(SB_URL+`/rest/v1/voca_pages?id=eq.${page._pid}`, opt); }
      if (!res.ok) throw new Error('rename failed '+res.status);
      await cleanupReviews(bookId, cur, name); // 복습도 새 이름으로 이관(진도 보존, 유령 복습 방지)
    }
    page.num = name;
    book.pages.sort((a,b)=>pageSort(a,b));
    render();
    toast(TX(`페이지 이름이 '{v0}'(으)로 바뀌었어요`,`Renamed to '{v0}'`,{v0:(name)}));
  } catch(e) { toast(TT('변경 실패, 잠시 후 다시 시도','Rename failed, try later')); }
}

// ── 페이지 병합 (merge) ──
function mergePage(bookId, pageNum) {
  if (isAssignedReadonly(bookId)) { toast(TT('과제 책은 편집할 수 없어요','Assigned books are read-only')); return; }
  const book = findBook(bookId);
  const src = book ? findPage(book, pageNum) : null;
  if (!src) return;
  const others = book.pages.filter(p => String(p.num) !== String(pageNum));
  if (!others.length) { toast(TT('합칠 다른 페이지가 없어요','No other page to merge')); return; }
  const ov = document.createElement('div');
  ov.id = 'merge-modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML = `<div style="background:var(--bg-card);border-radius:20px 20px 0 0;padding:20px 22px 36px;width:100%;max-width:480px;">
    <div class="sheet-handle"></div>
    <h3 style="font-family:var(--font-display);font-size:20px;margin-bottom:6px;color:var(--ink-100);">📑 Page ${esc(String(pageNum))} ${TT('합치기','Merge')}</h3>
    <div style="font-size:12px;color:var(--ink-60);margin-bottom:14px;">${TX(`이 페이지의 단어({v0}개)를 선택한 페이지로 옮기고, 이 페이지는 삭제돼요.`,`Move {v0} words into the selected page; this page will be deleted.`,{v0:(src.words.length)})}</div>
    <div style="max-height:50vh;overflow-y:auto;">
      ${others.map(p=>`<button onclick="doMergePage('${bookId}','${String(pageNum).replace(/'/g,"\\'")}','${String(p.num).replace(/'/g,"\\'")}')" style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;border:1px solid var(--ink-12);border-radius:12px;margin-bottom:8px;background:var(--bg-input);cursor:pointer;font-family:var(--font-body);text-align:left;">
        <span style="font-size:14px;font-weight:600;color:var(--ink-100);">→ Page ${esc(String(p.num))}</span>

async function doMergePage(bookId, srcNum, dstNum) {
  document.getElementById('merge-modal')?.remove();
  const book = findBook(bookId);
  const src = book ? findPage(book, srcNum) : null;
  const dst = book ? findPage(book, dstNum) : null;
  if (!src || !dst || !dst._pid) { toast(TT('페이지 오류','Page error')); return; }
  toast(TT('합치는 중...','Merging...'));
  try {
    if (src._pid) {
      const opt = { method:'PATCH', headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }, body: JSON.stringify({ page_id: dst._pid }) };
      let res = await fetch(SB_URL + `/rest/v1/voca_words?page_id=eq.${src._pid}`, opt);
      if ((res.status===401||res.status===403) && await refreshSession()) { opt.headers.Authorization='Bearer '+_authToken; res = await fetch(SB_URL + `/rest/v1/voca_words?page_id=eq.${src._pid}`, opt); }
      if (!res.ok) throw new Error('move failed '+res.status);
      await fetch(SB_URL + `/rest/v1/voca_pages?id=eq.${src._pid}`, { method:'DELETE', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken } });
      await cleanupReviews(bookId, srcNum); // 합쳐져 사라진 페이지의 복습 정리

    }
    dst.words = [...dst.words, ...src.words];
    book.pages = book.pages.filter(p => String(p.num) !== String(srcNum));
    updateTotalWords(); render();
    toast(TX(`✅ Page {v2} → Page {v0} 합쳤어요 ({v1}개)`,`✅ Merged into Page {v0} ({v1})`,{v0:(dstNum),v1:(dst.words.length),v2:(srcNum)}));
  } catch(e) { toast(TT('합치기 실패: ','Merge failed: ')+e.message); }
}

async function doAssign(bookId, pageNum){
  const ko = userNativeLang==='ko';
  if (!orgIsAdmin() || !userOrg) { toast(TT('관리자만 배정할 수 있어요','Admins only')); return; }
  const book = findBook(bookId);
  let target = (document.querySelector('input[name="assign-target"]:checked')||{}).value || 'all';
  const due = (document.getElementById('assign-due')||{}).value || null;
  let studentIds = [];
  if (target==='selected'){
    // 이미 배정된(disabled) 학생은 제외하고 '새로 체크한' 학생만 배정(중복 방지)
    studentIds = [...document.querySelectorAll('.assign-stu:checked:not(:disabled)')].map(c=>c.value);
    if (!studentIds.length){ toast(TT('새로 배정할 학생을 선택해주세요 (✓ 배정됨은 이미 배정된 학생)','Select a student to add')); return; }
  } else if (!orgIsPrimary()) {
    // 공동 관리자의 '전체' = 자기 담당 학생 전체를 지정 배정
    studentIds = (window._assignStudents||[]).map(s=>s.id);
    if (!studentIds.length){ toast(TT('담당 학생이 없어요. 주 관리자에게 배정을 요청하세요.','No students assigned to you.')); return; }
    target = 'selected';
  }
  const hasPage = (pageNum!=null && pageNum!=='null');
  const titleSnap = (book?book.title:'') + (hasPage?` · p.${pageNum}`:'');
  try {
    const rows = await sbFetch('/rest/v1/voca_assignments','POST',{
      org_id: userOrg.id, assigned_by: currentUser.id, book_id: bookId,
      page_num: hasPage?String(pageNum):null, title: titleSnap,
      due_date: due||null, target_type: target, active: true
    }, true, {'Prefer':'return=representation'});
    const row = Array.isArray(rows)?rows[0]:null;
    if (!row || !row.id){ toast(TT('배정 실패, 잠시 후 다시','Assign failed')); return; }
    let n = (window._assignStudents||[]).length;
    if (target==='selected' && studentIds.length){
      await sbFetch('/rest/v1/voca_assignment_students','POST', studentIds.map(sid=>({assignment_id:row.id, student_id:sid})), true, {'Prefer':'return=representation'});
      n = studentIds.length;
    }
    if (target==='all'){
      // '학원 전체'는 전원(+향후 학생)을 커버하므로, 같은 책(+페이지)의 기존 배정
      // (옛 1명짜리 selected·중복 all)을 비활성화해 중복/혼란을 없앤다.
      const pf = hasPage ? `page_num=eq.${encodeURIComponent(String(pageNum))}` : 'page_num=is.null';
      try { await sbFetch(`/rest/v1/voca_assignments?org_id=eq.${userOrg.id}&book_id=eq.${bookId}&${pf}&id=neq.${row.id}&active=eq.true`, 'PATCH', { active:false }); } catch(e){}
    }
    const ov = document.getElementById('assign-overlay'); if (ov) ov.remove();
    toast(TX(`✅ {v0}명에게 배정했어요`,`✅ Assigned to {v0}`,{v0:(n)}));
  } catch(e){ toast((TT('배정 오류: ','Error: '))+(e&&e.message||e)); }
}

async function loadAssignments(force){

  // 아직 org 승인 상태/토큰이 준비 안 됐으면 '로드됨'으로 표시하지 말고 그냥 반환.

  //  단체 학생이 첫 진입 때 배정 단어장이 안 뜨던 버그가 있었음)
  if (!(userOrgId && userOrgStatus === 'approved' && _authToken)) return;
  // 관리자(원장)는 과제를 '주는' 사람 — 배정 책을 책장에 주입하지 않는다.
  // (예전엔 여기서 주입된 배정 공식책이, 책장에서 빼도 로그인마다 되살아났음)
  if (orgIsAdmin()) { _assignLoaded = true; return; }
  _assignLoaded = true;
  try {
    const res = await fetch(SB_URL + '/functions/v1/assignments-for-student', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken },
      body:'{}'
    });
    const data = await res.json().catch(()=>({}));
    const assignments = Array.isArray(data.assignments) ? data.assignments : [];
    const rawBooks = Array.isArray(data.books) ? data.books : [];
    window._assignList = assignments;
    // 받은 책을 메모리 books 에 읽기전용 주입 (원본 참조 유지, DB 저장 안 함)
    const existingIds = new Set(books.map(b=>b.id));
    rawBooks.forEach(b=>{
      if (existingIds.has(b.id)) { const eb = findBook(b.id); if (eb){ eb._assigned=true; eb._readonly=true; } return; }
      books.push({
        id:b.id, title:b.title, author:b.author||'', color:b.color,
        // 공식 단어장(수능 등)은 표지가 제목 기반으로 매핑됨 → 배정 책도 동일한 표지로 보이게 _officialCover 적용
        desc:b.description||'', cover:_officialCover(b.title, b.cover_url), category:b.category||'general',
        _assigned:true, _readonly:true,
        pages:(b.voca_pages||[])
          .sort((a,c)=>(a.page_num+'').localeCompare(c.page_num+'', undefined, { numeric:true }))
          .map(p=>({ num:p.page_num, _pid:p.id, words:(p.voca_words||[])
            .sort((a,c)=>new Date(a.created_at)-new Date(c.created_at))
            .map(w=>({ id:w.id, en:w.en, ipa:w.ipa||'', base:w.base, ctx:w.ctx, sentence:w.sentence||'', level:w.level||'', fav:w.is_favorite||false, analysis:w.analysis||null })) }))
      });
      existingIds.add(b.id);
    });
    _stripHiddenWords();
    _saveBooksCache();
    // 배정 책 복습 상태 미리 로드(배지용)
    [...new Set(assignments.map(a=>a.book_id))].forEach(bid=>{ try{ loadReviewStatus(bid); }catch(e){} });
    const top = stack[stack.length-1];
    if (top && top.name === 'library') render();
  } catch(e){ console.warn('[loadAssignments]', e); }
}
function _assignBadge(a){
  const ko = userNativeLang==='ko';
  let status='none';
  if (a.page_num != null) {
    status = _reviewStatus[a.book_id+'|'+a.page_num] || 'none';
  } else {
    const bk = findBook(a.book_id);
    const ss = bk ? bk.pages.map(p=>_reviewStatus[a.book_id+'|'+p.num]) : [];
    if (ss.some(s=>s==='doing')) status='doing';
    else if (ss.length && ss.every(s=>s==='done')) status='done';
    else if (ss.some(s=>s==='done')) status='doing';
    else status='none';
  }
  if (status==='done') return { label: TT('복습 완료','Done'), color:'#1c7c3c', bg:'#e6f4ea' };
  if (status==='doing') return { label: TT('복습 중','Reviewing'), color:'#b35900', bg:'#fff3e0' };
  return { label: TT('시작 전','Not started'), color:'#c0392b', bg:'#fdecea' };
}

// ===== 교사 리포트 + 학부모 카드 =====
// ── 학부모 이미지 카드('자랑 카드') ─────────────────────────────
// shareParentCard 가 모은 데이터(연속·누적·주간 달력·에빙하우스·선생님 한마디)를
// 외부 라이브러리 없이 캔버스에 직접 그려 PNG로 공유/저장. (오프라인 OK, 폰트/이미지 오염 문제 없음)
function _drawParentCard(d){
  const S=2, DW=540;                                   // 2배 해상도(1080px)로 선명하게
  const big=document.createElement('canvas'); big.width=DW*S; big.height=1400*S;
  const bctx=big.getContext('2d'); bctx.scale(S,S);
  const h=_pcPaint(bctx, DW, d);                        // 실제 높이만큼 잘라서 반환
  const out=document.createElement('canvas'); out.width=DW*S; out.height=Math.round(h*S);
  out.getContext('2d').drawImage(big,0,0);
  return out;
}
function _pcPaint(ctx, W, d){
  const ko=userNativeLang==='ko';
  const F='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
  const P=22, CW=W-P*2;
  const rr=(x,y,w,h,r)=>{ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };
  const wrap=(text,font,maxW)=>{ ctx.font=font; const out=[]; let line='';
    String(text||'').split(/\s+/).forEach(w=>{
      const t=line?line+' '+w:w;
      if(ctx.measureText(t).width<=maxW){ line=t; return; }
      if(line){ out.push(line); line=''; }
      let buf=''; for(const ch of w){ if(ctx.measureText(buf+ch).width>maxW && buf){ out.push(buf); buf=ch; } else buf+=ch; } line=buf;
    });
    if(line) out.push(line); return out; };
  const seg=(x,y,parts)=>{ let cx=x; parts.forEach(p=>{ ctx.font=p.f; ctx.fillStyle=p.c; ctx.fillText(p.t,cx,y); cx+=ctx.measureText(p.t).width; }); };

  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,1400);

  // 헤더 (남색 그라데이션 · 학원 로고 있으면 왼쪽에)
  const hH=84, g=ctx.createLinearGradient(0,0,W,hH);
  g.addColorStop(0,'#1c3553'); g.addColorStop(1,'#2a4a73');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,hH);
  let tx=P;
  if(d._logoImg){
    const ls=44, lx=P, ly=(hH-ls)/2;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(lx+10,ly); ctx.arcTo(lx+ls,ly,lx+ls,ly+ls,10); ctx.arcTo(lx+ls,ly+ls,lx,ly+ls,10); ctx.arcTo(lx,ly+ls,lx,ly,10); ctx.arcTo(lx,ly,lx+ls,ly,10); ctx.closePath();
    ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
    const im=d._logoImg, sc=Math.min((ls-8)/im.width,(ls-8)/im.height), dw=im.width*sc, dh=im.height*sc;
    ctx.drawImage(im, lx+(ls-dw)/2, ly+(ls-dh)/2, dw, dh);
    ctx.restore();
    tx=P+56;
  }
  ctx.fillStyle='#fff'; ctx.font='800 19px '+F; ctx.fillText(d.orgName||'IM VOCA', tx, 36);
  ctx.fillStyle='#cdd6e0'; ctx.font='500 11.5px '+F;
  ctx.fillText((TT('영어 단어 학습 리포트 · ','Vocabulary Report · '))+(d.dateLabel||''), tx, 56);
  ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='800 16px '+F; ctx.fillText(d.studentName||'', W-P, 40);
  ctx.textAlign='left';
  let y=hH+16;

  // 히어로 통계 2칸 (연속 학습 · 누적 암기)
  const bw=(CW-10)/2, bh=82;
  const hero=(x,hd)=>{ ctx.fillStyle='#faf7f1'; rr(x,y,bw,bh,14); ctx.fill();
    ctx.strokeStyle='#efe7d6'; ctx.lineWidth=1; rr(x+0.5,y+0.5,bw-1,bh-1,14); ctx.stroke();
    ctx.fillStyle='#8a8a8a'; ctx.font='700 11.5px '+F; ctx.fillText(hd.emo+' '+hd.label, x+14, y+24);
    ctx.fillStyle=hd.color; ctx.font='800 30px '+F; ctx.fillText(hd.val, x+14, y+60);
    const vw=ctx.measureText(hd.val).width;
    ctx.fillStyle='#b0a890'; ctx.font='700 13px '+F; ctx.fillText(hd.unit||'', x+16+vw, y+60); };
  hero(P, d.hero1); hero(P+bw+10, d.hero2);
  y+=bh+12;

  // 이번 주 달력 (월~일 ✓)
  const wh=88;
  ctx.fillStyle='#fff'; rr(P,y,CW,wh,14); ctx.fill();
  ctx.strokeStyle='#ececec'; ctx.lineWidth=1; rr(P+0.5,y+0.5,CW-1,wh-1,14); ctx.stroke();
  ctx.fillStyle='#9a7b3a'; ctx.font='700 10.5px '+F; ctx.fillText(TT('이번 주','THIS WEEK'), P+14, y+20);
  const cal=d.weekCal||[], step=(CW-28-26)/6;
  cal.forEach((c,i)=>{ const cx=P+14+13+i*step, cy=y+44;
    ctx.beginPath(); ctx.arc(cx,cy,13,0,Math.PI*2);
    ctx.fillStyle=c.on?'#1c7c3c':(c.future?'#fbfbfb':'#f0f0f0'); ctx.fill();
    if(!c.on){ ctx.strokeStyle='#e8e8e8'; ctx.lineWidth=1; ctx.stroke(); }
    if(c.isToday){ ctx.beginPath(); ctx.arc(cx,cy,16.5,0,Math.PI*2); ctx.strokeStyle='#b8860b'; ctx.lineWidth=1.8; ctx.stroke(); }
    ctx.textAlign='center';
    if(c.on){ ctx.fillStyle='#fff'; ctx.font='800 13px '+F; ctx.fillText('✓', cx, cy+4.5); }
    ctx.fillStyle=c.on?'#1c7c3c':(c.future?'#d5d5d5':'#b5b5b5'); ctx.font=(c.on?'800':'600')+' 10.5px '+F;
    ctx.fillText(c.label, cx, y+76); ctx.textAlign='left'; });
  y+=wh+12;

  // 요일별로 무엇을 했는지 (학부모가 가장 궁금해하는 부분)
  const wd = (d.weekDetail||[]).slice(0, 7);
  if (wd.length) {
    const rows = wd.map(r => ({ label: r.label, lines: wrap(r.text, '500 11.5px '+F, CW-58) }));
    const dh = 26 + rows.reduce((n,r)=>n + Math.max(1, r.lines.length)*16, 0) + 12;
    ctx.fillStyle='#fff'; rr(P,y,CW,dh,14); ctx.fill();
    ctx.strokeStyle='#ececec'; ctx.lineWidth=1; rr(P+0.5,y+0.5,CW-1,dh-1,14); ctx.stroke();
    ctx.fillStyle='#9a7b3a'; ctx.font='700 10.5px '+F;
    ctx.fillText(TT('요일별 학습 내용','DAY BY DAY'), P+14, y+20);
    let ry = y+38;
    rows.forEach(r=>{
      ctx.fillStyle='#1c3553'; ctx.font='800 11.5px '+F;
      ctx.fillText(r.label, P+14, ry);
      ctx.fillStyle='#3a3a3a'; ctx.font='500 11.5px '+F;
      r.lines.forEach((ln,j)=> ctx.fillText(ln, P+38, ry + j*16));
      ry += Math.max(1, r.lines.length)*16;
    });
    y += dh + 12;
  }

  // 이번 주 요약
  const B='#2b2b2b', GN='#1c7c3c', OR='#b35900', AC='#1c3553';
  const f13='500 13px '+F, f13b='800 13px '+F, f12='500 12px '+F;
  const lines=[];
  lines.push([{t:'✏️ ',f:f13,c:B},{t:(TT('이번 주 새로 외운 단어 ','New words this week: ')),f:f13,c:B},{t:d.weekNewLabel,f:f13b,c:AC}]
    .concat(d.diffLabel?[{t:'  '+d.diffLabel,f:'700 11.5px '+F,c:GN}]:[]));
  lines.push([{t:'🔁 ',f:f13,c:B},{t:d.reviewLabel,f:f13,c:(d.overdue>0?OR:GN)}]);
  if(d.todayLabel) lines.push([{t:'☀️ ',f:f12,c:'#8a8a8a'},{t:(TT('오늘: ','Today: '))+d.todayLabel,f:f12,c:'#8a8a8a'}]);
  const sh=14+lines.length*23+6;
  ctx.fillStyle='#fff'; rr(P,y,CW,sh,14); ctx.fill();
  ctx.strokeStyle='#ececec'; ctx.lineWidth=1; rr(P+0.5,y+0.5,CW-1,sh-1,14); ctx.stroke();
  lines.forEach((L,i)=> seg(P+14, y+26+i*23, L));
  y+=sh+12;

  // 에빙하우스 안내 (과학적 관리 어필)
  const ebbLines=wrap(d.ebbLine||'', '500 12px '+F, CW-56);
  const eh=14+ebbLines.length*18+8;
  ctx.fillStyle='#eef4fb'; rr(P,y,CW,eh,12); ctx.fill();
  ctx.fillStyle='#2a4a73'; ctx.fillRect(P,y+3,3,eh-6);
  ctx.font='16px '+F; ctx.fillText('🧠', P+12, y+25);
  ctx.fillStyle='#2c4058'; ctx.font='500 12px '+F;
  ebbLines.forEach((ln,i)=> ctx.fillText(ln, P+38, y+23+i*18));
  y+=eh+10;

  // 선생님 한마디
  if(d.comment){
    const cmLines=wrap(d.comment, '500 12.5px '+F, CW-28);
    const chh=32+cmLines.length*19+8;
    ctx.fillStyle='#f4f8f4'; rr(P,y,CW,chh,12); ctx.fill();
    ctx.fillStyle='#1c7c3c'; ctx.fillRect(P,y+3,3,chh-6);
    ctx.fillStyle='#1c7c3c'; ctx.font='800 11px '+F; ctx.fillText('💬 '+TT('선생님 한마디',"Teacher's note"), P+14, y+20);
    ctx.fillStyle='#2e4a36'; ctx.font='500 12.5px '+F;
    cmLines.forEach((ln,i)=> ctx.fillText(ln, P+14, y+40+i*19));
    y+=chh+10;
  }

  // 푸터
  y+=4;
  ctx.strokeStyle='#eee'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(W-P,y); ctx.stroke();
  ctx.fillStyle='#9a9a9a'; ctx.font='500 10.5px '+F; ctx.fillText(d.orgName||'', P, y+22);
  ctx.textAlign='right'; ctx.fillStyle='#b8860b'; ctx.font='700 10.5px '+F;
  ctx.fillText('by IM VOCA · 기출 빅데이터 영단어', W-P, y+22);
  ctx.textAlign='left';
  return y+34;
}

// 과제별 상세 리포트를 지정한 컨테이너(boxId)에 채움. 리포트 페이지·단체관리 리포트 탭 공용.
// '지정(selected)' 배정은 org-report 가 대상 학생을 안 걸러줌 → assignment_students 로 클라에서 필터.
// (배정에서 빼도 리포트/상세에 계속 보이던 문제 해결. 엣지함수 재배포 불필요)
async function _filterSelectedAssignments(report){
  const selIds = (report||[]).filter(a=>a.target_type==='selected').map(a=>a.assignment_id).filter(Boolean);
  if (!selIds.length) return report||[];
  const map = {};
  try {
    const links = await sbFetch(`/rest/v1/voca_assignment_students?assignment_id=in.(${selIds.join(',')})&select=assignment_id,student_id`);
    if (Array.isArray(links)) links.forEach(l=>{ (map[l.assignment_id] = map[l.assignment_id] || new Set()).add(l.student_id); });
  } catch(e){ return report||[]; }
  return (report||[]).map(a=>{
    if (a.target_type!=='selected') return a;
    const set = map[a.assignment_id] || new Set();
    return { ...a, students: (a.students||[]).filter(s=>set.has(s.student_id)) };
  }).filter(a=> a.target_type!=='selected' || (a.students && a.students.length));
}

  }
}

      const step = Math.min(p.n, 6);
      parts.push(_pageLabel(p.bid, p.page) + ' · ' +
        (step >= 6 ? TT('60일 복습 완주 🎉','final review 🎉')
                   : TX(`{v0}번째 복습`,`review #{v0}`,{v0:(step)})));
    });
    weekDetail.push({ label: wLabels[i], text: parts.join(' / ') });
  }

  // 이번 주 · 지난주 · 누적 · 오늘
  const weekStart=kstStr(dow), lwStart=kstStr(dow+7), lwEnd=kstStr(dow+1);
  const wkStudy=pairsIn('study',weekStart,kstToday), wkReview=pairsIn('review',weekStart,kstToday);
  const lwStudy=pairsIn('study',lwStart,lwEnd);
  const allStudy=pairsIn('study','0000-01-01',kstToday);
  const todayStudy=pairsIn('study',kstToday,kstToday);
  const totalWords=sumW(allStudy), weekNewWords=sumW(wkStudy), lastWeekWords=sumW(lwStudy);
  const totalDaysStudied=daySet.size;

  // 밀린 복습 + 에빙하우스 단계 = org-report(서버 권위) — RLS로 타 학생 voca_review 직접 조회는 불가
  let reportRows = [];
  const _pushRows = arr => (arr||[]).forEach(asg=>(asg.students||[]).forEach(st=>{ if(st.student_id===sid) reportRows.push({ ...st, _book: asg.title || btitle(asg.book_id) }); }));
  _pushRows(window._lastReport);
  if (!reportRows.length && userOrg) {
    try {
      const rr = await authPost('/functions/v1/org-report', { org_id: userOrg.id, student_id: sid });
      if (rr && rr.ok) { const rd = await rr.json().catch(()=>({})); _pushRows(rd.report); }
    } catch(e){}
  }
  // (구버전 함수 호환: reviewsOverdue 필드가 없으면 예전 '책당 1개' 방식으로 폴백)
  let overdue = 0;
  if (reportRows.some(st=>typeof st.reviewsOverdue === 'number')) reportRows.forEach(st=>{ overdue += st.reviewsOverdue || 0; });
  else reportRows.forEach(st=>{ if(st.exists && !st.completed && st.nextReviewDate && String(st.nextReviewDate).slice(0,10) < kstToday) overdue++; });

  // ── 카드 표시용 라벨 (자랑 카드 프레이밍: 쌓인 것·꾸준함 먼저, 밀림은 '조금만 더') ──
  const cnt = (list,words)=> words>0 ? `${words.toLocaleString()}${TT('개',' words')}` : `${list.length}${TT('과',' lessons')}`;
  const hero1 = streak>0
    ? {emo:'🔥', label:TT('연속 학습','Streak'), val:String(streak), unit:TT('일째','days'), color:'#c0392b'}
    : {emo:'🗓', label:TT('누적 학습일','Days studied'), val:String(totalDaysStudied), unit:TT('일','days'), color:'#1c3553'};
  const hero2 = totalWords>0
    ? {emo:'📚', label:TT('누적 암기 단어','Words memorized'), val:totalWords.toLocaleString(), unit:TT('단어','words'), color:'#1c3553'}
    : {emo:'📚', label:TT('누적 학습','Lessons done'), val:String(allStudy.length), unit:TT('과','lessons'), color:'#1c3553'};
  const diff = weekNewWords - lastWeekWords;
  const diffLabel = (diff>0 && lastWeekWords>0) ? (TX(`지난주보다 +{v0} ↑`,`+{v0} vs last wk ↑`,{v0:(diff)})) : '';
  const weekNewLabel = wkStudy.length ? cnt(wkStudy, weekNewWords) : (TT('아직 없음','none yet'));
  const rN = wkReview.length;
  const reviewLabel = overdue>0
    ? (rN>0 ? (TX(`복습 {v0}세트 완료 · {v1}개만 더 하면 완성!`,`{v0} review sets done · {v1} to go!`,{v0:(rN),v1:(overdue)}))
            : (TX(`밀린 복습 {v0}개 — 오늘 하면 따라잡아요!`,`{v0} reviews to catch up today`,{v0:(overdue)})))
    : (rN>0 ? (TX(`복습 {v0}세트 완료 · 밀린 복습 없음 👏`,`{v0} review sets done · nothing overdue 👏`,{v0:(rN)}))
            : (TT('밀린 복습 없음 👏','Nothing overdue 👏')));
  const todayLabel = todayStudy.length ? compactLabel(todayStudy) : '';
  // 에빙하우스 문구 — 진행 중 과제의 단계(stageLabel: 'N일차 복습 중' 등)를 학부모 언어로
  const stRow = reportRows.find(r=>r.exists && !r.completed && r.stageLabel && r.stageLabel!=='시작 전');
  const doneRow = reportRows.find(r=>r.completed);
  const ebbLine = stRow
    ? (TX(`『{v0}』 단어들이 지금 {v1} — 2·3·6·15·30·60일 반복 복습으로 장기기억에 저장되는 중이에요.`,`"{v0}" is now at {v1} — spaced reviews (2·3·6·15·30·60 days) move words into long-term memory.`,{v0:(stRow._book),v1:(stRow.stageLabel)}))
    : doneRow
    ? (TX(`『{v0}』 60일 복습까지 완주했어요 🎉 외운 단어가 장기기억에 단단히 저장됐습니다.`,`"{v0}" finished the full 60-day review cycle 🎉`,{v0:(doneRow._book)}))
    : (TT('외운 단어는 2·3·6·15·30·60일 주기로 자동 복습되어 장기기억으로 저장됩니다.','Words are auto-reviewed on a 2·3·6·15·30·60-day schedule for long-term memory.'));
  // 선생님 한마디 기본 문구 (모달에서 수정 가능)
  const wkDaysN = weekCal.filter(c=>c.on).length;
  let comment;
  if (wkDaysN===0) comment = TT('이번 주 학습을 시작하면 이 카드가 채워져요. 함께 응원해주세요!','Cheer them on to start this week!');
  else {
    comment = TX(`이번 주 {v0}일 학습했어요.`,`Studied {v0} day(s) this week.`,{v0:(wkDaysN)});
    if (streak>=3) comment += TX(` {v0}일 연속, 꾸준함이 아주 좋아요 👏`,` {v0}-day streak 👏`,{v0:(streak)});
    comment += overdue>0 ? (TT(' 남은 복습만 마치면 완벽해요.',' Just a few reviews left.')) : (TT(' 복습도 밀리지 않고 제때 하고 있어요.',' Reviews are right on schedule.'));
  }

  _showParentImageCardModal({
    orgName, logoUrl: (userOrg && userOrg.logo_url) || '',
    studentId: sid, name: sName,        // 기준 날짜를 바꿔 다시 뽑을 때 쓴다
    studentName: sName||(TT('학생','Student')), dateLabel,
    streak, totalDaysStudied, totalWordsLabel: cnt(allStudy, totalWords),
    hero1, hero2, weekCal, weekDetail, weekNewLabel, diffLabel, reviewLabel, overdue,
    todayLabel, ebbLine, comment
  });
}

function sendParentCard(){
  const ko = userNativeLang==='ko';
  const title = ((document.getElementById('pcard-title')||{}).value || 'IM VOCA').trim();
  const desc = (document.getElementById('pcard-body')||{}).value || '';
  const ov = document.getElementById('pcard-overlay'); if (ov) ov.remove();
  // 부모님껜 '전체 글'로 — 카톡 대화창에 그대로 보이게(잘림/막다른 수신설정 페이지 없음).
  // 시스템 공유 시트에서 카카오톡을 고르면 일반 텍스트 메시지로 전달됨.
  const full = (title ? (title + '\n\n') : '') + desc;
  if (navigator.share){
    navigator.share({ text: full }).catch(()=>{});
  } else if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(full)
      .then(()=>toast(TT('복사했어요 — 카톡 대화창에 붙여넣기 하세요 📋','Copied — paste into chat 📋')))
      .catch(()=>alert(full));
  } else {
    alert(full);
  }
}

function openEditBook(bookId) {
  const book=findBook(bookId); if(!book)return;
  document.getElementById('edit-book-id').value=bookId;
  document.getElementById('edit-title').value=book.title;
  document.getElementById('edit-author').value=book.author;
  document.getElementById('edit-desc').value=book.desc||'';
  document.getElementById('modal-edit').classList.add('open');
}

async function saveEditBook() {
  const bookId=document.getElementById('edit-book-id').value;
  const title=document.getElementById('edit-title').value.trim();
  const author=document.getElementById('edit-author').value.trim();
  const desc=document.getElementById('edit-desc').value.trim();
  if (!title) { toast('제목을 입력해주세요'); return; }
  try {
    await fetch(SB_URL+`/rest/v1/voca_books?id=eq.${bookId}`,{method:'PATCH',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+_authToken},body:JSON.stringify({title,author,description:desc})});

async function deleteBook(bookId) {

  if (!confirm(TT('이 책을 삭제할까요? 저장된 단어도 모두 삭제돼요.','Delete this book? All saved words will be deleted too.'))) return;
  try {
    await fetch(SB_URL+`/rest/v1/voca_books?id=eq.${bookId}`,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+_authToken}});
    await cleanupReviews(bookId); // 고아 복습 방지
   books=books.filter(b=>b.id!==bookId); updateTotalWords(true); back(); render(); toast('삭제됐어요');
  } catch(e) { toast('삭제 실패: '+e.message); }
}

async function deletePage(bookId, pageNum) {
  if (isAssignedReadonly(bookId)) { toast(TT('과제 책은 편집할 수 없어요','Assigned books are read-only')); return; }
  if (!confirm(TX(`Page {v0}을 삭제할까요?`,`Delete Page {v0}?`,{v0:(pageNum)}))) return;
  try {
    const book=findBook(bookId), page=findPage(book,pageNum);
    if (page?._pid) await fetch(SB_URL+`/rest/v1/voca_pages?id=eq.${page._pid}`,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+_authToken}});
    await cleanupReviews(bookId, pageNum); // 유령 복습 방지
    if (book) book.pages=book.pages.filter(p=>String(p.num)!==String(pageNum));
    updateTotalWords(true);   // 삭제: 마지막 페이지면 0 기록 허용
    render(); toast(TX(`Page {v0} 삭제됐어요`,`Page {v0} deleted`,{v0:(pageNum)}));
  } catch(e) { toast('삭제 실패: '+e.message); }
}

async function openBillingPortal() {

  if (!email) { toast(TT('로그인이 필요해요','Please log in')); return; }

      method: 'POST',

    });

    }
  } catch(e) {
    toast(TT('네트워크 오류','Network error'));
  }
}

// TTS 음성 목록 캐시 (iOS/iPadOS는 getVoices()가 첫 호출 때 비어 있어 voiceschanged로 늦게 로드됨)
let _ttsVoices = [];
function _loadTtsVoices() {
  try { _ttsVoices = window.speechSynthesis.getVoices() || []; } catch (e) { _ttsVoices = []; }
  return _ttsVoices;
}
if (typeof window !== 'undefined' && window.speechSynthesis) {
  _loadTtsVoices();
  // onvoiceschanged: 음성 목록이 준비되면 캐시 갱신
  try { window.speechSynthesis.addEventListener('voiceschanged', _loadTtsVoices); } catch (e) {}
}
function _pickTtsVoice(ttsLang) {
  const voices = (_ttsVoices && _ttsVoices.length) ? _ttsVoices : _loadTtsVoices();
  if (!voices.length) return null;
  const norm = v => (v.lang || '').replace('_', '-');
  const prefix = ttsLang.split('-')[0];
  const nm = v => ((v.name||'') + ' ' + (v.voiceURI||''));
  const isCompact = v => /compact/i.test(nm(v));
  const isEnhanced = v => /(enhanced|premium|neural|siri)/i.test(nm(v));
  // iOS/macOS 노벨티·저품질 음성(로봇처럼 들림) → 강하게 회피
  const isNovelty = v => /(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|princess|ralph|grandma|grandpa|reed|rocko|sandy|shelley|flo|eddy)/i.test(nm(v));
  // 점수: 정확한 로캘>같은 언어, 고품질>표준>compact, 노벨티 제외
  const score = v => {
    const lang = norm(v); let s;
    if (lang === ttsLang) s = 100; else if (lang.startsWith(prefix)) s = 50; else return -1;
    if (isNovelty(v)) s -= 1000;
    if (isEnhanced(v)) s += 40;
    if (isCompact(v)) s -= 20;
    if (v.localService) s += 5;
    if (v.default) s += 3;
    return s;
  };
  let best = null, bestS = -1;
  for (const v of voices) { const s = score(v); if (s > bestS) { bestS = s; best = v; } }
  return (bestS >= 0) ? best : null;
}
let _ttsWatch = null;   // onend 누락 감지 워치독
let _ttsUtterRef = null; // ⚠️ Chrome: 발화 중 utterance가 GC되면 onend가 유실됨 → 참조 유지
function speak(word, onEnd, _retry) {
  if (!window.speechSynthesis) { if(onEnd) onEnd(); return; }
  const synth = window.speechSynthesis;
  // iOS: 유휴 상태에서 불필요한 cancel을 반복하면 음성이 쉰 목소리로 깨짐 → 재생 중일 때만 cancel
  if (synth.speaking || synth.pending) synth.cancel();
  if (_ttsWatch) { clearInterval(_ttsWatch); _ttsWatch = null; }
  // 학습 언어에 맞는 발음 언어 코드
  const ttsMap = { en:'en-US', ko:'ko-KR', es:'es-ES', zh:'zh-CN', ja:'ja-JP', fr:'fr-FR', de:'de-DE', pt:'pt-BR', vi:'vi-VN', id:'id-ID' };
  const tcode = (typeof getTargetLang === 'function' && getTargetLang()?.code) || 'en';
  const ttsLang = ttsMap[tcode] || 'en-US';
  const doSpeak = () => {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = ttsLang; u.rate = 0.85; u.pitch = 1;
    const v = _pickTtsVoice(ttsLang);
    // ⚠️ iOS는 voice 미지정 시 u.lang을 무시하고 기기 기본(한국어 등) 음성으로 읽어버림 → 반드시 voice를 명시
    //    단, 재시도(_retry)일 땐 명시하지 않음 — 선택된 음성이 '목록엔 있지만 미설치/고장'(삼성 등)이라
    //    무음이 나는 케이스가 있어, 재시도는 엔진 기본 음성으로 돌린다.
    if (v && !_retry) u.voice = v;
    _ttsUtterRef = u; // GC 방지
    // ⚠️ 긴 문장(예문)은 Web Speech API의 onend가 발화되지 않는 경우가 많음(엔진 ~15초 컷오프/콜백 유실).
    //    또한 iOS Safari는 재생이 끝나도 synth.speaking이 true로 박혀 복구되지 않는 버그가 있어
    //    speaking 상태만 믿으면 자동 반복이 멈춤 → 글자수 기반 추정 시간 상한으로 강제 종료해 보완.
    let fired = false, sawSpeaking = false, ticks = 0;
    const startTs = Date.now();
    const estMs = (word.length * 95) / u.rate + 1500; // 추정 발화 시간
    const hardCapMs = estMs + 5000;                    // iOS speaking 멈춤 대비 상한(여유 5초)
    const finish = () => {
      if (fired) return; fired = true;
      if (_ttsWatch) { clearInterval(_ttsWatch); _ttsWatch = null; }
      _ttsUtterRef = null;
      if (onEnd) onEnd();
    };
    // 소리도 없이 실패하면(음성 미설치·엔진 오류) 기본 음성으로 1회 재시도
    const retryOnce = () => {
      if (fired) return; fired = true;
      if (_ttsWatch) { clearInterval(_ttsWatch); _ttsWatch = null; }
      _ttsUtterRef = null;
      try { synth.cancel(); } catch(e) {}
      setTimeout(() => speak(word, onEnd, true), 120); // cancel 직후 speak 무시(Chrome 버그) 회피 지연
    };
    u.onend = finish;
    u.onerror = () => { if (!sawSpeaking && !_retry) { retryOnce(); return; } finish(); };
    synth.speak(u);
    try { synth.resume(); } catch(e) {} // Chrome: paused 상태에서 speak가 무시되는 버그 보완
    if (_ttsWatch) clearInterval(_ttsWatch);
    _ttsWatch = setInterval(() => {
      if (fired) { clearInterval(_ttsWatch); _ttsWatch = null; return; }
      ticks++;
      const elapsed = Date.now() - startTs;
      if (synth.speaking) {
        sawSpeaking = true;
        if (elapsed > 10000) { try { synth.resume(); } catch(e) {} } // Chrome ~15초 컷오프 방지(장문)
      }
      if (sawSpeaking && !synth.speaking) { finish(); return; }  // 정상 종료(PC/안드로이드)
      if (elapsed >= hardCapMs) { finish(); return; }            // iOS: speaking 멈춤 미복구 → 강제 종료
      if (!sawSpeaking && ticks >= 6) {                          // ~3.6초간 재생 시작조차 안 됨
        if (!_retry) { retryOnce(); return; }                    // 1차: 기본 음성으로 재시도
        try { logError('tts_silent','speak','device TTS produced no sound',{ lang: ttsLang }); } catch(e){}
        toast(TT('🔇 이 기기에서 발음을 재생하지 못했어요. 기기 설정 → 텍스트 읽어주기(TTS)에서 영어 음성이 설치돼 있는지 확인해주세요.','🔇 Could not play speech. Please check that an English TTS voice is installed in your device settings.'), 5000);
        finish(); return;
      }
    }, 600);
  };
  // 음성 목록이 아직 안 떴으면(iOS 콜드 스타트) voiceschanged를 기다렸다 재시도
  if (!(_ttsVoices && _ttsVoices.length)) {
    _loadTtsVoices();
    if (!_ttsVoices.length) {
      let done = false;
      const run = () => { if (done) return; done = true; _loadTtsVoices(); doSpeak(); };
      try { synth.addEventListener('voiceschanged', run, { once: true }); } catch (e) {}
      setTimeout(run, 300); // 폴백: 이벤트가 안 와도 강제 실행
      return;
    }
  }
  doSpeak();
}

function bookCoverBg(b){
  const h = _coverHash(b.id || b.title);

// 책 표지 위에 얹을 장식(책등 그림자 + 일러스트). 사용자 업로드 표지(cover)면 생략
function bookCoverDeco(b){
  if (b.cover) return '';

  const kind = h % 6;
  const illustStyle = "position:absolute;right:7px;bottom:24px;width:46%;height:46%;opacity:0.9;pointer-events:none;";

  return spine + _coverIllust(kind, illustStyle);
}

function fmtScoreDate(iso) {
  try {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return (d.getMonth()+1) + '.' + d.getDate();
  } catch(e) { return ''; }
}

// 월별 뷰 → 사용자별 월 점수 맵 집계 (캐시). months = 데이터가 있는 달 목록(오름차순).
// 월별 표시 점수 = [일지 정확 점수(exact, 2026-09-10~)] + [일지 이전 몫을 활동 비율로 배분].
// 배분 대상 = 원본 총점수(perfect) − 일지 합계 → 사용자의 월별 합 = 연도별 = 전체 누적(원본) 일치.
function _hallAgg() {
  if (window._hallAggCache) return window._hallAggCache;
  const u = {}, monthSet = new Set();
  (window._hallMonthly||[]).forEach(r => {
    const k = r.user_id; if (!k || !r.month) return;
    if (!u[k]) u[k] = { uid:k, name:r.name, org_id:r.org_id, org_role:r.org_role, org_status:r.org_status, months:{}, exact:{}, lastBy:{}, perfect:0, rawAll:0, exactAll:0 };
    const s = r.score||0, ex = r.exact_score||0;
    if (s>0 || ex>0) monthSet.add(r.month);
    u[k].months[r.month] = (u[k].months[r.month]||0) + s;
    u[k].exact[r.month] = (u[k].exact[r.month]||0) + ex;
    u[k].rawAll += s; u[k].exactAll += ex;
    if ((r.perfect_total||0) > u[k].perfect) u[k].perfect = r.perfect_total||0;
    const d = String(r.last_day||'').slice(0,10);
    if (d && (!u[k].lastBy[r.month] || d > u[k].lastBy[r.month])) u[k].lastBy[r.month] = d;
  });
  const users = Object.values(u);
  users.forEach(x => {
    const hist = Math.max(x.perfect - x.exactAll, 0);   // 일지 이전에 쌓인 몫
    x.factor = (x.rawAll>0 && hist>0) ? (hist / x.rawAll) : 0;
  });
  return window._hallAggCache = { users, months: [...monthSet].sort() };
}
// 달/연도 넘김: 데이터가 있는 가장 이른 달 ~ 이번 달(로컬 기준) 범위 안에서 이동
function hallNav(delta) {
  const kst = _todayStr();
  const minM = (_hallAgg().months[0] || kst.slice(0,7));
  if ((window._hallPeriod||'month') === 'month') {
    const cur = window._hallMonthSel || kst.slice(0,7);
    const d = new Date(Date.UTC(+cur.slice(0,4), +cur.slice(5,7)-1+delta, 1));
    const next = d.toISOString().slice(0,7);
    if (next < minM || next > kst.slice(0,7)) return;
    window._hallMonthSel = next;
  } else {
    const next = String((+(window._hallYearSel || kst.slice(0,4))) + delta);
    if (next < minM.slice(0,4) || next > kst.slice(0,4)) return;
    window._hallYearSel = next;
  }
  window._hallPage = 1; renderHallTabs(); renderHallBody();
}

function renderHallBody() {

  let list = []; // {name, _score, sub, mine}

        .filter(m=>m._score>0).sort((a,b)=>b._score-a._score).slice(0,MAXR);
    } else {
      list = all.map(m=>({ name:m.name||(TT('익명','Anon')), _score:(m.perfect_reviews||0), sub:m.last_scored_at?('📅 '+fmtScoreDate(m.last_scored_at)):'', mine:m.name===userName, org:(m.org_id&&m.org_status==='approved')?(window._hallOrgNames[m.org_id]||''):'' }))
        .filter(m=>m._score>0).sort((a,b)=>b._score-a._score).slice(0,MAXR);
    }
  } else {
    // 월별/연도별: 활동 기록 기반 재계산 점수 (선택한 달/연도, 날짜는 그 기간의 마지막 점수일)
    const period = window._hallPeriod || 'month';
    const kst = _todayStr();
    const selM = window._hallMonthSel || kst.slice(0,7);
    const selY = window._hallYearSel || kst.slice(0,4);
    const users = _hallAgg().users;
    const myId = currentUser && currentUser.id;
    const scoreOf = u => {
      const raw = period==='month' ? (u.months[selM]||0)
        : Object.keys(u.months).reduce((s,mm)=> s + (mm.slice(0,4)===selY ? u.months[mm] : 0), 0);
      const ex = period==='month' ? (u.exact[selM]||0)
        : Object.keys(u.exact).reduce((s,mm)=> s + (mm.slice(0,4)===selY ? u.exact[mm] : 0), 0);
      return ex + Math.round(u.factor * raw);   // 일지 정확분 + 과거 배분분
    };
    const lastOf = u => {
      let d = '';
      if (period==='month') d = u.lastBy[selM]||'';
      else Object.keys(u.lastBy).forEach(mm=>{ if(mm.slice(0,4)===selY && u.lastBy[mm]>d) d=u.lastBy[mm]; });
      return d ? ('📅 '+fmtScoreDate(d+'T00:00:00')) : '';
    };
    if (tab === 'team') {
      const orgMap = {};
      users.forEach(u => {
        if (u.org_id && u.org_status==='approved' && u.org_role==='student') {
          const sc = scoreOf(u);
          if(!orgMap[u.org_id]) orgMap[u.org_id]={score:0,count:0};
          orgMap[u.org_id].score+=sc; if(sc>0) orgMap[u.org_id].count+=1;
        }
      });
      list = Object.keys(orgMap).filter(id=>orgMap[id].score>0)
        .map(id=>({ name:'🏫 '+( window._hallOrgNames[id]||(TT('단체','Org'))), _score:orgMap[id].score, sub:`👥 ${orgMap[id].count}${TT('명','')}`, mine: id===userOrgId }))
        .sort((a,b)=>b._score-a._score).slice(0,MAXR);
    } else if (tab === 'members') {
      list = users.filter(u=>u.org_id===userOrgId && u.org_status==='approved' && u.org_role==='student')
        .map(u=>({ name:u.name||(TT('익명','Anon')), _score:scoreOf(u), sub:lastOf(u), mine:u.uid===myId }))
        .filter(x=>x._score>0).sort((a,b)=>b._score-a._score).slice(0,MAXR);
    } else { // indiv — 전체 사용자
      list = users.map(u=>({ name:u.name||(TT('익명','Anon')), _score:scoreOf(u), sub:lastOf(u), mine:u.uid===myId, org:(u.org_id&&u.org_status==='approved')?(window._hallOrgNames[u.org_id]||''):'' }))
        .filter(x=>x._score>0).sort((a,b)=>b._score-a._score).slice(0,MAXR);
    }
  }

  if (list.length === 0) {
    const p = window._hallPeriod || 'month';
    const _kst = _todayStr();
    const _selM = window._hallMonthSel || _kst.slice(0,7), _selY = window._hallYearSel || _kst.slice(0,4);
    const emptyTitle = (window._hallLegacy || p==='all') ? (TT('아직 등록된 기록이 없어요','No records yet'))
      : p==='month' ? (TX(`{v1}월 기록이 아직 없어요`,`No records in {v0} yet`,{v0:(_selM),v1:(+_selM.slice(5,7))}))
      : (TX(`{v0}년 기록이 아직 없어요`,`No records in {v0} yet`,{v0:(_selY)}));
    el.innerHTML = `<div style="text-align:center;padding:60px 20px;">
      <div style="font-size:48px;margin-bottom:16px;">🏆</div>
      <div style="font-size:15px;color:var(--ink-60);">${emptyTitle}</div>
      <div style="font-size:13px;color:var(--ink-40);margin-top:8px;">${TT('단어를 외우거나 복습하면 순위에 올라가요!','Study or review to appear!')}</div>
    </div>`;
    return;
  }

  // 내 순위
  const myIdx = list.findIndex(m=>m.mine);
  const totalPages = Math.min(Math.ceil(list.length/PER), Math.ceil(MAXR/PER));
  let page = window._hallPage || 1;
  if (page > totalPages) page = totalPages;
  const startI = (page-1)*PER;
  const pageItems = list.slice(startI, startI+PER);

  const myCard = (myIdx>=0) ? `
    <div style="background:var(--gold-bg);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;">
      <div style="font-size:20px;">${myIdx<3?medals[myIdx]:(myIdx+1)+(TT('위',''))}</div>
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--accent);">${tab==='team'?(TT('우리 단체','My Team')):(TT('내 순위','My Rank'))}</div>
        <div style="font-size:12px;color:var(--ink-60);">⚡ ${list[myIdx]._score}${TT('점','pts')}</div>
      </div>
    </div>` : '';

  const rows = pageItems.map((m,idx) => {
    const rank = startI + idx;
    return `
    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ink-07);${m.mine?'background:var(--gold-bg);':''}">
      <div style="font-size:${rank<3?'22px':'14px'};width:32px;text-align:center;font-weight:700;color:${rank<3?'inherit':'var(--ink-40)'};">${rank<3?medals[rank]:rank+1}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:${m.mine?'700':'500'};color:var(--ink-100);display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          ${esc(m.name)}
          ${m.org?`<span style="font-size:9.5px;font-weight:600;color:var(--ink-45);background:var(--ink-05);border:1px solid var(--ink-07);border-radius:99px;padding:1px 7px;white-space:nowrap;">🏫 ${esc(m.org)}</span>`:''}
          ${m.mine?`<span style="font-size:10px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;">${tab==='team'?(TT('우리','Mine')):(TT('나','Me'))}</span>`:''}
        </div>
        <div style="font-size:11px;color:var(--ink-40);margin-top:2px;">⚡ ${m._score}${TT('점','pts')}${m.sub?' · '+m.sub:''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">${rank===0?'<div style="font-size:20px;">👑</div>':''}</div>
    </div>`;
  }).join('');

  // 페이지네이션 (1,2,3...)
  let pager = '';
  if (totalPages > 1) {
    let btns = '';
    for (let i=1;i<=totalPages;i++){
      const act = i===page;
      btns += `<button onclick="window._hallPage=${i};renderHallBody();" style="min-width:28px;height:28px;padding:0 6px;border:1px solid ${act?'var(--accent)':'var(--ink-12)'};background:${act?'var(--accent)':'transparent'};color:${act?'#fff':'var(--ink-60)'};border-radius:7px;font-size:12px;font-weight:${act?700:500};cursor:pointer;font-family:var(--font-body);">${i}</button>`;
    }
    pager = `<div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:14px;">${btns}</div>`;
  }

  el.innerHTML = `
    ${myCard}
    <div style="background:var(--bg-card);border-radius:16px;overflow:hidden;">${rows}</div>
    ${pager}
  `;
}
