*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { height: 100%; font-family: var(--font-body); color: var(--ink-100); -webkit-font-smoothing: antialiased; background: #e3d9c9; }
#root { position: fixed; inset: 0; height: 100dvh; }
.scr { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 20px 22px 0; overflow: hidden; background: radial-gradient(135% 90% at 50% -12%, #f8f2e8 0%, var(--bg-page) 52%); }
@media (min-width: 768px) {
  /* ===== PC 최적화: 좌측 사이드바 + 넓은 콘텐츠 + 가운데 정렬 ===== */
  :root { --sidebar-w: 264px; }

  /* 하단 탭바 → 좌측 세로 사이드바 */
  .dock {
    top: 0 !important; bottom: 0 !important; left: 0 !important; right: auto !important;
    transform: none !important;
    width: var(--sidebar-w) !important; max-width: var(--sidebar-w) !important; height: 100vh !important;
    flex-direction: column !important; justify-content: flex-start !important; align-items: stretch !important;
    gap: 8px; padding: 34px 18px !important;
    border-top: none !important; border-right: 1px solid var(--ink-12) !important;
    background: var(--bg-card) !important;
    backdrop-filter: none !important;
  }
  /* 사이드바 상단 로고 영역 */
  .dock::before {
    content: "IM VOCA";
    font-family: var(--font-display); font-size: 25px; font-weight: 700;
    color: var(--accent); letter-spacing: -0.02em;
    padding: 0 16px 26px; margin-bottom: 12px;
    border-bottom: 1px solid var(--ink-07);
  }
  .dock__btn {
    flex-direction: row !important; justify-content: flex-start !important; align-items: center !important; gap: 16px !important;
    padding: 16px 18px !important; font-size: 17px !important; font-weight: 600 !important; border-radius: 13px;
    width: 100% !important; height: auto !important; transition: background .15s, color .15s;
  }
  .dock__btn:hover { background: var(--bg-input); }
  .dock__btn--active { background: var(--gold-bg); }
  .dock__btn span:first-child { font-size: 26px !important; width: 30px !important; text-align: center; }
  .dock__btn span:last-child { font-size: 16px !important; }

  /* 콘텐츠 영역: 사이드바 오른쪽 전체, 내부에서 가운데 정렬 */
  .scr {
    left: var(--sidebar-w) !important; right: 0 !important; width: auto !important; max-width: none !important;
    transform: none !important;
    padding: 0 !important; border: none !important;
    align-items: center;
    overflow-y: auto;
  }
  /* 실제 내용은 적당한 폭으로 가운데, 내용 적으면 위아래도 가운데 */
  .scr > *:not(.btn-fixed):not(.dock):not(.study-start-bar) { width: 100%; max-width: 720px; }
  .scr-scroll {
    width: 100%; max-width: 720px;
    margin-left: auto !important; margin-right: auto !important;
    padding: 40px 40px 60px !important;
    min-height: 100%;
    display: block;
  }
  /* scr-scroll 직속 자식이 flex로 찌그러지지 않게 (복습 카드 등) */
  .scr-scroll > * { flex-shrink: 0; }
  /* 하단 고정 버튼 바(btn-fixed, 높이 약 84px)가 있는 화면: 마지막 행이 바에 가려지지 않게 */
  .scr:has(.btn-fixed) .scr-scroll { padding-bottom: 140px !important; }
  /* 내용이 적을 때 세로 가운데 정렬되도록: 스크롤 컨테이너를 flex로 채움 */
  .scr { justify-content: flex-start; }
  .scr::before, .scr::after { content: none; }

  /* 책장/리스트가 들어가는 화면은 더 넓게 + 확실히 가운데 */
  .scr.scr-wide > * { max-width: 1180px !important; margin-left: auto !important; margin-right: auto !important; }
  .scr.scr-wide .scr-scroll { max-width: 1180px !important; margin-left: auto !important; margin-right: auto !important; padding: 44px 44px 80px !important; }

  /* 책장 격자: 넓은 화면이니 여러 열 자동 채움 */
  .book-grid { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)) !important; gap: 30px 26px !important; }
  .scr-wide .book-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important; gap: 36px 30px !important; }
  .scr-wide .lib-header { max-width: 100%; margin-top: 0; }
  /* 타일이 다시 넓어지므로 글자·여백은 원래 크기로 */
  .book-cover { border-radius: 12px; padding: 14px 13px 15px; }
  .book-cover__title { font-size: 19px; }
  .book-cover__author { font-size: 10px; }
  .book-tile__title { font-size: 15px; margin-top: 13px; }
  .book-tile__sub { font-size: 11px; margin-top: 3px; }

  /* 모달/시트/오버레이는 화면 전체 기준 가운데 */
  .overlay { left: 0; right: 0; max-width: none; transform: none; }
  .sheet { max-width: 520px; margin: 0 auto; }
  /* 하단 버튼: 사이드바 오른쪽 영역 하단에 고정, 가운데 정렬 */
  .btn-fixed { position: fixed !important; left: var(--sidebar-w) !important; right: 0 !important; bottom: 0 !important; top: auto !important; width: auto !important; max-width: none !important; min-width: 0 !important; margin: 0 !important; align-self: auto !important; display: flex !important; flex-direction: row !important; justify-content: center !important; align-items: center !important; gap: 12px !important; padding: 16px 40px calc(16px + env(safe-area-inset-bottom,0px)) !important; background: var(--bg-page) !important; border-top: 1px solid var(--ink-07) !important; z-index: 100 !important; box-sizing: border-box !important; }
  .btn-fixed .btn, .btn-fixed--row .btn { flex: 0 1 280px !important; width: auto !important; max-width: 280px !important; }

  /* 암기/설정 화면의 시작 버튼바도 하단 고정 */
  .study-start-bar { position: fixed !important; left: var(--sidebar-w) !important; right: 0 !important; bottom: 0 !important; top: auto !important; max-width: none !important; flex-direction: row !important; justify-content: center !important; gap: 12px !important; margin: 0 !important; padding: 16px 40px calc(16px + env(safe-area-inset-bottom,0px)) !important; background: var(--bg-page) !important; border-top: 1px solid var(--ink-07); z-index: 100 !important; box-sizing: border-box !important; }
  .study-start-bar .btn { flex: 0 1 300px !important; width: auto !important; max-width: 300px !important; }
  #study-setup-inner { padding-bottom: 90px !important; }
  /* 상단 우측 버튼이 제목과 안 겹치게: 제목 영역에 오른쪽 여백 */
  .scr-wide .lib-header { padding-right: 0; }
}
.scr-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;

/* 로그인 화면 (IM메신저 스타일 좌우 2단) */
.auth-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-page); padding: 20px; overflow-y: auto; }
.auth-card { width: 100%; max-width: 440px; background: var(--bg-card); border-radius: 22px; overflow: hidden; display: flex; box-shadow: 0 4px 12px rgba(40,25,10,0.06), 0 24px 60px rgba(40,25,10,0.16); }
.auth-aside { display: none; }
.auth-main { flex: 1; padding: 36px 32px; }
@media (min-width: 768px) {
  .auth-card { max-width: 900px; min-height: 560px; }
  .auth-aside { display: flex; flex-direction: column; justify-content: center; width: 42%; padding: 48px 40px; background: linear-gradient(158deg, #26405f 0%, #0f1d2e 100%); color: #f3ece0; position: relative; }
  .auth-main { width: 58%; padding: 56px 56px; display: flex; flex-direction: column; justify-content: center; }
  .auth-mobile-logo { display: none; }
  .auth-feat { display: flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 14px; color: rgba(243,236,224,0.92); }
  .auth-feat .ic { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
  /* PC: 사이드바 하단 액션 영역 (관리/Premium/알림/앱소개/My) */
  .dock-bottom { display: flex !important; flex-direction: column; gap: 4px; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--ink-07); }
  .dock-mini { background: none; border: none; border-radius: 10px; padding: 11px 14px; font-family: var(--font-body); font-size: 13.5px; font-weight: 600; color: var(--ink-60); cursor: pointer; text-align: left; transition: background .15s; }
  .dock-mini:hover { background: var(--bg-input); }
  .dock-mini--accent { color: var(--accent); }
  /* PC에선 책장 상단 우측 버튼(관리/My 등) 숨김 — 사이드바 하단으로 이동 */
  .topbar-actions { display: none !important; }
  /* 책 추가 버튼: 제목 아래 왼쪽으로 */
  .scr-wide .lib-header { flex-direction: column !important; align-items: flex-start !important; gap: 14px !important; }
  .scr-wide .lib-add-btn { align-self: flex-start !important; }
  /* 상세화면(book 등) PC 사이드바 표시 */
  .dock--detail { display: flex !important; }
}
.scr-scroll::-webkit-scrollbar { width: 4px; }
.scr-scroll::-webkit-scrollbar-thumb { background: var(--ink-12); border-radius: 2px; }
.h-display { font-family: var(--font-display); letter-spacing: -0.03em; line-height: 0.97; color: var(--ink-100); }

.label-xs { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-40); font-weight: 500; }
.muted { color: var(--ink-60); }
.topnav { display: flex; justify-content: space-between; align-items: center; height: 30px; margin-bottom: 2px; flex-shrink: 0; }
.topnav__back { font-size: 20px; cursor: pointer; padding: 4px 8px 4px 0; color: var(--ink-100); user-select: none; }
.topnav__title { font-size: 13px; color: var(--ink-60); letter-spacing: -0.02em; }
.topnav__right { font-size: 16px; cursor: pointer; padding: 4px 0 4px 8px; }
.dock { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 80px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; background: rgba(247,242,234,0.82); border-top: 1px solid var(--hairline); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 -8px 24px rgba(40,25,10,0.05); z-index: 20; }
.dock__btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 20px; font-size: 10px; color: var(--ink-40); background: none; border: none; font-family: var(--font-body); }
.dock__btn--active { color: var(--accent); }
button:active, .dock__btn:active, .book-tile:active, .scope-card:active, .list-row:active, .page-row:active, .chip:active {
  opacity: 0.6 !important;
  transform: scale(0.97);
  transition: opacity 0.05s, transform 0.05s;
}
.btn:active { filter: brightness(0.88); transform: scale(0.98); transition: transform 0.05s, filter 0.05s; }
.ox-btn:active { filter: brightness(0.85); transform: scale(0.96); transition: transform 0.05s, filter 0.05s; }
.dock__glyph { font-family: var(--font-display); font-size: 22px; line-height: 1; letter-spacing: -0.04em; }
.btn { width: 100%; padding: 15px 14px; border-radius: 13px; font-family: var(--font-body); font-weight: 600; font-size: 15px; cursor: pointer; border: none; text-align: center; letter-spacing: -0.01em; transition: transform .12s ease, box-shadow .18s ease, filter .12s ease; }
.btn-solid { background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 60%), var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(15,34,56,0.18), 0 10px 22px rgba(15,34,56,0.18); }
@media (hover: hover) and (pointer: fine) { .btn-solid:hover { box-shadow: 0 3px 8px rgba(15,34,56,0.22), 0 14px 30px rgba(15,34,56,0.22); transform: translateY(-1px); } }
.btn-outline { background: var(--bg-card); color: var(--ink-100); border: 1.5px solid var(--ink-12); box-shadow: var(--shadow-sm); }
/* ── 단체 관리(LMS) 앱셸: 왼쪽 고정 사이드바 + 오른쪽 콘텐츠 ── */
.org-app { position: fixed; inset: 0; background: var(--bg-page); }
.org-sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 244px; background: var(--bg-card); border-right: 1px solid var(--ink-07); padding: 22px 16px 18px; overflow-y: auto; z-index: 15; display: flex; flex-direction: column; gap: 3px; box-shadow: 1px 0 0 rgba(44,33,24,0.02); }
.org-sidebar__brand { display: flex; align-items: center; gap: 9px; padding: 0 6px 14px; margin-bottom: 8px; border-bottom: 1px solid var(--ink-07); }
.org-nav__id { display: flex; align-items: center; gap: 10px; padding: 12px 8px; margin-bottom: 8px; background: var(--bg-page); border-radius: 12px; }
.org-nav__btn { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 11px; border: none; background: none; font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--ink-60); cursor: pointer; text-align: left; width: 100%; transition: background .15s, color .15s; }
.org-nav__btn:hover { background: var(--bg-page); color: var(--ink-100); }
.org-nav__btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(15,34,56,0.18); }
.org-nav__ic { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.org-content { position: absolute; left: 244px; right: 0; top: 0; bottom: 0; overflow-y: auto; padding: 30px 40px 90px; }
.org-content__inner { max-width: 940px; }
.org-main__title { font-family: var(--font-display); font-size: 23px; font-weight: 600; color: var(--ink-100); letter-spacing: -0.01em; margin: 2px 2px 20px; }
@media (max-width: 820px) {
  /* 모바일: 앱셸 자체를 스크롤 컨테이너로 (콘텐츠가 화면보다 길 때 아래로 스크롤되게) */
  .org-app { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  /* 상단 탭바는 스크롤해도 고정(sticky) */
  .org-sidebar { position: sticky; top: 0; width: 100%; height: auto; flex-direction: row; align-items: center; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid var(--ink-07); padding: 10px 14px; gap: 6px; box-shadow: none; z-index: 15; }
  .org-sidebar__brand, .org-nav__id { display: none; }
  .org-nav__btn { width: auto; flex-shrink: 0; padding: 9px 14px; font-size: 13px; border: 1px solid var(--ink-07); background: var(--bg-page); white-space: nowrap; }
  .org-nav__btn.active { border-color: var(--accent); }
  .org-nav__toapp { order: 99; }
  .org-sidebar::-webkit-scrollbar { display: none; }
  .org-content { position: static; padding: 18px 18px 110px; }
}
.btn-fixed { position: absolute; left: 22px; right: 22px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
.btn-fixed--row { flex-direction: row; gap: 8px; }
.btn-fixed--row .btn { flex: 1; }
.lib-header { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4px; }
.dock-bottom { display: none; }
.dock--detail { display: none; }  /* 상세화면 사이드바는 모바일에서 숨김 */
/* 책장 상단 버튼: 항상 한 줄 — My 는 오른쪽 고정, 나머지는 넘치면 좌우 스크롤 */
.topbar-actions { display: flex; align-items: center; gap: 6px; }
.topbar-scroll { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow-x: auto; margin-left: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.topbar-scroll::-webkit-scrollbar { display: none; }
.topbar-actions .topbar-btn { flex-shrink: 0; font-size: 12px !important; padding: 6px 12px !important; }
/* 좁은 화면: 책장 화면만 제목을 버튼 한 줄 아래로 내려 겹침 방지 —
   즐겨찾기·검색 등 다른 scr-wide 화면은 복습·명예의 전당과 같은 높이(50px) 유지 */
@media (max-width: 640px) {
  .scr-shelf.scr { padding-top: 64px !important; }
  .scr-shelf .lib-header { margin-top: 0; }
}
.lib-plus { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; color: var(--accent); }
.book-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px 12px; margin-top: 22px; padding: 0 2px; }
/* ── 책장 도구줄: 정렬 · 순서 편집 · 보기 방식 ─────────────────── */
.shelf-tools { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding: 0 6px; flex-wrap: wrap; }
.shelf-spacer { flex: 1 1 auto; min-width: 0; }
.shelf-sort { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-body); font-size: 12px; color: var(--ink-60); }
.shelf-sort select {
  font-family: var(--font-body); font-size: 12.5px; font-weight: 700; color: var(--ink-100);
  background: var(--bg-card); border: 1px solid var(--ink-12); border-radius: 999px;
  padding: 6px 26px 6px 11px; cursor: pointer; -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.shelf-btn {
  font-family: var(--font-body); font-size: 12.5px; font-weight: 700; color: var(--ink-60);
  background: var(--bg-card); border: 1px solid var(--ink-12); border-radius: 999px;
  padding: 6px 13px; cursor: pointer; white-space: nowrap;
}
.shelf-btn--on { background: var(--accent); border-color: var(--accent); color: #fff; }
.shelf-seg { display: inline-flex; border: 1px solid var(--ink-12); border-radius: 999px; overflow: hidden; background: var(--bg-card); }
.shelf-seg button {
  font-size: 14px; line-height: 1; color: var(--ink-40); background: none; border: none;
  padding: 7px 12px; cursor: pointer;
}
.shelf-seg button.on { background: var(--accent); color: #fff; }
.shelf-hint { margin: 10px 6px 0; font-size: 11.5px; color: var(--ink-60); line-height: 1.6; }

/* ── 리스트 보기 ──────────────────────────────────────────────── */
.book-list { display: flex; flex-direction: column; margin-top: 16px; padding: 0 6px; }
.book-row {
  display: flex; align-items: center; gap: 13px; padding: 11px 4px;
  border-bottom: 1px solid var(--ink-07); cursor: pointer;
}
.book-row:last-child { border-bottom: none; }
.book-row__cover {
  width: 42px; height: 58px; flex-shrink: 0; border-radius: 5px; overflow: hidden;
  box-shadow: 0 1px 3px rgba(40,25,10,0.22); display: flex; align-items: center; justify-content: center;
}
.book-row__cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.book-row__cover span { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: rgba(255,255,255,0.92); }
.book-row__meta { flex: 1; min-width: 0; }
.book-row__title {
  font-family: var(--font-display); font-size: 15px; font-weight: 500; color: var(--ink-100);
  letter-spacing: -0.01em; line-height: 1.3; overflow-wrap: anywhere;
}
.book-row__tag { font-family: var(--font-body); font-size: 10px; font-weight: 800; color: #c0392b; white-space: nowrap; }
.book-row__sub { font-family: var(--font-body); font-size: 11.5px; color: var(--ink-60); margin-top: 3px; }
.book-row__chev { color: var(--ink-40); font-size: 20px; flex-shrink: 0; line-height: 1; }

/* ── 순서 편집 ────────────────────────────────────────────────── */
.tile-move {
  position: absolute; inset: 0; z-index: 3; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: rgba(22,16,10,0.34); backdrop-filter: blur(1px);
}
.tile-move--row { position: static; inset: auto; background: none; backdrop-filter: none; gap: 6px; flex-shrink: 0; border-radius: 0; }
.tile-move button {
  width: 34px; height: 34px; border-radius: 10px; border: none; cursor: pointer;
  background: rgba(255,255,255,0.94); color: #1c3553; font-size: 13px; font-weight: 700; line-height: 1;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
.tile-move--row button { width: 30px; height: 30px; border-radius: 9px; }
.tile-move--row button { background: var(--bg-card); border: 1px solid var(--ink-12); color: var(--ink-60); box-shadow: none; }
.tile-move button[disabled] { opacity: 0.3; cursor: default; }
.book-tile.is-edit, .book-row.is-edit { touch-action: none; -webkit-user-select: none; user-select: none; }
.book-tile.is-edit .book-cover { box-shadow: 0 0 0 2px var(--accent); border-radius: 10px; }
.shelf-drag { opacity: 0.45; }
.shelf-drop-target { outline: 2px dashed var(--accent); outline-offset: 3px; border-radius: 10px; }
.book-tile { cursor: pointer; }
.book-cover { position: relative; width: 100%; aspect-ratio: 30/43; border-radius: 9px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 9px 11px; color: #fff; font-family: var(--font-display); letter-spacing: -0.02em; line-height: 1.02; overflow: hidden; box-shadow: 0 1px 2px rgba(40,25,10,0.11), 0 6px 14px rgba(40,25,10,0.17), 0 14px 28px rgba(40,25,10,0.12); transition: transform .18s ease, box-shadow .18s ease; }
/* 표지 상단 광택 + 미세한 안쪽 테두리로 '실제 책' 질감 */
.book-cover::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(157deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0) 46%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 -18px 30px rgba(0,0,0,0.14); pointer-events: none; }
@media (hover: hover) and (pointer: fine) { .book-tile:hover .book-cover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(40,25,10,0.14), 0 16px 30px rgba(40,25,10,0.24), 0 30px 60px rgba(40,25,10,0.16); } }
/* aspect-ratio 미지원 안드로이드 폴백 */
@supports not (aspect-ratio: 1/1) {
  .book-tile { position: relative; }
  .book-cover { height: 0; padding-bottom: 143%; position: relative; }
  .book-cover__title { position: absolute; top: 10px; left: 9px; right: 9px; }
  .book-cover__author { position: absolute; bottom: 11px; left: 9px; right: 9px; }
}
.book-cover__title { font-size: 13.5px; font-weight: 500; } .book-cover__author { font-family: var(--font-body); font-size: 8.5px; opacity: 0.8; letter-spacing: 0.03em; }
.book-tile__title { font-family: var(--font-display); font-size: 12.5px; font-weight: 500; margin-top: 9px; color: var(--ink-100); letter-spacing: -0.01em; line-height: 1.2; }
.book-tile__sub { font-size: 9.5px; color: var(--ink-60); margin-top: 2px; line-height: 1.35; }
.book-hero { display: flex; gap: 14px; margin-top: 14px; align-items: flex-start; }
.book-hero__cover { width: 88px; height: 132px; border-radius: 8px; flex-shrink: 0; }
.book-hero__title { font-family: var(--font-display); font-size: 20px; letter-spacing: -0.04em; color: var(--ink-100); line-height: 1.1; }
.book-hero__author { font-size: 12px; color: var(--ink-60); margin-top: 5px; }
.book-hero__badge { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-40); margin-top: 10px; }
.book-hero__desc { font-size: 11px; color: var(--ink-60); line-height: 1.55; margin-top: 4px; max-height: 170px; overflow-y: auto; padding-right: 6px; }
.book-hero__desc::-webkit-scrollbar { width: 4px; }
.book-hero__desc::-webkit-scrollbar-thumb { background: var(--ink-12); border-radius: 4px; }
.rule { margin-top: 16px; border-top: 1px solid var(--ink-07); }
.sect-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.sect-row__name { font-size: 13px; font-weight: 600; color: var(--ink-100); }
.sect-row__count { font-size: 11px; color: var(--ink-60); }
.page-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--ink-07); }
.page-row:last-child { border-bottom: none; }
.page-row__num { font-size: 13px; font-weight: 500; color: var(--ink-100); }
.page-row__right { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-60); }

.scanning { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.ring { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--ink-07); border-top-color: var(--ink-100); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes imvocaPulse { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
.chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 11px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--ink-12); color: var(--ink-100); background: var(--bg-card); }
.word-item { padding: 10px 0; border-bottom: 1px solid var(--ink-07); }
.word-item:last-child { border-bottom: none; }
.word-item__en { font-weight: 600; font-size: 16px; color: var(--ink-100); }
.word-item__base { font-size: 11px; color: var(--ink-60); margin-top: 2px; }
.word-item__ctx { font-size: 11px; color: var(--ink-100); margin-top: 2px; }
.word-item__ctx em { font-style: normal; background: var(--gold-bg); padding: 0 2px; }
.scope-card { border: 1.5px solid var(--ink-12); border-radius: 13px; padding: 15px; cursor: pointer; }
.scope-card--on { border-color: var(--ink-100); border-width: 2px; padding: 14px; }
.scope-card__head { display: flex; justify-content: space-between; align-items: center; }
.scope-card__name { font-size: 14px; font-weight: 600; color: var(--ink-100); }
.scope-card__hint { font-size: 11px; color: var(--ink-60); margin-top: 4px; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-40); display: flex; align-items: center; justify-content: center; font-size: 10px; }
.radio--on { background: var(--ink-100); border-color: var(--ink-100); color: var(--bg-page); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--ink-07); cursor: pointer; }
.list-row:last-child { border-bottom: none; }
.study { position: fixed; inset: 0; height: 100dvh; display: flex; flex-direction: column; padding: 18px 22px 16px; z-index: 25; background: var(--bg-page); overflow: hidden; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.study__top { display: flex; justify-content: space-between; align-items: center; }
.study__info { font-size: 11px; color: var(--ink-60); }
.study__close { font-size: 16px; cursor: pointer; padding: 4px; color: var(--ink-100); }
.study__bar { height: 3px; background: var(--ink-07); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.study__fill { height: 100%; background: var(--accent); } /* width transition은 매 카드 innerHTML 재렌더로 재생된 적 없는 죽은 코드라 제거 — 살리려면 scaleX+엘리먼트 유지로 별도 작업 */
.study__round { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-40); margin-top: 8px; }
.card-wrap { flex: 1 1 auto; min-height: 0; position: relative; perspective: 1400px; cursor: pointer; margin: 10px 0 8px; }
.ox-row { display: flex; gap: 10px; flex: 0 0 auto; margin-top: 4px; }
.ox-hint { text-align: center; flex: 0 0 auto; margin-top: 10px; background: var(--gold-bg); border: 1px solid var(--ink-12); border-radius: 12px; padding: 8px 10px; }
.ox-hint__nav { font-size: 12.5px; font-weight: 600; color: var(--ink-100); letter-spacing: 0.01em; }
.ox-hint__sub { font-size: 11px; color: var(--ink-60); margin-top: 4px; }

    }
  }
  // 빈 본문(204/return=minimal) 안전 처리: res.json() 은 빈 본문에서 예외를 던져
  // 배정 등 return=minimal POST/PATCH 가 실패한 것처럼 보이는 버그를 유발함 → 빈 본문은 null 반환.
  const text = await res.text();
  if (!text) return null;
  try { return JSON.parse(text); } catch(e){ return null; }
}

// 인증 GET + 401/403(토큰 만료)이면 세션 갱신 후 1회 재시도.
// 실패(네트워크/여전히 인증 오류)면 null 을 돌려 "빈 데이터"와 구분되게 함.
async function authGet(path) {
  const doFetch = () => fetch(SB_URL + path, { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken } });
  let res;
  try { res = await doFetch(); } catch(e) { return null; }
  if (res.status === 401 || res.status === 403) {
    if (await refreshSession()) { try { res = await doFetch(); } catch(e) { return null; } }
  }
  if (!res.ok) return null;
  try { return await res.json(); } catch(e) { return null; }
}

// ── 공용: 일시적 실패(네트워크·토큰 타이밍) 재시도 ──────────────────────────
// fn 이 배열을 돌려주면 성공으로 보고 즉시 반환, 아니면 점점 늘어나는 간격(400ms×n)으로 재시도.
// 책장·공식책·복습 목록 등이 "한 번 삐끗해서 빈 화면"이 되던 문제를 한 곳에서 방지한다.
async function fetchRetry(fn, tries = 4) {
  let out = null;
  for (let i = 0; i < tries; i++) {
    out = await fn();
    if (Array.isArray(out)) return out;
    if (i < tries - 1) await new Promise(r => setTimeout(r, 400 * (i + 1)));
  }
  return out;
}

// ── 공용: 복습(voca_review) 정리/이관 ──────────────────────────────────────
// 책/페이지를 삭제·병합·이름변경할 때 반드시 호출 — 안 하면 '유령 복습'
// ("추가하지 않은 페이지 · 0개 단어")이 남는다. newPageNum 을 주면 삭제 대신 이관(진도 보존).
async function cleanupReviews(bookId, pageNum, newPageNum) {
  try {
    let q = SB_URL + `/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=eq.${bookId}`;
    if (pageNum != null) q += `&page_num=eq.${encodeURIComponent(String(pageNum))}`;
    const opt = (newPageNum != null)
      ? { method:'PATCH', headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken }, body: JSON.stringify({ page_num: String(newPageNum) }) }
      : { method:'DELETE', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken } };
    await fetch(q, opt);
  } catch(e) { console.warn('복습 정리 실패:', e); }
}

// ⚠️ 동시 호출 방지(single-flight): 여러 요청이 401을 동시에 만나면 refreshSession 이
// 동시에 여러 번 호출되는데, Supabase 는 refresh_token 을 회전(rotate)시켜서 첫 갱신만
// 성공하고 나머지는 '이미 쓰인 토큰'으로 실패 → 그 요청들이 "불러오지 못했어요"로 뜸.
// 그래서 갱신이 진행 중이면 같은 Promise 를 공유해 딱 한 번만 갱신한다.
let _refreshPromise = null;
function refreshSession() {
  if (_refreshPromise) return _refreshPromise;   // 이미 갱신 중 → 그 결과를 함께 기다림
  _refreshPromise = (async () => {
    try {
      const session = JSON.parse(localStorage.getItem('imvoca.session') || '{}');
      const refreshToken = session.refresh_token;
      if (!refreshToken) return false;
      const res = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      const data = await res.json();
      if (data && data.access_token) {
        _authToken = data.access_token;
        localStorage.setItem('imvoca.session', JSON.stringify(data));
        return true;
      }
      return false;
    } catch(e) { return false; }
  })();
  // 완료되면(성공/실패 무관) 잠시 뒤 잠금 해제 → 이후 재시도는 새로 갱신 가능
  _refreshPromise.finally(() => { setTimeout(() => { _refreshPromise = null; }, 1500); });
  return _refreshPromise;
}

// 토큰 자동 갱신: 만료(약 1시간) 전에 미리 갱신 + 앱으로 돌아올 때 갱신
let _lastTokenRefresh = Date.now();
async function autoRefreshToken() {
  if (!_authToken) return;
  const ok = await refreshSession();
  if (ok) _lastTokenRefresh = Date.now();
}
setInterval(autoRefreshToken, 45 * 60 * 1000); // 45분마다
document.addEventListener('visibilitychange', async () => {
  // 다시 화면을 볼 때, 5분 이상 백그라운드였으면 토큰 갱신 + 화면 새로고침.
  // (오래 켜둔 뒤 돌아오면 토큰 만료로 복습/명예의전당이 빈 화면처럼 보이던 문제 방지)
  if (document.visibilityState === 'visible' && _authToken && (Date.now() - _lastTokenRefresh > 5 * 60 * 1000)) {
    await autoRefreshToken();
    if (typeof flushPending === 'function') flushPending(); // 밀린 학습/테스트 기록 재전송
    // 갱신 후, 학습/퀴즈 중이 아니면 현재 화면을 다시 그려 데이터를 새로 불러옴
    try {
      const _r = (typeof stack !== 'undefined' && stack.length) ? stack[stack.length-1] : null;
      const _busy = ['study-cards', 'quiz', 'study-done'];
      if (currentUser && _r && !_busy.includes(_r.name)) {
        window._hallData = null; window._hallMonthly = null; window._hallAggCache = null; // 명예의 전당 캐시 무효화 → 재요청
        if (typeof render === 'function') render();
      }
    } catch(e) {}
  } else if (document.visibilityState === 'visible' && _authToken && typeof flushPending === 'function') {
    flushPending(); // 짧게 나갔다 와도 밀린 기록이 있으면 전송
  }
});

// — 중국 브라우저면 중국어, 미국이면 영어, 한국이면 한국어. IP와 달리 VPN·여행 중에도 사용자 실제 언어를 따른다.
// 지원 목록에 없는 언어는 영어로. 배우는 언어 기본값은 항상 영어.
function _detectNativeLang(){
  try {
    const supported = LANG_OPTIONS.map(l=>l.code);
    const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||''];
    for (const c of prefs) {
      const base = String(c).toLowerCase().split('-')[0];
      if (supported.includes(base)) return base;
    }
  } catch(e){}
  return 'en';
}

  fetch('https://get.geojs.io/v1/ip/country.json').then(r=>r.json()).then(d=>{
    if (localStorage.getItem('imvoca.nativeLang')) return; // 그 사이 사용자가 저장했으면 존중

function TT(ko,en){ if(userNativeLang==='ko')return ko; const d=UI_XL[userNativeLang]; return (d&&d[en]!==undefined)?d[en]:en; }
// TX(ko, en, vars): 동적 값이 들어가는 이중언어 텍스트. 문장 속 {v0}·{v1}… 자리에 vars 값을 끼워 넣는다.

function TX(ko,en,vars){ let s; if(userNativeLang==='ko'){ s=ko; } else { const d=UI_XL[userNativeLang]; s=(d&&d[en]!==undefined)?d[en]:en; } return String(s).replace(/\{(\w+)\}/g,(m,k)=>(vars&&vars[k]!==undefined)?String(vars[k]):m); }

// ── 페이지 정렬 함수 ──
function pageSort(a, b) {
  const ROMAN = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx',
                 'xxi','xxii','xxiii','xxiv','xxv','intro','preface','prologue','foreword','appendix'];
  const aStr = String(a.num).toLowerCase().trim();
  const bStr = String(b.num).toLowerCase().trim();
  const aRoman = ROMAN.indexOf(aStr);
  const bRoman = ROMAN.indexOf(bStr);
  const aNum = parseInt(a.num);
  const bNum = parseInt(b.num);
  const aIsNum = !isNaN(aNum) && String(aNum) === String(a.num).trim();
  const bIsNum = !isNaN(bNum) && String(bNum) === String(b.num).trim();

  // 로마숫자/특수단어 → 맨 앞
  if (aRoman >= 0 && bRoman >= 0) return aRoman - bRoman;
  if (aRoman >= 0) return -1;
  if (bRoman >= 0) return 1;
  // 둘 다 숫자 → 숫자 순
  if (aIsNum && bIsNum) return aNum - bNum;
  // 숫자 → 문자 앞
  if (aIsNum) return -1;
  if (bIsNum) return 1;
  // 나머지("Day 1"·"Day 10" 등 숫자 포함 라벨)는 숫자 자연 정렬 (1,2,…,10,11 순)
  return aStr.localeCompare(bStr, undefined, { numeric: true, sensitivity: 'base' });
}


// ── 플랜/스캔 카운트 로드 ──
async function loadUserPlan() {
  try {
    // authGet: 토큰 만료 시 자동 갱신+재시도. (오래 유휴 후 새로고침하면 org 정보가
    // 안 실려 어드민 통계가 0으로 뜨던 문제 방지 — 이 값이 org 상태의 기준점)
    // 일시적 실패면 짧게 재시도(모바일 실행 직후 등) — 공용 fetchRetry
    const data = await fetchRetry(() => authGet(`/rest/v1/members?id=eq.${currentUser.id}&select=plan,scan_count,stripe_customer_id,visit_count,org_id,org_role,org_status,premium_until,created_at,signup_tz`), 2);
    if (!Array.isArray(data)) return; // 그래도 실패 → 기존 값 유지(0으로 덮어쓰지 않음)
    if (data[0]) {
      userPlan = data[0].plan || 'free';
      userScanCount = data[0].scan_count || 0;
      userDailyScanCount = data[0].daily_scan_count || 0;
      userDailyScanDate = data[0].daily_scan_date || null;
      userStripeId = data[0].stripe_customer_id || '';
      userPremiumUntil = data[0].premium_until || null;
      userCreatedAt = data[0].created_at || null;
      userOrgId = data[0].org_id || null;
      userOrgRole = data[0].org_role || null;
      userOrgStatus = data[0].org_status || null;
      // 첫 암기 점수 판정용: '이미 학습한 페이지'를 학습 시작 전에 미리 시드
      _seedScoredPages().catch(()=>{});
      if (userOrgRole === 'owner' || userOrgId) { await loadMyOrg(); }
      // 최종 접속 시각(last_seen_at)은 매번 갱신, 누적 접속수(visit_count)는 하루 1회만 증가
      const today = new Date().toISOString().slice(0,10);
      const isNewDay = localStorage.getItem('imvoca.lastVisitDay') !== today;
      // 화면 언어도 같이 올린다. 그동안 언어는 localStorage 에만 있어서 서버가 몰랐고,
      // 그래서 메일을 어느 언어로 보낼지 알 수 없었다.
      const visitPatch = { last_seen_at: new Date().toISOString(), native_lang: (userNativeLang || 'ko') };
      if (isNewDay) visitPatch.visit_count = (data[0].visit_count||0) + 1;
      // 어느 나라에서 쓰는지 — IP 는 건드리지 않고 기기가 알려주는 표준시간대·언어만 남긴다.
      // 가입 당시 위치(signup_tz)는 비어 있을 때 한 번만 채운다.
      const _geo = {};
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (tz) { _geo.tz = tz; if (!data[0].signup_tz) _geo.signup_tz = tz; }
      } catch(e){}
      try { if (navigator.language) _geo.locale = navigator.language; } catch(e){}
      sbFetch(`/rest/v1/members?id=eq.${currentUser.id}`, 'PATCH', { ...visitPatch, ..._geo },
        true, { 'Prefer': 'return=representation' })
        .then(r => { if (isNewDay && Array.isArray(r) && r.length) localStorage.setItem('imvoca.lastVisitDay', today); })
        // 지역 컬럼이 아직 없는 DB(마이그레이션 전)면 400 이 난다 → 원래 항목만 다시 보낸다.
        // 접속 기록이 지역 때문에 통째로 날아가지 않게.
        .catch(() => sbFetch(`/rest/v1/members?id=eq.${currentUser.id}`, 'PATCH', visitPatch,
            true, { 'Prefer': 'return=representation' })
          .then(r => { if (isNewDay && Array.isArray(r) && r.length) localStorage.setItem('imvoca.lastVisitDay', today); })
          .catch(()=>{}));
    }
  } catch(e) {}
}

// 책별 복습 상태 캐시 { "bookId|pageNum": "done"|"doing" }
let _reviewStatus = {};
let _reviewStatusLoaded = {}; // 책별로 이미 불러왔는지
async function loadReviewStatus(bookId) {
  // 로그아웃·세션만료 직후에도 화면이 남아 있어 책을 누를 수 있다.
  // 그때 currentUser 가 null 이라 아래 URL 을 만들다 터졌다
  // (에러 리포트: TypeError: null is not an object (evaluating 'currentUser.id'))
  if (!currentUser) return;
  if (_reviewStatusLoaded[bookId]) return; // 이미 불러왔으면 다시 안 함
  // 먼저 로컬 백업을 덮어 그림(서버 실패해도 학습한 점이 안 사라지게)
  _overlayLocalStudied();
  const data = await authGet(`/rest/v1/voca_review?user_id=eq.${currentUser.id}&book_id=eq.${bookId}&select=page_num,completed`);
  if (!Array.isArray(data)) { console.error('[복습 상태 로드 실패]'); return; } // 실패 → loaded 플래그 안 세우고 다음에 재시도
  _reviewStatusLoaded[bookId] = true;
  let changed = false;
  data.forEach(r => {
    const key = bookId + '|' + r.page_num;
    const val = r.completed ? 'done' : 'doing';
    if (_reviewStatus[key] !== val) { _reviewStatus[key] = val; changed = true; }
  });
  // 실제로 새 상태가 생겼고, 지금 그 책 화면이면 한 번만 다시 그림
  if (changed && stack[stack.length-1]?.name === 'book' && stack[stack.length-1]?.bookId === bookId) render();
}

// 페이지 안 단어 삭제
async function deletePageWord(bookId, pageNum, wordIdx) {
  if (isAssignedReadonly(bookId)) { toast(TT('과제 책은 편집할 수 없어요','Assigned books are read-only')); return; }
  const book = findBook(bookId);
  const page = book ? findPage(book, pageNum) : null;
  if (!page) return;
  const word = page.words[wordIdx];
  if (!word) return;
  const ko = userNativeLang === 'ko';
  if (!confirm(TX(`"{v0}" 단어를 삭제할까요?`,`Delete "{v0}"?`,{v0:(word.en)}))) return;
  try {
    if (word.id) {
      await fetch(SB_URL + `/rest/v1/voca_words?id=eq.${word.id}`, {
        method: 'DELETE',
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + _authToken }
      });
    }
page.words.splice(wordIdx, 1);
    updateTotalWords(true);   // 삭제: 마지막 단어면 0 기록 허용
    renderKeepScroll();
    toast(TT('삭제됐어요','Deleted'));
  } catch(e) { toast(TT('삭제 실패','Delete failed')); }
}

function updateNoticeBadge() {
  const cnt = unreadNoticeCount();
  // ⚠️ 배지 자리가 두 군데다 — 모바일 상단바(notice-badge)와 PC 사이드바(notice-badge-pc).
  //    예전엔 모바일 것만 갱신하고 PC 것은 만들어만 두고 아무도 채우지 않았다.
  //    그래서 맥에서는 안 읽은 공지가 있어도 화면에 표시가 없는데 독 아이콘 숫자에는
  //    포함돼(복습 2 + 공지 1 = 3), 숫자가 틀린 것처럼 보였다.
  ['notice-badge', 'notice-badge-pc'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (cnt > 0) { el.textContent = cnt > 9 ? '9+' : cnt; el.style.display = 'flex'; }
    else { el.style.display = 'none'; }
  });
}

}

async function loadNoticeReactions(noticeIds) {

      (_noticeReactions[nid] = _noticeReactions[nid] || {});

      slot.count++;
      if (r.user_id === currentUser?.id) slot.mine = true;
    });
  } catch(e) {}
}

  const nid = String(notice.id);

    }).join('')}

async function toggleReaction(noticeId, emoji) {
  if (!currentUser) { toast(TT('로그인이 필요해요','Please log in')); return; }
  const nid = String(noticeId);
  (_noticeReactions[nid] = _noticeReactions[nid] || {});
  const r = (_noticeReactions[nid][emoji] = _noticeReactions[nid][emoji] || { count:0, mine:false });
  const wasMine = r.mine;
  r.mine = !wasMine; r.count = Math.max(0, r.count + (wasMine ? -1 : 1));
  updateReactionBarUI(nid);
  const baseHdr = () => ({ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+_authToken });
  const doFetch = async (path, opts) => {
    let res = await fetch(SB_URL + path, opts);
    if ((res.status===401||res.status===403) && await refreshSession()) { opts.headers.Authorization = 'Bearer '+_authToken; res = await fetch(SB_URL + path, opts); }
    return res;
  };
  try {
    let res;
    if (wasMine) {
      res = await doFetch(`/rest/v1/voca_notice_reactions?notice_id=eq.${encodeURIComponent(nid)}&user_id=eq.${currentUser.id}&emoji=eq.${encodeURIComponent(emoji)}`, { method:'DELETE', headers: baseHdr() });
    } else {
      res = await doFetch('/rest/v1/voca_notice_reactions', { method:'POST', headers: { ...baseHdr(), 'Prefer':'return=minimal' }, body: JSON.stringify({ notice_id: nid, user_id: currentUser.id, emoji }) });
    }
    if (!res.ok) throw new Error('reaction write failed');
  } catch(e) {
    r.mine = wasMine; r.count = Math.max(0, r.count + (wasMine ? 1 : -1)); updateReactionBarUI(nid);
    toast(TT('잠시 후 다시 시도해주세요','Please try again'));
  }
}

// PATCH/DELETE 헬퍼 (authGet/authPost 와 동일하게 401→refresh→재시도)
async function _authPatch(path, body){
  const doIt=()=>fetch(SB_URL+path,{method:'PATCH',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+_authToken,'Prefer':'return=minimal'},body:JSON.stringify(body)});
  let res; try{res=await doIt();}catch(e){return null;}
  if(res.status===401||res.status===403){ if(await refreshSession()){ try{res=await doIt();}catch(e){return null;} } }
  return res;
}
async function _authDelete(path){
  const doIt=()=>fetch(SB_URL+path,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+_authToken}});
  let res; try{res=await doIt();}catch(e){return null;}
  if(res.status===401||res.status===403){ if(await refreshSession()){ try{res=await doIt();}catch(e){return null;} } }
  return res;
}

// 내 후기 최상단 고정 → 최신순. (본인 글을 바로 확인·삭제할 수 있게 맨 위에 픽스)
function _sortReviews(){
  const myId = currentUser && currentUser.id;
  _reviews.sort((a,b)=>{
    const am=(myId&&a.user_id===myId)?0:1, bm=(myId&&b.user_id===myId)?0:1;

  });
}

// ── 후기 자동 번역 ─────────────────────────────────────────────
// 한국어로 적힌 후기를 보는 사람의 모국어로 번역해 보여준다 (Gemini 프록시 사용).
// 기기별 localStorage 캐시로 같은 후기는 언어당 한 번만 번역하고, 실패하면 원문 그대로 둔다.
function _rvXlKey(){ return 'imvoca_rvxl_' + userNativeLang; }
function _rvXlCache(){ try{ const v=JSON.parse(localStorage.getItem(_rvXlKey())||'{}'); return v&&typeof v==='object'?v:{}; }catch(e){ return {}; } }
let _rvXlBusy = false;
async function _translateReviews(){
  if (userNativeLang==='ko' || _rvXlBusy) return;
  const cache = _rvXlCache();
  const targets = _reviews.filter(r=>r.body && /[가-힣]/.test(r.body)).slice(0,30);
  if (!targets.length) return;
  targets.forEach(r=>{ if(cache[r.id]) _rvApplyXl(r.id, cache[r.id]); });
  const need = targets.filter(r=>!cache[r.id]);
  if (!need.length) return;
  _rvXlBusy = true;
  try {
    const prompt = 'Translate the following app user reviews from Korean into ' + promptLangName(userNativeLang) + '.\n'
      + 'Keep the casual tone, emojis and line breaks. Do not add or omit anything.\n'
      + 'Return ONLY a JSON object mapping each id to its translation. No code fences, no commentary.\n\n'
      + JSON.stringify(need.map(r=>({ id:String(r.id), text:r.body })));
    const model = GEMINI_MODELS[_geminiModelIdx] || GEMINI_MODELS[0];
    const res = await fetch(SB_URL + '/functions/v1/gemini-proxy', { method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+(_authToken||SB_KEY)}, body:JSON.stringify({ model, tz:_myTz(), body:{ contents:[{ parts:[{ text: prompt }] }], generationConfig:{ temperature:0.2 } } }) });
    const data = await res.json();
    let txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    txt = txt.trim().replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'');
    const map = JSON.parse(txt);
    let dirty = false;
    need.forEach(r=>{ const v = map[String(r.id)]; if (typeof v==='string' && v.trim()){ cache[r.id]=v.trim(); dirty=true; _rvApplyXl(r.id, cache[r.id]); } });
    if (dirty) { try { const keep={}; _reviews.forEach(r=>{ if(cache[r.id]) keep[r.id]=cache[r.id]; }); localStorage.setItem(_rvXlKey(), JSON.stringify(keep)); } catch(e){} }
  } catch(e) { /* 번역 실패 → 원문 유지 (다음 방문 때 재시도) */ }
  finally { _rvXlBusy = false; }
}
function _rvApplyXl(id, xl){
  const el = document.getElementById('rv-body-'+id); if(!el) return;
  el.textContent = xl;
  const note = document.getElementById('rv-xl-'+id);
  if (note) { note.style.display='block'; note.dataset.showing='xl'; }
}
function _rvToggleOrig(id){
  const r = _reviews.find(x=>String(x.id)===String(id)); if(!r) return;
  const el = document.getElementById('rv-body-'+id), note = document.getElementById('rv-xl-'+id);
  if (!el || !note) return;
  const link = note.querySelector('a');
  if (note.dataset.showing==='xl') {
    el.textContent = r.body; note.dataset.showing='orig';
    if (link) link.textContent = TT('번역 보기','Show translation');
  } else {
    const c = _rvXlCache(); if (c[r.id]) el.textContent = c[r.id];
    note.dataset.showing='xl';
    if (link) link.textContent = TT('원문 보기','Show original');
  }
}

async function submitReview(){
  const ko = userNativeLang==='ko';
  if(!currentUser){ toast(TT('로그인이 필요해요','Please log in')); return; }
  const bodyEl=document.getElementById('rv-body'), linkEl=document.getElementById('rv-link');
  const body=(bodyEl?.value||'').trim();
  const link=(linkEl?.value||'').trim();
  if(!body && !link){ toast(TT('후기 또는 영상 링크 중 하나는 넣어주세요 🙂','Add a review or a video link')); bodyEl?.focus(); return; }
  if(link && !/^https?:\/\//i.test(link)){ toast(TT('영상 링크는 http로 시작하는 주소여야 해요','Link must start with http')); linkEl?.focus(); return; }

function _rvReported(){ try{ const v=JSON.parse(localStorage.getItem(_rvReportKey())||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
async function reportReview(id){

  if (!confirm(TT('이 후기를 부적절한 내용으로 신고할까요?\n신고하면 내 화면에서 숨겨지고 관리자가 검토해요.','Report this review as inappropriate?\nIt will be hidden for you and reviewed by an admin.'))) return;

}

async function deleteReview(id){

// 📝 시험(Test) — 온라인 자동채점 + PDF 시험지 출제 (동일 문제 스냅샷 공용)
//   관리자(원장)가 배정 단어장에서 출제 → 학생 앱 응시(자동채점) 또는 종이 인쇄.
// ════════════════════════════════════════════════════════════════
let _tests = [];
function _isTestAdmin(){ return userOrgRole==='owner' && userOrgStatus==='approved'; }
function _wordMeaning(w){ const a=(w&&w.analysis)||{}; if(a.meanings&&a.meanings.length) return a.meanings.map(m=>m.ko).filter(Boolean).join(', '); return (w&&(w.base||w.ctx))||''; }
function _normAns(s){ return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim(); }
function _buildQuestions(words, type, count){
  const pool = (words||[]).map(w=>({en:w.en, meaning:_wordMeaning(w)})).filter(p=>p.en&&p.meaning);
  const picked = shuffle(pool).slice(0, Math.min(count, pool.length));
  const allM = [...new Set(pool.map(p=>p.meaning))];
  return picked.map((p,i)=>{
    const qt = type==='mix' ? (i%2?'spell':'mc') : type;
    if(qt==='mc'){
      const distract = shuffle(allM.filter(m=>m!==p.meaning)).slice(0,3);
      const choices = shuffle([p.meaning, ...distract]);
      return { n:i+1, type:'mc', en:p.en, meaning:p.meaning, prompt:p.en, answer:p.meaning, choices };
    }
    return { n:i+1, type:'spell', en:p.en, meaning:p.meaning, prompt:p.meaning, answer:p.en };
  });
}
function gradeTest(questions, answers){
  let score=0; const per=[];
  (questions||[]).forEach((q,i)=>{ const a=answers[i]; const ok = q.type==='mc' ? (a===q.answer) : (!!a && _normAns(a)===_normAns(q.answer)); if(ok)score++; per.push({n:q.n,en:q.en,prompt:q.prompt,given:a==null?'':a,answer:q.answer,ok}); });
  return { score, total:(questions||[]).length, per };
}
// 관리자용 배정·출제 후보: 내 책장 + (책장에서 뺐더라도) 공식 카탈로그 전체
function adminBookPool(){
  const cat = (typeof window!=='undefined' && Array.isArray(window._officialCatalogFull)) ? window._officialCatalogFull : [];
  const have = new Set((books||[]).map(b=>b.id));
  return [...(books||[]), ...cat.filter(b=>!have.has(b.id)).map(b=>_mapOfficialBook(b))];
}
function _testBooks(){ return adminBookPool().filter(b=>b.pages && b.pages.some(p=>p.words&&p.words.length)); }
function _pageLabel(b,p){ return (b._official||b._officialContent) ? String(p.num) : ('Page '+p.num); }

// 기간 내 특정 학생이 공부한 단어 수집 → 문제 생성 (온라인·PDF 공용)
function _wordsForActivity(acts){
  const seen=new Set(), ws=[];
  (acts||[]).forEach(a=>{
    const b=findBook(a.book_id); if(!b||!b.pages) return;
    const np=_norm(a.page_num); const p=b.pages.find(pp=>_norm(pp.num)===np); if(!p||!p.words) return;
    p.words.forEach(w=>{ const k=String(w.en||'').toLowerCase(); if(w.en && _wordMeaning(w) && !seen.has(k)){ seen.add(k); ws.push(w); } });
  });
  return ws;
}
function _norm(s){ return String(s==null?'':s).replace(/[^0-9]/g,''); }
// 고정형 시험의 출제 범위(책+Day) 단어 풀
function _wordsForFixed(t){
  const b=findBook(t.book_id); if(!b||!b.pages) return [];
  const set=new Set((t.pages||[]).map(p=>_norm(p)));
  let ws=[]; b.pages.forEach(p=>{ if(set.has(_norm(p.num))) ws=ws.concat(p.words||[]); });
  return ws.filter(w=>_wordMeaning(w));
}

// ── PDF 시험지 (새 창 → 인쇄/PDF 저장) ──
const _PAPER_CSS = `
    *{box-sizing:border-box;} body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#111;margin:0;padding:22px;}
    .paper{max-width:760px;margin:0 auto 28px;}
    .stu{page-break-before:always;} .stu:first-child{page-break-before:auto;}

    .hd .meta{font-size:13px;margin-top:9px;display:flex;gap:18px;flex-wrap:wrap;}
    .q{margin:0 0 13px;font-size:14.5px;line-height:1.5;page-break-inside:avoid;} .qt b{margin-right:4px;}
    .ch{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:5px;color:#222;font-size:13.5px;} .ch span{white-space:nowrap;}
    .bl{margin-top:7px;color:#999;letter-spacing:1px;}
    .answers{page-break-before:always;} .answers .t{font-size:18px;font-weight:800;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px;}
    .keys{display:flex;flex-wrap:wrap;gap:7px 16px;} .k{font-size:13px;white-space:nowrap;}
    .noprint{text-align:center;margin:16px;} .noprint button{background:#1c3553;color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;}
    @media print{ .noprint{display:none;} body{padding:0;} }
`;
const _CIRC=['①','②','③','④'];
function _paperEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 문제 배열 → 문제 HTML + 정답 HTML (1..N 재번호)
function _paperQ(qs){
  const qhtml=qs.map((q,i)=> q.type==='mc'
    ? `<div class="q"><div class="qt"><b>${i+1}.</b> ${_paperEsc(q.prompt)}</div><div class="ch">${(q.choices||[]).map((c,j)=>`<span>${_CIRC[j]||'·'} ${_paperEsc(c)}</span>`).join('')}</div></div>`
    : `<div class="q"><div class="qt"><b>${i+1}.</b> ${_paperEsc(q.prompt)}</div><div class="bl">________________________</div></div>`).join('');
  // 정답지: 객관식은 정답 '번호(①②③④)'만, 주관식은 '답(단어)'을 표기
  const keys=qs.map((q,i)=>{
    let a;
    if(q.type==='mc'){ const idx=(q.choices||[]).indexOf(q.answer); a = idx>=0 ? _CIRC[idx] : _paperEsc(q.answer); }
    else a = _paperEsc(q.answer);
    return `<span class="k"><b>${i+1}.</b> ${a}</span>`;
  }).join('');
  return { qhtml, keys };
}
function openTestPaper(id, variant){
  const t=_tests.find(x=>String(x.id)===String(id)); if(!t){ toast('시험을 찾을 수 없어요'); return; }
  if(t.mode==='range'){ openRangePapers(id); return; }   // 기간형은 학생별 시험지
  let qs=(t.questions||[]);
  if(variant) qs = shuffle(qs.map(q=>({...q, choices:q.choices?shuffle(q.choices):q.choices})));
  const esc2=_paperEsc;
  const vLabel = variant?` · ${variant}형`:'';
  const {qhtml,keys}=_paperQ(qs);
  // 앱 안에서는 window.open 이 시스템 사파리로 넘어가고 document.write 가 닿지 않는다
  // (빈 창만 뜬다). 시험지 인쇄는 PC 작업이므로 그쪽으로 안내한다.
  if (_isIosApp()) { toast(TT('시험지 인쇄·PDF 저장은 PC에서 이용해주세요','Printing is available on desktop')); return; }
  const w=window.open('','_blank'); if(!w){ toast('팝업이 차단됐어요 — 허용 후 다시'); return; }

     <div class="hd"><div class="t">${esc2(t.title||'단어 시험')}${vLabel}</div><div class="src">${esc2(t.book_title||'')} · ${(t.pages||[]).join(', ')} · ${qs.length}문항</div>
       <div class="meta"><span>이름 ______________</span><span>날짜 __________</span><span>점수 ______ / ${qs.length}</span></div></div>
     ${qhtml}

   <div class="paper answers"><div class="t">✔ 정답지</div><div class="keys">${keys}</div></div>

  </body></html>`);
  w.document.close();

// 기간 맞춤 시험 — 학생별 개별 시험지(문제+정답)를 한 문서로 (인쇄해서 각자 배부)
async function openRangePapers(id){
  const t=_tests.find(x=>String(x.id)===String(id)); if(!t){ toast('시험을 찾을 수 없어요'); return; }

  if(t.student_ids && t.student_ids.length){ const set=new Set(t.student_ids); studs=studs.filter(s=>set.has(s.id)); }
  if(!studs.length){ toast('대상 학생이 없어요 (학생·관리자 탭에서 승인 필요)'); return; }
  const acts = await authGet(`/rest/v1/voca_activity?org_id=eq.${userOrg.id}&day=gte.${t.from_date}&day=lte.${t.to_date}&select=user_id,kind,book_id,page_num`) || [];
  const byUser={}; (acts||[]).forEach(a=>{ (byUser[a.user_id]=byUser[a.user_id]||[]).push(a); });
  let sections='', made=0;

    const qs=_buildQuestions(words, t.qtype, t.num||20);
    const {qhtml,keys}=_paperQ(qs); made++;
    sections+=`<div class="stu"><div class="paper"><div class="hd"><div class="t">${_paperEsc(t.title)} · ${_paperEsc(s.name||'학생')}</div><div class="src">${t.from_date}~${t.to_date} · ${qs.length}문항</div><div class="meta"><span>이름 ${_paperEsc(s.name||'')}</span><span>점수 ______ / ${qs.length}</span></div></div>${qhtml}</div><div class="paper answers"><div class="t">✔ 정답 · ${_paperEsc(s.name||'')}</div><div class="keys">${keys}</div></div></div>`;
  });
  if(!made){ toast('이 기간에 공부한 학생이 없어요 🙏'); return; }
  // 앱 안에서는 window.open 이 시스템 사파리로 넘어가고 document.write 가 닿지 않는다
  // (빈 창만 뜬다). 시험지 인쇄는 PC 작업이므로 그쪽으로 안내한다.
  if (_isIosApp()) { toast(TT('시험지 인쇄·PDF 저장은 PC에서 이용해주세요','Printing is available on desktop')); return; }
  const w=window.open('','_blank'); if(!w){ toast('팝업이 차단됐어요 — 허용 후 다시'); return; }
  w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${_paperEsc(t.title||'시험')}</title><style>${_PAPER_CSS}</style></head><body>${sections}<div class="noprint"><button onclick="window.print()">🖨️ 인쇄 / PDF로 저장 (${made}명)</button></div></body></html>`);
  w.document.close();
}

  window._testResultTest=t; window._testResultRows=rows;   // 시험 결과 학부모 카드용

  el.setAttribute('style','position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;');
  const avg = rows.length ? Math.round(rows.reduce((s,r)=>s+(r.total?r.score/r.total*100:0),0)/rows.length) : 0;
  const list = rows.length ? rows.map((r,i)=>{
    const pct = r.total?Math.round(r.score/r.total*100):0; const c=pct>=80?'#1c7c3c':pct>=50?'#b35900':'#c0392b';
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ink-07);">
      <span style="width:22px;color:var(--ink-40);font-size:12px;">${i+1}</span>

      <span style="font-weight:800;color:${c};font-size:14px;min-width:44px;text-align:right;">${pct}%</span>

  }).join('') : `<div style="text-align:center;color:var(--ink-40);font-size:13px;padding:22px 0;">아직 응시한 학생이 없어요.</div>`;
  el.innerHTML=`<div style="background:var(--bg-card);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:85vh;overflow:auto;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><div style="font-size:18px;font-weight:800;color:var(--ink-100);">📊 ${esc(t?t.title:'결과')}</div><button onclick="document.getElementById('tresult-overlay').remove()" style="margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-40);">×</button></div>
    <div style="font-size:12px;color:var(--ink-60);margin-bottom:14px;">응시 ${rows.length}명 · 평균 ${avg}%</div>
    ${list}</div>`;
  el.addEventListener('click',e=>{ if(e.target===el) el.remove(); });
}

// 시험 결과를 학부모에게 보내는 '별도' 리포트 카드 (평상시 단어암기 리포트와 분리)
function shareTestResultCard(userId){
  const t=window._testResultTest, rows=window._testResultRows||[];
  const r=rows.find(x=>x.user_id===userId); if(!r){ toast('결과를 찾을 수 없어요'); return; }
  const orgName=(userOrg&&userOrg.name)?userOrg.name:'IM VOCA';
  const pct=r.total?Math.round(r.score/r.total*100):0;
  const avg=rows.length?Math.round(rows.reduce((s,x)=>s+(x.total?x.score/x.total*100:0),0)/rows.length):0;
  const sorted=[...rows].sort((a,b)=>(b.total?b.score/b.total:0)-(a.total?a.score/a.total:0));
  const rank=sorted.findIndex(x=>x.user_id===userId)+1;
  let dateStr=''; try{ dateStr=new Date(r.submitted_at||r.created_at).toLocaleDateString('ko-KR',{month:'long',day:'numeric'}); }catch(e){}
  const wrong=(r.answers||[]).filter(p=>!p.ok).map(p=>p.en||p.prompt||p.answer).filter(Boolean);
  const lines=[];
  lines.push(`📝 ${t&&t.title?t.title:'단어 시험'} · 결과`);
  lines.push(`${r.user_name||'학생'} · ${dateStr}`);
  lines.push('');
  lines.push(`✅ 점수: ${pct}점 (${r.score}/${r.total})`);
  lines.push(`👥 반 평균 ${avg}점 · 응시 ${rows.length}명 중 ${rank}등`);
  if(wrong.length){ lines.push(''); lines.push(`✍️ 다시 볼 단어: ${wrong.slice(0,12).join(', ')}${wrong.length>12?` 외 ${wrong.length-12}개`:''}`); }
  lines.push('');
  lines.push(pct>=80?'아주 잘했어요! 이대로 꾸준히 응원해주세요 💪':pct>=50?'좋아요! 틀린 단어만 다시 외우면 완벽해요 👍':'괜찮아요, 틀린 단어 복습하면 금방 올라와요 🙏');
  _showParentShareModal(`${orgName} 시험 결과`, lines.join('\n'), '시험 결과 보내기');
}

// ── 학생: 배정된 시험 ──
async function loadMyTests(){
  if(!(userOrgId && currentUser)) return [];
  const tests=await authGet(`/rest/v1/voca_tests?org_id=eq.${userOrgId}&active=eq.true&order=created_at.desc&limit=50`) || [];
  const mine=await authGet(`/rest/v1/voca_test_results?user_id=eq.${currentUser.id}&select=test_id`) || [];
  const done=new Set((mine||[]).map(r=>r.test_id));
  return (tests||[]).filter(t=> !done.has(t.id) && (!t.student_ids || (Array.isArray(t.student_ids)&&t.student_ids.includes(currentUser.id))) );
}
// 학생 홈 배너 — 배정된 시험이 있으면 표시 (세션 캐시, 응시 후 갱신)
async function _refreshMyTestsBanner(){
  const el=document.getElementById('my-tests-banner'); if(!el) return;
  if(!(userOrgId && userOrgRole==='student')){ el.innerHTML=''; return; }

    <div style="font-size:24px;">📝</div>
    <div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:800;">${TX(`배정된 시험 {v0}개`,`{v0} test(s) assigned`,{v0:(list.length)})}</div><div style="font-size:11.5px;opacity:.9;margin-top:1px;">${TT('지금 응시하고 성적을 확인하세요','Take now')}</div></div>
    <div style="font-size:18px;opacity:.85;">›</div></div>`;
}

      <button onclick='startTakeTest(${JSON.stringify(String(t.id))})' style="width:100%;margin-top:11px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;">응시하기 →</button>
    </div>`).join('') : `<div style="text-align:center;color:var(--ink-40);font-size:13px;padding:26px 0;">배정된 시험이 없어요 👍</div>`;

// ── 학생: 응시 ──
let _take = null;
// 진행 중 시험을 기기에 저장 → 재접속/새로고침해도 이어서 응시 (문항·보기 셔플까지 통째로 보관)
function _takeKey(){ return 'imvoca.take.' + (currentUser?.id || 'anon'); }
function saveTakeState(){
  try {
    if (!_take || !_take.qs) return;
    localStorage.setItem(_takeKey(), JSON.stringify({ test:_take.test, qs:_take.qs, answers:_take.answers||{}, idx:_take.idx||0, savedAt:Date.now() }));
  } catch(e){}
}
function clearTakeState(){ try { localStorage.removeItem(_takeKey()); } catch(e){} }
function hasSavedTake(){
  try {
    const s = localStorage.getItem(_takeKey()); if (!s) return false;
    const d = JSON.parse(s);
    if (!d || !Array.isArray(d.qs) || !d.qs.length) { clearTakeState(); return false; }
    if (d.savedAt && Date.now() - d.savedAt > 24*3600*1000) { clearTakeState(); return false; } // 24시간 후 폐기
    return true;
  } catch(e){ return false; }
}
function resumeTakeTest(){
  try {
    const s = localStorage.getItem(_takeKey()); if (!s) return;
    const d = JSON.parse(s); if (!d || !Array.isArray(d.qs)) return;
    _take = { test:d.test, qs:d.qs, answers:d.answers||{}, idx:d.idx||0 };
    document.getElementById('mytest-overlay')?.remove();
    let el = document.getElementById('take-overlay'); if (!el){ el=document.createElement('div'); el.id='take-overlay'; document.body.appendChild(el); }
    el.setAttribute('style','position:fixed;inset:0;z-index:10001;background:var(--bg-page);overflow-y:auto;padding:0 0 90px;');
    _renderTake();
    toast(TT('이어서 시험을 볼 수 있어요 ✍️','Resumed your test ✍️'));
  } catch(e){}
}
async function startTakeTest(id){
  const list=await loadMyTests(); const t=list.find(x=>String(x.id)===String(id)) || _tests.find(x=>String(x.id)===String(id));
  if(!t){ toast('시험을 찾을 수 없어요'); return; }
  // 기간 맞춤: 내가 그 기간에 공부한 단어로 문제를 즉석 생성
  let base = t.questions||[];
  if(t.mode==='range'){
    toast('내 학습 기록으로 문제 생성 중…');
    const acts = await authGet(`/rest/v1/voca_activity?user_id=eq.${currentUser.id}&day=gte.${t.from_date}&day=lte.${t.to_date}&select=kind,book_id,page_num`) || [];
    const words=_wordsForActivity(acts);
    if(!words.length){ toast('이 기간에 공부한 단어가 없어 시험을 볼 수 없어요 🙏'); return; }
    base=_buildQuestions(words, t.qtype, t.num||20);
    if(!base.length){ toast('문제를 만들 수 없어요'); return; }
  }
  // 학생별 셔플(문제·보기 순서) — 부정행위 방지. 채점은 셔플된 문제 객체 기준이라 정확.
  const qs = shuffle(base.map(q=>({...q, choices:q.choices?shuffle(q.choices):q.choices})));
  _take={ test:t, qs, answers:{}, idx:0 };
  saveTakeState();
  document.getElementById('mytest-overlay')?.remove();
  let el=document.getElementById('take-overlay'); if(!el){ el=document.createElement('div'); el.id='take-overlay'; document.body.appendChild(el); }
  el.setAttribute('style','position:fixed;inset:0;z-index:10001;background:var(--bg-page);overflow-y:auto;padding:0 0 90px;');
  _renderTake();
}
function _renderTake(){
  const el=document.getElementById('take-overlay'); if(!el||!_take) return;
  const t=_take.test, qs=_take.qs||[];
  el.innerHTML=`<div style="max-width:560px;margin:0 auto;">
    <div style="background:var(--bg-card);border-bottom:1px solid var(--ink-07);padding:16px 18px;position:sticky;top:0;z-index:5;">
      <div style="display:flex;align-items:center;gap:8px;"><div style="font-size:16px;font-weight:800;color:var(--ink-100);">${esc(t.title||'단어 시험')}</div>
      <button onclick="if(confirm(TT('시험을 그만두시겠어요? 진행 중인 답안이 삭제돼요.','Quit the test? Your answers so far will be discarded.'))){clearTakeState();document.getElementById('take-overlay').remove();_take=null;}" style="margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-40);">✕</button></div>
      <div style="font-size:12px;color:var(--ink-60);margin-top:3px;">${qs.length}문항 · ${t.qtype==='spell'?'뜻을 보고 영어 단어를 쓰세요':t.qtype==='mix'?'객관식+주관식':'알맞은 뜻을 고르세요'}</div>
    </div>
    <div style="padding:14px 16px;">
      ${qs.map((q,i)=>_takeQ(q,i)).join('')}
      <button onclick="submitTest()" style="width:100%;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;">제출하고 채점하기</button>
    </div></div>`;
}
function _takeQ(q,i){
  const cur=_take.answers[i];
  const head=`<div style="font-size:12px;color:var(--ink-45);font-weight:700;">${i+1}${q.type==='spell'?' · 스펠링':''}</div><div style="font-size:17px;font-weight:800;color:var(--ink-100);margin:3px 0 10px;">${esc(q.prompt)}</div>`;
  let body;
  if(q.type==='mc'){
    body=(q.choices||[]).map(c=>`<button onclick='_takePick(${i},${JSON.stringify(c)})' style="display:block;width:100%;text-align:left;border:1.5px solid ${cur===c?'var(--accent)':'var(--ink-12)'};background:${cur===c?'var(--gold-bg)':'var(--bg-card)'};color:var(--ink-100);border-radius:10px;padding:11px 13px;font-size:14px;margin-bottom:7px;cursor:pointer;">${esc(c)}</button>`).join('');
  } else {
    body=`<input value="${esc(cur||'')}" oninput="_take.answers[${i}]=this.value;saveTakeState()" placeholder="영어 단어 입력" autocapitalize="off" autocomplete="off" style="width:100%;box-sizing:border-box;border:1.5px solid var(--ink-12);border-radius:10px;padding:12px 13px;font-size:15px;background:var(--bg-card);color:var(--ink-100);">`;
  }
  return `<div style="background:var(--bg-card);border:1px solid var(--ink-07);border-radius:14px;padding:15px;margin-bottom:12px;">${head}${body}</div>`;
}
function _takePick(i,c){ _take.answers[i]=c; saveTakeState(); _renderTake(); window.scrollTo(0,window.scrollY); }
async function submitTest(){
  if(!_take) return;
  const t=_take.test, qs=_take.qs||[];
  const answers=qs.map((q,i)=>_take.answers[i]);
  const blanks=answers.filter(a=>a==null||a==='').length;
  if(blanks>0 && !confirm(TX(`{v0}문항이 비어 있어요. 그대로 제출할까요?`,`{v0} question(s) are blank. Submit anyway?`,{v0:(blanks)}))) return;
  const g=gradeTest(qs, answers);
  const row={ test_id:t.id, user_id:currentUser.id, user_name:userName||'학생', org_id:userOrgId||null, score:g.score, total:g.total, answers:g.per };
  const res=await authPost('/rest/v1/voca_test_results', row, 'return=minimal');
  if(!(res && res.ok)){ toast('제출 실패 — 잠시 후 다시 시도'); logError('write_fail','submitTest',res?('status '+res.status):'no response',{}); return; }
  clearTakeState();
  window._myTestsDirty=true;
  _renderTakeResult(g);
}
function _renderTakeResult(g){
  const el=document.getElementById('take-overlay'); if(!el) return;
  const t=_take.test, qs=_take.qs||[];
  const pct=g.total?Math.round(g.score/g.total*100):0; const c=pct>=80?'#1c7c3c':pct>=50?'#b35900':'#c0392b';
  const review=qs.map((q,i)=>{ const p=g.per[i]; return `<div style="display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--ink-07);">
      <span style="font-size:15px;">${p.ok?'✅':'❌'}</span>
      <div style="flex:1;font-size:13px;"><div style="color:var(--ink-100);font-weight:600;">${i+1}. ${esc(q.prompt)}</div>
      ${p.ok?'':`<div style="color:#c0392b;margin-top:2px;">내 답: ${esc(p.given||'(빈칸)')}</div><div style="color:#1c7c3c;">정답: ${esc(q.answer)}</div>`}</div></div>`; }).join('');
  el.innerHTML=`<div style="max-width:560px;margin:0 auto;">
    <div style="background:linear-gradient(160deg,#1c3553,#0f2338);color:#fff;padding:30px 20px;text-align:center;">
      <div style="font-size:14px;opacity:.9;">${esc(t.title||'단어 시험')}</div>
      <div style="font-size:52px;font-weight:900;margin:8px 0 2px;color:${pct>=80?'#7CF5A0':pct>=50?'#FFC94D':'#FF9B9B'};">${pct}%</div>
      <div style="font-size:16px;font-weight:700;">${g.score} / ${g.total} 정답</div>
    </div>
    <div style="padding:16px;">
      <div style="font-size:13px;font-weight:800;color:var(--ink-100);margin-bottom:8px;">문항별 결과</div>
      ${review}
      <button onclick="document.getElementById('take-overlay').remove();_take=null;" style="width:100%;margin-top:16px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;">완료</button>
    </div></div>`;
  window.scrollTo(0,0);
}

function checkRecoveryToken() {
  // hash와 search 둘 다 확인
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const raw = hash.startsWith('#') ? hash.substring(1) : hash;

  if (!raw) return false;

  const params = new URLSearchParams(raw);
  const type = params.get('type');
  const error = params.get('error');

  // 에러 감지
  if (error) {
    history.replaceState(null, '', window.location.pathname);
    setTimeout(() => {
      renderLogin();
      toast('⚠️ 링크가 만료됐어요. 비밀번호 찾기를 다시 시도해주세요.');
    }, 300);
    return true;
  }

  // recovery 타입 확인
  if (type !== 'recovery') return false;

  const accessToken = params.get('access_token');
  if (!accessToken) return false;

  // URL 깔끔하게
  history.replaceState(null, '', window.location.pathname);
  _authToken = accessToken;
  showNewPasswordForm();
  return true;
}

    if (userOrg && currentUser && userOrg.owner_id === currentUser.id

function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// JS 단일따옴표 문자열을 HTML 속성 안에 안전하게 넣기 위한 이스케이프 (예: don't, o'clock)
function jsq(s){ if(s==null) return ''; return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\r\n]+/g,' '); }
async function uploadOrgLogo(ev){

    const url = `${SB_URL}/storage/v1/object/public/org-logos/${path}`;
