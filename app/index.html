  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100dvh; display:flex; align-items:center; justify-content:center;
         padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));
         font-family:'Noto Sans KR',-apple-system,"Apple SD Gothic Neo",sans-serif;
         color:var(--ink); font-weight:300; line-height:1.65;
         background:radial-gradient(130% 85% at 50% -10%, #f8f2e8 0%, #f3efe6 55%); }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);

  .pat { display:inline-block; margin-top:14px; font-size:11px; color:var(--gold);
         background:#f7f2e6; border-radius:99px; padding:5px 12px; }

<script>
  // 안드로이드에서 온 사람은 원래 스토어 링크를 누른 것과 같은 경험이 되게 바로 넘긴다.
  // 아이폰은 앱 심사 전이라 웹앱(홈 화면 추가)이 최선이고, PC 는 그냥 이 화면을 둔다.
  (function () {
    var ua = navigator.userAgent || '';
    if (/Android/i.test(ua) && !/(kakaotalk-scrap|facebookexternalhit|Twitterbot|Slackbot|bot|crawler|spider)/i.test(ua)) {
      document.getElementById('wait').style.display = 'block';
      setTimeout(function () { location.replace(document.getElementById('store').href); }, 700);
    }
  })();
</script>
