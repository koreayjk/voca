<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>IM VOCA</title>
<!--
  짧은 유입 주소. imvoca.app/yt

  왜 필요한가: 틱톡·인스타 바이오에 클릭되는 링크를 못 거는 계정이 있다
  (개인 계정은 팔로워 1,000명 조건이 걸리는 경우가 많다). 그때 긴 주소를
  타이핑하라고 할 수는 없다. 이 주소는 영상에서 말로 읽어줄 수도 있고,
  utm 을 그대로 들고 가서 유입 측정도 끊기지 않는다.

  ⚠️ 유튜브는 한 채널이 한국어·영어·스페인어를 다 받는다
  (영상 1개 + 음성 트랙 3개, Multi-language audio).
  그래서 여기서 언어를 강제하지 않고 갈 곳을 언어로 나눈다.

  - 한국어  → 앱 + ?lt=1 (비회원도 레벨 테스트를 풀 수 있다)
  - 그 외   → /read (데모 페이지)

  영어 사용자는 레벨 테스트가 막혀 있고(공식 Lv.1~12 에 영어 번역이 없다)
  게스트는 스캔도 못 한다. 앱에 바로 떨어뜨리면 '빈 책장 + 로그인 벽' 이
  전부다. /read 가 실제 스캔 결과를 먼저 보여주고 가입으로 보낸다.
  자세한 건 marketing/english-market.md.
-->
<link rel="canonical" href="https://imvoca.app/">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    // 바이오·게시물별로 utm_campaign 등을 덧붙여 쓸 수 있게, 들어온 값은 그대로 넘긴다
    if (!q.get('utm_source')) q.set('utm_source', 'youtube');
    if (!q.get('utm_medium')) q.set('utm_medium', 'bio');

    var ko = false;
    try {
      var saved = localStorage.getItem('imvoca.nativeLang');
      if (saved) {
        ko = (saved === 'ko');                     // 직접 고른 적이 있으면 그 선택을 존중한다
      } else {
        var prefs = (navigator.languages && navigator.languages.length)
          ? navigator.languages : [navigator.language || ''];
        for (var i = 0; i < prefs.length; i++) {
          if (String(prefs[i]).toLowerCase().indexOf('ko') === 0) { ko = true; break; }
        }
      }
    } catch (e) {}

    if (ko) {
      q.set('lt', '1');                            // 한국어는 레벨 테스트가 무료 가치 단계다
      location.replace('/?' + q.toString());
    } else {
      location.replace('/read?' + q.toString());   // 그 외는 데모 페이지가 그 역할을 한다
    }
  })();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/read?utm_source=youtube&utm_medium=bio"></noscript>
