<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IM VOCA 공지</title>
<meta property="og:title" content="IM VOCA · 사진 찍으면 AI가 단어장">
<meta property="og:description" content="교재를 찍으면 AI가 단어를 자동 추출하고 복습까지. 지금 무료로 시작하세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://imvoca.app">
<meta name="theme-color" content="#1c3553">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background:#0f1d30; color:#e8eef5; min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center; padding:20px;
  }
  .wrap { width:100%; max-width:480px; }
  .card {
    background:#1c3553; border:1px solid #2d4a6b; border-radius:18px;
    overflow:hidden; box-shadow:0 16px 48px rgba(0,0,0,0.4);
  }
  .top { padding:22px 22px 0; }
  .brand { display:flex; align-items:center; gap:8px; margin-bottom:18px; }
  .brand-logo { width:30px; height:30px; border-radius:8px; background:#f6b73c; display:flex; align-items:center; justify-content:center; font-weight:800; color:#1c3553; font-size:15px; }
  .brand-name { font-size:15px; font-weight:700; color:#fff; }
  .cat { display:inline-block; background:#2d4a6b; color:#9fc3e8; font-size:12px; font-weight:600; padding:4px 11px; border-radius:99px; margin-bottom:12px; }
  .title { font-size:22px; font-weight:800; color:#fff; line-height:1.35; margin-bottom:8px; }
  .date { font-size:12px; color:#7a93ad; margin-bottom:18px; }
  .notice-img { width:100%; border-radius:12px; margin-bottom:16px; display:block; }
  .body { font-size:15px; line-height:1.8; color:#c4d4e6; white-space:pre-wrap; padding-bottom:22px; border-bottom:1px solid #2d4a6b; }
  .cta { padding:22px; }
  .cta-line { font-size:14px; color:#aebfd2; margin-bottom:12px; text-align:center; }
  .btn {
    display:block; width:100%; background:#f6b73c; color:#1c3553;
    text-align:center; text-decoration:none; font-size:16px; font-weight:800;
    padding:15px; border-radius:12px; border:none; cursor:pointer;
  }
  .btn-sub { display:block; text-align:center; margin-top:12px; font-size:13px; color:#7a93ad; text-decoration:none; }
  .loading, .err { text-align:center; padding:50px 20px; color:#9fc3e8; font-size:14px; }
  .foot { text-align:center; margin-top:16px; font-size:11px; color:#5a7491; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="loading">불러오는 중...</div>
  </div>
  <div class="foot">IM VOCA · imvoca.app</div>
</div>

<script>
const SB_URL = 'https://ziatqkjlafucqtwshhla.supabase.co';
const SB_KEY = 'sb_publishable_anybo402FSdDKMNiWcQzSA_oc7LIzZC';
const APP_URL = 'https://imvoca.app';

const CAT = {
  notice:   { icon:'📢', label:'공지' },
  update:   { icon:'✨', label:'업데이트' },
  event:    { icon:'🎁', label:'이벤트' },
  tip:      { icon:'💡', label:'꿀팁' },
};

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const card = document.getElementById('card');

  if(!id){
    // id 없으면 그냥 앱으로 유도
    card.innerHTML = ctaOnly();
    return;
  }

  try{
    const url = `${SB_URL}/rest/v1/voca_notices?id=eq.${encodeURIComponent(id)}&published=eq.true&select=*`;
    let res = await fetch(url, { headers: { 'apikey': SB_KEY } });
    if (!res.ok) {
      // 폴백: Authorization 헤더 추가해서 재시도
      res = await fetch(url, { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } });
    }
    if (!res.ok) {
      console.error('notice fetch status', res.status, await res.text());
      card.innerHTML = `<div class="err">공지를 불러오지 못했어요. (${res.status})</div>` + ctaBlock('IM VOCA 시작하기');
      return;
    }
    const data = await res.json();
    if(!Array.isArray(data) || data.length===0){
      card.innerHTML = `<div class="err">공지를 찾을 수 없어요.</div>` + ctaBlock('IM VOCA 시작하기');
      return;
    }
    const n = data[0];
    const c = CAT[n.category] || CAT.notice;
    const dateStr = new Date(n.created_at).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
    document.title = (n.title || 'IM VOCA') + ' · IM VOCA';

    card.innerHTML = `
      <div class="top">
        <div class="brand"><div class="brand-logo">V</div><div class="brand-name">IM VOCA</div></div>
        <span class="cat">${c.icon} ${c.label}</span>
        <div class="title">${esc(n.title)}</div>
        <div class="date">${dateStr}</div>
        ${n.image_url ? `<img class="notice-img" src="${n.image_url}" alt="">` : ''}
        <div class="body">${esc(n.body)}</div>
      </div>
      ${ctaBlock('IM VOCA 시작하기')}
    `;
  }catch(e){
    card.innerHTML = `<div class="err">불러오지 못했어요.</div>` + ctaBlock('IM VOCA 시작하기');
  }
}

function ctaBlock(label){
  return `
    <div class="cta">
      <div class="cta-line">📷 교재를 찍으면 AI가 단어장을 만들어줘요</div>
      <a class="btn" href="${APP_URL}">${label}</a>
      <a class="btn-sub" href="${APP_URL}">앱에서 더 보기 →</a>
    </div>`;
}
function ctaOnly(){
  return `
    <div class="top">
      <div class="brand"><div class="brand-logo">V</div><div class="brand-name">IM VOCA</div></div>
      <div class="title">사진 찍으면<br>AI가 단어장을 만들어줘요</div>
      <div class="date" style="margin-top:10px;">교재 한 장이면 단어 추출 · 복습 · 퀴즈까지</div>
    </div>
    ${ctaBlock('무료로 시작하기')}`;
}

load();
</script>
</body>
</html>
