<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>IM VOCA</title>
<!--
  짧은 유입 주소. imvoca.app/tt → 레벨 테스트로 바로.

  왜 필요한가: 틱톡·인스타 바이오에 클릭되는 링크를 못 거는 계정이 있다
  (개인 계정은 팔로워 1,000명 조건이 걸리는 경우가 많다). 그때 긴 주소를
  타이핑하라고 할 수는 없다. 이 주소는 영상에서 말로 읽어줄 수도 있고,
  utm 과 ?lt=1 을 그대로 들고 가서 유입 측정도 끊기지 않는다.
-->
<link rel="canonical" href="https://imvoca.app/">
<script>
  (function () {
    // 틱톡은 영어권(미국) 채널이다 (2026-11-26~).
    // 계정이 미국 등록이라 틱톡의 첫 배포가 영어권으로 간다 — 거기에 맞춘다.
    // 영어 원어민은 '자기 언어 책을 읽다 모르는 단어를 찍는' 쪽이므로
    // 모국어·공부할 언어를 둘 다 en 으로 둔다(원어민 모드).
    // 이미 설정 화면에서 직접 고른 사람은 그 선택을 존중한다.
    try {
      if (!localStorage.getItem('imvoca.nativeLang')) {
        localStorage.setItem('imvoca.nativeLang', 'en');
        localStorage.setItem('imvoca.targetLang', 'en');
      }
    } catch (e) {}
    var q = new URLSearchParams(location.search);
    // ⚠️ lt=1 을 붙이지 않는다. 영어 사용자는 레벨 테스트가 막혀 있다
    //    (공식 Lv.1~12 에 영어 번역이 없어 보기가 한국어로 나오기 때문).
    //    붙여봐야 아무 일도 안 일어난다.
    if (!q.get('utm_source')) q.set('utm_source', 'tiktok');
    if (!q.get('utm_medium')) q.set('utm_medium', 'bio');
    // 앱이 아니라 데모 페이지로 보낸다. 영어 사용자는 비회원으로 스캔을 할 수 없어
    // 앱에 바로 떨어뜨리면 '빈 책장 + 로그인 벽' 이 전부다 — 무료로 가치를 주는
    // 단계가 없다. /read 는 실제 스캔 결과를 먼저 보여주고 가입으로 보낸다.
    location.replace('/read?' + q.toString());
  })();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/read?utm_source=tiktok&utm_medium=bio"></noscript>
<p style="font-family:system-ui;text-align:center;margin-top:3rem;color:#1E3754">
  IM VOCA 로 이동 중… <a href="/read?utm_source=tiktok&utm_medium=bio">바로가기</a>
</p>
