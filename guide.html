<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IM VOCA 사용법</title>
<link rel="icon" href="https://imvoca.app/2.png">
<style>
  :root{
    --bg:#f5f1e8; --card:#fffdf7; --ink:#2a2622; --ink60:#6b6358; --ink40:#9a9186;
    --line:#eadfce; --accent:#c98a3a; --gold:#faf3e4;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1815; --card:#241f1a; --ink:#f0ece4; --ink60:#b7ad9e; --ink40:#8a8175;
           --line:#3a332b; --accent:#e0a250; --gold:#2b241b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;}
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line);}
  .back{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;flex-shrink:0;}
  .back:active{opacity:.6}
  .top h1{font-size:18px;font-weight:800;margin:0;}
  .lang{margin-left:auto;display:flex;gap:4px;}
  .lang button{border:1px solid var(--line);background:var(--card);color:var(--ink60);border-radius:99px;
    padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;}
  .lang button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px calc(60px + env(safe-area-inset-bottom));}
  .lead{font-size:13.5px;color:var(--ink60);line-height:1.6;margin:2px 2px 18px;}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(120,90,40,.05);}
  .sec h2{font-size:17px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .sec .ic{font-size:22px;}
  .purpose{background:var(--gold);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:13.5px;line-height:1.6;margin:10px 0 12px;}
  .howto{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--ink40);margin:0 2px 7px;}
  ol.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.7;}
  ol.steps li{margin-bottom:6px;}
  .tip{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;
    font-size:12.5px;color:var(--ink60);line-height:1.6;margin-top:12px;}
  .shot{margin-top:14px;}
  .shot img{width:100%;border:1px solid var(--line);border-radius:12px;display:block;}
  .shot .cap{font-size:11px;color:var(--ink40);text-align:center;margin-top:6px;}
  .foot{text-align:center;font-size:12px;color:var(--ink40);margin-top:22px;line-height:1.7;}
  .foot a{color:var(--accent);text-decoration:none;font-weight:700;}
</style>
</head>
<body>
  <div class="top">
    <button class="back" onclick="goBack()" aria-label="back">‹</button>
    <h1 id="pgTitle">📖 앱 사용법</h1>
    <div class="lang">
      <button id="lko" onclick="setLang('ko')">한</button>
      <button id="len" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div class="wrap">
    <div class="lead" id="lead"></div>
    <div id="sections"></div>
    <div class="foot" id="foot"></div>
  </div>

function goBack(){ if (history.length > 1) history.back(); else location.href = 'https://imvoca.app/'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(lang){
  const d = DATA[lang] || DATA.ko;
  document.documentElement.lang = lang;
  document.getElementById('pgTitle').textContent = d.title;
  document.getElementById('lead').textContent = d.lead;
  document.getElementById('foot').innerHTML = d.foot;
  document.getElementById('lko').className = lang==='ko'?'on':'';
  document.getElementById('len').className = lang==='en'?'on':'';
  document.getElementById('sections').innerHTML = d.secs.map(s => `
    <div class="sec">
      <h2><span class="ic">${s.ic}</span>${esc(s.title)}</h2>
      <div class="purpose">💡 ${esc(s.purpose)}</div>
      <div class="howto">${esc(d.howto)}</div>
      <ol class="steps">${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      ${s.tip?`<div class="tip">💡 ${esc(s.tip)}</div>`:''}
      ${s.img?`<div class="shot"><img src="${s.img}" loading="lazy" alt="">${s.cap?`<div class="cap">${esc(s.cap)}</div>`:''}</div>`:''}
    </div>`).join('');
  try{ localStorage.setItem('imvoca_guide_lang', lang); }catch(e){}
}
function setLang(l){ render(l); }

// 언어 결정: URL ?lang= (앱이 넘김) > 저장값 > 브라우저 언어 > 한국어
(function(){
  let lang;
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'ko') lang = q;
    else lang = localStorage.getItem('imvoca_guide_lang')
              || ((navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'ko');
  }catch(e){ lang = 'ko'; }
  render(lang || 'ko');
})();
